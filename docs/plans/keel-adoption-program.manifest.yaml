  title: "KEEL adoption — Phase 1: doctrine rewrite + Charter genesis. odd-methodology.md 1,264→~300 honest lines (spine-as-system, §2.5 + altitude tests leading, banding as evidence grades, VERIFIED=ran-green-at-SHA, ancestry named, novelty claim retracted, change-management unbundled, KEEL primitive frame); docs/charter.md genesis with the founding intent verbatim as entry #0 (hash-chained, bootstrap exception documented); AC.PO.1/AC.PO.2 defined for real in VALUE_PROPOSITION.md; dormant write-time gates archived with a dated note naming dispatch contract-carriage as the salvaged component. Per the ratified methodology-synthesis verdict (owner 'Make it so' 2026-06-10 15:06 CDT, Discord 1514360242). Phase 1 of the keel-adoption-program; Cycles A–F follow as separate amendments."

