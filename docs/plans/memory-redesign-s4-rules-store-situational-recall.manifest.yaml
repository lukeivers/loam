# BASELINE: the pre-amendment tip immediately before this cycle's source commit.
# PLACEHOLDER at plan-authoring (2026-07-07) — origin/main tip (the sealed S2 ranker
# close-out). RETARGET at build time to the actual HEAD~1 at apply time (the source
# commit lands directly on the then-current tip). S4 STACKS on the sealed three-way-split
# predecessors (S1a ground-floor extraction -> standing telemetry -> S2 ranker); it adds
# a NEW recall channel and never reshapes the store-(b) merge, so it fast-forwards cleanly.
#
# Single-component amendment on the EXISTING primary-persona component (NOT a new
# component). Adds: (1) a NEW `rules_store.py` (sibling of decision_ledger.py) — the
# behavioral-rule store (frontmatter'd markdown under <memory_dir>/rules/, mirroring the
# sealed decision-ledger write discipline: atomic tmp+os.replace, append-not-rewrite,
# supersession-by-marking, human-prunable); (2) write-side classification — a rule requires
# a directive + situation-tags + >=1 provenance pointer to a store-(b) record (auditable to
# evidence), authored APART from facts at write time; (3) SITUATIONAL recall in
# keep_pace/retrieval.py — a SEPARATE labeled block on a SEPARATE budget, surfacing a rule
# only when the turn's detected situation is in its tag set (exact set-membership, NO
# relevance score), NEVER merged into _merge_by_score; (4) NAMED reversible levers —
# SITUATIONAL_RULE_CAP (the owner's governing context-budget dial; 0 == no-op) + a master
# flag mirroring RANK_CONSTITUTIONAL_FLOOR (off == byte-identical pre-S4); (5) a conservative
# situation-detector as a named pluggable seam (richer tool-event/threaded-context signals
# feed it later without reshaping the store); (6) an additive {situation -> rules fired}
# telemetry record on the existing fail-open recorder. Adds AC.RSR.1..8 (AC.RSR.7
# outcome-altitude via the production entry-point with no pre-arranged state; AC.RSR.5
# context-budget-bound; AC.RSR.6 reversibility).
#
# DEFERRED (out of this cycle, see plan §7 sequencing): S1b (physically moving the
# situational design-lenses out of always-on CLAUDE.md into store (c)) sequences immediately
# AFTER S4, gated on S4 telemetry proving situational recall reliably fires on the design-lens
# situation — S4 creates the destination but does NOT edit any CLAUDE.md or floor surface.
# S5 (automated offline rule-EXTRACTION at the high frustration/outcome/idea threshold)
# is a separate later stage; S4 ships the store + situational recall + MANUAL/seeded authoring.
