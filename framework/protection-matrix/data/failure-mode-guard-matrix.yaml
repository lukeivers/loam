# loam protection-pillar — the failure-mode × guard matrix (SOURCE OF TRUTH).
#
# This file is the single machine-checkable catalogue of loam's protection
# pillar (doctrine §"The two sides of leg 2 — translation in, protection
# around"). Each row binds ONE known way an AI betrays a user by default to
# loam's ACTUAL guard against it, whether that guard is default-on, whether
# the failure mode is floor-class (non-negotiable) or proportional, and how
# we verify the guard fires.
#
# The `loam guards` verb reads THIS file, derives the live guard set from
# ground truth (guard_ref resolution against the real tree + hook/gate
# registration), reconciles the two, and NAMES the gaps. The human-readable
# companion at docs/design/protection-matrix.md is GENERATED from this file —
# never hand-edited (avoids a second drift surface; dogfoods the reconcile
# discipline).
#
# Schema (plan §5). Every row carries:
#   id            scope-descriptive failure-mode id (FM.*), never version-packed.
#   name          plain-language name (doctrine vocabulary, user-facing).
#   description   one sentence: how this betrays a user by default.
#   source        the doctrine § or feedback_*.md that names this mode.
#   guard         the actual loam guard (named hook / gate / ODD / FBM /
#                 reconcile discipline / persona-discipline).
#   guard_kind    hook | release-gate | odd | memory | comparator |
#                 persona-discipline | none
#   guard_ref     the path (or path:symbol) that IS the guard — the check
#                 resolves this against the real tree. Empty for
#                 persona-discipline / none rows (unverifiable by construction).
#   default_on    YES | NO-PROGRAMMATIC | NONE — is the guard on by default
#                 for every user, no opt-in?
#   class         floor | proportional.
#   proportionality_note  (proportional rows) what stakes dial this guard.
#   verification  HOW we know the guard fires — a test ref / probe / the
#                 registration check.
#   gap           DERIVED by the check (class==floor AND default_on!=YES);
#                 never authored here.
#
# Guard refs are Tier-0 sourced — every non-persona-discipline guard_ref was
# read in the loam tree at build time. No guard is invented to make a row look
# covered (doctrine §"a confident hallucination with a delete key" — the
# protection pillar must not itself hallucinate coverage).

schema_version: 1

rows:
  - id: FM.HALLUCINATION
    name: "Invents things that do not exist"
    description: >-
      Confidently states facts, sources, counts, or statuses it has not
      verified — the canonical AI betrayal (doctrine: "inventing things that
      do not exist").
    source: "docs/design/loam-doctrine.md §two-sides-of-leg-2; feedback_information_trust_ordering.md; feedback_claim_or_cite_no_fake_sources.md"
    guard: "information-trust-ordering + claim-or-cite discipline + the substrate-audit comparator (catches a shipping doc's stale status claim)"
    guard_kind: comparator
    guard_ref: "framework/tools/loam/src/loam_cli/audit/comparator.py:compare_claim"
    default_on: "NO-PROGRAMMATIC"
    class: floor
    proportionality_note: ""
    verification: >-
      The comparator IS exercised on shipping docs at publish
      (check_substrate_audit); but broad fact-recall has no programmatic
      check — the comparator covers status-claim drift only, persona
      discipline covers the rest. PARTIAL coverage → floor gap on
      non-doc claims.

  - id: FM.MISSING-CONTEXT
    name: "Works from missing or degraded context"
    description: >-
      Acts without the context it needed — never loaded the operating
      corpus, or lost it to compaction (doctrine: "not always having the
      right context").
    source: "docs/design/loam-doctrine.md §two-sides-of-leg-2; feedback_session_start_discipline.md"
    guard: "SessionStart corpus-load gate (loads the operating corpus at session start) + the precompact reinject skill (re-asserts discipline across compaction)"
    guard_kind: hook
    guard_ref: "framework/hands-off-lifecycle/hooks/corpus_load_session_start.py"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      The corpus-load hook is registered on SessionStart in the dev
      settings template; the precompact-hook skill ships at
      plugins/loam-skills/skills/precompact-hook/SKILL.md. Registration
      ground truth confirms the SessionStart wiring.

  - id: FM.SILENT-BREAKAGE
    name: "One change breaks the surrounding work"
    description: >-
      Fixes one thing and quietly breaks another — silent regression
      (doctrine: "making one change that breaks the surrounding things").
    source: "docs/design/loam-doctrine.md §two-sides-of-leg-2 (objective-driven authoring guards silent regression); feedback_odd_no_non_objective_code.md"
    guard: "ODD objective-binding gate + TDD guard + the pre-publish release-gate chain"
    guard_kind: hook
    guard_ref: "plugins/dev-sdlc/hooks/objective_binding_gate.py"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      The objective-binding gate + tdd_guard ship in the dev-sdlc plugin
      hook set; ALL_GATES runs the structural release chain at publish.
      Dev-mode default-on; proportional in derived workspaces (doctrine
      §"above the floor, rigor flexes").

  - id: FM.GOAL-DRIFT
    name: "Loses the original goal"
    description: >-
      Drifts off the original objective mid-task — the work no longer maps
      to what was asked (doctrine: "loses the original goal").
    source: "docs/design/loam-doctrine.md §two-sides-of-leg-2; feedback_odd_no_non_objective_code.md"
    guard: "ODD authoring (every line maps to a named AC) + the active-scope sentinel hook"
    guard_kind: hook
    guard_ref: "framework/hands-off-lifecycle/hooks/active_scope_sentinel.py"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      The active-scope sentinel ships in the hands-off-lifecycle hook set;
      ODD objective-binding is the authoring discipline. Dev-mode
      default-on.

  - id: FM.NO-MEMORY
    name: "Has no real memory"
    description: >-
      Forgets across sessions — no durable record of what was learned or
      decided (doctrine: "having no real memory").
    source: "docs/design/loam-doctrine.md §two-sides-of-leg-2 (file-based memory guards the no-real-memory failure)"
    guard: "file-based memory (the FBM corpus) + the loam-memory-inspect tooling over it"
    guard_kind: memory
    guard_ref: "framework/tools/loam-memory-inspect/src/loam_memory_inspect/cli.py"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      The memory-inspect CLI surfaces + audits the file-based memory
      corpus; the corpus itself is the durable store. The tool's presence
      in the tree is the registration ground truth.

  - id: FM.NARRATION-NOT-ACTION
    name: "Narrates intent without taking the action"
    description: >-
      Says it will do the work (or claims it did) without ever emitting the
      tool call — terminal-only intent-text the user never sees as a result.
    source: "feedback_narration_is_not_action.md (born from the 2026-05-31 silent-night failure; fired four times in one night)"
    guard: "the self-recovery distress-detector — its unfulfilled-claim class (you-keep-saying / you-said-but) deterministically catches the narration-not-action distress shape on the inbound path and trips self-diagnosis by the 2nd signal; partial — a DOWNSTREAM catch on recurrence, not a prevention that a work-turn ends on a work/reply tool call"
    guard_kind: hook
    guard_ref: "framework/self-correction/hooks/distress_detector.py:classify_distress"
    default_on: "NO-PROGRAMMATIC"
    class: floor
    proportionality_note: ""
    verification: >-
      PARTIAL: the distress detector's unfulfilled-claim rubric
      (_UNFULFILLED_PATTERNS — "the narration-not-action distress shape")
      deterministically classifies the user's distress and trips
      self-diagnosis, a real programmatic DOWNSTREAM catch; but there is no
      programmatic guard that PREVENTS the narration (a work-turn ending on
      the work/reply tool call) — wiring the detector into settings is
      owner-gated. Floor gap on prevention; the recurrence is the
      structural-enforcement trigger (feedback_structural_enforcement_on_recurrence).

  - id: FM.INFERRED-RHYTHM
    name: "Infers the user's session, time, or rhythm"
    description: >-
      Guesses when the user is around, how long they've been gone, or what
      their cadence is from session signals it cannot actually observe.
    source: "feedback_session_is_a_surface_never_infer_user_rhythm.md"
    guard: "persona-discipline only"
    guard_kind: persona-discipline
    guard_ref: ""
    default_on: "NO-PROGRAMMATIC"
    class: proportional
    proportionality_note: >-
      Stakes scale with how much an action depends on the inferred rhythm
      (a low-stakes greeting vs scheduling a real external action off a
      wrong assumption about the user's availability).
    verification: >-
      UNVERIFIABLE by a deterministic check — proportional, so NOT a floor
      gap, but recorded as a known persona-discipline-only guard.

  - id: FM.ENV-PERCEPTION-MVC
    name: "Confuses its internal env-model with the user's view"
    description: >-
      Treats its own model of the environment (files, state, what's on
      screen) as what the user actually sees — a model/view confusion.
    source: "feedback_environment_perception_model_dont_assume.md (explicitly the THIRD instance in one session)"
    guard: "persona-discipline only"
    guard_kind: persona-discipline
    guard_ref: ""
    default_on: "NO-PROGRAMMATIC"
    class: floor
    proportionality_note: ""
    verification: >-
      UNVERIFIABLE by a deterministic check. This is a GAP — a floor-class
      betrayal guarded only by a prose rule that has already recurred
      (third instance in one session).

  - id: FM.PROCESS-DRIFT-UNDER-PRESSURE
    name: "Abandons the defined flow under pressure"
    description: >-
      Drops the structured flow it was following when the work gets hard or
      urgent — exactly when the flow matters most (doctrine: "a defined flow
      decays first under pressure").
    source: "docs/design/loam-doctrine.md §Follow-the-defined-workflow; feedback_defined_workflow_in_context_pause_if_lost.md"
    guard: "the keep-pace flow-position hooks (partial — they re-assert flow position) + mostly persona-discipline"
    guard_kind: persona-discipline
    guard_ref: ""
    default_on: "NO-PROGRAMMATIC"
    class: floor
    proportionality_note: ""
    verification: >-
      PARTIAL: keep-pace re-asserts flow position
      (framework/hands-off-lifecycle/hooks/keep_pace/), but there is no
      programmatic guard that the flow is actually FOLLOWED under pressure.
      Floor gap — the residual is persona discipline.

  - id: FM.BUILT-NE-LIVE
    name: "Claims built/published from prose, not git refs"
    description: >-
      Reports a thing as built/sealed/merged/published from a status line
      or a prior agent's summary rather than the git ref graph — stale-prone
      Tier-2 prose treated as ground truth.
    source: "feedback_published_state_only_from_git_refs.md"
    guard: "the substrate-audit gate (catches a shipping DOC claiming a live component is dark / vice-versa) — partial: shipping docs only, not arbitrary in-conversation claims"
    guard_kind: release-gate
    guard_ref: "framework/tools/loam/src/loam_cli/release/gates.py:check_substrate_audit"
    default_on: "NO-PROGRAMMATIC"
    class: floor
    proportionality_note: ""
    verification: >-
      The substrate-audit gate IS wired into ALL_GATES + runs at publish
      against shipping docs (real, default-on for THAT surface). But a
      built/published CLAIM made in conversation (not in an audited doc)
      has no programmatic check → PARTIAL → floor gap for non-doc claims.

  - id: FM.STALE-MEMORY-VS-TRUTH
    name: "Trusts a stored claim over live ground truth"
    description: >-
      Believes a stored memory/note over the cheapest available live
      evidence — a stale note denies present reality.
    source: "feedback_notes_and_users_are_pointers_evidence_resolves.md"
    guard: "the FBM reconcile entry-point — the SAME comparator the doc-audit uses, routing a stored claim through compare_claim for checkable claims"
    guard_kind: comparator
    guard_ref: "framework/tools/loam/src/loam_cli/audit/reconcile.py:reconcile_stored_claim"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      reconcile_stored_claim routes a checkable stored claim through the
      same comparator as the doc audit; the finding is dated + scoped (never
      an eternal negative). Default-on for CHECKABLE claims; a non-checkable
      stored claim is surfaced, owner rules (by construction, not a gap).

  - id: FM.SECRET-LEAK
    name: "Commits secrets or .env files"
    description: >-
      Writes a credential, token, or .env into version control — a
      universal, high-blast-radius betrayal.
    source: "CLAUDE.md §Universal-principles (NEVER commit secrets or .env); feedback corpus (no-secrets rule)"
    guard: >-
      the secret-pattern guard hook + the dangerous-flag guard hook —
      now EXTENDED (AC.SBB.1, secure-build baseline) with a staged-diff scan
      at the commit/push boundary: a `git commit` / `git push` triggers a
      scan of the content the boundary would publish (the staged diff for
      commit, the unpushed range for push) for the same credential shapes,
      catching a secret embedded in a FILE — not just on the command line —
      and firing for the artifact loam BUILDS (any repo under cwd), not only
      loam's own. The staged-diff path is strictly additive (the inbound
      paste path's fail-OPEN convention is preserved) and the secret floor
      is non-tunable (AC.SBB.4 — its strictness cannot be downgraded).
    guard_kind: hook
    guard_ref: "framework/safety-layer/hooks/secret_pattern_guard.py"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      secret_pattern_guard + dangerous_flag_guard ship in the safety-layer
      hook set — UNIVERSAL (not dev-mode-gated). Their presence in the
      safety-layer is the registration ground truth. The AC.SBB.1
      staged-diff extension is verified by
      framework/safety-layer/tests/test_AC_SBB_1_secret_at_commit_boundary.py
      (real hook subprocess against a real temp git repo: a staged-file
      secret is denied at `git commit`, an unpushed-commit secret is denied
      at `git push`, the value is never echoed, a non-repo read fails OPEN)
      plus the pre-existing fail-open regression suite (zero regression).

  - id: FM.DESTRUCTIVE-PRUNE
    name: "Deletes a load-bearing thing while pruning"
    description: >-
      Cuts a "vestigial" rule or compresses a sentence that was actually
      load-bearing — the pruning leg's signature betrayal (doctrine: "a
      confident hallucination with a delete key").
    source: "docs/design/loam-doctrine.md §pruning (every prune reversible + destructive cuts surfaced before they happen + check 'does anything still depend on it?')"
    guard: "the reversibility primitive (every prune tracked in version control, rollback-able) + the surface-before-destructive discipline + the depends-on-it check (partial — reversibility is programmatic, the depends-on check is persona-discipline)"
    guard_kind: persona-discipline
    guard_ref: ""
    default_on: "NO-PROGRAMMATIC"
    class: floor
    proportionality_note: ""
    verification: >-
      PARTIAL: the reversibility primitive
      (framework/reversibility-primitive/) makes prunes rollback-able
      (real, programmatic), but "does anything still depend on it?" + the
      surface-before-cut step are persona discipline → floor gap on the
      decision-to-cut, covered programmatically only on the undo side.

  - id: FM.BOUNDARY-VIOLATION
    name: "Framework writes user-state outside its declared homes"
    description: >-
      The framework writes into directories that belong to the user's
      project, crossing the framework/user-state boundary (ADR-0001).
    source: "framework boundary ADR-0001; the check_boundary_respected gate"
    guard: "the boundary-respected release gate"
    guard_kind: release-gate
    guard_ref: "framework/tools/loam/src/loam_cli/release/gates.py:check_boundary_respected"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      check_boundary_respected is a member of ALL_GATES — runs at every
      publish; its membership in the tuple is the registration ground truth.

  - id: FM.MIGRATION-GAP
    name: "Ships a state change with no migration"
    description: >-
      Changes the user-state schema without declaring a migration, leaving
      existing workspaces unable to upgrade safely.
    source: "the check_migration_declared gate; state-migration-engine component"
    guard: "the migration-declared release gate"
    guard_kind: release-gate
    guard_ref: "framework/tools/loam/src/loam_cli/release/gates.py:check_migration_declared"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      check_migration_declared is a member of ALL_GATES — runs at every
      publish; its membership in the tuple is the registration ground truth.

  - id: FM.FALSE-FAULT
    name: "Manufactures a fault that isn't real"
    description: >-
      Admits an error it did not actually make — a low-trust introspective
      self-output dressed up as an honest audit finding.
    source: "feedback_no_false_fault_admission.md"
    guard: "persona-discipline only — the four-test discipline before writing an audit ✗"
    guard_kind: persona-discipline
    guard_ref: ""
    default_on: "NO-PROGRAMMATIC"
    class: proportional
    proportionality_note: >-
      Stakes scale with what the false admission triggers (a throwaway
      self-correction vs a fabricated fault that reverses a correct
      decision or damages trust).
    verification: >-
      UNVERIFIABLE by a deterministic check — proportional, so NOT a floor
      gap, but recorded as a known persona-discipline-only guard.

  - id: FM.PROCESS-DRIFT
    name: "Drops the defined flow mid-task"
    description: >-
      Loses its place in the structured flow it was following — abandons the
      defined workflow when the work gets long or hard, exactly when the
      flow's structure matters most (doctrine: "a defined flow decays first
      under pressure").
    source: "docs/design/loam-doctrine.md §Follow-the-defined-workflow; feedback_defined_workflow_in_context_pause_if_lost.md (owed from the defined-workflow build)"
    guard: "the defined-workflow position re-injection hook — reads the active flow's cursor from disk and re-injects flow + step + branch-state (plus the pause-if-lost directive) on every context-loss point (SessionStart=compact / PreCompact / UserPromptSubmit / PreToolUse); partial — it RE-ASSERTS position advisorily, it does not hard-block a step taken out of order"
    guard_kind: hook
    guard_ref: "framework/tools/loam/src/loam_cli/flows/reinject.py:build_reinjection_context"
    default_on: "NO-PROGRAMMATIC"
    class: floor
    proportionality_note: ""
    verification: >-
      PARTIAL: build_reinjection_context re-injects the on-disk cursor
      position (real, deterministic — the AC.REINJECT.1 outcome-altitude
      test drives the production entry-point); but the re-injection is
      ADVISORY (every path returns 0, never blocks a tool call) and wiring
      it into a live settings.json is owner-gated instance-config. Floor gap
      on enforcement; the residual that the flow is actually FOLLOWED under
      pressure is persona discipline. (Companion to the persona-discipline
      FM.PROCESS-DRIFT-UNDER-PRESSURE row — this row binds the now-merged
      re-injection guard the older row only anticipated.)

  - id: FM.COMMS-PATH-DEAD
    name: "Goes silent when the user-visible channel dies"
    description: >-
      The channel the user actually reads (Telegram) goes down and the agent
      becomes silent — the user is left in the dark with no signal that work
      is still happening (the silent-night failure on the OUTBOUND path).
    source: "feedback_telegram_outage_selfheal_and_confident_continue.md; feedback_user_distress_is_priority_diagnostic_signal.md (self-recovery F-4)"
    guard: "the self-recovery watchdog's dead-channel detection + out-of-band self-heal — proactively probes whether the user-visible channel is live and, on a negative probe, delivers an out-of-band notice via the durable fallback surface so a down channel does not become silence; no user distress signal required to fire it"
    guard_kind: hook
    guard_ref: "framework/self-correction/src/loam/self_correction/watchdog.py:ChannelVerdict"
    default_on: "NO-PROGRAMMATIC"
    class: floor
    proportionality_note: ""
    verification: >-
      PARTIAL: the watchdog's dead-channel leg (ChannelVerdict —
      "the result of a dead-channel check + self-heal attempt") proactively
      probes channel liveness and routes to the out-of-band notify, a real
      deterministic guard (the AC.SR-WATCH.2 tests drive it); but wiring the
      watchdog into a live settings.json / runtime loop is owner-gated
      instance-config, so it is not default-on for every user yet. Floor gap
      on default-on activation; the detection + self-heal mechanism itself
      is real and sealed.

  - id: FM.SILENT-EGRESS
    name: "Sends your data off your machine without asking"
    description: >-
      Sends a user's data or files off their machine for troubleshooting or
      analytics WITHOUT explicit, transparent, per-item user consent — the
      default-leak privacy betrayal (nothing should leave the machine the user
      has not seen, in plain language, and approved).
    source: "docs/design (privacy-safe data-sharing layer §0.1 — the silent-egress matrix-gap finding); CLAUDE.md §Universal-principles (NEVER commit secrets / leak user data)"
    guard: "the egress-consent gate — a fail-closed, nothing-leaves-by-default release gate that assembles every off-machine send into a reviewable bundle, shows the user exactly what would leave in plain language, takes per-item approve/redact/decline, binds the approval to the content identity, and refuses to release on any uncertainty through a single audited choke point. BUILT + SEALED (framework/egress-consent/, EgressReleaseGate.release, sealed at 2304dea); wiring it into every off-machine send path as the default choke point is owner-gated instance-config, so it is not default-on for every send yet — until that wiring is default-on the floor is held by the sealed gate where it is invoked plus persona discipline elsewhere"
    guard_kind: release-gate
    guard_ref: "framework/egress-consent/src/loam/egress_consent/gate.py:EgressReleaseGate"
    default_on: "NO-PROGRAMMATIC"
    class: floor
    proportionality_note: ""
    verification: >-
      PARTIAL: the named guard (the egress-consent gate) is now BUILT + SEALED
      — the EgressReleaseGate fail-closed release symbol resolves against the
      real tree (framework/egress-consent/src/loam/egress_consent/gate.py),
      so the row binds a REAL guard rather than carrying an empty unbuilt-guard
      ref. This mirrors the FM.COMMS-PATH-DEAD shape: a sealed, resolvable guard
      whose wiring into every runtime send-path as the default-on choke point is
      owner-gated instance-config, so it is not yet default-on for every user.
      Floor gap on default-on activation; the consent-gate mechanism itself is
      real and sealed (the protection pillar reports the honest now-built
      binding, not a hallucinated full-coverage claim and not a stale
      not-yet-built status).

  - id: FM.DROPPED-OPEN-LOOPS
    name: "Forgets its own open loops"
    description: >-
      Drops its OWN deferred work — the follow-ups, rechecks, and revisits it
      intended to come back to are never revisited; it acts only when prompted
      and silently forgets its outstanding obligations (an assistant that
      cannot keep pace with the user because it loses its own future work).
    source: >-
      feedback_apply_claude_leverage_to_own_tooling.md (self-scheduled
      follow-up is CORE to keep-pace); CLAUDE.md §keep-pace; task #79
      (the persona self-scheduled-recheck mechanism)
    guard: >-
      the persona self-scheduled-recheck mechanism (task #79) — first instance
      LIVE in the operator environment (launchd self-recheck jobs that wake an
      agent, re-run the analysis, and message the owner on a material change);
      the loam-canonical reusable "self-recheck" SKILL + pending-rechecks
      register (a durable register of the persona's own outstanding
      obligations, default-on, built on a Claude-native scheduling primitive
      per Lens 1) is SCOPED, not yet built — until that capability is built +
      sealed in the canonical tree the floor is held only by persona discipline
    guard_kind: none
    guard_ref: ""
    default_on: "NONE"
    class: floor
    proportionality_note: ""
    verification: >-
      UNVERIFIABLE by a deterministic check in the canonical tree today —
      the named guard's first instance is LIVE but lives in the operator's
      personal environment (launchd jobs), NOT in canonical loam, and the
      reusable, productized, default-on self-recheck SKILL + pending-rechecks
      register is SCOPED, not yet built, so there is no symbol in the loam tree
      to resolve. This is the honest "named-but-not-yet-bound" status — an
      instance-level guard exists (the operator's launchd jobs) but the general
      default-on canonical capability does not — so the row carries the
      unbuilt-guard shape (guard_kind none, empty guard_ref, default_on NONE)
      rather than a hallucinated binding (the protection pillar must not invent
      coverage it does not have). A floor-class GAP: until the self-recheck capability is
      built + default-on in the canonical tree, the keep-your-own-open-loops
      floor is held only by persona discipline.

  - id: FM.DESTRUCTIVE-PROD-UNGATED
    name: "Destroys a live system that was never confirmed safe"
    description: >-
      Runs a destructive action (drop/delete a database, empty a bucket, tear
      down infrastructure) against a production-resolved target — because the
      environment label said non-production, or because the live system has no
      fresh proof its safety protections are armed — and so destroys real data
      on a system serving real users (doctrine: "breaking the surrounding work
      or the original goal"; Lens 0 protection floor — dropping prod).
    source: >-
      docs/plans/deploy-safety-floor-gate-primitives.md (AC.DSF.2/.3/.6/.7);
      docs/design/loam-doctrine.md §two-sides-of-leg-2 (Lens 0 protection
      floor); devops-pipeline-2026-06-27 red-team G1 (attestation) / G2
      (resolved-target) / G15 (fail-policy)
    guard: >-
      the deploy-safety FLOOR PreToolUse gate — a framework-native gate that
      reads the per-environment config + attestation contract and refuses, by
      default, a destructive verb against a production-class target with no
      fresh attestation; gate strength = max(declared, resolved-target) so a
      command resolving to a declared-prod identity is prod-gated even from a
      non-prod active env; rename-safe (gate height derives from structured
      fields, never the env name); fails CLOSED on the destructive path (its
      own evaluation error denies, never falls open)
    guard_kind: hook
    guard_ref: "framework/deploy-safety-floor/hooks/deploy_safety_floor_guard.py:main"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      The component's AC.DSF.* suite, incl. the outcome-altitude AC.DSF.7 that
      drives the REAL PreToolUse entry-point over raw stdin (no pre-arranged
      state): a fabricated destructive command in an is_production context with
      no attestation record returns a deny naming the target + sub-action in
      plain words, and a raised evaluation (corrupt attestations file) still
      returns deny (fail-closed). Registered default-on for every workspace via
      framework/deploy-safety-floor/hooks/settings.fragment.json, composed into
      .claude/settings.json by the sealed workspace-sync auto-composer (same
      framework-native wiring as frame-kernel / corpus-load). Scope boundary:
      the live provider PROBES that populate the attestation record (the
      deletion-protection / Object-Lock / prevent_destroy reads) are deploy-tier
      and out of this floor's scope — the framework-side DEFAULT POSTURE (no
      fresh record => refuse) is what this guard enforces and what the suite
      verifies.

  - id: FM.VULN-DEPENDENCY-SHIPPED
    name: "Ships a build with a known-vulnerable dependency"
    description: >-
      Produces a build artifact that pulls in a dependency with a publicly
      known security vulnerability — the build looks fine and runs, but
      ships a hole someone else has already documented (doctrine:
      "breaking the surrounding work"; Lens 0 protection floor — shipping a
      known-CVE artifact).
    source: >-
      docs/plans/deploy-safety-floor-gate-primitives.md (AC.SBB.2);
      docs/FUTURE_IDEAS_DRAFT.md F-SECURE-BUILD-BASELINE (Tilth directive);
      docs/design/loam-doctrine.md §two-sides-of-leg-2 (Lens 0 protection
      floor)
    guard: >-
      the secure-build baseline dependency-hygiene gate — on a build /
      publish command in a supported ecosystem (Node/Next, Python) the floor
      runs the ecosystem's OWN audit tool (`npm audit` / `pip-audit`; Lens 1
      compose, never a re-implemented vuln DB) and, on a vulnerability at or
      above a configured severity floor, blocks-or-surfaces per the
      configured strictness; a clean audit passes silently; an audit tool
      that is unavailable is SURFACED honestly (never reported as clean for
      an audit that did not run). Strictness (block vs surface) is the only
      tunable.
    guard_kind: hook
    guard_ref: "framework/secure-build-baseline/src/loam/secure_build_baseline/dependency_audit.py:run_ecosystem_audit"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      framework/secure-build-baseline/tests/test_AC_SBB_2_dependency_audit_gate.py
      drives run_ecosystem_audit with injected ecosystem-audit JSON: a vuln
      at/above the floor produces a finding (not clean), below-floor vulns
      pass silently, the severity floor is configurable, an unavailable tool
      is marked must-surface (NOT clean), and pip-audit-shaped JSON parses.
      The gate is wired default-on for every workspace via
      framework/secure-build-baseline/hooks/settings.fragment.json (the
      secure_build_baseline_guard.py:main entry-point), composed into
      .claude/settings.json by the sealed workspace-sync auto-composer (same
      framework-native wiring as the deploy-safety floor). The live audit DB
      itself is the ecosystem tool's, not loam's (compose, don't
      re-implement).

  - id: FM.ARTIFACT-LEAKS-RUNTIME-STATE
    name: "Sweeps harness working state into the shipped artifact"
    description: >-
      A broad `git add -A` / `git commit -a` sweeps the harness's own
      runtime working state — scratch files, per-workspace memory queues,
      tracker SQLite DBs — or a secret / .env into the project being built,
      so internal state and credentials leak into the shipped artifact
      (doctrine: "breaking the surrounding work or the original goal"; Lens 0
      protection floor — leaking internal state / secrets).
    source: >-
      docs/plans/deploy-safety-floor-gate-primitives.md (AC.SBB.3 / .4);
      docs/FUTURE_IDEAS_DRAFT.md F-SECURE-BUILD-BASELINE (Tilth directive)
    guard: >-
      the secure-build baseline artifact-cleanliness guard — a generated
      project carries the floor `.gitignore` (harness runtime state +
      secrets), and a pre-commit sweep inspects a broad-stage command's
      target repo for runtime-state / secret paths that are present and NOT
      git-ignored (would enter the artifact under `git add -A`), then
      blocks-or-surfaces per strictness. Sample/example secret files are
      exempt. The secret-never-committed half is the non-tunable floor
      (AC.SBB.4); artifact-cleanliness strictness (block vs surface) is the
      tunable.
    guard_kind: hook
    guard_ref: "framework/secure-build-baseline/src/loam/secure_build_baseline/artifact_sweep.py:offending_paths"
    default_on: "YES"
    class: floor
    proportionality_note: ""
    verification: >-
      framework/secure-build-baseline/tests/test_AC_SBB_3_artifact_cleanliness.py
      exercises the floor `.gitignore` (covers .scratch/ + memory queues +
      *.sqlite + .env + secret-file family) and the sweep against a REAL temp
      git repo: unignored runtime state is flagged offending, the same paths
      with the floor `.gitignore` in place are NOT offending, and an
      end-to-end `git add -A` does not stage them. The outcome-altitude
      test_AC_SBB_C_outcome_altitude.py drives the REAL PreToolUse hook
      entry-point over raw stdin against a real on-disk repo (no pre-arranged
      state): `git add -A` with an unignored `.env` returns a deny naming the
      path in plain words; with the floor `.gitignore` present it returns no
      deny; a non-repo directory fails soft. Registered default-on via
      framework/secure-build-baseline/hooks/settings.fragment.json
      (secure_build_baseline_guard.py:main), composed by the sealed
      workspace-sync auto-composer.
