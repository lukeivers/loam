[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-cli"
version = "0.1.0"
description = "Unified loam top-level CLI; amend subcommand for amendment dispatch."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
loam = "loam_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
