plan: docs/plans/amendment-143-tier1-retroactive-sweep-followup.md

seal_description: |
  Tier 1 retroactive sweep follow-up: tighten heuristic + widen
  downstream globs + live sweep (closes #134 §16 finding #6,
  three-scope merge per causal dependency).

  Scope A — seal-commit attribution heuristic tightening. The
  existing narrow heuristic (`git log --grep=^chore(seals):
  --grep=<slug> --all-match`) missed sealed amendments whose
  seal-commit subject names a different slug than the plan-doc
  filename (e.g., `amendment-22-pos-amend-cli.md` whose seal
  commit `60dc0c6` is `chore(seals): pos-amend-cli-and-universal-
  paths seal — ...`). Empirical recovery: 13 plan-docs at
  canonical HEAD `b278cc6` (~5% of corpus) recoverable by
  Strategy 2's body-slug second-pass. Three-strategy fallback
  chain (current narrow / body-slug second-pass / `amendment #NN`
  third-pass); first non-empty result determines attribution;
  multi-match in ANY strategy stays in `result.ambiguous`
  preserving the §134 halt-trigger #5 contract verbatim.

  Scope B — downstream consumer glob widening. Pre-flight Tier-0
  grep widened the brief's 2-consumer count to the actual 4
  (§16 finding #1): release-gate `_find_plan_doc` at
  `framework/tools/loam/src/loam_cli/release/gates.py:189`,
  Phase γ `discover_amendment_plans` at `framework/tools/heavy-b-
  migrate/src/loam/heavy_b_migrate/amendment_acs.py:88`, session-
  start `enumerate_amendments_in_flight` at `framework/primary-
  persona/src/loam/primary_persona/session_start_gate.py:163`,
  and bash-guard `_candidate_manifests` at `plugins/dev-sdlc/
  hooks/bash_guard.py:236`. Shared helpers `iter_all_plan_docs`,
  `iter_all_manifests`, and `find_plan_doc_by_slug_glob` in a
  new `plan_locator.py` module under `loam_amend` (D-T1RS.GLOB-
  LOCATION); DRY across consumers; sealed-first priority for
  ambiguous slugs during the transition window (D-T1RS.GLOB-
  PRIORITY); session-start gets a new sibling
  `enumerate_sealed_amendments` rather than modifying the
  existing in-flight semantics (D-T1RS.SESSION-START-SEMANTICS).

  Scope C — live sweep against canonical. New CLI subcommand
  `loam amend sweep-archive [--dry-run]` (D-T1RS.LIVE-SWEEP-
  MECHANISM) makes the sweep durably reproducible. Operator-
  typed real-run AFTER seal as a separate `chore(retroactive-
  sweep):` commit (D-T1RS.LIVE-SWEEP-TIMING) — keeps the seal-
  diff window clean. Dry-run-first discipline gates the ~150-
  plan-doc tree restructure (halt-trigger #3 in §6); §134 halt-
  trigger #5 contract preserved verbatim. THIS plan-doc + manifest
  themselves move via the existing post-#134 seal-time archive
  path (Strategy 1 match on full slug); the live-sweep CLI is a
  no-op for this plan-doc (already moved by seal) and operates
  on the OTHER cleanly-attributable plan-docs.

  Shape (merged single amendment) chosen per D-T1RS.MERGE: three
  scopes with causal dependency (C depends on A + B); merging
  saves two apply + seal cycles vs three sequential amendments.
  AC families are scope-disjoint at the AC-family level
  (.HEURISTIC / .GLOB / .SWEEP). Multi-component fence (four)
  scope-disjoint at the file level. Dogfood discipline
  (D-T1RS.DOGFOOD): THIS amendment's own seal exercises the
  post-#134 plan_archive.py integration (Strategy 1); the live-
  sweep CLI invocation exercises the rest of the corpus.

  Composes with amendment #134 (closes the deferred T1.4 retro-
  sweep at §16 finding #6 — heuristic tightening AND downstream
  consumer widening AND live sweep land together); amendment
  #142 (exercises the SKILL-prose `narrative.target` canonical
  form + BASELINE walk-forward + source-edit-commit-before-apply
  conventions). Per `feedback_locked_design_not_license_for_bad_-
  outcomes`, the #134 narrow heuristic's locked design is
  revisited because the operational outcome (35% false-negative
  rate against the canonical corpus) is bad enough to merit
  re-extension; the fix is ADDITIVE (Strategies 2 + 3 augment,
  not replace, Strategy 1).

  Closes amendment #134 §16 finding #6 on seal.

