[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-graceful-degradation"
version = "0.1.0"
description = "Graceful-degradation policy layer for pOS v2 — Claude-upstream failure detection, per-mode FSMs, policy dispatch, notification, resume."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    "loam-scope-of-work",
    "loam-primary-persona",
    "loam-orchestrator",
]

[tool.setuptools]
package-dir = {"loam.graceful_degradation" = "src/loam/graceful_degradation"}
packages = ["loam.graceful_degradation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
