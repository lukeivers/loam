  title: "Memory redesign — write-side facts-discipline: keep store (b) a store of PROVABLE FACTS (event / state-after-work / verified finding / ATTRIBUTED expression), never the model's bare opinions / speculation / plans, by typing each write's epistemic kind deterministically at write time (a sibling of classify_volatility; fail-safe to FACT; read-side annotates rather than excludes) and drawing the fact-vs-rule cleave at write time — WITHOUT any admission gate that would suppress the owner's LIBERAL fact-ingest"

# BASELINE: the pre-amendment tip immediately before this cycle's source commit.
# PLACEHOLDER at plan-authoring (2026-07-08) — origin/main tip (the sealed S4 close-out,
# a1166b8d). RETARGET at build time to the actual HEAD~1 at apply time (the source commit
# lands directly on the then-current tip). This stage completes the FACT half of S4's
# "write-side fact/rule discipline" (S4-as-built delivered the RULE half); it adds an
# additive epistemic tag + a read annotation behind a named lever and never reshapes any
# sealed core, so it fast-forwards cleanly.
#
# Single-component amendment on the EXISTING primary-persona component (NOT a new component).
# Adds: (1) a NEW deterministic `classify_epistemic_type` in file_memory.py — a SIBLING of the
# sealed `classify_volatility` on a different, orthogonal axis (provable-fact vs opinion/
# speculation/plan): stdlib-only, NO LLM/API, tags each store-(b) write, fail-safe toward FACT
# (only affirmative non-fact grammar ABSENT an attribution + ABSENT a durable-fact signal tags
# non-fact; ambiguity + any classifier error => FACT — the never-suppress direction, mirroring
# classify_volatility's never-drop floor); (2) an additive `epistemic:` frontmatter field emitted
# by write_episode (the AC-driven schema-field precedent set by `volatility:`); (3) the ATTRIBUTION
# move — a thought authored WITH an author+time is fact-eligible (a provable utterance-event),
# a bare truth-claim is not — this is how "facts only" keeps the owner's "record that he said it"
# without storing unprovable claims, and is the structural partition that dissolves the
# provable-only vs LIBERAL-ingest tension; (4) a read-side not-a-verified-fact annotation on a
# non-fact-typed record in keep_pace/retrieval.py (mirroring VOLATILE_SOFT_ANNOTATION — substance
# exposed, marked, never silently withheld); (5) the documented fact-vs-rule write-time cleave +
# the observed-preference resolution (the OBSERVATION is a fact in (b); the behavioral PRIOR is a
# provenance-bearing rule in (c) via S4's already-sealed write_rule, only when the high behavioral
# threshold is cleared — a memory always, a rule only sometimes); (6) a NAMED reversibility lever
# (mirroring RANK_CONSTITUTIONAL_FLOOR; off => byte-identical pre-stage writes + recall, legacy
# tagless records read back fail-safe as FACT, nothing migrated or deleted). Adds AC.WFD.1..9
# (AC.WFD.6 outcome-altitude via the production write + recall entry-points with no pre-arranged
# state; AC.WFD.7 liberal-ingest preservation — the write SET is unchanged, only typing +
# rendering are added; AC.WFD.8 reversibility).
#
# LOAD-BEARING invariant (halt trigger §6.1): the discipline TAGS and ANNOTATES; it NEVER rejects,
# drops, gates, or re-routes a store-(b) write away from disk. A reject-gate would break the owner's
# LIBERAL fact-ingest and is the #1 named F2 tension. Enforcement composes with D2 (the persona
# writes the record at write time; the deterministic classifier is the crude-tell BACKSTOP, not a
# verifier — true verifiability is the persona's judgment).
#
# DEFERRED (out of this cycle): S5 (automated offline rule-EXTRACTION/consolidation that mines
# accumulated facts to DERIVE rules at the high threshold + fits retrieval parameters) — this stage
# produces clean epistemic-typed facts; S5 consumes them; this stage runs NO extraction engine and
# makes NO algorithmic significance judgment. An optional write-time STEER (reuse the sealed
# decision-ledger detect_and_flag_ruling_gap pattern to nudge "you should have authored a rule")
# is carried as a named follow-on (plan §10 Fork D). S1b is an unrelated fence (the floor surfaces).
