seal_description: |
  Context-management Cycle 3 — the eviction discipline.

  Ships the achievable substitute for the runtime-forbidden "strike out
  specific content." On the subscription `claude -p` path the runtime owns
  the window — there is no delete-message primitive (research §2.1; the
  closest, context-editing, is API-only + content-agnostic). The substitute:
  a discoverable `context-hygiene` SKILL at
  `plugins/loam-skills/skills/context-hygiene/SKILL.md` (subdirectory shape —
  the discoverable contract per the v0.1.7 AC.LAYERED.2 pattern) encoding the
  three runtime-legal doors — input-discipline (cap tool-return size, keep MCP
  deferred), fork-by-default for noisy read work, externalize-early — which
  together produce the EFFECT of evicting content that was never resident.

  The highest-leverage door (fork-isolation) is GATED on an empirical probe.
  Research §7 marks fork token-attribution to the parent's `context_window`
  field UNVERIFIED. AC.CTXEVICT.S IS the verifier: a real fork dispatch of a
  token-spending task, comparing the caller's occupancy reading (via Cycle 1's
  sensor) before/after against the fork's own spend. If fork tokens LEAK into
  the parent reading, the fork-by-default lever's premise is false → halt +
  re-scope Cycle 3 to externalize-early + input-discipline only + surface to
  owner (plan §6 halt-trigger 2). Cycle 3 does NOT ship with the probe red.

  Body names the F2 correction (delete-message is not a subscription-path
  runtime primitive), the skill-truncation footgun (research §2.5 — invoked
  skill content stays resident; auto-compaction reattaches ≤5000 tok/skill,
  ≤25000 total → keep state in files, not resident skills), and the
  composition surfaces (`loam-spawn-isolation` fork; `precompact-hook`
  block+log-cannot-steer-summary; the context budget's >60% externalize-early
  trigger).

  Subscription-compatible (no Anthropic API key; per
  feedback_no_anthropic_api_key). No new fork/isolation mechanism —
  `loam-spawn-isolation` already exists; this SKILL points the persona at it.

  AC families (full text in plan §4):
    - AC.CTXEVICT.1 — SKILL discoverable (valid frontmatter; reachable via
      `_symlink_plugin_skills`); body carries the three doors + the
      delete-message-not-a-primitive F2 note.
    - AC.CTXEVICT.2 — body names the composition surfaces.
    - AC.CTXEVICT.S — OUTCOME-ALTITUDE: empirical probe shows fork tool-call
      tokens do NOT add to the caller's `context_window` occupancy reading.
      RED if fork tokens leak → halt.

  Out of scope (plan §3): any new fork/isolation mechanism; the API
  context-editing path (skipped); auto-firing the discipline; steering
  `/compact` summaries (API-only).

  Method-level D-build.* decisions remain the builder's (plan §6 + §14).

  Minor's last cycle → HARD-smoke ride-along per
  feedback_hard_smoke_per_minor_before_publish (cold install + real claude -p +
  real fixture + regression ride-alongs) AFTER local seal, BEFORE publish.

  BASELINE walked at apply-time (Cycle 2 seal + §14 backfill predecessor).
  Single-component fence: `plugins/loam-skills/`.

