narrative:
  target: framework/workspace-bootstrap/seals/SEAL_COMMIT.pos-new-workspace
  body: |
    # Amendment #67 — Single-framework restructure — synthetic framework-only branch + reader fall-through

    2026-04-28. The post-D.4 fresh-workspace bootstrap (β.2 absorbed
    into D.4 / amendment #65) cloned canonical wholesale into
    `<workspace>/framework/`, producing `<workspace>/framework/
    framework/<comp>/` (component paths doubled) and
    `<workspace>/framework/CLAUDE.md` (top-level docs nested one
    level deeper than the four corpus-discovery readers expect). The
    pos3 D-shape cutover (commit `938b4c8`) patched it with a fan of
    relative symlinks at the workspace root — workspace-specific
    cosmetic patch that did NOT survive into future fresh workspaces.

    Locked decisions D1–D7 (research §6, pre-attached recommendations,
    ruled by Luke at dispatch time):

      - D1: adopt Alternative 4 (subtree-split synthetic branch).
      - D2: NOT Alternative 5 (canonical-side restructure of
        `framework/<comp>/` to `<comp>/`).
      - D3: 4a (reader fall-through), not 4b (bootstrap-time symlinks).
      - D4: custom commit-tree script (~50–100 LOC python) at a NEW
        tools-side home `framework/tools/pos-publish-framework-only/`.
      - D5: probe-and-prefer-workspace-root (handles future workspaces
        with workspace-root-specific overrides).
      - D6: applies on pos3 immediately AND future workspaces (the
        reader fall-through unblocks pos3 simultaneously).
      - D7: branch name `framework-only`.

    ## Surface added

      - framework/tools/pos-publish-framework-only/ (NEW TOOL):
          * pyproject.toml — package metadata + console-script entry.
          * src/pos_publish_framework_only/__init__.py — public API.
          * src/pos_publish_framework_only/synth.py — git-plumbing
            composition (rev-parse + ls-tree + mktree + commit-tree
            + update-ref) for deterministic framework-only branch
            synthesis. ~280 LOC.
          * src/pos_publish_framework_only/cli.py — operator-facing
            console script (`pos-publish-framework-only`).
          * tests/conftest.py — fixture canonical factory.
          * tests/test_AC_SFR_2_synthesis_pipeline.py — AC.SFR.2 +
            AC.SFR.5 verifications (lockstep advance, idempotent
            re-run, byte-content match, stranger-clones-canonical).

      - framework/workspace-bootstrap/tests/
        test_AC_SFR_1_single_framework_directory.py (NEW):
        AC.SFR.1 verification — cloned workspace has shape
        `<new-ws>/framework/<comp>/` (no doubling), HC#4 byte-content
        match against canonical's pos-v2, branch tracks framework-only.

      - framework/workspace-bootstrap/tests/
        test_AC_SFR_4_pos_sync_composition.py (NEW): AC.SFR.4
        end-to-end — bootstrap-then-sync flow, canonical advances,
        synthesis re-runs, pos-sync ff-only fast-forwards the
        workspace's framework/, byte-content match post-sync,
        workspace-state byte-identical pre/post sync (HC#6 carry-
        forward).

      - framework/workspace-bootstrap/tests/
        test_AC_SFR_5_stranger_clones_canonical.py (NEW): AC.SFR.5
        — `git clone <canonical>` (no --branch) produces a tree
        byte-identical to canonical's pos-v2; framework-only
        reachable via explicit branch flag.

      - framework/primary-persona/tests/
        test_AC_SFR_3_corpus_discovery_fall_through.py (NEW):
        AC.SFR.3 verification for the primary-persona reader pair
        (`discover_baseline_corpus` + `enumerate_amendments_in_flight`
        + the `compose_session_fields` integration).

      - framework/hands-off-lifecycle/tests/
        test_AC_SFR_3_corpus_load_sentinel_fall_through.py (NEW):
        AC.SFR.3 verification for the hands-off-lifecycle hook —
        `compute_corpus_paths_required` + `_classify_corpus_state` +
        end-to-end `write_corpus_load_sentinel`.

      - framework/tools/loam-mode/tests/
        test_AC_SFR_3_session_start_fall_through.py (NEW):
        AC.SFR.3 verification for the loam-mode emitter —
        `emit_session_start_context` falls through to
        `<workspace>/framework/CLAUDE.dev.md`.

    ## Surface edited

      - framework/workspace-bootstrap/src/workspace_bootstrap/
        new_workspace.py:
          * `FRAMEWORK_ONLY_BRANCH = "framework-only"` constant.
          * `_clone_canonical` runs `git clone <src>` followed by
            `git checkout -B framework-only origin/framework-only`
            (two-step flow accepts both source shapes — local branch
            on canonical OR remote-tracking ref via the cache layer).
          * `_resolve_url_to_clone_source` now also runs
            `git update-ref refs/heads/framework-only
            refs/remotes/origin/framework-only` against the cache
            after `ensure_cache_clone` so the cache's framework-only
            propagates as a local branch into subsequent clone-from-
            cache operations.

      - framework/primary-persona/src/session_start_gate.py:
          * `_resolve_corpus_path(workspace_root, rel)` helper —
            workspace-root first, fall through to `workspace_root /
            "framework" / rel`.
          * `discover_baseline_corpus` reads CLAUDE.md via the helper.
          * `compose_session_fields` existence-checks via the helper.
          * `enumerate_amendments_in_flight` falls through to
            `<workspace>/framework/docs/plans/`.

      - framework/hands-off-lifecycle/hooks/corpus_load_sentinel.py:
          * `compute_corpus_paths_required` reads dev-mode-manifest
            with workspace-root-first / framework-root-fall-through;
            when the framework copy is the source, the selector is
            scoped to the framework root.
          * `_classify_corpus_state` counts a path present when EITHER
            workspace-root OR framework-root copy exists.

      - framework/tools/loam-mode/src/loam_mode/session_start.py:
          * `emit_session_start_context` probes
            `<workspace>/CLAUDE.dev.md` first; falls through to
            `<workspace>/framework/CLAUDE.dev.md`.

      - framework/workspace-bootstrap/tests/conftest.py:
          * `_make_fixture_canonical` synthesises framework-only on
            the fixture by default (publish_framework_only=True);
            opt-out flag for tests verifying the failure mode.

      - framework/workspace-bootstrap/tests/test_pos_new_workspace.py:
          * AC.D.4.1 byte-content fixture pairs updated to reflect
            the post-restructure workspace shape (`<new-ws>/
            framework/CLAUDE.md` rather than `<new-ws>/framework/
            framework/<comp>/...`).
          * URL-form test asserts `<new-ws>/framework/README.md`
            rather than `<new-ws>/framework/framework/README.md`
            (doubling eliminated).

    ## ACs delivered

      - AC.SFR.1 — pos-new-workspace produces single-level
        framework directory (HC#4 byte-content match;
        framework-only is the checked-out branch).

      - AC.SFR.2 — canonical publishes framework-only in lockstep
        with pos-v2 (synthesis is idempotent; re-runs are no-ops;
        advances chain parents for ff-graph composition).

      - AC.SFR.3 — corpus-discovery readers fall through to
        `<workspace>/framework/` when workspace-root copy absent
        (four readers across primary-persona, hands-off-lifecycle,
        loam-mode).

      - AC.SFR.4 — pos-sync composition with framework-only is
        unchanged from D.3's `git fetch + git merge --ff-only`
        invariant (HC#6 carry-forward — workspace-state files
        byte-identical pre/post sync apart from pos-sync's own
        state record).

      - AC.SFR.5 — stranger-clones-canonical preserved (synthesis
        runs against canonical without mutating pos-v2).

      - AC.SFR.S — Seal-diff invariant honoured.

    ## Backwards-compatibility (HC#2)

      - All pre-existing workspace-bootstrap tests pass
        post-amendment (236 passed). Test fixture pairs updated
        to reflect the corrected (single-level) workspace shape;
        the prior assertions encoded the doubling failure class,
        not behaviour to preserve.

      - All pre-existing primary-persona tests pass (394 passed).

      - All pre-existing hands-off-lifecycle tests pass apart from
        a pre-existing failure in
        `tests/test_d1_byte_content_match.py` (workspace-bootstrap
        pyproject.toml SHA mismatch) that is unrelated to this
        amendment — pre-existing on `pos-v2` HEAD `39cfbb1`.
        Surfaced for FUTURE_IDEAS_DRAFT.

      - All pre-existing loam-mode tests pass apart from a
        pre-existing failure in `test_F_S_seal_diff.py`
        (allowed-prefix `tools/loam-mode/` references the pre-D.1
        path, not `framework/tools/loam-mode/`). Pre-existing on
        `pos-v2` HEAD `39cfbb1`. Surfaced for FUTURE_IDEAS_DRAFT.

      - HC#3: no new third-party deps. The synthesis tool uses
        stdlib + git CLI; the reader changes use stdlib `Path`.

      - HC#4: byte-content match assertions cover synthesis
        output (test_AC_SFR_2_HC4_byte_content_match) AND the
        end-to-end bootstrap-then-sync flow
        (test_AC_SFR_4_pos_sync_fast_forwards_framework_only).

      - HC#5: pos-sync composition + stranger-clones-canonical
        load-bearing properties verified empirically in tests.

      - HC#6: workspace-state byte-identity pre/post sync re-asserted
        (modulo pos-sync's own state-record surface).

      - HC#7-#10: scope-only-dispatch + no `--amend` + plan-before-
        code + stranger-clones-canonical preserved.

    ## Empirical Q1 — pre-push hook timing

      Synthesis run on canonical's actual tree at HEAD `39cfbb1`:
      0.46s wall-clock (single invocation, cold cache). Well inside
      the 5–10s dev-ergonomics budget surfaced in the plan §6
      Q1 question. The pre-push hook can run synchronously without
      operator-noticeable latency.

    BASELINE 39cfbb1 (D.5.5's seal commit ancestor — current HEAD at
    dispatch). Each component's BASELINE advances per `pos-amend
    apply`. hands-off-lifecycle's H19 frozen BASELINE stays at 3780603
    per amendment #23.
