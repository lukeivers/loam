  title: "PATCH — Per-component pyproject version lockstep regression closure. Defects against v0.8.0 AC.HONEST.1 outcome shape (per-component-version discipline established): the discipline silently broke between v0.10.0 (last honored) and v0.11.0/v0.12.0 (skipped). 26 in-scope component pyprojects currently at 0.10.0; target current shipped MINOR 0.12.0 per D-NFCLEAN.4 + D-SDPD precedents (PATCHes ride MINOR; per-component-version discipline advances with MINORs only). 4 additional pyprojects at 0.0.0 (handsoff-loop, loam-spawn-isolation, programbench-revival, programbench-revival/realpb) — measurement/experimental harnesses; §16 finding #1 ruling required (default recommendation EXCLUDE). New file docs/ACTIVE_MINOR is the machine-readable anchor; new test plugins/dev-sdlc/tests/test_AC_PCVR_pyproject_version_lockstep.py enforces the lockstep structurally + includes mutation-detection fixture for outcome-altitude proof. Four ACs (AC.PCVR.{1,2,3,4} plus AC.PCVR.S). Class PATCH per docs/release-versioning-policy.md (defect closure within established outcome shape; no new outcome capability)."

