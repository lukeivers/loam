  body: |
    # C2-bis — test-fence partition extension

    2026-05-02. Foldback for C2 halt at HT-C2.4 (109-file test-residual
    scope mismatch surfaced during C2 build investigation; C2 plan
    §5.4's 26-file enumeration was partial — restricted to production
    source/doc files only, but AC.M11a.2's literal-match grep across
    the full synthetic tree includes 109 test files containing dev-
    only literals as assertion strings, fixture content, comments, and
    docstrings). C2-bis closes the test-residual scope mechanically
    via single-glob partition extension; C2-prime (separate sealed-
    cycle, lands next) closes the smaller accurate Class C population
    (~21 production files).

    Source surfaces (audit trail):

      - C1+C2 combined sub-plan at `docs/rebuild/plans/
        oss-v0-1-0-publish-public-docs-classes-abc.md` (§14
        D-build.ABC-C2.HALT narrative).
      - C2 halt-and-surface report at `<workspace>/.scratch/
        claude-output/oss-v0-1-0-publish-classes-abc-c2-halt.md`.
      - C2-bis sub-plan at `docs/rebuild/plans/oss-v0-1-0-publish-
        public-docs-classes-abc-bis.md`.
      - M7-partition-fix precedent (small-scope sealed-cycle + HOL
        no-op anchor): `docs/rebuild/plans/oss-v0-1-0-publish-public-
        docs-partition-fix.md`.
      - C1 amendment precedent (mechanical Classes A + B partition
        reclassification, sealed `e2cbeec`).

    Locked decision (dispatcher autonomy directive):

      - Add `- glob: "**/tests/**"` to `dev_only:` block. Industry-
        convention shape — no public-shipping artefact under any
        modern Python package's `tests/` directory in v1.0 OSS
        releases (cpython, numpy, requests precedent).

    HOL is no-op narrative anchor only (per M2 + M7-partition-fix +
    C1 precedent) — sidecar bump + this notes file only; no behaviour
    edits to HOL.

    Structural remedy:

      - `framework/tools/pos-publish-framework-only/publish-mode-
        manifest.yaml` — add one glob entry under `dev_only:`:
        `**/tests/**` (with provenance comment citing the C2-bis
        plan-doc + the industry-convention rationale).

    AC surface (AC.ABC-Cbis.1 + AC.ABC-Cbis.2 + AC.ABC-Cbis.S):

      - AC.ABC-Cbis.1: M2 partition manifest's `dev_only:` block
        contains `- glob: "**/tests/**"`.
      - AC.ABC-Cbis.2: post-fix synthesis output carries zero blobs
        under any `tests/` directory (`git ls-tree -r refs/heads/
        framework-only | grep '/tests/'` returns 0 hits).
      - AC.ABC-Cbis.S: seal-diff invariant — only paths under
        `framework/tools/pos-publish-framework-only/` (structural) +
        `framework/hands-off-lifecycle/tests/SEAL_COMMIT*` (anchor) +
        universal-paths.

    Verification empirically performed pre-seal: synthesis CLI
    advanced refs/heads/framework-only against the post-feature HEAD;
    `git ls-tree -r refs/heads/framework-only | grep -E '/tests/'`
    returns zero hits. AC.ABC-Cbis.1 + AC.ABC-Cbis.2 PASS.

    Method-level choices (builder's call per ODD §1.1):

      - Single glob entry appended to existing `dev_only:` block
        (under the C1-locked `**/tests/test_AC_*_seal_diff_*.py`
        block; structural co-location with existing dev_only test
        admissions). The C1-locked exact globs remain in place as
        audit-trail for D-Q.ABC.3 = a precision ruling — they are
        subsumed by the broader `**/tests/**` but not conflicting.
      - HOL no-op anchor (convention per M2 + M7-partition-fix +
        C1 precedent; tools-tree amendments need a sealed-component
        anchor since pos-publish-framework-only carries no
        test_no_sealed_amendments.py).
      - Synthesis smoke check post-fix verifies the new glob zeroes
        out the synthetic tree's `tests/` files (sanity check, not
        part of M11a's full sweep — that's M11a-3's job, post-
        C2-prime).

    Out of scope (per plan §8):

      - C2-prime (Class C 21-file production remediation) — separate
        sealed-cycle authored at `docs/rebuild/plans/oss-v0-1-0-
        publish-public-docs-classes-abc-prime.md`; lands next.
      - The full M11a sweep (AC.M11a.1..6) — re-dispatches against
        post-C2-prime HEAD per D-Q.M11.4.
      - Removal of the C1-locked exact globs (cosmetic; out of
        scope here — kept for audit trail).
      - Per-test classification or test-rewrite — industry-convention
        shape rules: tests don't ship publicly in v1.0 OSS releases.

    BASELINE `c868618` (HEAD post-C1-§14-backfill — C1 sealed
    `e2cbeec` + C2 halt narrative recorded). The HOL anchor's
    SEAL_COMMIT sidecar lands at the seal SHA via `loam amend seal`.
