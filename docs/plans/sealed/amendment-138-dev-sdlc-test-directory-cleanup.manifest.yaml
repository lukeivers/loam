baseline: "43d1ded"

plan: docs/plans/amendment-138-dev-sdlc-test-directory-cleanup.md

seal_description: |
  Cleanup of the dev-sdlc test directory baseline so future seal-tool
  work (notably the unwritten F-SEAL-PLUGINS-TESTS-SKIPPED +
  F-SEAL-DIRTY-TREE-CHECK-AFTER-PLAN-ARCHIVE hygiene pair) lands on
  green pytest output for the full plugins/dev-sdlc test suite.

  Two concrete fixes:

  1. `plugins/dev-sdlc/dev-mode-manifest.yaml` — delete the
     `framework/memory-system/` root entry + glob (the directory was
     deleted at v0.3.0 Cycle 2 commit b92aaea, "graphiti rip-out"; the
     manifest entries are post-removal residual). Test
     AC.PMR.3 + AC.PMR.4 (both currently failing) verify every
     remaining root + glob resolves under the canonical workspace.

  2. `plugins/dev-sdlc/skills/plan-before-code-author/SKILL.md` +
     `plugins/dev-sdlc/skills/plan-docs-author/SKILL.md` — rewrite the
     frontmatter `description:` field as a `>-` (folded, strip-trailing-
     newline) block scalar so English colons inside the description
     content ("applied 2026-05-05:" etc.) no longer parse as inline
     YAML key/value separators. 9 currently-failing tests across 4
     test files clear on the same fix; body of each SKILL.md is
     unchanged.

  Pre-flight Tier-0 evidence resolved the dispatch brief's framing of
  a third scope (OSS_M6 packaging regression) as a Python-version
  artifact rather than a product-code gap: the `pyenv` shim defaults
  to Python 3.9.17 for `python`/`pytest`, but the plugin requires
  `>=3.13`; under the seal-tool's actual invocation path
  (`.venv/bin/python` → Python 3.13), the 6 OSS_M6 collection errors
  disappear and all OSS_M6 tests collect cleanly. No code change is
  needed for OSS_M6 — D-DSTC.OSS-M6-RESOLUTION = "no action".

  No edit under `plugins/dev-sdlc/src/`. The `loam.plugins.dev_sdlc`
  Python package is unchanged; entry-point discovery, CLI subcommand
  registration, and the contribution surface are behaviour-preserved.

components:
