schema_version: 1
amendment:
  number: 62
  slug: d-migration-1-5-rename-aware-seal
  title: "D-migration D.1.5 — pos-amend rename-aware seal + D.1 retroactive cleanup"

# BASELINE: cdd6e2a — current HEAD at dispatch (D.1's §14-backfill commit).
# Per BASELINE-as-HEAD~1 pattern, when D.1.5's feat commit lands HEAD
# advances to that feat commit and apply runs against this BASELINE
# (the commit immediately before the feat).
baseline: cdd6e2aed50991c4309c125b3889dc50e8f59048

plan: docs/rebuild/plans/d-migration-1-5.md

seal_description: "D-migration D.1.5 — pos-amend rename-aware seal + D.1 cleanup"

# Single-component sealed amendment: ONLY the rename-only components from
# D.1 are listed for the cleanup pass. pos-amend itself (the surface
# being modified) is admitted via universal_paths prefix per amendment
# #22 precedent (D-Q.3 lock).
#
# Apply step over these components serves TWO purposes simultaneously:
#   1. Exercises the new rename-only-detection logic (each is rename-only
#      vs cdd6e2a..HEAD-of-D.1.5-feat — the feat commit is itself a code
#      edit confined to framework/tools/pos-amend/, so each rename-only
#      component's diff window vs cdd6e2a..feat is empty for that
#      component, classifying as no-changes).
#   2. The cleanup_directives block (below) declares the pre-D.1 SEAL_COMMIT
#      + BASELINE values to revert to.
#
# Net effect: the apply step's standard component loop is a no-op for
# these components (no diff in window from cdd6e2a..feat); the
# cleanup_directives block writes back the pre-D.1 values.
components:
  - name: cost-governance
    seal_test: framework/cost-governance/tests/test_no_sealed_amendments.py
    sidecar: framework/cost-governance/tests/SEAL_COMMIT
  - name: graceful-degradation
    seal_test: framework/graceful-degradation/tests/test_no_sealed_amendments.py
    sidecar: framework/graceful-degradation/tests/SEAL_COMMIT
  - name: memory-system
    seal_test: framework/memory-system/tests/test_no_sealed_amendments.py
    sidecar: framework/memory-system/tests/SEAL_COMMIT
  - name: observability-aggregator
    seal_test: framework/observability-aggregator/tests/test_no_sealed_amendments.py
    sidecar: framework/observability-aggregator/tests/SEAL_COMMIT
  - name: reversibility-primitive
    seal_test: framework/reversibility-primitive/tests/test_no_sealed_amendments.py
    sidecar: framework/reversibility-primitive/tests/SEAL_COMMIT
  - name: self-correction
    seal_test: framework/self-correction/tests/test_no_sealed_amendments.py
    sidecar: framework/self-correction/tests/SEAL_COMMIT
  - name: self-upgrade
    seal_test: framework/self-upgrade/tests/test_no_sealed_amendments.py
    sidecar: framework/self-upgrade/tests/SEAL_COMMIT
  - name: telegram-interface
    seal_test: framework/telegram-interface/tests/test_no_sealed_amendments.py
    sidecar: framework/telegram-interface/tests/SEAL_COMMIT

