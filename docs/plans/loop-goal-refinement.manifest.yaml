schema_version: 3
amendment:
  slug: loop-goal-refinement
  title: "Loop goal-refinement — convert the hands-off-loop intake's honest-refuse terminal + the faithful=False terminal into entries into a BOUNDED goal-refinement construct, per the owner product steer (owner-steer-goal-refinement-2026-05-16.md, Luke Telegram 11408; binding foundation, NOT re-litigated): a non-tech user must accomplish what they want with AI — an unmeasurable goal is REFINED toward measurable (interactive-refine first, else self-refine), and when the real goal is not directly measurable at all, pick a measurable milestone ON THE PATH, get explicit agreement at the single approval gate, achieve it, then structurally re-engage a check-in. CONTAINED EVOLUTION of the intake derivation (NOT a loop re-architecture; decompose/dispatch/judge UNTOUCHED, AC.FOUND.0) + ONE named in-scope prerequisite — the intake->loop check_command/check_argv seam, milestone-leg-ONLY (AC.GR.6, plan §3b: the sealed phase-b-fix-plan correctly scoped this OUT for the three PBF fixes, but the owner's milestone-on-the-path behaviour is structurally unverifiable without it — an agreed milestone is meaningless if a different hand-authored command decides done; named here as a read-path connection prerequisite, NOT silently folded, NOT silently ignored). AC.GR.1 — the honest-refuse terminal (intake.py _derive_defects) AND the faithful=False terminal become BOUNDED refinement ENTRIES, never an immediate terminal approved=False; the sealed ceb629b honesty base preserved (no silent approved=True on empty, no auto-retry rubber-stamp). AC.GR.2 — interactive-refine BEFORE self-refine, both bounded, the durable elicitation leg (AC.B.2) NOT regressed (reused, not modified; the deterministic structural path is byte-unchanged). AC.GR.3 — milestone-on-the-path: a measurable goal on the path surfaced at the SINGLE approval gate framed as a milestone the loop aims at first, on agreement carried as the approved unit AND recording the still-open fuzzy aim + a structurally re-engaged check-in obligation (NOT a silent terminal replacement of the user's aim). AC.GR.4 — refinement is finitely BOUNDED (_REFINE_MAX_ATTEMPTS) and the honest-negative survives: on exhaustion a DEFINITE evidence-named honest-negative naming the goal class — NOT an unbounded loop, NOT a fabricated cheap test (sealed ceb629b no-fake preserved), NOT a weakened acceptance; the honest-negative is AC-satisfying exactly as a successful refinement is. AC.GR.5 — the lead/phase-end honest re-harden: a re-run of the EXACT phase-b-hardening 7-intent protocol (same 7 per D-GR-3 ADOPTED, one run per intent, NO retry-to-pass, simulating a reasonable cooperative user — short plain answers, agrees to a sensibly-derived measurable milestone) scored by an INDEPENDENT faithfulness judge that is NOT the loop's own AC.B.4b judge (a separate stricter differently-framed Tier-0 probe forced to enumerate what a literal exit-0 of the raw derived check command would/would-not guarantee — the verdict is real independent empirical judging, never the loop's own self-report). The bar (plan §4 rationale — do NOT move/re-argue the bar): per-intent definiteness + net improvement over the sealed 2/7 + no fabricated pass + per-class irreducibility first-class — deliberately NOT a fixed >=N/7 (a fixed number would reward gaming on honestly-irreducible classes and conflate refined-to-faithful with agreed-milestone-on-the-path, both valid owner-sanctioned outcomes). A definite 'these classes refine to faithful, these classes are irreducible even on-the-path — here is the evidence' is a VALID plan-success §10.5 outcome, reported straight, NEVER retried to green, NEVER the bar weakened, NEVER widened into a re-architecture mid-build. AC.GR.6 — the intake->loop seam closed for the milestone leg (named in-scope prerequisite, milestone-leg-ONLY): the command the loop freezes+executes (verify.FrozenAcceptance.check_argv, orchestrator.py verify(...)) is provably derived from the IntakeOutcome.machine_checkable the user agreed to — a read-path connection (freeze_input_from_outcome + the cli run --from-intake read-path consuming IntakeOutcome instead of only a hand-authored frozen JSON), NOT a redesign of decompose/dispatch/judge (AC.FOUND.0 untouched); AC.GR.1/.2/.4 do NOT depend on it and land first, AC.GR.3 depends on it, AC.GR.5's milestone-class intents depend on it. FENCE (plan §2, binding): the intake.py refinement region + the named seam read-path (milestone-leg-only — freeze_input_from_outcome in intake.py + the cli.py --from-intake read-path + the __init__.py export) + their tests + ONE conditional SKILL.md doc-truth line (the pre-change prose 'an independent faithfulness check guarding the checkable-but-wrong failure' was silent on refinement and is now inaccurate after the change — the conditional doc-truth touch IS triggered; one behavioural-doc line, minimal). The elicitation leg (intake.py:202-229, AC.B.2) is REUSED, NOT modified (the durable leg must not regress). The two pre-existing test_AC_HL_PBF_2 tests were adjusted as RECORDED fix-driven tightenings per the sealed AC.PBF.4 precedent (the binding plan AC.GR.1 explicitly converts the faithful=False terminal to a refinement entry; the sealed AC.PBF.2 property — judge sees the machine check, either polarity honest, NO retry-to-green — is PRESERVED exactly: the negative now flows into bounded refinement and lands a definite honest-negative, never flipped to green; this is a legitimate AC.GR.1 behaviour change, NOT a loosening to pass a broken test; M5 four-step resolution recorded in the build report). OUT (hard, plan §2): the core decompose->dispatch->judge loop / orchestrator.py / goal_drive.py internals (except the named seam read-path) / verify.py spine; the elicitation code; the §1a/§1c launch sites; the Telegram-poller isolation (b33c0a8, _isolation.py — UNTOUCHED; the AC.GR.5 re-harness routes EVERY judge claude spawn through the sealed shared loam-spawn-isolation surface, AST-verified zero hand-rolled subprocess.run — the Telegram-death #5 vector is closed for the re-harness); ProgramBench (downstream, gated on this re-harden); any token/argv/model/config/channel/isolation change; publish/seal-policy/canonical-main mutation. Single-component fence: framework/workspace-bootstrap/ (sidecar framework/workspace-bootstrap/tests/SEAL_COMMIT, seal_test framework/workspace-bootstrap/tests/test_no_sealed_amendments.py — VERIFIED present this turn; LIVE allowed_prefixes admit framework/tools/ + framework/hands-off-lifecycle/ + plugins/loam-skills/ + docs/plans/, all VERIFIED this turn). Anchor rationale: the intake.py/cli.py/__init__.py site edits live under framework/tools/handsoff-loop/ inside the workspace-bootstrap seal-test's admitted framework/tools/ prefix; the AC.GR.* test files + the re-harness runner land under framework/hands-off-lifecycle/tests/ + framework/tools/handsoff-loop/src/ inside the admitted prefixes; the SKILL.md doc-truth line lands under the admitted plugins/loam-skills/ prefix; mirrors the phase-b-intake-fix + telegram-5-fix + handsoff-loop-real-build precedents that sealed cleanly against workspace-bootstrap on this exact branch tip. extra_allowed_prefixes EMPTY — no sealed-source edit outside the workspace-bootstrap anchor. Pre-existing operator WT files (docs/FUTURE_IDEAS_DRAFT.md modified + the untracked docs/plans/binary-usage-observation-harness.* / principle-foundation-structural-enforcement.* pairs) are NOT this build's — untouched/unstaged/unattributed, admitted via --allow-untracked-globs at seal (AC.LAE.2), NOT auto-staged, NOT committed. NO Anthropic API key — real claude binary, default Sonnet (feedback_no_anthropic_api_key). LOCAL SEAL ONLY — NOT merged to main, NOT pushed, NOT published, NOT tagged; origin/main stays exactly at its current commit (the public step is a separate owner-asked action, NOT part of this cycle). No version bump (version derives at release-time). AC family scope-descriptive (AC.GR.1..6); slug NOT version-packed; one test file per AC per the one-file-per-AC convention; method-in-AC test passed per-AC (each satisfiable by more than one implementation per plan §4 satisfiability notes)."

