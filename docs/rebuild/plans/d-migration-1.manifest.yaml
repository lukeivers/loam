# Multi-component sealed amendment. Every framework component touched
# (16 components moved into framework/), 14 of which carry seal-test
# sidecars. Component paths declared post-move (under framework/<name>/).
# scope-of-work + safety-layer (no SEAL_COMMIT sidecar pre-D.1) are
# moved by git mv but not entered here — their seal-discipline is
# handled by hands-off-lifecycle's H19 cross-cutting test (which
# admits the framework/ first-segment via the test file's own
# allowed-set widening).
components:
  - name: cost-governance
    seal_test: framework/cost-governance/tests/test_no_sealed_amendments.py
    sidecar: framework/cost-governance/tests/SEAL_COMMIT
  - name: graceful-degradation
    seal_test: framework/graceful-degradation/tests/test_no_sealed_amendments.py
    sidecar: framework/graceful-degradation/tests/SEAL_COMMIT
  - name: hands-off-lifecycle
    seal_test: framework/hands-off-lifecycle/tests/test_cross_cutting.py
    sidecar: framework/hands-off-lifecycle/tests/SEAL_COMMIT
    frozen_baseline: true   # H19 frozen baseline (per amendment #23)
  - name: memory-system
    seal_test: framework/memory-system/tests/test_no_sealed_amendments.py
    sidecar: framework/memory-system/tests/SEAL_COMMIT
  - name: objective-tracker
