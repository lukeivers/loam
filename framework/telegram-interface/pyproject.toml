[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-telegram-interface"
version = "1.0.0"
description = "Telegram channel adapter for loam — consumes the Claude MCP Telegram plugin via adapter-pattern injection into OneOnOneChannel; supports multi-identity allowlist, availability probe, direct Bot API fallback, and session-two setup walkthrough."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "opentelemetry-api>=1.25",
    "pyyaml>=6",
    "loam-primary-persona",
]

[tool.setuptools]
package-dir = {"loam.telegram_interface" = "src/loam/telegram_interface"}
packages = ["loam.telegram_interface"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
