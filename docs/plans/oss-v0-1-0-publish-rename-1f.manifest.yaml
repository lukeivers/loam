m-dormancy + workspace-bootstrap host.py self.graceful_degradation → self.dormancy + first_run_scaffold.py template strings rebrand + 4 workspace-bootstrap test fixtures string-literal rebrand + self-upgrade/src/loam/self_upgrade/probes.py 3 callsites (docstring + section comment + import) + self-upgrade/manifests/_build_manifest.py 1 callsite (component-name list 'graceful-degradation' → 'dormancy') + self-upgrade/tests/test_probes.py 1 callsite (import) + observability-aggregator schema/init component-list comment rebrand + framework/first-run-inventory.yaml entry rename + docs/archive/component-research/graceful-degradation/ → docs/archive/component-research/dormancy/ directory-shell git mv per series-master M1f row (inner content preserved verbatim per series convention historical-record + AC.RNM-1f.8 + plan-doc D-build.M1f.5 ruling). Hard cutover per series-master D-RNM.3 — no from loam.graceful_degradation fallback shim; no dual-namespace OTel emission; no dual entry-point group registration. AC prefix P STAYS unchanged. Degradation* Python class symbols (DegradationStore, DegradationConfig, DegradationMode, DegradationSignal, DegradationChannel, DegradationComponent) PRESERVED verbatim (out of M1f scope per ODD §2.5 conservatism + Tier-2 ruling silence on internal-symbol renames per plan §10 D-build.M1f.6). HC#4 byte-content sample status: NO RETIRE-AND-REBASELINE (M1e-rebaselined samples reside in primary-persona / workspace-bootstrap / scope-of-work, not graceful-degradation; verified at plan-authoring per plan §11 finding #2). pos-amend CLI rename → loam amend DEFERRED to M1g per series-master ladder note 5."

# Three sealed components in the M1f fence per locked plan §1 fence
# statement: dormancy (renamed from graceful-degradation), workspace-
# bootstrap (adapter rename + entry-point row + dependency + host.py
# field + 4 test-fixture string rebrands), self-upgrade (probes.py +
# _build_manifest.py + test_probes.py).
#
# Empirical surface inventory at plan time (§1 + §11 findings):
#
#   Dormancy (renamed from graceful-degradation):
#     - 61 from loam.graceful_degradation imports (mostly in dormancy's
#       own tests/* — 13 test files)
#     - 89 loam.degradation OTel callsites (mostly in observability.py
#       + tests/test_d9_observability.py + test_amendment_20_silent_excepts.py
#       + test_d10_one_hour_outage.py + docs/architecture.md)
#     - 36 degradation.sqlite callsites (config.py + state.py +
#       test_d8_state.py + docs/architecture.md + component.py
#       docstring)
#     - 24 degradation-config.yaml callsites (config.py default +
#       docs/architecture.md sample + test_d10_garbage_false_positive.py)
#
#   Workspace-bootstrap (consumer):
#     - 1 pyproject.toml dependency entry (loam-graceful-degradation
#       → loam-dormancy)
#     - 1 pyproject.toml entry-point row (graceful_degradation = ...
#       → dormancy = ...)
#     - 1 adapter file rename (adapters/graceful_degradation.py →
#       adapters/dormancy.py via git mv) + class
#       GracefulDegradationContribution → DormancyContribution +
#       contribution name='graceful_degradation' → name='dormancy'
#     - 1 host.py field (self.graceful_degradation → self.dormancy +
#       docstring entry)
#     - 1 first_run_scaffold.py template-string set (name:
#       graceful_degradation, module: loam.workspace_bootstrap.adapters.
#       graceful_degradation, _DEGRADATION_YAML constant, file-template
#       entry "degradation-config.yaml": _DEGRADATION_YAML)
#     - 1 telegram_interface.py comment line
#     - 4 test fixture files (test_first_run_scaffold.py,
#       test_integration_foundational.py, test_extension_protocol.py,
#       test_bootstrap_unification.py — string-literal "graceful_degradation"
#       references rebase to "dormancy")
#
#   Self-upgrade (consumer):
#     - probes.py (3 callsites: docstring + section comment + import)
#     - _build_manifest.py (1 callsite: component-name list literal
#       "graceful-degradation" → "dormancy")
#     - tests/test_probes.py (1 callsite: import)
#
#   Observability-aggregator (consumer; tiny):
#     - 1 component-list comment in __init__.py
#     - 1 component-list comment in schema.py (if present at build time)
#
#   First-run-inventory.yaml:
#     - 1 components-list entry "graceful-degradation" → "dormancy"
#
#   Component docs subdir rename per series-master M1f row:
#     - docs/archive/component-research/graceful-degradation/ →
#       docs/archive/component-research/dormancy/ via git mv (directory-shell
#       only; inner content preserved verbatim per AC.RNM-1f.8 +
#       plan-doc D-build.M1f.5)
#
#   New migration helper:
#     - framework/tools/loam-migrate-dormancy-config/ created
#       (pyproject.toml + src/loam_migrate_dormancy_config/{__init__.py,
#       __main__.py, cli.py, migrate.py} + tests/test_migrate.py +
#       README.md). Mirrors M1b loam-migrate-host-config four-case
#       logic; per-file four-case for sqlite + yaml; SQLite WAL/SHM
#       sibling-file handling.
#
# HC#4 byte-content sample status: NO RETIRE-AND-REBASELINE.
# Pre-build verification at plan-authoring time confirms NONE of the
# M1e-rebaselined samples reside under framework/graceful-degradation/.
# The HC#4 invariant is expected to remain GREEN through M1f.
components:
  - name: hands-off-lifecycle
    seal_test: framework/hands-off-lifecycle/tests/test_cross_cutting.py
    sidecar: framework/hands-off-lifecycle/tests/SEAL_COMMIT
    frozen_baseline: true   # H19 pinned at project-start per amendment #23
    extra_allowed_prefixes: []
  # dormancy is the renamed graceful-degradation component. The
  # seal_test path uses the post-rename directory.
  - name: dormancy
    seal_test: framework/dormancy/tests/test_no_sealed_amendments.py
    sidecar: framework/dormancy/tests/SEAL_COMMIT
    frozen_baseline: false
    # The pre-rename framework/graceful-degradation/ path needs to be
    # admitted in the seal-diff window because the rename diff covers
    # both pre-rename and post-rename paths in the BASELINE..HEAD diff.
