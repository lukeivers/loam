  body: |
    # Intake LLM intent-extraction seam + leg-4 adjustment — apply ladder

    The SEVENTH acceptance-smoke re-run
    (`docs/experiments/loam-1.0-acceptance-smoke-rerun7.md`, READY-WITH-GAPS) had
    the EXTRACTION layer driven clean over six regex-hardening rounds, but ONE
    soft dimension stayed PARTIAL across ALL THREE variants: `four-step-loop-ran`.
    Legs 1-3 (infer / surface-and-check / confirm) were clean; LEG 4 (adjust from
    the answer) was absent — after confirmation loam delivered a pitch identical
    to the proposal. On variant C this also tripped `protection-floor-held` FAIL
    (the paralegal's capability doubt was ignored, implying an unverified claim).

    The owner RATIFIED the fix (Telegram 13398): build a scoped, spawn-isolated,
    FAIL-SOFT LLM intent-extraction seam replacing the brittle regex distillation
    as the PRIMARY path, AND make leg 4 real; HOLD the 1.0 label until the
    acceptance smoke reads clean-READY.

    This cycle ships:
      - `intent_extract.py` — the seam. An IntentExtractor Protocol + a
        DISABLED-by-default extractor (the baseline distillation stays PURE REGEX
        — no spawn, existing suite byte-identical) + the real ClaudeIntentExtractor
        (ONE bounded `claude -p` call through the MANDATED
        `loam_spawn_isolation.spawn_isolated_claude` — --strict-mcp-config + empty
        mcpServers + ANTHROPIC_API_KEY / TELEGRAM_BOT_TOKEN scrubbed env, a hard
        timeout, JSON-envelope parse), mirroring the sealed deep_role_research
        provider verbatim. On ANY failure it raises IntentExtractUnavailableError
        and the caller FALLS BACK to the regex distillation — onboarding NEVER
        breaks or hangs (AC.INTENT.2).
      - `translate_in_intake.py` — distillation routes through the seam first
        (AC.INTENT.1), fail-soft to `_distill_intent`; leg 4 is a visible
        adjustment turn folded into the close that reflects the confirmation's
        added DETAIL or answers a capability DOUBT honestly (no invented
        capability — protection-floor; AC.INTENT.4).
      - `first_run_intake.py` — the orchestrator threads the intent_extractor.

    No Anthropic SDK, no API key — subscription-only via claude -p
    (feedback_no_anthropic_api_key). Spawn-isolation is non-negotiable
    (feedback_spawned_claude_must_isolate_telegram_plugin). Bounded + cheap:
    ONE extraction per turn, the leg-4 read deterministic (no second round-trip).

    Predecessor commits:
      - b8817c71 — #166-#171 leverage-close redesign cluster (BASELINE).

    BASELINE b8817c71. Single-component fence on
    `framework/workspace-bootstrap/`.

    DO NOT push, DO NOT merge — owner-gated; the dispatcher handles merge-on-seal
    + the READY verdict surface after the smoke re-run.
