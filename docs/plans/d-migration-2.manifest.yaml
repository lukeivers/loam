baseline: 9221fa0b39bfe3652e47279cab2874538ebdfc65

plan: docs/plans/d-migration-2.builder-plan.md

seal_description: "D-migration D.2 — workspace-state directory established at <workspace>/workspace/ + reader cutover"

# Multi-component sealed amendment per the wider-fence ruling
# (primary persona 2026-04-27, option (a)). The dispatch's halt-and-
# surface report enumerated readers across primary-persona, loam-mode,
# all of workspace-sync, all of self-upgrade, plus the
# workspace-bootstrap/adapters/* cluster. All sealed components in
# that fan-out are listed below.
#
# loam-mode (framework/tools/loam-mode/) is NOT a sealed component
# (no SEAL_COMMIT sidecar pre-D.2). Its source edit is admitted via
# the framework/tools/ universal-paths prefix per D.1's precedent.
components:
  - name: workspace-bootstrap
    seal_test: framework/workspace-bootstrap/tests/test_no_sealed_amendments.py
    sidecar: framework/workspace-bootstrap/tests/SEAL_COMMIT
    frozen_baseline: false
  - name: hands-off-lifecycle
    seal_test: framework/hands-off-lifecycle/tests/test_cross_cutting.py
    sidecar: framework/hands-off-lifecycle/tests/SEAL_COMMIT
    frozen_baseline: true   # H19 frozen baseline (per amendment #23)
  - name: primary-persona
    seal_test: framework/primary-persona/tests/test_no_sealed_amendments.py
    sidecar: framework/primary-persona/tests/SEAL_COMMIT
    frozen_baseline: false
  - name: workspace-sync
    seal_test: framework/workspace-sync/tests/test_no_sealed_amendments.py
    sidecar: framework/workspace-sync/tests/SEAL_COMMIT
    frozen_baseline: false
  - name: self-upgrade
    seal_test: framework/self-upgrade/tests/test_no_sealed_amendments.py
    sidecar: framework/self-upgrade/tests/SEAL_COMMIT
    frozen_baseline: false

# Universal admissions per amendment #22 ruling #3 + D-Q.3 / D-Q.4 lock.
# framework/tools/ admitted as a prefix because loam-mode lives there
# but lacks a SEAL_COMMIT sidecar (per D.1's precedent for unsealed-
# component cluster admissions).
universal_paths:
  prefixes:
    - docs/plans/
    - framework/tools/
  files:
    - CLAUDE.md
    - docs/odd-in-pos.md
    - docs/odd-methodology.md
    - docs/FUTURE_IDEAS.md

narrative:
  target: framework/hands-off-lifecycle/seals/SEAL_COMMIT.true-first-run
  body: |
    # Amendment #63 — D-migration D.2 — workspace-state directory established at <workspace>/workspace/ + reader cutover

    2026-04-27. Second of the D-migration amendments. D.1 (sealed at
    570092a, Amendment #61) restructured canonical pos-v2's
    `framework/<component>/` layout. D.1.5 (sealed at 21e27f2,
    Amendment #62) added rename-aware seal logic to pos-amend. D.2
    establishes the workspace-state side of the structural split:
    every workspace-state file (`.pos/`, `personas/`, `.mcp.json`,
    `objective_tracker.sqlite`, orchestrator + memory-write-worker
    log files, adapter `data/` paths) lives under
    `<workspace>/workspace/<...>` rather than at the workspace root.

    `<workspace>/.claude/` is preserved at the workspace root per
    D-Q.A4 lock (Claude Code expectation honoured).

    pos3's existing flat-tree workspace-state is NOT auto-migrated
    by this amendment (HC#5 — pos3 in-place migration is a future
    amendment, e.g. D.2.5).

    ## Wider-fence ruling — primary persona, 2026-04-27

    The prior D.2 builder halted-and-surfaced after pre-build
    investigation (per plan §10 trigger #4 — required source-edit
    outside fence). The halt-surface report at
    `.scratch/claude-output/d-migration-2-halt-surface.md`
    enumerated ~10 reader files across components: primary-persona,
    tools/loam-mode, all of workspace-sync (not just sync_protected),
    all of self-upgrade, the broader workspace-bootstrap/adapters/
    cluster, and hands-off-lifecycle hooks.

    Three resolutions ranked: (a) extend D.2's fence to every reader;
    (b) introduce a path-helper but still touch every reader (same
    fence problem); (c) defer the writer move too — D.2 establishes
    layout symbolically only.

    Primary persona ruled (a) — extend fence. Reasoning: D.2's
    objective in plan §4 is establishing the workspace-state
    directory. A symbolic-only D.2 (option c) defers the actual
    establishment until reading code reads from there. HC#6's
    structural promise only becomes meaningful once the new paths
    are the live paths. HC#5 (pos3 smoke verifies the new layout
    works) is impossible unless the new layout is live.

    ## Surface added

      - framework/workspace-bootstrap/src/workspace_bootstrap/
        workspace_paths.py (NEW MODULE) — single-source-of-truth
        path helpers + WorkspaceLayout Pydantic schema with HC#6
        structural-guard validator.

      - framework/workspace-bootstrap/tests/
        test_d2_workspace_state_scaffold.py (NEW) — AC.D.2.1
        verification with HC#4 byte-content match for scaffolded
        workspace-state files.

      - framework/workspace-bootstrap/tests/
        test_d2_workspace_layout_refuses_framework_state.py (NEW)
        — AC.D.2.4 structural-guard verification.

      - framework/workspace-bootstrap/tests/
        test_d2_no_inline_workspace_state_paths.py (NEW)
        — AC.D.2.5 centralisation verification (greps framework
        source for inline `workspace_root / ".pos"` patterns).

      - framework/workspace-bootstrap/tests/
        test_d2_workspace_paths_helper.py (NEW) — unit tests
        for the helper.

    ## Surface edited

      - framework/workspace-bootstrap/src/workspace_bootstrap/
        adapters/first_run_scaffold.py:
          * Plist templates' StandardOutPath / StandardErrorPath /
            WorkingDirectory updated to `{workspace}/workspace/...`.
          * `_write_amendment_j_workspace_files` writes under
            `pos_subdir(workspace_root)` not `workspace_root /
            ".pos"`.
          * `_install_persona_directory` writes under
            `personas_dir(workspace_root)`.
          * Scaffolds `<workspace>/.gitignore` (declares framework/
            as the only tracked subtree).

      - framework/workspace-bootstrap/src/workspace_bootstrap/
        adapters/{observability_aggregator,cost_governance,
        safety_layer,self_correction,reversibility_primitive}.py:
        `host.workspace_root / "data"` → `data_subdir(...)`.

      - framework/workspace-bootstrap/src/workspace_bootstrap/
        adapters/primary_persona.py: `host.workspace_root / ".pos"`
        → `pos_subdir(...)`.

      - framework/workspace-bootstrap/src/workspace_bootstrap/
        adapters/mcp_json_writer.py: `workspace_root /
        MCP_JSON_FILENAME` → `mcp_json_path(workspace_root)`.

      - framework/workspace-bootstrap/src/workspace_bootstrap/
        adapters/tracker_seed.py: `tracker_db_path_for(...)`
        returns `<ws>/workspace/objective_tracker.sqlite`.

      - framework/hands-off-lifecycle/hooks/{first_run_state,
        active_scope_sentinel,corpus_load_sentinel,first_run_dispatch,
        first_run_helper,first_run_scaffold_runner,statusline}.py:
        workspace-state path constants pinned to `workspace/.pos/...`
        with comment pointing at workspace_paths.py as canonical
        source. Hooks duplicate the constants per minimum-import
        contract (the hook scripts run before the workspace's
        .venv exists; cannot import workspace_bootstrap).

      - framework/primary-persona/src/{session_start_gate,
        dispatch_wrapper,loader,authoring,onboarding,introduction,
        memory_write_worker,stop_emitter,tracker_context}.py:
        every workspace-state path read updated to use the
        workspace_paths helper.

      - framework/workspace-sync/src/workspace_sync/{state,staging,
        merge_helper,ancestor_detection,sync_config,sync_protected,
        cli}.py: workspace-state path reads updated. (Pre-D.3
        path-correctness window — D.3 retires the bulk of
        workspace-sync.)

      - framework/self-upgrade/src/self_upgrade/{state,
        sync_protected}.py: workspace-state path reads updated.

      - framework/tools/loam-mode/src/loam_mode/session_start.py:
        `Path(workspace_root) / "personas"` →
        `personas_dir(workspace_root)`.

      - test fixtures across the touched components: mechanical
        path-shift updates per ODD §3.4. Existing AC verifications
        unchanged in intent.

    ## ACs delivered

      - AC.D.2.1 — workspace-bootstrap scaffolds workspace state
        under `<workspace>/workspace/`. HC#4 byte-content-match
        for scaffolded files.

      - AC.D.2.2 — `<workspace>/.claude/` location preserved at
        workspace root (D-Q.A4 lock).

      - AC.D.2.3 — Plist EnvironmentVariables / StandardOutPath
        / WorkingDirectory reference new paths.

      - AC.D.2.4 — HC#6 structural guard fires via WorkspaceLayout
        Pydantic validator.

      - AC.D.2.5 — Path-helper centralisation enforced
        structurally (no inline `workspace_root / ".pos"` patterns
        in framework source).

      - AC.D.2.S — Seal-diff invariant.

    ## ACs deferred from plan §4

      - Original AC.D.2.4 (workspace-state migration script): defers
        to a future D-amendment (D.2.5) per D.2-build.F. The
        wider-fence ruling already restructured this amendment's
        shape; the migration script lands cleanly once D.2
        establishes the layout.

      - Original AC.D.2.5 (pos3 real-apply): defers with the
        migration script (HC#5 honoured — D.2 does NOT auto-migrate
        pos3).

    ## Backwards-compatibility (HC#2)

      - Every pre-existing component test passes post-D.2 modulo
        mechanical fixture-path updates. These count as mechanical
        fixture updates per ODD §3.4, not regressions.

      - Every code edit traces to an AC (reverse traceability check
        in d-migration-2.builder-plan.md §5).

      - HC#3: no new third-party deps.

      - HC#4: byte-content-match assertions for scaffolded
        workspace-state files post-fresh-scaffold (in
        test_d2_workspace_state_scaffold.py).

      - HC#5: pos3 in-place migration NOT performed by D.2 (deferred
        per D.2-build.F).

      - HC#6: WorkspaceLayout Pydantic validator refuses
        framework-rooted workspace-state paths structurally.

      - HC#7-#9: scope-only-dispatch + no `--amend` + plan-before-
        code adhered.

    BASELINE 9221fa0 (D.1.5's §14 backfill commit — HEAD at dispatch).
    Each component's BASELINE advances per `pos-amend apply`.
    hands-off-lifecycle's H19 frozen BASELINE stays at 3780603 per
    amendment #23.

    Next: D.3 dispatches against the post-D.2 tree. D.3 retires
    workspace-sync's bespoke pipeline in favour of `git fetch +
    git merge --ff-only` against `framework/`.
