  # source stays in the canonical dev tree (and runs in dev mode);
  # ONLY the partition class changes here. M-GMP relocates the source
  # to plugins/graphiti-memory/ at the right time. See `dev_only:`
  # block below for the new entry.
  - glob: "framework/objective-tracker/**"
  - glob: "framework/observability-aggregator/**"
  - glob: "framework/orchestrator/**"
  - glob: "framework/primary-persona/**"
  - glob: "framework/reversibility-primitive/**"
  - glob: "framework/safety-layer/**"
  - glob: "framework/scope-of-work/**"
  - glob: "framework/self-correction/**"
  - glob: "framework/self-upgrade/**"
  - glob: "framework/telegram-interface/**"
  - glob: "framework/workspace-bootstrap/**"
  - glob: "framework/workspace-sync/**"
  # Workspace-bootstrap input (referenced by runtime).
  - path: framework/first-run-inventory.yaml
  # Top-level public files. README.md + CLAUDE.md exist today;
  # LICENSE / CONTRIBUTING.md / CODE_OF_CONDUCT.md / SECURITY.md
  # are forward-looking — authored at M8.
  - path: README.md
  - path: CLAUDE.md
  - path: LICENSE
  - path: CONTRIBUTING.md
  - path: CODE_OF_CONDUCT.md
  - path: SECURITY.md
  # Public docs scaffold — forward-looking — authored at M7.
  - path: docs/positioning.md
  - path: docs/getting-started.md
  - path: docs/architecture.md
  - glob: "docs/components/**"
  - glob: "docs/design/**"
  # Public plugin-reference category — added at M7-partition-fix per
  # AC.M7-fix.1 (foldback for M11a halt F-M11a.1). M7 commit `2fefd8b`
  # added `docs/plugins/dev-sdlc.md` per M7 D-Q.M7.6 = (c) "separate
  # `docs/plugins/<name>.md` category"; the M2 manifest predates M7
  # and never admitted the new directory. Future v0.x plugin
  # references inherit this glob's `dev_and_public` class.
  - glob: "docs/plugins/**"
  # Existing live public-relevant docs.
  - path: docs/CLAUDE_CAPABILITIES.md
  # install-from-source.txt + docs/install-from-source.md ADMITTED at
  # FBE.4 (v0.1.0 reviewer foldback; plan-doc: docs/rebuild/plans/
  # v0-1-0-foldback-scope-expansion-fbe4.md; parent: docs/rebuild/
  # plans/v0-1-0-foldback-scope-expansion.md §4 FBE.4). Path B
  # (in-tree resolution via ordered `-e ./<comp>` requirements file)
  # ratified after the prior FBE.4 dispatch's empirical halt
  # (pip 26.0.1 rejects ${PROJECT_ROOT} substitution in
  # [project.dependencies] and requirements.txt parsing alike;
  # documented in <workspace>/.scratch/claude-output/fbe4-status-
  # 2026-05-03.md Probes 1-7). Bare-name inter-component deps stay
  # in pyprojects (workspace-bootstrap + dev-sdlc + loam-init,
  # byte-identical to BASELINE per AC.FBE.4.{1,2}); the requirements
  # file plus prose doc carry the in-tree resolution mechanism for
  # v0.1.0 stranger-clone install. v0.2 PyPI publish gate captured
  # to FUTURE_IDEAS.
  - path: install-from-source.txt
  - path: docs/install-from-source.md
  # plugins/dev-sdlc/ SPLIT-ADMITTED at FBE.3 (v0.1.0 reviewer
  # foldback; plan-doc: docs/rebuild/plans/v0-1-0-foldback-scope-
  # expansion-fbe3.md; parent: docs/rebuild/plans/v0-1-0-foldback-
  # scope-expansion.md §4 FBE.3 + §3 Decision B.2 (Decision B.alt =
  # SHIP at v0.1.0)).
  #
  # Pre-M6b.0 the plugin classified `dev_and_public` per M6a baseline.
  # M6b.0 RECLASSIFIED it `dev_only` per AC.OSS-M6b0.9 + D-build.M6.14
  # because the plugin contains the dev-discipline corpus (CDCs,
  # long-form ODD docs, conventions, gate hooks, loam-mode tooling,
  # dev-mode-manifest). FBE.3 SPLITS the admission: the user-facing
  # plugin source (`src/`, `pyproject.toml`, `README.md`) ships
  # publicly so a stranger can `pip install -e plugins/dev-sdlc`
  # against the synth tree and reach the contribution-protocol +
  # `loam project` verb (BLOCKER 2 in the reviewer foldback). The
  # dev-discipline subtree (`docs/`, `hooks/`, `templates/`,
