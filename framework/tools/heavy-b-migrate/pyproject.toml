[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-heavy-b-migrate"
version = "1.9.0"
description = "Heavy-B Phase α/β/γ data-migration extractors + lazy-projection trigger (dev-discipline; post-M1g namespace pivot per M1e §11 finding #4)."
requires-python = ">=3.11"

[project.scripts]
heavy-b-migrate = "loam.heavy_b_migrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
