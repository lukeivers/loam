  slug: release-cli-tag-target-and-cut-hardening
  title: "Release-CLI hardening (cycle 1 of 3) — the release tool CANNOT tag a broken tree and CANNOT ship a mis-shaped/mis-numbered cut, plus a build-time mergeability verb. THREE distinct-but-composing outcomes in one loam-cli amendment, per the 2026-07-08 release-seal near-miss audit: (D) RIGHT TAG TARGET — resolve a version's tag target as the seal that DOMINATES every other seal in its roadmap §2 row (ancestor-dominance), replacing the fragile seals[-1] text-parse at ALL four tag-target sites (runner tag creation, seal-reachable gate, notes anchor, backfill marker) + a mandatory dominance gate in gates.run_all; HALT/RED when no seal dominates. (A) DETERMINISTIC CUT — a mandatory gates.run_all gate recomputes class+number from repo state (conventional-commit scan over <published>..HEAD + published-tag read) per docs/release-versioning-policy.md and REDs when content class != the version being cut (the policy's own halt-and-surface, never-silent-renumber event); MAJOR stays owner-gated (D-CUT.MAJOR). (B) MERGEABILITY VERB — `loam release preflight <version>` emits per-branch fast-forward/merge-tree verdicts + the computed cut, shaped for the ratification artefact; HONESTLY a tool-assisted PARTIAL (relies on being run), NOT the structural pre-dispatch hook (that is a SEPARATE scheduled item, out of scope). Real-row verified: the dominating-seal resolver's target == git rev-list -1 v1.10.0 (99a1be9) and v1.11.0 (badd2d6f). Outcome-altitude: AC.DOM.4 (non-dominating first-SHA row → dominating seal, never the early SHA), AC.CUT.4 (MINOR-content-under-PATCH-target → RED), AC.PRE.4 (conflicting branch → non-clean). STOP at sealed-local — no `loam release`, no tag, no push (the single published cut is the dispatcher's action after all 3 cycles seal)."

