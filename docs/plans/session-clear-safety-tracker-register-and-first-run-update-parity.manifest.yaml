amendment:
  slug: session-clear-safety-tracker-register-and-first-run-update-parity
  title: "session-`/clear` safety: objective-tracker as the open-loop register + first-run↔update parity registry MINOR — a workspace `/clear`/compaction loses no meaningful end-user state without a hand-maintained RESUME-STATE file, AND every state-mutating first-run/setup step has a registered, idempotent update-path the workspace-update process discovers + replays against EXISTING (already-initialized) workspaces. Root cause is GIVEN + verified-from-canonical-source this turn (not re-derived): FBM session-start reconstruction is recency-ranked + source-blind; the SEALED `tracker-context` SessionStart contributor (amendments #38/#40) is the designed open-loop priority channel but emits nothing because the existing workspace's objective-tracker has 0 rows — amendment-39 `tracker_seed` fires fresh-clone-only and `run_first_run_scaffold` short-circuits to `already_scaffolded` on re-run (AC36.3 — re-run is a by-design no-op, the exact mechanism that lets a newly-added setup step never replay); compounding, `ObjectiveStatus = {proposed, active, achieved, abandoned}` (spec.py:58-76, verified) has NO status meaning 'shipped, owner ruling pending'. Subsumes R1 (tracker becomes the seeded AND existing-workspace-backfilled, priority-ordered home for open owner decisions + the sequenced dev queue — turns the starved sealed channel load-bearing), R2 (an additive owner-pending lifecycle distinction — amendment-38 widening precedent, default-preserving, D8 round-trip), and G (a NEW lightweight first-run↔update parity registry + discovery + idempotent replay against existing workspaces — NOT `first-run-inventory.yaml`, which is venv/services provisioning with no per-item update-path; reusing it would entrench the AC36.3 no-op-on-re-run defect). ODD §4 re-extension applied to the SEALED recency-only digest outcome contract (AC.MSC.2 'most-recent', AC40.1 'non-empty when in-flight exists' — neither pins priority): locked-design-not-license — 'it's the sealed recency contract' is NOT a defense; the corrective adds a priority-altitude outcome AC, named not silently widened. memory-session-continuity §10-risk-3 advisory framing ('the persona should use the facts better') is structurally REJECTED (carried ratified F2 — the residual is the unfed channel + missing owner-pending state, not persona-discipline). 14 ACs across 3 families + 3 seal-diff: AC.SCS-R1.{1,2,3,4,S} (4 = outcome-altitude: existing-unseeded-workspace backfill via the production entry-point, no pre-arranged state — the defect's exact inverse), AC.SCS-R2.{1,2,3,S}, AC.SCS-G.{1,2,3,4,S}; all outcome-shape, method-in-AC test passed per-AC; AC.SCS-R1.*/AC.SCS-R2.* ladder to AC.PO.1, AC.SCS-G.* ladder to AC.PO.2. Class MINOR — R2/R1 change user-observable session-start digest content + add a representable lifecycle state; D-SCS.1 ratifies, PATCH only on explicit build-time evidence of no user-observable boundary cross (unlikely). Version derives at release-time (`feedback_version_numbers_at_release_time`). AC family scope-descriptive (`AC.SCS-*`); slug NOT version-packed. THREE sequenced sub-amendments under one plan (R2→R1→G; R1's publish-relevant FBM fix NOT blocked on G's general framework); builds serialized one-tree (`feedback_serialize_amendment_builds`). Predecessor plan-author HEAD ace6f87; composes on SEALED #38 (tracker schema widening), #39 (fresh-clone tracker-seed), #40 (tracker-context contributor — no priority AC), #45/#46 (multi-contributor SessionStart registry/emitter), and the SEALED memory-session-continuity amendment (recency floor + the §10-risk-3 residual this plan rejects structurally). D-SCS.3: OWNER-RATIFIED in CORRECTED form (recorded 2026-05-18, Telegram msg 11547) — build in an ISOLATED git worktree of canonical loam off a CLEAN base, NO sequence-after dependency; the original 'sequence-AFTER the in-flight `amend/loam-init-persona-wiring`' recommendation was SUPERSEDED because that branch is STALE (last commit `ace6f87` 2026-05-16, no open `loam amend` cycle, Tier-0-verified twice) — drift-contamination eliminated structurally, not via same-tree serialization; the recommended→superseded→ratified-corrected trail is preserved in the plan-doc §14/§16. NO Anthropic API key constraint unaffected (no LLM call added). OWNER-RATIFIED — BUILD-READY: D-SCS.1/D-SCS.2 RATIFIED + D-SCS.3 SUPERSEDED→RATIFIED-corrected (Telegram msgs 11545/11546/11547; full provenance + audit trail in plan-doc §14/§16). The single gating ruling is cleared; objective / AC ladder / component fence UNCHANGED by the ratification-recording turn."

