[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-deploy-safety-floor"
version = "0.1.0"
description = "Always-on deploy-safety FLOOR — per-environment config abstraction + destructive-action classifier (gate = max(declared, resolved)) + attestation-record contract + refuse-all-destructive default + the PreToolUse floor gate. Framework-native; deploy-tier capabilities compose ON it."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[tool.setuptools]
package-dir = {"loam.deploy_safety_floor" = "src/loam/deploy_safety_floor"}
packages = ["loam.deploy_safety_floor"]
