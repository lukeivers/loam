[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-observability-aggregator"
version = "1.4.0"
description = "loam observability aggregator — single-user local-first trace store. Subscribes to every sealed component's emission surface (OTel via bootstrap; memory JSONL via tail), stores in DuckDB (SQLite fallback), serves structured + NL + CLI queries, supports replay under decaying retention with v1.1 R10 retention-class honouring."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    "duckdb>=1.0",
]

[tool.setuptools]
package-dir = {"loam.observability_aggregator" = "src/loam/observability_aggregator"}
packages = ["loam.observability_aggregator"]

[project.scripts]
pos-obs = "loam.observability_aggregator.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
