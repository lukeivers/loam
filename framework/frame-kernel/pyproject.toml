[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-frame-kernel"
version = "1.3.0"
description = "loam frame-kernel — the resident microkernel (Trusted Computing Base) + the SubagentStart auto-context handoff that injects the always-on core, active-workstream context, and relevant memory into every dispatched subagent."
requires-python = ">=3.11"
dependencies = [
    "loam-primary-persona",
]

[tool.setuptools]
package-dir = {"loam.frame_kernel" = "src/loam/frame_kernel"}
packages = ["loam.frame_kernel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
