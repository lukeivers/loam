[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orphan-plist-cleanup"
version = "0.1.0"
description = "Detect and remediate pre-amendment-#6 orphan pos-v2 launchd plists."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orphan-plist-cleanup = "orphan_plist_cleanup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
