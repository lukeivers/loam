amendment:
  slug: frame-kernel-subagent-context-handoff-1a
  title: "loam-realignment SLICE 1a — SubagentStart auto-context handoff (the IN-handoff / keystone). NEW component `frame-kernel`: a `SubagentStart` hook (`framework/frame-kernel/hooks/subagent_start_context.py`) that injects ONE `additionalContext` bundle into every dispatched subagent's context, carrying three tiers — (a) the always-on MICROKERNEL (`kernel/loam-microkernel.md`: prime directive (per-user translation) + three-role identity (runtime/platform/product) + protection floor + pause-if-lost, authored as if-then implementation intentions, version-pinned, read from the file not hardcoded); (b) the active workstream context (resolver STUBBED to current-workstream for 1a — project-keying is the deferred P-layer); (c) relevant memory (reuses `memory_consumer.search(query=<task text>, group_ids=[workspace_slug])` unchanged). Registered via a portable `settings.fragment.json` (mirrors keep-pace's fragment shape; `${LOAM_REPO}` placeholder + SubagentStart matcher block). Output = `hookSpecificOutput.additionalContext` JSON envelope (mirrors `principle_reminder.py`). Extends loam governance from the human→persona boundary DOWN to persona→subagent, lifts the unused SubagentStart primitive, retires hand-written principle/context propagation in dispatch briefs. AC.SACH.{1,2,3,4,5,S}: bundle carries microkernel (1); microkernel in if-then form (2); workstream + memory tiers present (3); fail-soft — never aborts a dispatch (4); registered via portable settings-fragment (5); REAL subagent dispatch receives the microkernel — outcome-altitude (S). Feasibility CONFIRMED from the claude-feature-awareness catalogue (SubagentStart + additionalContext-in-hookSpecificOutput both first-class); residual live-version risk carried as the AC.SACH.S build-time probe + a §8 halt trigger. SLICE 1b (SubagentStop frame-check), project-keyed selective loading, live-activation merge, and workspace-sync fragment auto-composition are explicitly OUT OF SCOPE. NEW single-component fence: `frame-kernel`."

