  body: |
    # V11.A — orchestrator runtime fix (fence-one-no-edit)

    2026-05-03. v0.1.2 load-bearing item per
    `docs/rebuild/plans/v0-1-x-roadmap.md` §2 v0.1.2 item 1.
    Sub-plan: `docs/rebuild/plans/v0-1-2-V11-A-orchestrator-fix.md`.
    Empirical orchestrator-state observation:
    `<workspace>/.scratch/claude-output/orchestrator-state-2026-05-02.md`.

    Scope (per sub-plan §4 + §6): fence-one-no-edit on
    `framework/orchestrator/`. ZERO source-side edits inside
    `src/`, `ops/`, or `scripts/`. Bookkeeping-only seal: sidecar
    SEAL_COMMIT advance + BASELINE literal bump in
    `tests/test_no_sealed_amendments.py`. Mirrors FBE.4's fence-
    three-no-edit precedent (`docs/rebuild/plans/v0-1-0-foldback-
    scope-expansion-fbe4.md` §1 + AC.FBE.4.S).

    The dispatcher's two named source-side buckets are pre-resolved:
      - Plist template `pos_orchestrator → loam.orchestrator` was
        fixed at `f0c4aa9` (FBE.5 hot-fix companion). Verified at
        planning: `framework/orchestrator/ops/launchd/com.loam.
        orchestrator.plist.tmpl` line 27 = `<string>loam.
        orchestrator</string>`.
      - `framework/orchestrator/` editable install entry already
        present at `install-from-source.txt:34` + `docs/install-
        from-source.md:83`. Already installed editable in the
        canonical venv per `pip list`.

    Smoke (AC.V11.A.3) captured pre-seal. Ran:

        SMOKE_ROOT=/tmp/v11a-smoke
        rm -rf "$SMOKE_ROOT"
        mkdir -p "$SMOKE_ROOT/.loam/logs"
        cat > "$SMOKE_ROOT/config.yaml" <<EOF
        root_dir: "$SMOKE_ROOT/.loam"
        EOF
        /Users/lukeivers/ivers-corp-pos-v2/.venv/bin/python \
            -m loam.orchestrator --config "$SMOKE_ROOT/config.yaml" \
            > "$SMOKE_ROOT/orchestrator.out" \
            2> "$SMOKE_ROOT/orchestrator.err" &
        ORCH_PID=$!
        # ... 5s readiness wait ...
        kill -TERM $ORCH_PID; wait $ORCH_PID

    Result (verbatim):

        Spawned PID: 31320
        socket appeared at attempt 2
        PID alive after readiness window: YES
        Socket bound: srw-------@ 1 lukeivers  wheel  0 May  3 19:01
            /tmp/v11a-smoke/.loam/orchestrator.sock
        Socket mode (octal): 600
        lsof on socket:
        COMMAND   PID      USER   FD   TYPE             DEVICE SIZE/OFF NODE NAME
        Python  31320 lukeivers   15u  unix 0xa2b684f4f4468745      0t0
            /tmp/v11a-smoke/.loam/orchestrator.sock
        Exit code on SIGTERM: 0
        STDERR tail: (empty)
        STDOUT tail: (empty)

    All four runtime contracts (per AC.V11.A.3) pass: PID alive
    after 5s, socket at the configured isolated `root_dir` path
    (NOT `~/.loam/orchestrator.sock` and NOT `~/.pos/orchestrator.
    sock`), mode 0600 per `config.py:69`, clean SIGTERM exit 0 per
    `__main__.py:28`. Empty stderr — no crash, no warnings.

    AC surface (per sub-plan §4):

      - AC.V11.A.1 — plist template grep returns single
        `<string>loam.orchestrator</string>` (verified pre-build).
      - AC.V11.A.2 — `framework/orchestrator` present in both
        install-from-source.txt and docs/install-from-source.md
        (verified pre-build).
      - AC.V11.A.3 — smoke per §7 passes all four runtime contracts
        (captured above).
      - AC.V11.A.4 — negative AC: zero `*.py` LOC delta inside
        `framework/orchestrator/{src,ops,scripts}/`; only sidecar
        bumps + plan-doc + manifest + parent §8 backfill.
      - AC.V11.A.S — fence-one-no-edit: `git diff
        BASELINE..SEAL_COMMIT --name-only` produces only paths
        under `framework/orchestrator/tests/` + `docs/rebuild/
        plans/`.

    Method-level choices (builder's call per ODD §1.1):

      - Surface #6: smoke runs Option A (direct module run with
        isolated `--config <yaml>` against `/tmp/v11a-smoke/.loam/`)
        rather than Option B (launchd install with custom label
        override). Option A honours the dispatcher's "don't disrupt
        pos3's runtime" ruling — no `~/Library/LaunchAgents/` or
        `launchctl bootstrap` state mutation.
      - The `launchctl healthy state` AC interpretation tightened:
        structural readiness (post-fix template carries the right
        module name; canonical venv has the package installed
        editable) rather than live-launchctl bootstrap, because
        live bootstrap would overwrite Luke's running plist
        (Surface #5).

    Out of scope (per sub-plan §9):

      - `pos_orchestrator` source-string vocabulary leakage
        (Surface #1 — 4 docstring/help-text/operations-doc sites
        in `framework/orchestrator/` are non-functional and
        FUTURE_IDEAS_DRAFT-deferred).
      - Live launchd reinstall on Luke's host (Surface #5 —
        operator hygiene; recipe in status file at
        `<pos3>/workspace/.scratch/claude-output/v11a-orchestrator-
        fix-status-2026-05-03.md`).
      - Orphan PID 27100 cleanup (Surface #4 — already gone per
        empirical `ps` probe).
      - Statusline-watcher script fix (orchestrator-state dossier
        D-Q.ORCH.2 — independent amendment).
      - Amendments #38/#39/#40 themselves (V11.B in v0.1.4 per
        dispatch).

    Predecessor commits:
