    Composes on (consumers-only; no semantic edits):

      - The OSS v0.1.0 publish programme master plan
        (`oss-v0-1-0-publish.md`) — M1e row already in §5 per
        M1b's precursor commit `7be713b`.
      - The M1.rename series master plan
        (`oss-v0-1-0-publish-rename.md`) — M1e is the fifth
        sub-amendment per the §2 ladder.
      - `loam-rename-decisions.md` — Tier-1 items 2–7
        (namespace pivot scope).
      - `.scratch/claude-output/loam-rename-migration-plan.md`
        (mechanics + dependency ordering).
      - M1d build-time finding #8 (legacy emit-side tracer
        pos_v2.primary_persona).

    FIDRAFT items closed by this amendment: M1d build-time finding
    #8 (legacy pos_v2.primary_persona) — closed via AC.RNM-1e.6.

    FIDRAFT items surfaced by this amendment (per plan §11 finding #7):

      - "framework/tools/ namespace-pivot residuals — pos-publish-
         framework-only, orphan-plist-cleanup, upgrade-merge-resolver,
         heavy-b-migrate."
      - "M1c launchd-label stragglers in orchestrator + self-upgrade
         (com.pos.orchestrator → com.loam.orchestrator) — small
         corrective amendment, ≈20 callsites."
