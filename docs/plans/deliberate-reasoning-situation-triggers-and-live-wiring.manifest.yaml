narrative:
  target: framework/deliberate-reasoning/seals/SEAL_COMMIT.deliberate-reasoning-situation-triggers-and-live-wiring
  body: |
    # deliberate-reasoning slice 3 — situation/behavior triggers + live-wiring
    # (default-OFF, zero-collateral) — apply ladder

    Per docs/plans/deliberate-reasoning-situation-triggers-and-live-wiring.md.
    Consumes the slice-1 confirmed-scoped outcome (seal a6156590; the gated
    gate->loop corrects re-derivable errors on flagged turns with zero
    collateral) and acts on its named "wire it into live primary-persona
    turns" follow-on, while REPLACING the slice-1 conversation-keyword trigger
    substrate (_HEDGE_RE over draft_text, _STAKES_RE over prompt_text) per the
    owner's objection to keyword-on-conversation triggers.

    Scope (plan §2 + §5 + §7): EXTENDS the SEALED framework/deliberate-reasoning/
    component. (1) A new SITUATION-SIGNAL substrate feeding the gate from the
    pending action's structure + recent tool-result history, retiring the
    conversation-keyword detectors; the evaluate_gate(GateSignals) ->
    GateDecision contract shape preserved. (2) The v1 situation set —
    UNBOUNDED_OP, REPEAT_FAILED, MACHINE_IRREVERSIBLE, HIGH_BLAST_RADIUS — all
    calibrated to fire on the 2026-06-24 runaway-regex incident. (3) LIVE-WIRING
    through the EXISTING PreToolUse hook pattern (composing with
    in_thread_work_budget_guard / wd_discipline_guard), engaging the slice-1
    re-think loop on a fire, under the default-OFF LOAM_DELIBERATE_REASONING
    switch. (4) The zero-collateral / default-OFF guarantee carried forward as
    a LIVE invariant (the gate fires on zero normal turns).

    AC families (plan §5): AC.TRIG.{1..4} (situation-trigger substrate) +
    AC.WIRE.{1..4} (live-wiring + no-collateral) + AC.WIRE.OA (outcome-altitude
    live end-to-end real-situation fire with zero collateral).

    Method-level choices are the builder's call per ODD §1.1; the plan fixed
    the ACs (§5), the named decisions (D-SIT.1..6), the fence (§5/§8), and the
    halt triggers (§8), not the implementation.

    KEY DESIGN RULINGS carried in (plan §3): the (i)/(ii)/(iii) fork is ruled
    HYBRID structural-first (ship the free structural floor in v1; defer the
    costly per-turn LLM self-assessment as a default-OFF escalation — the
    cheap logprob form is not exposed on the subscription/claude -p path, so
    always-on (ii) is the per-turn-token trap slice-1 ruled out). The
    structural-vs-keyword line: admissible signals read the pending action's
    structure + recent tool-result metadata; inadmissible signals read the
    NL prompt/draft content. NOVELTY retained only if structurally derived,
    else retired. Slice-2a's prompt-keyword matcher superseded as an input
    contract; the self-model folds in as a structural-signal conditioning
    source, not a parallel keyword scan; slice-2a's experiment untouched +
    paused.

    HONEST GAP (plan §10 RF-3, NON-HIDDEN): v1 does NOT cover the draft-QUALITY
    class (a subtly-wrong answer with no risky action + no repeated failure);
    it trades that (weakly served by the removed hedge-regex) for clean
    action-runaway coverage (the actual incident). The draft-quality class
    routes to the deferred option-(ii) escalation.

    Predecessor: the RATIFIED plan-doc commit (set at build time once the
    owner ratifies this DRAFT).

    SEALED-component amendment fence on framework/deliberate-reasoning/ (the
    slice-1 sidecar is ADVANCED at this seal, not created).

