lc = \"loam.plugins.dev_sdlc.contribution:DevSdlcContribution\"` under group loam.bootstrap.contributions (FIRST EXTERNAL contributor to the entry-point group from outside the bootstrap package per plan §11 finding #7). Plugin contribution metadata: phase=after_orchestrator_ready, after=('primary_persona','objective_tracker','scope_of_work') — plugin reads these surfaces at construction. Sealed-component fence: 3 components — plugins/dev-sdlc/ (NEW component carrying plugin source + tests + first SEAL_COMMIT sidecar + first tests/test_no_sealed_amendments.py seal-test authored at M6) + framework/tools/loam/ (subcommand-discovery extension: ~30-50 LOC in loam_cli.cli + 1 new test asserting entry-point-group resolution) + framework/tools/pos-publish-framework-only/ (M2 partition manifest extends audit_roots: + plugins/ + dev_and_public: + glob: \"plugins/dev-sdlc/**\" + 1 new partition-classification test). HC#4 byte-content sample status: NO RETIRE-AND-REBASELINE (plugin is NEW component — no pre-existing HC#4 sample paths under plugins/dev-sdlc/; framework/tools/loam/ extension is additive Python; framework/tools/pos-publish-framework-only/ extension is additive YAML — no sample paths impacted; verified at plan-authoring per plan §11 finding #4). Critical structural finding (§11): M6 is the FIRST EXTERNAL contributor to workspace-bootstrap's entry-point group — no plugin-tree precedent exists today; M6 establishes both the plugins/<name>/ directory pattern AND the loam.cli.subcommands entry-point group; v0.2+ plugins inherit cheaper landing per master plan D-Q.OSS.5 + plan §10 D-Q.M6.1. Deferred to v0.1.1+ per plan §1 + §5: objective-extraction skill for existing repos (Idea 3 sub-feature; multi-week build) + workflow-state-machine engine reimplementation (use scope-of-work's existing FSM) + external issue-tracker integration + multi-project orchestration + contradiction detection + roadmap tooling + project archive lifecycle + per-project Claude PreToolUse/Stop hooks + MCP server exposing project state + plugin uninstall/rollback shape + existing-repo retrofit flow. v0.1.0 ships the WORKFLOW SHAPE; v0.2+ extends with depth."

