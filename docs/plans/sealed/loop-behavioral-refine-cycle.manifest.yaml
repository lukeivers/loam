schema_version: 3
amendment:
  slug: loop-behavioral-refine-cycle
  title: "Loop behavioral feedback-and-refine cycle — the hands-off loop's terminal \"done\" stops requiring only structural presence (a compile.sh + a source file exist) or a trivial `true` and starts requiring a BEHAVIORAL self-check (a self-constructed functional check the loop derives from the task's plain-language intent and actually runs against the produced artefact); a failed behavioral check RE-DRIVES a BOUNDED number of refine attempts carrying the behavioral failure context back to a sub-agent, under the EXISTING cost/wall ceiling (no unbounded turn-burn), VERIFICATION-GATED each iteration (anti-erosion, SlopCodeBench-class — folded as a binding constraint not a footnote); on bound exhaustion the loop emits a definite evidence-backed honest-negative (a first-class plan-success outcome, never retried-to-green, the bound never weakened). The behavioral self-check is the loop's OWN self-constructed check, structurally PROVABLY-NOT the graded benchmark scorer / the independent held-out judge / the intake faithfulness judge (the AC.RPB.1-class freeze-isolation spine preserved by construction — coupling the self-check to the graded scorer destroys the Tier-0 honesty control AND the loop's autonomy). Composes the already-present Claude-native primitives ONLY (the /goal turn-iteration in goal_drive.py + the orchestrator's _dispatch_subagent re-dispatch + the existing verify spine) — does NOT import or re-implement an external agent framework (Lens 1); the bounded re-drive is a contained control-flow evolution of run_handsoff_loop (the single for+single verify becomes a bounded re-drive around verify), NOT a loop re-architecture and NOT a new orchestrator phase; AC.FOUND.0 (the core decompose->dispatch->judge mechanism) is consumed, NOT re-proved. The concrete realpb bug (arms.py:200 sets the in-loop check_command to literally \"true\", so the loop's keep-going condition is satisfied by a no-op) is fixed GENERICALLY by routing the in-loop check through the generic behavioral self-check construct (BRC.6), NOT a realpb-specific hack and NOT another no-op. ORTHOGONAL to the sealed loop-goal-refinement (ef59d1f): that sealed work bounded the INTAKE leg (derive_acceptance_from_intent — the acceptance DERIVATION pre-dispatch) and DELIBERATELY held orchestrator.py decompose->dispatch->verify out of scope (D-GR-1 in-intake, AC.FOUND.0 untouched); THIS cycle closes the still-open POST-DISPATCH-verify gap both that plan and handsoff-loop-real-build left open — it composes ALONGSIDE the sealed intake construct and MUST NOT modify it (a §8.4 halt). Six ACs scope-descriptive (AC.BRC.1 behavioral-done-not-structural / .2 bounded-re-drive-with-failure-context / .3 verification-gated-iteration-anti-erosion / .4 self-check-provably-not-the-scorer / .5 lead end-test definite per-dimension verdict honest-negative-valid / .6 generic \"true\"-replacement); one test file per AC; method-in-AC test passed per-AC (each satisfiable by >1 implementation; the refine/synthesis MECHANISM is deliberately the builder's call per ODD §1.1 + Lens 4 — outcome-shape confident/source-grounded, single-right-mechanism not). Gap-fix scope ONLY — the score-payoff SIZE is explicitly the SEPARATE post-aggregate fast-follow the detached 5-task verdict.json failure-class map sizes; NO AC asserts or depends on a payoff magnitude (F4 — scope tracks confidence; existence is architecturally certain + aggregate-independent, size is the post-verdict signal). Single-component fence: framework/workspace-bootstrap/ (sidecar framework/workspace-bootstrap/tests/SEAL_COMMIT, seal_test framework/workspace-bootstrap/tests/test_no_sealed_amendments.py — VERIFIED present this turn; LIVE allowed_prefixes admit framework/tools/ + framework/hands-off-lifecycle/ + framework/hands-off-lifecycle/seals/ + docs/plans/, allowed_files admit docs/STATE.md — all VERIFIED this turn at the named test-file line refs). Anchor rationale: the objective is a contained control-flow evolution of the handsoff-loop orchestration package (lands under the workspace-bootstrap-admitted framework/tools/ prefix) + its AC tests (framework/hands-off-lifecycle/ prefix); mirrors the handsoff-loop-real-build / loop-goal-refinement / programbench-revival-real-pb precedents that sealed cleanly against this exact workspace-bootstrap anchor on this branch tip. extra_allowed_prefixes EMPTY — no sealed-source edit outside the workspace-bootstrap anchor; the sealed loop-goal-refinement intake construct is NOT touched (§8.4 halt). NO Anthropic API key — sub-agents are real claude binary, default Sonnet, every spawn routed through the sealed isolation surface (feedback_no_anthropic_api_key). LOCAL SEAL ONLY — NOT merged to main, NOT pushed, NOT published, NOT tagged; origin/main stays exactly at its current commit (the public step is a separate owner-asked action, NOT part of this cycle). The build itself is FUTURE OWNER-GATED — this manifest + plan are plan-only. No version bump (version derives at release-time). NEW commits only, no --amend."

