[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-objective-tracker"
version = "1.1.0"
description = "Objective tracker primitive for loam — forest-of-trees with event-sourced persistence, sidecar scope binding, and ODD integration."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[tool.setuptools]
package-dir = {"loam.objective_tracker" = "src/loam/objective_tracker"}
packages = ["loam.objective_tracker"]
