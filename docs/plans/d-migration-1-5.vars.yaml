# --- Detection mechanism (per D-Q.1 recommendation) ---

DETECTION_MECHANISM:
  primary: "git diff --diff-filter=ADMRT --find-renames=99% --name-status <BASELINE>..<HEAD> -- <old-path>/ <new-path>/"
  whitelist:
    description: "A/D pairs are 'substantive' UNLESS the path matches the component's own seal-bookkeeping (sidecar + seal-diff test)."
    paths_per_component:
      - "<old-path>/tests/SEAL_COMMIT"
      - "<new-path>/tests/SEAL_COMMIT"
      - "<old-path>/tests/test_no_sealed_amendments.py"
      - "<new-path>/tests/test_no_sealed_amendments.py"
      - "<old-path>/tests/test_cross_cutting.py"  # for hands-off-lifecycle
      - "<new-path>/tests/test_cross_cutting.py"
  verdict:
    rename_only: "every diff entry is R>=99% rename, OR an A/D pair from the whitelist"
    substantive: "any diff entry is M (modified) or R<99% or A/D outside the whitelist"
  fallback: "(c) hybrid — when heuristic returns True, optionally cross-check via sha256-of-tree on the component's old vs new path. Builder's call to invoke; plan-author leans 'skip unless a test fixture surfaces an edge case'."

# --- Retroactive cleanup target machinery (per AC.D.1.5.5) ---

