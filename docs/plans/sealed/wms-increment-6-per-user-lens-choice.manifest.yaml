  slug: wms-increment-6-per-user-lens-choice
  title: "WMS Increment 6 — PER-USER LENS CHOICE (the L4 wiring): the mechanism that decides WHICH lens(es) a given user sees by default per-turn, derived from their #34 profile, owner-settable, with a plain-language switch path. Builds NO new lens (inc-5 re-bundled goals/plate/waiting-on, so the lens SET is complete) — it is the CHOOSER over that set. Three pieces on the SEALED primary-persona, all composing built primitives read-only: (a) a deterministic fail-open lens-choice RESOLVER reading the #34 work-tracking/preferred-lens cell via the SAME cell_or_prior path intake.py uses, mapping the profile to a default lens-SET; (b) the per-turn surface made choice-aware — session_start_emitter.py registers the CHOSEN lens(es) at TriggerKind.turn instead of unconditionally piling work-streams+projects+relational on every turn (the FBM-don't-bloat composition: the right lens, not all of them), keeping the un-chosen lenses as the inc-5 on-demand render_*_block entry points; (c) a plain-language SWITCH writer that persists the work-tracking/preferred-lens cell in the #34 matrix line-shape WITHOUT widening AIM_AREAS or apply_override's area-gate (apply_override REJECTS the work-tracking area — verified line 694 — so the switch CANNOT round-trip through it). NO store mutation, no #34-taxonomy mutation, no workspace-bootstrap seed-writer edit, no new lens."

# BASELINE: build/wms-increment-5 tip @ build time (the plan-doc commit's parent on THAT
# branch). The five lenses (work_streams_surface.py / projects.py / relational.py +
# goals.py / plate.py / waiting_on.py) + their render_*_block on-demand entry points + the
# always-on TriggerKind.turn registrations in session_start_emitter.py + the #34 read engine
# (interaction_model.py: load_interaction_model / cell_or_prior / classify_area /
# render_matrix / Cell + the apply_override area-gate) + intake.py's work-tracking read
# precedent + the shared lens_render.py factory all live on this branch + its inc-2/3/4
# ancestors, NOT on main — building on main finds no lenses to choose among (plan §8 halt #1).
# SINGLE-component amendment on the SEALED `primary-persona`: one new keep-pace module +
# one edit to the per-turn registration site +
#   (a) `lens_choice.py` RESOLVER — load_interaction_model -> cell_or_prior("work-tracking",
#       "preferred-lens") -> a deterministic value->lens-SET map; fail-open to a NON-EMPTY
#       default derived from the existing technical-exposure cell (D-WMS6.5: plain ->
#       on-my-plate the simplest actionable view; open -> work-streams the architecture's
#       broadest openness default; deep -> the user's explicit pick / a multi-lens set). NO
#       LLM on the hot path (mirrors classify_area), NO store mutation, NEVER raises
#       (D-WMS6.2 / AC.CHOICE.3/.4). NEVER returns an empty set (the anti-regression floor,
#       RF #3 / §8 #3).
#   (b) `lens_choice.py` SWITCH WRITER — persists the work-tracking/preferred-lens cell by
#       re-emitting the matrix via interaction_model.render_matrix + Cell(value=<lens>,
#       confidence=high, locked=True), WITHOUT calling apply_override (which rejects the
#       work-tracking area, line 694) and WITHOUT adding work-tracking to AIM_AREAS or
#       editing the workspace-bootstrap seed-writer (the fence; D-WMS6.4 / §5). Owner-
#       initiated explicit statement; the plain-language confirm is the verify step
#       (D-WMS6.6); stays inside the #34 MVP fence (cells move only by explicit statement).
#   (c) `session_start_emitter.py` made CHOICE-AWARE — before the M-FBM branch registers the
#       work-streams + projects + relational turn blocks, it calls the resolver and registers
#       exactly the CHOSEN lens(es); the un-chosen lenses' register_*_contributor functions
#       stay DEFINED + exported so their on-demand render_*_block path is unchanged
#       (AC.SURFACE.2). Fail-OPEN: a resolver/registration error registers the CURRENT
#       always-on default-set, never zero blocks (AC.SURFACE.4 / §8 #3).
# The objective-tracker store is CONSUMED read-only (the chosen lens reads it via the
# existing API exactly as inc-2/4/5 do) — NOT modified (D-WMS6.1). interaction_model.py is
# CONSUMED read-only for the resolver (load_interaction_model / cell_or_prior) and REUSE-only
# for the writer (render_matrix / Cell line-shape) — its AIM_AREAS taxonomy and apply_override
# area-gate are NOT widened, no new injected axis. If the build decides it truly needs
# work-tracking in AIM_AREAS (to write through apply_override), OR a workspace-bootstrap
# seed-writer change, OR any store MUTATION, it HALTS rather than reaching into those sealed
# taxonomy surfaces (plan §8 #2/#4) — that is a SEPARATE workspace-bootstrap + interaction-
# model cycle, not this one.
# Confirms architecture roadmap row 6 (per-user lens choice / L4 wiring) + WMS-D3 (lens-
