# BASELINE: 65c1f27d — canonical main tip (the Slice DF + Slice HB seals already
# landed; this amendment follows on). The handsoff-loop family seals against the
# workspace-bootstrap component anchor (the source lives under
# framework/tools/handsoff-loop/, inside the workspace-bootstrap seal-test's
# admitted framework/tools/ prefix — same pattern as the Slice DF / Slice HB
# seals), so the seal-diff is scoped 65c1f27d..<seal>.
#
# Owner-directed amendment (ruling
# 2026-06-24-design-first-non-tech-user-visible-outputs): rehearsal-1 generated a
# command-line-tool candidate (option 1) and a "file-watch daemon" candidate
# (option 3) for a non-technical accounting-firm owner — developer machinery the
# target user cannot operate. The design stage was generating in IMPLEMENTATION
# framing, not user-outcome framing. This is the loam prime directive applied to
# the design stage: the user brings WHAT in THEIR terms; the design they review
# must be in their vocabulary (visible outcomes), never the machinery.
#
# The amendment encodes "infer/assume the user's tech level (DEFAULT
# non-technical) and constrain the candidate space accordingly" — NOT hardcode
# web-only. For a non-tech user every surfaced candidate is something they can
# personally SEE and USE (a visible/interactive experience OR a sensible
# automated delivery), and NO surfaced candidate's primary interaction is a CLI /
# daemon / background-watch / drop-folder surface. Enforced two ways: a
# tech-level-partitioned direction-seed set + a prompt constraint (the generation
# layer), AND a held-out structural classifier (is_nontech_operable) that drops a
# CLI/daemon-primary candidate even if the prompt slips (the guarantee). AC
# surface AC.DF.6. Plan §5.
