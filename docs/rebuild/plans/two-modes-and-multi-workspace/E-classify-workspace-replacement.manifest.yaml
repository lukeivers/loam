narrative:
  target: workspace-bootstrap/seals/SEAL_COMMIT.classify-workspace-dev-intent
  body: |
    # Amendment #42 — workspace-bootstrap classify_workspace replacement
    #                 + path-mismatch fold (sub-plan E of
    #                 two-modes-and-multi-workspace)

    2026-04-25. Second sub-plan of the two-modes-and-multi-workspace
    programme (master plan
    `docs/rebuild/plans/two-modes-and-multi-workspace/MASTER.md`).
    Re-extension of amendment #39's tracker-seed surface; folds in
    the latent `#39 ↔ #40` path-mismatch fix per master-plan §11.5.
    Single-component amendment on the `workspace-bootstrap` sealed
    surface; AC.E.S enforces.

    Surface delta inside `workspace-bootstrap/`:

      - `workspace-bootstrap/src/workspace_bootstrap/adapters/tracker_seed.py`
        — `classify_workspace(workspace_root)` body replaced. Was a
        heuristic checking `<workspace>/docs/rebuild/VALUE_PROPOSITION.md`
        presence (amendment #39); now reads the workspace-local dev-
        intent answer via sub-plan A's `read_dev_intent` reader.
        Mapping: `"yes"` → `"pos-v2-dev"`, `"no"` / `"absent"` →
        `"user"`. Fail-soft: the reader's own fail-safe (returns
        `"absent"` on missing/malformed contracts per amendment #41
        AC.A.6) means classify_workspace never raises on contract
        shape issues. Lazy import of `read_dev_intent` mirrors
        amendment #40's pattern. The `FRAMEWORK_VALUE_PROP_RELPATH`
        constant remains load-bearing for `load_value_prop_source`
        (the dev path still reads the file as content); only the
        CLASSIFICATION source-of-truth moves.

      - `workspace-bootstrap/src/workspace_bootstrap/adapters/tracker_seed.py`
        — `tracker_db_path_for(workspace_root)` parameter renamed
        from `pos_root` to `workspace_root`. The function now
        returns `<workspace_root>/objective_tracker.sqlite`,
        aligning with `primary_persona.tracker_context.tracker_db_path_for`
        (amendment #40). Folds in the latent path-mismatch (#39 ↔
        #40) fix per master-plan §11.5: the seed and the
        contributor now share a single source of truth for the
        tracker DB location.

      - `workspace-bootstrap/src/workspace_bootstrap/adapters/first_run_scaffold.py`
        — `_run_tracker_seed` callsite passes `workspace_root` (not
        `pos_root`) to `tracker_db_path_for`. The helper's `pos_root`
        parameter is dropped (it was only used to compute the tracker
        DB path).

    Behaviour:

      - At first-run scaffold time, the persona contract is in its
        starter state (`dev_intent="unanswered"`). `read_dev_intent`
        returns `"absent"`; classify_workspace returns `"user"`.
        This is the documented defensive default per locked owner
        ruling 4 (and AC.E.3). Workspaces that pre-create the
        persona contract with `dev_intent="yes"` (e.g. integration-
        test fixtures, future re-classification flows) classify as
        `"pos-v2-dev"`. Re-seeding via `seed_tracker` after the user
        answers dev_intent is supported via the same shape AC39.5
        documents for late-supplied value-prop content.
      - `load_value_prop_source` behaviour is unchanged in shape:
        dev workspaces still read `docs/rebuild/VALUE_PROPOSITION.md`,
        non-dev workspaces still read `<workspace>/value-prop.md`.
        The decoupling is conceptual: one constant, two consumers,
        only one of them is used to consume it for classification.
      - The tracker DB location moves from `pos_root` to
        `workspace_root`. AC39.x test fixtures advanced to read from
        `tracker_db_path_for(workspace)` rather than
        `tracker_db_path_for(pos_root)` — mechanical fixture update,
        AC outcomes unchanged (the AC39.x outcomes are about seed
        records inside the DB, not the literal path).

    AC surface (AC.E.1 – AC.E.7 + AC.E.S) — outcome-shaped criteria
    + the seal-diff invariant:

      - AC.E.1: `classify_workspace` returns `"pos-v2-dev"` iff the
        persona contract carries `dev_intent: yes`.
      - AC.E.2: `classify_workspace` returns `"user"` when
        `dev_intent: no`.
      - AC.E.3: `classify_workspace` returns `"user"` when dev_intent
        is `"absent"` (no contract, starter-unanswered, malformed).
      - AC.E.4: `classify_workspace` does NOT inspect
        `VALUE_PROPOSITION.md`; the four (dev_intent × file-presence)
        combinations all classify on dev_intent alone.
      - AC.E.5: `load_value_prop_source` still reads the framework
        path on dev classification + the workspace path on user
        classification.
      - AC.E.6: `tracker_db_path_for(workspace_root)` returns
        `<workspace_root>/objective_tracker.sqlite`; matches
        `primary_persona.tracker_context.tracker_db_path_for`.
      - AC.E.7: `_run_tracker_seed` passes a workspace-rooted DB
        path to the seed runner.
      - AC.E.S: sub-plan E is single-component (manifest declares
        one component, `workspace-bootstrap`); the universal seal-
        diff machinery in `test_no_sealed_amendments.py` (B23
        sidecar pattern) is present and routes BASELINE..SEAL_COMMIT
        through the sidecar.

    Pre-existing AC39.x test fixtures (4 fixture helpers across 4
    files) advanced per owner ruling 2026-04-25 (a) — fixture data
    updates preserve AC outcome shapes; AC39.x AC text unchanged.
    Affected fixtures:
    - `_seed_pos_v2_dev_workspace` (AC39.1)
    - `_seed_dev` (AC39.2)
    - `_seed_dev` (AC39.3)
    - `_build_workspace` (AC39.4)
    All four now pre-create a persona contract carrying
    `dev_intent: yes` so `classify_workspace` returns `"pos-v2-dev"`
    (the AC outcomes about seed records are preserved). Plus all
    AC39.x `tracker_db_path_for(pos_root)` callsites updated to
    `tracker_db_path_for(workspace)` — the new workspace-rooted
    resolver shape.

    Method-level choices (builder's call per ODD §1.1):

      - D-build.E1 (lazy import of `read_dev_intent`): yes. Mirrors
        amendment #40's pattern; keeps the import graph acyclic.
      - D-build.E2 (caching): no. Plan §10 D-E.2 recommended caching
        but the seed runs once per scaffold; the marginal I/O cost
        is negligible. Defer caching to a future amendment if
        profiling shows hot-loop.
      - D-build.E3 (defensive try/except in classify_workspace): no.
        `read_dev_intent` is itself fail-safe; wrapping again would
        dilute the seam.
      - D-build.E4 (`tracker_db_path_for` parameter rename): rename
        from `pos_root` to `workspace_root`; drop the now-unused
        `pos_root` param from `_run_tracker_seed`'s signature.
      - D-build.E5 (AC39 dev-fixture pre-create persona contract):
        yes. Plan AC.E.5 explicitly says "the test that needs
        amendment is the classification-input fixture (it now seeds
        `dev_intent` rather than file presence)."

    BASELINE 294a90e (pre-amendment tip — current HEAD at session
    start; the dev-discipline doc commit appending #41 tooling/
    workflow findings to FUTURE_IDEAS_DRAFT). workspace-bootstrap's
    SEAL_COMMIT sidecar advances to the amendment commit on the
    empty-diff window; advanced to the seal SHA via `pos-amend
    seal` on the seal commit.

    With this amendment, `classify_workspace` becomes a
    deterministic dev-mode signal sub-plans B (mode-loading) and F
    (auto-load partition) can compose on. The path-mismatch (#39 ↔
    #40) latent bug is closed at the source; future
    register_tracker_context wiring will land on the same DB the
    seed wrote.
