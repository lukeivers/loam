narrative:
  target: workspace-bootstrap/seals/SEAL_COMMIT.mcp-json-writer
  body: |
    # Amendment #47 — workspace-bootstrap workspace-local
    #                  `.mcp.json` writer (memory-graphiti MCP
    #                  server registration)

    2026-04-25. Sibling amendment to #46 (primary-persona
    SessionStart + UserPromptSubmit emitter, sealed at 2f44bbb).
    Together #46 + #47 close the substrate gap between the built
    memory + composer surface and live integration with Claude
    Code: #46 surfaces eager session-level memory + tracker +
    corpus state through SessionStart `additionalContext`; #47
    surfaces lazy turn-time MCP tools (`add_episode`, `search`,
    `find_nodes`, etc.) via a workspace-local `.mcp.json` that
    Claude Code reads at session-load to discover and bind the
    per-workspace memory-graphiti FastMCP service.

    The amendment lands one new responsibility on the existing
    `first_run_scaffold` adapter inside the `workspace-bootstrap`
    fence:

      - `workspace-bootstrap/src/workspace_bootstrap/adapters/
        mcp_json_writer.py` (new) — pure-function writer with
        deep-merge + structured-result. Stdlib-only (`json`,
        `pathlib`, `dataclasses`, `tempfile`, `os`). Exports:
        `MEMORY_GRAPHITI_SERVER_NAME`, `MCP_JSON_FILENAME`,
        `STREAMABLE_HTTP_PATH`, `MCPJsonWriteResult` dataclass,
        `build_memory_graphiti_entry(host, port)`,
        `merge_mcp_json(existing, host, port)`,
        `write_mcp_json(workspace_root, host, port)`.
      - `workspace-bootstrap/src/workspace_bootstrap/adapters/
        first_run_scaffold.py` — `run_first_run_scaffold(...)`
        gains a new helper invocation (`_run_mcp_json_writer`)
        between persona-directory install and tracker-seed.
        `ScaffoldResult` extended with three new fields
        surfacing the writer outcome (`mcp_json_path`,
        `mcp_json_wrote`, `mcp_json_reason`).

    Behaviour:

      - On a fresh-clone first-run, the scaffold writes
        `<workspace>/.mcp.json` carrying a single `mcpServers`
        entry — `memory-graphiti` — pointing at
        `http://<memory_host>:<memory_port>/mcp` (`type: "http"`,
        the FastMCP streamable-HTTP transport mounted at the
        default `/mcp` path). The `(host, port)` pair is
        resolved from the workspace-local
        `<pos_root>/memory.yaml` via the existing
        `_resolve_memory_host_port` seam (introduced by
        amendment #29; the same value already feeds the
        launchd plist's `EnvironmentVariables` dict).
      - Re-running first-run on a workspace whose `.mcp.json`
        carries pre-existing user-added MCP server entries
        deep-merges the `memory-graphiti` entry without removing
        or modifying user entries — top-level keys preserved,
        other `mcpServers` entries preserved.
      - Idempotency: equal-content merge skips the write
        (no mtime churn), reason `"already_current"`. Mirrors
        amendment #36 (persona-directory) + #37 (agent file)
        idempotency contracts.
      - Atomic write via `.tmp` + `os.rename` mirrors
        amendment #37's `agent_file_authoring.py` pattern.
        Avoids partial-write torn states.
      - Fail-soft: on malformed pre-existing `.mcp.json` (parse
        error or non-dict root), the writer skips with
        `reason="skipped_malformed_existing"` and preserves the
        user's content. On IO/permissions error, the writer
        skips with `reason="skipped_io_error"`. The scaffold
        completes; the SessionStart hook proceeds; the session
        degrades to "no memory MCP tools available" rather than
        failing closed (mirroring amendment #37 AC37.4's
        precedent).

    No source edits to `discovery.py`, `errors.py`, `host.py`,
    `main.py`, `manifest.py`, `ordering.py`, `spec.py`, or any
    other `workspace-bootstrap` adapter beyond
    `first_run_scaffold.py`. The new surfaces are purely
    additive.

    Crucially, no source edits to any other sealed component.
    The amendment consumes amendment #29's
    `_resolve_memory_host_port` surface (already present on
    `first_run_scaffold.py`) and writes a new file inside the
    workspace root; no cross-component contract change.

    AC surface (AC47.1 – AC47.4 + AC47.S) — three outcome-shaped
    behaviour ACs + reverse-§2.5 audit + seal-diff invariant:

      - AC47.1: fresh-clone first-run writes
        `<workspace>/.mcp.json` containing exactly one
        `mcpServers` entry keyed `memory-graphiti`, with
        `type: "http"` and a URL whose port matches the
        workspace's allocated memory-sidecar port.
      - AC47.2: re-running first-run on a workspace whose
        `.mcp.json` contains pre-existing user-added MCP server
        entries deep-merges the `memory-graphiti` entry without
        removing or modifying user entries.
      - AC47.3: write failure (malformed pre-existing JSON,
        permission denied, etc.) is graceful — first-run
        completes, structured diagnostic surfaces via the
        result, SessionStart hook proceeds. The session
        degrades; it does not halt.
      - AC47.4: ODD §2.5 reverse-direction audit clean — every
        code path / branch / dependency / test in the diff
        traces back to AC47.1–AC47.3.
      - AC47.S: seal-diff discipline — only
        `workspace-bootstrap/` + `docs/rebuild/plans/` +
        universal paths changed (verified by
        `workspace-bootstrap/tests/test_no_sealed_amendments.py`
        at BASELINE 3096016 + per-component sweep across every
        other sealed component).

    Method-level choices (builder's call per ODD §1.1):

      - D-build.2 (JSON shape): minimal `mcpServers` with
        single entry. `{"type": "http", "url":
        "http://<host>:<port>/mcp"}`. Per Claude Code MCP docs
        §4.3 — the JSON literal value is `"http"` (not the
        CLI flag value `"streamable-http"`). FastMCP serves
        the streamable-HTTP transport at `/mcp` by default.
      - D-build.3 (server name): `memory-graphiti` — matches
        the workspace's launchd service kind. Tools become
        callable as `mcp__memory-graphiti__<tool>`. The
        workspace slug is NOT included in the server name —
        the scope is workspace-local, so the JSON file is
        per-workspace by construction.
      - D-build.4 (deep-merge algorithm): `json.loads`
        existing → ensure dict → set
        `data.setdefault("mcpServers", {})["memory-graphiti"]
        = entry`. Mirrors amendment #37's `merge_session_start`
        shape at the JSON-merge level.
      - D-build.5 (port-source seam): reuse
        `_resolve_memory_host_port`. No new port-discovery
        code path. Same value as the launchd plist
        `EnvironmentVariables`.
      - D-build.6 (idempotency on equal content): byte-equal
        merge → skip write.
      - D-build.7 (atomic write): `.tmp` + `os.rename`.
      - D-build.8 (failure surface): `MCPJsonWriteResult(wrote,
        reason, path)` dataclass; structured result; scaffold
        proceeds.
      - D-build.9 (`ScaffoldResult` extension): three new
        fields — `mcp_json_path`, `mcp_json_wrote`,
        `mcp_json_reason`.

    Fail-closed behaviours:

      - Malformed pre-existing `.mcp.json` is NEVER overwritten
        — the writer surfaces a structured diagnostic and
        skips. User content is preserved.
      - IO/permissions error during write surfaces a structured
        diagnostic; the scaffold completes; SessionStart
        proceeds.
      - The `memory-graphiti` entry's identity is owned by the
        framework — re-runs replace its value with the current
        port. User-added entries (any other key under
        `mcpServers`, or any other top-level key) are
        preserved across re-runs.

    Out of scope (umbrella plan §4c):

      - Persona-side memory_client wiring (UserPromptSubmit
        eager retrieval) — future amendment.
      - Auto-memory ↔ graphiti unification.
      - Memory seeding (real memories accumulate through use).
      - Cross-workspace memory keying.
      - Multi-MCP-server registration (a future amendment may
        compose more entries; #47 ships exactly one).

    BASELINE 3096016 (pre-amendment tip — HEAD~1 of the
    amendment commit). workspace-bootstrap's SEAL_COMMIT
    sidecar advances to the amendment commit on the empty-diff
    window; advanced to the seal SHA via `pos-amend seal` on
    the seal commit.

    With this amendment, the umbrella memory-into-context plan
    closes both halves of the gap:

      - #46: eager session-level memory + tracker + corpus
        state into Claude Code's `additionalContext` at
        SessionStart + UserPromptSubmit (sealed at 2f44bbb).
      - #47: lazy turn-time MCP tools via workspace-local
        `.mcp.json` registration (this amendment).
