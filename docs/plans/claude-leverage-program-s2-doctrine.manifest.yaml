te gain a REQUIRED 'Primitive check' section (this cycle's own plan-doc §2bis is the first conforming instance). ★ outcome-altitude AC.CLP-DOC.2: a deliberately-bespoke dispatch through the production PreToolUse path produces the observable check event with no pre-arranged state. Pre-seal ride-along: primary-persona's AC.α.8 capability-content guard (skills/hook carry NO schema-marker strings; primary-persona stays OUT of the fence)."

