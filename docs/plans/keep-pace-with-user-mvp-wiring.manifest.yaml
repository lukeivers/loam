# BASELINE: the keep-pace MVP final-cycle (KP7) seal — the latest overall
# seal at dispatch time. This wiring cycle is serialized AFTER KP7 per
# feedback_serialize_amendment_builds (no concurrent build in this tree).
#
# Single-component fence — activation (in-tree wiring):
#   - hands-off-lifecycle — home of the KP0 hook chain entries
#     (framework/hands-off-lifecycle/hooks/keep_pace/user_prompt_submit.py
#     + pre_tool_use.py). This cycle edits ONLY their contributors()
#     surfaces (+ best-effort lazy-import wrappers) to register the
#     contributors the prior cycles BUILT but left out of their fences
#     (D-KP1.1 / D-KP7.1 / KP9 staging, RF-6). The KP1 retrieval factory
#     (primary-persona) and the KP7 re-assert (orchestrator) are reached
#     by lazy import; their source is NOT modified (no cross-component
#     fence breach). The KP9 draft_gate factory is in this same component.
#
# AC ladder (EXISTING staged ACs per docs/plans/sealed/keep-pace-with-user-mvp.md §5 —
# no new family; the activation ladders to the ACs each cycle staged against):
#   AC.KP1.*  — KP1 work-anchored retrieval contributor registered + fires
#   AC.KP7.2  — KP7 #15174 SessionStart-compact re-assert registered + fires
#   AC.KP9.*  — KP9 draft-gate contributor registered + fires on a leak,
#               silent on a clean draft
#   AC.KP0.4  — wired chain stays fail-open-whole-chain (raise/slow isolated)
#   AC.KP0.5  — wired chain writes the per-run latency log line
#   AC.KP.S.1 — live-session-safety fence: a broken wired contributor never
#               breaks the live session; fence confined to hands-off-lifecycle
