[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-orchestrator"
version = "0.14.0"
description = "Session-resilient orchestrator for loam — asyncio process host, Unix-socket JSON-RPC, bind_scope dispatch layer, compaction-survival integration."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    "loam-scope-of-work",
    "loam-objective-tracker",
    "loam-primary-persona",
]

[tool.setuptools]
package-dir = {"loam.orchestrator" = "src/loam/orchestrator"}
packages = ["loam.orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
