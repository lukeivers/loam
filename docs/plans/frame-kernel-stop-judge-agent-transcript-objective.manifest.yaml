  slug: frame-kernel-stop-judge-agent-transcript-objective
  title: "frame-kernel stop-judge objective from the agent transcript + advisory provenance. THE LIVE BUG (Tier-0, 2026-06-10): the SubagentStop frame-judge composed its prompt with the WRONG stated objective — the parent transcript's FIRST user message (an owner channel message from 2026-06-09) instead of the judged subagent's dispatch prompt — and the resulting OFF_FRAME flag reached the owner as a bare verdict with no provenance. Root cause: read_subagent_result loads the envelope's transcript_path, which points at the PARENT session's transcript (same family as c39de619/9eeef654). FRESH PROBE CAPTURES (n=2, the 9eeef654 technique, Claude Code 2.1.170): the real SubagentStop envelope carries agent_transcript_path — the subagent's OWN complete transcript whose first user message IS the literal dispatch prompt — plus agent_id/agent_type and last_assistant_message (the subagent's final output; the agent transcript's final assistant text is not reliably flushed at fire time). THE FIX (D-FJO.1/2/3): agent_transcript_path becomes the SOLE transcript source for the judge (objective head, result tail-fallback, consequential cue); the parent transcript is never loaded for the seed; absent agent_transcript_path degrades fail-soft to a silent no-op (never parent-message heuristics); the off-frame flag self-identifies as a 'frame-judge advisory on dispatch <agent_type> <id>' with a first-line excerpt of the judged objective. AC.FJO.1 (objective/cue/result source + priority + degraded modes) + AC.FJO.2 (advisory provenance) + AC.FJO.S (outcome-altitude: production hook entry-point, real captured envelope shape, planted dispatch prompt reaches the judge prompt's objective block, channel message does NOT). Existing AC.SSFC. contracts preserved; conftest's make_stop_envelope reshaped to the real captured envelope; fail-soft exit-0/non-blocking unchanged."

