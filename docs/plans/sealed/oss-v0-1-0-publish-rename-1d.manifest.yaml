#     - primary-persona         — observability.py + tests (~7 files)
#     - reversibility-primitive — observability.py
#     - self-correction         — observability.py + triggers.py + 3 tests
#     - self-upgrade            — observability.py + rollback.py +
#                                  clause_checks.py + upgrade.py
#     - telegram-interface      — observability.py + 2 tests
#     - workspace-bootstrap     — host.py (tracer name `pos.bootstrap`) +
#                                  main.py + tests + docs/extension_protocol.md
#                                  (NOT discovery.py — entry-point group
#                                  pos.bootstrap.contributions is Python
#                                  packaging, not OTel; M1e closes it)
#     - workspace-sync          — observability.py + cli.py + tests
#     - hands-off-lifecycle     — narrative anchor + H19 owner; HOL src
#                                  contains zero pos.* OTel literals at
#                                  plan-authoring time. HOL is in the fence
#                                  for HC#4 in-band rebaseline (one SHA
#                                  bump on workspace-bootstrap/host.py)
#                                  and as the conventional narrative anchor
#                                  for amendment seal commits.
