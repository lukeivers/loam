# pos-v2 dev-mode auto-load partition (sub-plan F).
#
# Owner-authored partition data consumed by the loam-mode selector
# (see ``plugins/dev-sdlc/tools/loam-mode/``; post-M6b.0 location).
# Sub-plan B mechanises the routing:
# NORMAL USE sessions auto-load only ``always_loaded``; DEV MODE
# sessions auto-load ``always_loaded ∪ dev_only``. Locked rulings
# 4–6 (master plan §D-MASTER.2 + §F) are the source of truth; this
# manifest formalises them.
#
# Shape:
#   roots:        list of top-level workspace-relative directories
#                 + files the audit walks. Anything outside roots is
#                 not audited; transient dirs (.git, .venv, .pytest_*,
#                 .scratch, *.egg-info, __pycache__) are excluded.
#   audit_excludes: glob patterns excluded from the audit walk.
#   always_loaded: list of entries — each is either
#                  - {path: <workspace-relative path>}, or
#                  - {glob: <fnmatch pattern>, exclude: [<patterns>]}
#                  Globs match recursively (** semantics) when the
#                  pattern contains ``**``; otherwise plain fnmatch.
#                  Exclusions are subtractive — globs minus exclude
#                  patterns. Unique by entry; sets must be disjoint.
#   dev_only:     same shape as always_loaded.
#
# AC.F1: ``always_loaded ∩ dev_only`` is empty (path-resolved sets).
# AC.F3: every backtick-quoted path / Markdown-link path inside any
#        always_loaded artefact resolves to an always_loaded path or
#        an external URL.
# AC.F4: glob+exclude shape is well-defined; an entry's match-set is
#        deterministic given the workspace tree.
# AC.F5: every workspace-tree path under ``roots`` (after
#        ``audit_excludes``) is matched by exactly one of the two
#        sets (no orphans, no overlap).

roots:
  # Sealed-component source surfaces (Phase 1–4). Per locked ruling
  # 4: "every Phase 1–4 sealed component's source surface" is always-
  # loaded. The component dir is the unit; sub-trees inside (src/,
  # tests/, docs/, seals/, scripts/, etc.) ride with the component.
  # Post-M6b.0 realignment (AC.PMR.3): 14 component refs rebased to
  # framework/<comp>/; graceful-degradation/ RENAMED to dormancy/
  # (the component was renamed pre-M6b.0); workspace-sync ADDED (a
  # missing component admission — workspace-sync was never in the
  # original sub-plan F authoring's 15-component list).
  - framework/cost-governance/
  - framework/dormancy/
  - framework/hands-off-lifecycle/
  - framework/memory-system/
  - framework/objective-tracker/
  - framework/observability-aggregator/
  - framework/orchestrator/
  - framework/primary-persona/
  - framework/reversibility-primitive/
  - framework/safety-layer/
  - framework/scope-of-work/
  - framework/self-correction/
  - framework/self-upgrade/
  - framework/telegram-interface/
  - framework/workspace-bootstrap/
  - framework/workspace-sync/
  # Top-level non-component surfaces. tools/ MOVED to framework/tools/
  # post-M6b.0; data/ STAYS top-level (workspace runtime telemetry,
  # not a component source surface).
  - docs/
  - framework/tools/
  - data/
  # Root files. first-run-inventory.yaml MOVED to framework/ post-M6b.0.
  - CLAUDE.md
  - CLAUDE.dev.md
  - README.md
  - framework/first-run-inventory.yaml

# Excluded from audit walk regardless of root membership.
audit_excludes:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/.pytest_cache/**"
  - "**/.scratch/**"
  - "**/__pycache__/**"
  - "**/*.egg-info/**"
  - "**/.DS_Store"
  # untracked / pre-amendment-cleanup, not a partition member
  - "personas/**"

always_loaded:
  # Runtime harness — every Phase 1–4 sealed component's source
  # surface (locked ruling 4). "Loaded" here means partition-
  # membership, not Python-import; B's mechanism uses the partition
  # to gate context, not interpreter imports. Post-M6b.0 realignment
  # (AC.PMR.4): mirrors the roots: block — 14 component globs rebased
  # to framework/<comp>/**; graceful-degradation/ RENAMED to dormancy/;
  # workspace-sync ADDED.
  - glob: "framework/cost-governance/**"
  - glob: "framework/dormancy/**"
  - glob: "framework/hands-off-lifecycle/**"
  - glob: "framework/memory-system/**"
  - glob: "framework/objective-tracker/**"
  - glob: "framework/observability-aggregator/**"
  - glob: "framework/orchestrator/**"
  - glob: "framework/primary-persona/**"
  - glob: "framework/reversibility-primitive/**"
  - glob: "framework/safety-layer/**"
  - glob: "framework/scope-of-work/**"
  - glob: "framework/self-correction/**"
  - glob: "framework/self-upgrade/**"
  - glob: "framework/telegram-interface/**"
  - glob: "framework/workspace-bootstrap/**"
  - glob: "framework/workspace-sync/**"
  # Tracker-root-load-bearing per amendment #39 + sub-plan E.
  - path: docs/rebuild/VALUE_PROPOSITION.md
  # End-user-facing harness docs. CLAUDE_CAPABILITIES STAYS top-level
  # (public-surface harness orientation); duration-estimation-rubric
  # MOVED to plugins/dev-sdlc/docs/ post-M6b.0 (dev-discipline doc per
  # AC.OSS-M6b0.5).
  - path: docs/CLAUDE_CAPABILITIES.md
  - path: plugins/dev-sdlc/docs/duration-estimation-rubric.md
  # Always-load CLAUDE.md (the thin shell post-scrub — see AC.F3).
  - path: CLAUDE.md
  # Top-level repo orientation.
  - path: README.md
  # First-run inventory drives workspace-bootstrap's first-run.
  # Post-M6b.0: MOVED to framework/first-run-inventory.yaml.
  - path: framework/first-run-inventory.yaml
  # Observability data dir is runtime telemetry, not dev surface.
  # STAYS top-level (workspace-side runtime path).
  - glob: "data/**"

dev_only:
  # Dev-mode CLAUDE.md fragment (B's AC.B3 surface). Created by F's
  # amendment as the relocation target for CLAUDE.md's pre-scrub
  # dev-heavy sections; B mechanises auto-loading via SessionStart.
  - path: CLAUDE.dev.md
  # ODD methodology + worked examples (locked ruling 5). Post-M6b.0:
  # MOVED into the Dev/SDLC plugin tree.
  - path: plugins/dev-sdlc/docs/odd-methodology.md
  - path: plugins/dev-sdlc/docs/odd-in-loam.md
  # v0.2.2 (AC.OGP.1) — lean ODD grounding prime. Loads FIRST in
  # DEV-MODE corpus-required set; held in working memory for ODD-
  # shaped tasks; verbose derivation in odd-llm-grounding-derivation.md
  # is read on-demand for depth.
  - path: docs/odd-llm-grounding.lean.md
  # Dev/SDLC tracker docs.
  - path: docs/rebuild/STATE.md
  - path: docs/rebuild/BACKLOG.md
  - path: docs/rebuild/FUTURE_IDEAS.md
  - path: docs/rebuild/FUTURE_IDEAS_DRAFT.md
  - path: docs/rebuild/decay-retention-analysis.md
  # All plan docs (per-amendment + per-sub-plan).
  - glob: "docs/rebuild/plans/**"
  # Component-scoped proposals + seal narratives.
  - glob: "docs/rebuild/components/**"
  # Spec docs.
  - glob: "docs/rebuild/spec/**"
  # The partition manifest itself (read by loam-mode; dev infrastructure).
  # Post-M6b.0: relocated under the dev-sdlc plugin tree.
  - path: plugins/dev-sdlc/dev-mode-manifest.yaml
  # Dev tooling.
  # Post-M1g rename + post-M6b.1 MOVE: pos-amend → loam-amend, relocated
  # under the dev-sdlc plugin tree. Post-M6b.0 framework/-split MOVE for
  # orphan-plist-cleanup: now lives under framework/tools/.
  - glob: "plugins/dev-sdlc/tools/loam-amend/**"
  - glob: "framework/tools/orphan-plist-cleanup/**"
  # Post-M6b.0: loam-mode lives at plugins/dev-sdlc/tools/loam-mode/
  # (was framework/tools/loam-mode/). Plugin's docs/cdcs/ + docs/conventions/
  # also load in DEV MODE alongside the long-form ODD docs that moved
  # into the plugin.
  - glob: "plugins/dev-sdlc/tools/loam-mode/**"
