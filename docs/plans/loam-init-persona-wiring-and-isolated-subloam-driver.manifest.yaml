amendment:
  slug: loam-init-persona-wiring-and-isolated-subloam-driver
  title: "loam init persona-wiring + isolated sub-loam driver MINOR — a fresh-init workspace lands the primary persona ACTIVE, and a real loam instance can be driven programmatically for the corrected ProgramBench bench without colliding with the operator's live session. ROOT CAUSE verified from canonical source this turn (probe CONFIRMED; companion researcher §2.2 REFUTED). Part 1 (the first-run bug): `loam init` runs `bootstrap_new_workspace` → `run_first_run_scaffold` → `_install_persona_directory` (writes `personas/<handle>/` contract+prompt ONLY, first_run_scaffold.py:1676-1766) → `_scaffold_claude_dir` (writes `.claude/settings.json` = literal `{}`, new_workspace.py:437, AC.FBE.5b.5 explicitly out-of-scopes persona-binding). The persona `.claude/agents/<handle>.md` is written ONLY by `onboarding.persist_grounding:457-459` which requires an interactive persona conversation that itself requires the persona already bound (chicken-and-egg); the binding SessionStart hook exists only in the manually-copied canonical-dev template, never scaffolded; the fresh-template prompt carries literal unsubstituted `{user_preferred_name}` tokens. Net: a non-tech user's documented quickstart (clone → loam init → cd → claude) lands them in a bare-LLM workspace with a dead persona — AC.PO.1 (translation-burden) violated. LOCKED-DESIGN-NOT-LICENSE applied: 'by design per AC.FBE.5b.5' is NOT a reason to keep a bad outcome; the corrective is a forward extension of the first-run scaffold composing on the existing to_agent_md + SessionStart-registry primitives (Lens 1, no new hook machinery). Part 2 (the SHARP DECIDED sub-loam mechanism): a scratch loam workspace created by the real production path, made persona-active by Part 1, driven by a programmatic PTY harness (pexpect-class pseudo-terminal — DECIDED, not claude -p which the probe proved is single-pass not-loam, not computer-use which cannot type into terminals) that spawns an INTERACTIVE claude session under an isolated CLAUDE_CONFIG_DIR + --strict-mcp-config empty-MCP + NO telegram plugin/channel + namespaced workspace slug + service_bootstrap=False, feeding it the FROZEN build_prompt (owner constraint Telegram 11271 — prompt frozen, loam condition is the variable; the v1/v2 --append-system-prompt run_loam_builder arm is RETIRED, it was never loam). Part 3 (telegram/bun-kill): verified NOT a loam bug, NOT a launchd-label collision (labels namespaced com.loam.<slug>.<kind>), NOT a loam pkill (zero pkill of telegram/bun in loam source) — it is the claude-plugins-official telegram plugin's single-consumer-per-bot-token contention (server.ts:56-75 SIGTERMs the prior poller); the fix == Part 2's isolation (one mechanism, not two — AC.LIPW.6). Seven ACs: AC.LIPW.{1,2,3,4,5,6} outcome-shape + AC.LIPW.S seal-diff; method-in-AC test passed per-AC; AC.LIPW.{1,2,3} ladder to AC.PO.1, AC.LIPW.{4,5,6} ladder to AC.PO.2. Class MINOR per `docs/release-versioning-policy.md` — Part 1 adds user-observable behaviour at the loam-init boundary; D-LIPW.1 ratifies, downgrade to PATCH only on explicit build-time evidence of no user-observable change. Version derives at release-time per `feedback_version_numbers_at_release_time`. AC family scope-descriptive (`AC.LIPW.*`); slug NOT version-packed. Predecessor plan-author HEAD 5957073 (memory-session-continuity §13/§14 backfill); composes on SEALED #110 FBE.5b, #36 persona-dir scaffold, #50 persist_grounding triplet, #45 multi-contributor SessionStart registry, #46 session-start emitter, #1.7/LAYERED plugin-agent symlink, and the SEALED memory-session-continuity amendment (d579748/77e3bd7 — orthogonal, different component anchor, no fence overlap). NO Anthropic API key — Part 2's driver uses the real claude binary, no API key, default Sonnet (`feedback_no_anthropic_api_key`). Plan-author-only cycle — build deferred to a future session pending owner ratification of D-LIPW.2 (the LOCKED-DESIGN-NOT-LICENSE deferral-now-due call — the single gating ruling)."

