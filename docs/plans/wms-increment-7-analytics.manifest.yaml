# If the build finds it needs a query the runtime does not expose, a projection field that
# does not exist, a new event kind, OR any store/event MUTATION, it HALTS rather than
# opening a sealed objective-tracker amendment (plan §8 #2). If the build is tempted to
# register an always-on analytics turn block, it HALTS (§8 #3) — analytics is ON-DEMAND.
# If the build is tempted to add a CUT vanity metric (throughput number / velocity /
# cycle-time headline / bottleneck-edge count / chart), it HALTS (§8 #4) — re-adding one
# needs an owner ruling.
# Confirms architecture roadmap row 7 (analytics, the LAST increment) + WMS-D6 (analytics
# scope + timing — the conservative-three-not-dashboard realisation). CLOSES the
# 7-increment WMS roadmap.
# Adds AC.ANL.PILEUP.* (where work accumulates/stalls — hottest group named + count /
