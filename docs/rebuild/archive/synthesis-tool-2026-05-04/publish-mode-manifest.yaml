  # `dev_only:` block below for the explicit subtree globs). The
  # pre-existing universal `**/seals/**` + `**/tests/**` precedence
  # rules continue to win for `plugins/dev-sdlc/seals/` +
  # `plugins/dev-sdlc/tests/` per partition-precedence rule #2.
  - glob: "plugins/dev-sdlc/src/**"
  - path: plugins/dev-sdlc/pyproject.toml
  - path: plugins/dev-sdlc/README.md
  # plugins/dev-sdlc/skills/** ADMITTED dev_and_public at FBE.3
  # build-time per the dispatcher's split-admit framing extended to
  # cover the user-facing first-click intent-routing surface
  # (skills/start-project.md is explicitly the user-facing
  # entry-point per its own front-matter — "first-click intent
  # routing for the Dev/SDLC plugin"). Parent plan §3 Decision B.2
  # enumeration was non-exhaustive (skills/ not listed in either
  # bucket). Surfaced in FBE.3 status report; reversible if the
  # dispatcher rules differently.
  - glob: "plugins/dev-sdlc/skills/**"
  # plugins/loam-skills/ ADMITTED dev_and_public 2026-05-04 (v0.1.3
  # SKILL.md packages bundle, sealed at f04e925). loam-skills carries
  # 5 general harness-translation patterns (memory-recall, scope-
  # decompose, dispatch-with-gates, onboarding-conversation, session-
  # handoff) that benefit any loam user (not dev-specific). Strangers
  # running raw Claude Code can `pip install -e plugins/loam-skills/`
  # against the synth tree and reach the SKILL.md set without
  # adopting the full harness. Per Luke's 2026-05-04 partition rule
  # ("anything specifically dev related goes into dev SDLC plugin"),
  # loam-skills correctly lives outside dev-sdlc. Universal
  # `**/seals/**` + `**/tests/**` precedence covers internal
