amendment:
  slug: phase-b-intake-fix
  title: "Phase-B intake fix — close the three named hands-off-loop intake-leg defects the phase-b-hardening honest-negative (3/7 faithful + one non-deterministic process crash) located at file:line in framework/tools/handsoff-loop/src/handsoff_loop/intake.py, then run the honest re-harden. THREE CONTAINED FIXES (not a re-architecture), priority order per the hardening report's own §\"Three concrete intake fixes\": (1) AC.PBF.1 — refuse an empty/broken 'done' BEFORE the approval gate (no silent approved=True on an empty plain done / empty check command / unparsed machine-checkable; an honest evidence-carrying refusal-with-reason per D-PBF-A ADOPTED, NOT auto-retry — closes hardening I2/I7 FAILED-TO-DERIVE-plus-rubber-stamp); (2) AC.PBF.2 — the independent faithfulness judge assesses the actual derived machine check command (mc['check_command']/mc['spec'], a live local already computed at intake.py:213-222) adversarially for the proxy/plumbing failure mode ('could this exit 0 while the user's real outcome is unmet?'), NOT only the friendly plain summary — the already-existing, already-independent, already-isolated, already-either-polarity claude -p judge is fed the ground truth; NO new judge process / NO new isolation / NO verify.py change (this IS the information-trust-ordering inversion: judge the ground-truth artefact, not the loop's own self-summary — closes hardening I3/I6 CHECKABLE-BUT-WRONG that the loop's own judge rubber-stamped); (3) AC.PBF.3 — the AC.B.3 jargon guard (intake.py:94-102) is deterministic and token-boundary-matched: ordinary words that merely contain a forbidden substring ('Mac.'->'ac.', 'odd'->'ODD', 'seal the envelope'->'seal') do NOT raise, genuine jargon (real AC.<id> / pytest / exit code / sealed manifest) still refused — closes the non-deterministic process crash. Plus AC.PBF.4 no-regression in the durable parts (elicitation bounded <=4, exactly one approval gate on a healthy derive, genuine jargon still refused, the pre-existing deterministic test_AC_HL_B1_B4_intake_structure.py invariants hold — adjusted ONLY where a fix legitimately tightens, never loosened to pass), and AC.PBF.5 the honest re-harden end-test: a re-run of the EXACT phase-b-hardening 7-intent protocol (same 7 intents per D-PBF-B ADOPTED, one run per intent, NO retry-to-pass) scored by an INDEPENDENT faithfulness judge that is NOT the loop's own AC.B.4b judge (a separate stricter differently-framed Tier-0 probe + an evidence-grounded read of each raw derived check command — the same independent methodology the hardening used; the verdict is a verified empirical observation, never the loop's own self-report) reaching >=6 of 7 faithful — and a definite 'still not durably reliable, here is the residual pattern + evidence' is a VALID plan-success §10.5 outcome reported straight, NEVER retried-to-green, NEVER widened into a re-architecture mid-build, NEVER the bar weakened (>=6/7 not 7/7 is the fair bar per plan §4/§8 — one case is mechanically-unverifiable-for-anyone). FENCE (plan §2, binding): ONLY the three intake.py sites + the intake test surface; the intake->loop check_command/check_argv seam (plan §3/§6.3/§8) is a NAMED OUT-OF-FENCE follow-on — NOT fixed, fix-2 does NOT depend on it. The SKILL.md behavioural-doc line was assessed and is NOT touched — its pipeline-shape prose stays accurate after the fix (the fixes strengthen the described 'independent faithfulness check guarding checkable-but-wrong' shape, they do not contradict it), so the conditional doc-truth touch is NOT triggered (fence kept minimal). OUT (hard, plan §2): the core decompose->dispatch->judge loop / verify.py / orchestrator.py / goal_drive.py; the §1a/§1c launch sites; the Telegram-poller isolation (b33c0a8, untouched — it held under 28 isolated spawns this run, recorded as non-fence corroboration only); the elicitation leg (AC.B.2, the durable part); ProgramBench (downstream, gated on the re-harden); any token/argv/model/config/isolation change; publish/seal-policy/canonical-main mutation. Single-component fence: framework/workspace-bootstrap/ (sidecar framework/workspace-bootstrap/tests/SEAL_COMMIT, seal_test framework/workspace-bootstrap/tests/test_no_sealed_amendments.py — VERIFIED present this turn; LIVE allowed_prefixes admit framework/tools/ + framework/hands-off-lifecycle/ + docs/plans/, all VERIFIED this turn). Anchor rationale: the intake.py site lives under framework/tools/handsoff-loop/ inside the workspace-bootstrap seal-test's admitted framework/tools/ prefix; the AC.PBF.* test files land under framework/hands-off-lifecycle/tests/ inside the admitted framework/hands-off-lifecycle/ prefix; mirrors the telegram-poller-isolation-fix + handsoff-loop-real-build + subloam-driver-fix precedents that sealed cleanly against workspace-bootstrap on this exact branch tip. extra_allowed_prefixes EMPTY — no sealed-source edit outside the workspace-bootstrap anchor. NO Anthropic API key — real claude binary, default Sonnet (feedback_no_anthropic_api_key). LOCAL SEAL ONLY — NOT merged to main, NOT pushed, NOT published, NOT tagged; origin/main stays exactly at its current commit (the public step is a separate owner-asked action, NOT part of this cycle). No version bump (version derives at release-time). AC family scope-descriptive (AC.PBF.1..5); slug NOT version-packed; one test file per AC per the one-file-per-AC convention; method-in-AC test passed per-AC (each satisfiable by more than one implementation)."

