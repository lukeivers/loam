# AC families locked per docs/plans/dev-build-deploy-spine.md §P1 +
# docs/design/dev-build-deploy-shared-contract.md (P1 LOCAL scope ONLY; P2
# Vercel / P3 real-infra / P-final adoption are OUT of this cycle):
#   AC.LOCAL.1 — a LOCAL build produces an Acceptance record in the P0 shape,
#                judged by an INDEPENDENT check the builder did not control.
#                The verdict (met) is derived solely from RUNNING the check;
#                the producer cannot fabricate it; a failing check is an honest
#                negative, never retried-to-green.
#   AC.LOCAL.2 — the enabled LOCAL command set contains no irreversible action
#                (verified by the EMPTY overlap of the LOCAL verb set with the
#                prod/destroy verb set — the floor idles); a destructive-SQL
#                guard at LOCAL WARNS (advises + proceeds) against a
#                provably-local target (the local DB is disposable) and DEFERS
#                an unknown/non-local target to the sealed floor (fail-closed —
#                a false 'local' on a managed URL is the one prod-blast mistake).
#   AC.LOCAL.3 — when a LOCAL backing service differs from a downstream env's
#                (engine or pinned version), the divergence is surfaced in
#                PLAIN LANGUAGE before any promotion is offered; a matching
#                service produces no gap; the honest-residual caveat (a local
#                machine is never identical to live) is ALWAYS present so a
#                clean diff never over-claims parity.
#   AC.LOCAL.4 — a LOCAL secret is stored in the OS keychain, never written to
#                a repo-committed file (composes on the secure-build baseline's
#                secrets-never-committed boundary — defence at the source, not
#                only at the commit gate); the value is never printed into a
#                transcript surface.
#
# Outcome-altitude: test_AC_LOCAL_C_outcome_altitude.py drives the REAL
# build_local() entry-point over a fresh on-disk workspace (deploy config + a
# LOCAL-tier verify_command) with NO pre-arranged state and NO internal
# function stubbed; the independent check is a REAL python subprocess whose
# exit code decides the Acceptance verdict (green-check matching-parity,
# failing-check honest-negative, sqlite-vs-postgres engine gap surfaced,
