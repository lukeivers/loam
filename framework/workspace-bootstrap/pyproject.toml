[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-workspace-bootstrap"
version = "1.0.0"
description = "loam workspace bootstrap — two-layer framework composing the foundational components into a running orchestrator + three-gate chain, plus the published plugin contribution protocol."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "PyYAML>=6",
    "duckdb>=0.10",
    "loam-orchestrator",
    "loam-observability-aggregator",
    "loam-safety-layer",
    "loam-reversibility-primitive",
    "loam-cost-governance",
    "loam-self-correction",
    "loam-self-upgrade",
    "loam-scope-of-work",
    "loam-objective-tracker",
    "loam-primary-persona",
    "loam-dormancy",
    "loam-telegram-interface",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.entry-points."loam.bootstrap.contributions"]
# Foundational-adapter bundle — thirteen contributions. Phase 4+
# components ship their own `loam.bootstrap.contributions` entry-points
# in their own packages; bootstrap's code does not need to change.
observability_aggregator = "loam.workspace_bootstrap.adapters.observability_aggregator:ObservabilityAggregatorContribution"
scope_of_work = "loam.workspace_bootstrap.adapters.scope_of_work:ScopeOfWorkContribution"
objective_tracker = "loam.workspace_bootstrap.adapters.objective_tracker:ObjectiveTrackerContribution"
primary_persona = "loam.workspace_bootstrap.adapters.primary_persona:PrimaryPersonaContribution"
dormancy = "loam.workspace_bootstrap.adapters.dormancy:DormancyContribution"
memory_system = "loam.workspace_bootstrap.adapters.memory_system:MemorySystemContribution"
reversibility_primitive = "loam.workspace_bootstrap.adapters.reversibility_primitive:ReversibilityPrimitiveContribution"
safety_layer = "loam.workspace_bootstrap.adapters.safety_layer:SafetyLayerContribution"
cost_governance = "loam.workspace_bootstrap.adapters.cost_governance:CostGovernanceContribution"
self_correction = "loam.workspace_bootstrap.adapters.self_correction:SelfCorrectionContribution"
self_upgrade = "loam.workspace_bootstrap.adapters.self_upgrade:SelfUpgradeContribution"
workspace_bootstrap_py = "loam.workspace_bootstrap.adapters.workspace_bootstrap_py:WorkspaceBootstrapPyContribution"
telegram_interface = "loam.workspace_bootstrap.adapters.telegram_interface:TelegramInterfaceContribution"

[project.scripts]
pos-bootstrap = "loam.workspace_bootstrap.main:cli_main"
# D-migration D.4 (amendment #65): fresh-workspace bootstrap primitive
# (β.2 absorption). Composes on the existing run_first_run_scaffold
# API + git clone; lives next to pos-bootstrap so the import boundary
# is tight (one component owns the scaffold + the bootstrap CLI).
pos-new-workspace = "loam.workspace_bootstrap.new_workspace:cli_main"

# v0.2.1 Cycle 1 AC.ONBOARD.1 — `loam onboard` registers as a
# subcommand of the unified loam CLI via the `loam.cli.subcommands`
# entry-point group (mirrors loam-init's wiring at
# framework/loam-init/pyproject.toml).
#
# Amendment #144 Scope C / AC.CLE.SCAFFOLD-AUDIT.2 — `loam workspace`
# registers a parent verb with `rescaffold-skills` as its first
# sub-verb (operator-recovery path for pre-v0.1.7 workspaces).
[project.entry-points."loam.cli.subcommands"]
onboard = "loam.workspace_bootstrap.onboarding_cli:build_onboard_subcommand"
workspace = "loam.workspace_bootstrap.workspace_cli:build_workspace_subcommand"
# N3 — the translate-in first-run intake orchestrator (D-4 (a)). Named
# `init-intake` (NOT `init`) to avoid shadowing the existing sealed
# `loam init` tree-bootstrap verb in framework/loam-init/ (plan §11
# collision resolution). Drives run_first_run_intake — the real
# production entry-point the outcome-altitude AC.ONFIRE.3 walks.
init-intake = "loam.workspace_bootstrap.first_run_intake_cli:build_init_intake_subcommand"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loam*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
