[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-primary-persona"
version = "0.14.0"
description = "Primary-persona layer for loam — loader, background-work monitor, and autonomous authoring framework."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    # Streamable-HTTP MCP client; pinned to match the host MCP
    # service's pin to avoid protocol drift. Update in lockstep
    # with that service.
    "mcp==1.27.0",
    # In-workspace dependency on scope-of-work.
    "loam-scope-of-work",
]

[tool.setuptools]
package-dir = {"loam.primary_persona" = "src/loam/primary_persona"}
packages = ["loam.primary_persona"]
