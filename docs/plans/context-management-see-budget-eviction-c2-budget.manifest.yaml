  body: |
    # context-management-see-budget-eviction-c2-budget — apply ladder

    Context-management Cycle 2 — the context budget. Second of three
    sequential context-management cycles per master plan
    `docs/plans/context-management-see-budget-eviction-master.md`.
    Predecessor: Cycle 1 (c1-see — the `read()` sensor this budget consumes).

    Plan: `docs/plans/context-management-see-budget-eviction-c2-budget.md`.

    Scope (plan §3 / §5): two-component fence on
    `framework/context-management/` (the budget function + classifier +
    tests — load-bearing) + `plugins/loam-skills/` (the `strategic-compact`
    branch-1 edit + a regression assertion). Universal admissions:
    `docs/plans/`.

    Single-cycle, single-seal ladder (plan §7).

    AC families: AC.CTXBUD.1 / .2 / .3 / .S (outcome-altitude) — full text in
    plan §4; outcome-shaped per ODD §2.5; AC.CTXBUD.1 arithmetic-verified per
    feedback_arithmetic_verification.

    Re-extension under existing objectives per ODD §4 — anchors to AC.PO.1
    (the guess becomes a measured number in the persona's translation) +
    AC.PO.2 (the >85%/>92% bands are the protection trigger against silent
    state-loss to compaction).

    Halt triggers (plan §6): WD drift; Cycle 1 not sealed (no sensor to
    consume); the SKILL edit would regress an existing AC.COMPACT.* test
    (heuristic-fallback path must survive — re-scope to additive-only); the
    60/85 thresholds in the SKILL's existing decision rule conflict with the
    classifier bands (verify Tier-0 — they should align per research §5.2);
    AC reframes to method-in-AC.

    BASELINE walked at apply-time (Cycle 1 seal + §14 backfill predecessor).
    Sidecars advance to this amendment's seal SHA at apply time.
