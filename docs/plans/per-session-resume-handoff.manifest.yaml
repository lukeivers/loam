  title: "Per-session resume handoff — episodic resume scoped by channel-session (CLAUDE_PERSONA) wherever it surfaces (session-start active-thread + per-turn keep-pace episode branch), while decision-ledger / corpus / ruling records stay workspace-global; session_key captured at Stop-hook enqueue and materialized from the record (never the worker's env); a SECONDARY human-readable workspace/.loam/handoffs/<persona>.md fallback"

# BASELINE: the pre-amendment canonical tip immediately before this cycle's
# source commit. REBASED 75adf102 -> 30a3aaef (current canonical HEAD) after two
# commits shipped onto this plan's read/write surfaces while it was blocked on the
# §3 single-owner collision gate: ec9dd982 (RVL volume-limits reshape, AC.RVL.1-9,
# reshaped keep_pace/retrieval.py) + 6d0e20a5 (write-side facts-discipline,
# AC.WFD.1-9, +248 to file_memory.py). Core design D1-D5 re-verified against the
# reshaped code and HOLDS (plan §2A). RETARGET at apply time to the actual
# pre-source tip (typically HEAD~1) per the exemplar convention. The primary-persona
# sidecar (framework/primary-persona/tests/SEAL_COMMIT) is now at c17fb90c (was
# aefb3eb6) — this cycle advances it.
#
# Single-component amendment on the EXISTING primary-persona component
# (NOT a new component). Write side: adds an optional `session_key` field
# captured at memory_write_queue.enqueue (from the Stop-hook env, where
# CLAUDE_PERSONA is live; queue+worker+stop_emitter BYTE-UNCHANGED by the
# reshape), threaded through the detached worker's _build_episode_args from the
# RECORD (never the worker's own env) into the episode frontmatter as an additive
# field beside salience/volatility/epistemic; group_id=workspace_slug is untouched.
# Read side: an optional in-scan session_key filter, applied DURING candidate
# selection upstream of every RVL volume cut (FTS candidate window 1600 -> num_results
# 200 -> INJECTION_CHAR_CAP 5000 byte budget), on ALL THREE file_memory read surfaces
# — recent_episodes (session-start; persona-aware bounded walk, no limit*4=32
# starvation), _fts_search (per-turn LIVE; recommended fts5 session_key column
# filtered in SQL, riding the EXISTING D-MSC.5 rebuild-on-mismatch — NOT a source
# migration, plan §2A Halt-trigger-4 cleared), and _grep_search (the FTS-rebuild-
# window fallback; group-loop frontmatter fence). Threaded through active_thread.py
# (session-start) and keep_pace/retrieval.py's episode branch and
# session_start_emitter.py; the dormant memory_consumer.py MCP twin scoped
# consistently. New: a handoffs.py surface (workspace/.loam/handoffs/<persona>.md
# write at turn-close + read at session-start, persona-filtered) + a shared
# session-key resolver (CLAUDE_PERSONA -> DISCORD_STATE_DIR basename ->
# workspace_slug). Adds AC.PSR.1..8 (AC.PSR.6 outcome-altitude via a real
# enqueue->worker turn-close write with the worker's own env unset/wrong;
# AC.PSR.8 = the byte-cap starvation falsifier the RVL caps introduced).
#
# GATING PRECONDITION (plan §3 / §8 Halt-trigger 1): SINGLE-OWNER build.
# Master-control owns this per Luke's direct ask; a second builder (loam-dev)
# in the canonical tree trips the serialize-amendment-builds hazard.
