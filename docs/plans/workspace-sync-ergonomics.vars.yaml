TITLE: "workspace-sync — Bundle β: ergonomics (close \"normal person can use pos\" gap)"
TLDR: |
  Three internal ACs that, together, close the "install once, `pos
  new-workspace`, `pos-sync` no args" non-tech-operator path:
  β.1 KK — workspace canonical-source config + `pos-sync` no-args;
  β.2 LL — `pos-new-workspace --from <repo>` bootstrap (NEW console_script,
  NOT `pos` subcommand — Hard Constraint #2 against editing sealed
  self-upgrade/cli.py); β.3 MM — global install path (recommendation:
  pipx + thin curl-bash wrapper).
  Hard Constraint #1: backward-compat preserved unconditionally
  (`pos-sync --canonical <p> --workspace <p>` continues to work).
  No new top-level objective.
  Plan-author recommends shipping as three separate amendments,
  sequenced via same-tree-serialize.
AC_PREFIX: AC.β.x
SPEC_PLACEMENT: |
  Composes under VALUE_PROPOSITION's AC.PO.1 (translation-burden
  absorption) and AC.PO.2 (toolkit-primitive growth) — the prime
  objective per CLAUDE.md §2.5. NO new top-level objective.
  Halt trigger 1 evaluated: does not fire.

  Per AC trace:
  - β.1 → AC.PO.1 (no `--canonical` to type) + AC.PO.2 (workspace-local
    sync-config.yaml primitive).
  - β.2 → AC.PO.1 (one verb instead of six manual steps) + AC.PO.2
    (pos-new-workspace bootstrap primitive).
  - β.3 → AC.PO.1 (one-liner install instead of clone+venv+install
    recipe) + AC.PO.2 (global install primitive; substrate for future
    plugin-ecosystem tooling per D-A1 ruling).
LENS_ANALYSIS: |
  ### Lens 1 — Claude leverage

  No new LLM call surface. β.1 is a config-file load. β.2 is
  clone+delegate-to-pos-sync+delegate-to-workspace-bootstrap. β.3 is
  packaging machinery. Composes on existing Claude-native primitives:
  slash-command surface (future `/new-workspace` wrap of β.2),
  `claude --add-dir` for hand-off to next session, MCP server
  discovery via `<workspace>/.mcp.json` (amendment #47's
  mcp_json_writer, no edits). Plugin / skill / MCP cache delegation
  per ruling A3 (Claude Code owns ~/.claude/).

  ### Lens 2 — Harness + primary-persona value

  Primary-persona test: PASS on all three ACs. "Pull the latest" /
  "create a new workspace" / "install pos" each become a single verb
  instead of a multi-step recipe. Headline: every subsequent
  `pos-sync` invocation post-β.1 is no-args.

  Harness test: PASS on all three ACs. Three new primitives —
  workspace-local sync-config.yaml, pos-new-workspace bootstrap,
  global install path — are each invocable by the persona on the
  user's behalf and durable across sessions.

  ### Lens 3 — ODD authoring

  Each AC is outcome-shaped; method is the builder's call. §11
  named decisions are outcome-shape (URL/path support, install path
  mechanism, console_script placement, bundle-vs-split). §14
  method-decision register is the post-build record per amendment
  #46/#47/#54/#56 precedent.
ACCEPTANCE_CRITERIA: |
  - **AC.β.1 — Workspace canonical-source config; `pos-sync` no-args
    from inside a workspace.** When `<workspace>/.pos/sync-config.yaml`
    exists with `canonical_source:` (URL or absolute local path),
    invoking `pos-sync` no-flags from inside the workspace reads the
    field, resolves it (clone-to-cache for URL, use-direct for local
    path), and proceeds with #56 + #57 sync flow. Pydantic-validated
    on every load. CLI flag `--canonical <p>` overrides config-file
    value. Backward-compat (Hard Constraint #1, binding): a workspace
    WITHOUT the file sees byte-identical behaviour to today's CLI.
    Cache-clone at `~/.pos/canonical-cache/<repo-id>/` (D-β.1
    recommendation; workspace-shared). Schema (workspace-local +
    ~/-rooted) shares one Pydantic model; precedence: CLI flag >
    workspace-local file > ~/-rooted file > schema defaults.
    Verified by 6 fixtures.

  - **AC.β.2 — `pos-new-workspace --from <repo>` bootstrap command.**
    Invoking `pos-new-workspace <workspace-path> --from <canonical-source>`:
    creates `<workspace-path>` if absent (refuses if non-empty),
    clones canonical to cache, embeds framework via internal pos-sync
    invocation against freshly-cloned canonical, writes
    `<workspace-path>/.pos/sync-config.yaml` with `canonical_source:`
    pre-populated, optionally invokes workspace-bootstrap's first-run
    scaffold via its public API (no edits to workspace-bootstrap/).
    Console_script placement (D-β.2, surfaced for owner ruling):
    plan-author recommends NEW console_script `pos-new-workspace`
    declared in `workspace-sync/pyproject.toml` (sibling to
    `pos-sync`, `pos-workspace-sync`). NOT a `pos` subcommand
    (Hard Constraint #2: no edits to sealed self-upgrade/).
    Verified by 5 fixtures.

  - **AC.β.3 — Global install path for pos / pos-sync /
    pos-new-workspace.** A non-tech operator runs a single one-liner
    that ends with the three binaries on PATH. D-β.3 surfaces three
    options: (a) curl-bash installer; (b) pipx-installable package
    (recommended) + thin curl-bash wrapper; (c) homebrew formula.
    Aligns with D-A1 ruling (Architecture A for the CLI binary).
    Verified by an end-to-end test on a fresh CI VM or equivalent
    isolated environment.

  No AC.β.S (seal-diff invariant) at the bundle level — bundle β is
  dev-discipline. If D-β.4 routes any AC to sealed-component shape,
  that AC's plan-doc gains a §14 register skeleton + per-AC
  seal-diff invariant.
