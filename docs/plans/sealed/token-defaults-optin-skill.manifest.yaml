schema_version: 3
amendment:
  slug: token-defaults-optin-skill
  title: "Token-optimization defaults documenter + opt-in writer SKILL — absorb ECC's recommended cost-optimization settings (Sonnet default, MAX_THINKING_TOKENS=10000, CLAUDE_AUTOCOMPACT_PCT_OVERRIDE=50, MCP/tool caps) via two complementary surfaces: (a) a documented preset in docs/getting-started.md so docs-first user discovery sees the recommended settings + their cost-rationale before they hit cost pain; (b) an opt-in SKILL at plugins/loam-skills/skills/cost-optimised-defaults/ that the persona invokes on user cost-signal (e.g. 'loam is expensive', 'what should my settings be'), presents the 4 recommended settings + their rationales, awaits explicit user approval, and on approval merges them into ~/.claude/settings.json non-destructively (existing user keys preserved; collisions surfaced + accept user's choice; atomic write-temp-then-rename so partial writes can't corrupt). Per D-TOKEN.ENFORCE (maintainer ruling TG 12301 / 'B'): NO auto-mutation of ~/.claude/settings.json on install — user-config sovereignty preserved; SKILL is the only mutation surface and writes only on explicit user approval. AC family scope-descriptive (AC.TOKEN.1 docs section / AC.TOKEN.2 SKILL bundle / AC.TOKEN.3 non-destructive merge / AC.TOKEN.4 explicit-approval flow / AC.TOKEN.5 install-time-no-touch negative AC / AC.TOKEN.S outcome-altitude end-to-end synthetic session per feedback_test_outcome_altitude_required). Single-component fence: framework/workspace-bootstrap/ (same anchor + same admitted-prefix pattern as handsoff-loop-real-build precedent, which sealed plugins/loam-skills/ + docs/plans/ + docs/STATE.md cleanly). ECC cost-savings percentages (60% / 70%) attributed to ECC explicitly in the docs section per feedback_claim_or_cite_no_fake_sources — loam has not independently measured. Composes with feedback_compact_clear_decision_heuristic memory rule (heuristic informs WHEN to apply discipline; this work-item installs SETTINGS that make the discipline effective) and with the existing global Token-efficiency discipline in ~/.claude/CLAUDE.md (this generalises maintainer-only discipline to a user-facing surface). Method-in-AC test passed per AC (each satisfiable by more than one implementation: Python helper vs Bash+jq merge; YAML vs JSON frontmatter; markdown section anywhere within getting-started.md so long as position constraint satisfied). extra_allowed_prefixes EMPTY — no sealed-source edit outside the workspace-bootstrap anchor. No version bump (version derives at release-time per feedback_version_numbers_at_release_time). Wall-clock cost band: sm (~2-4 h AI-time per the duration rubric × ~15-25 tool calls × 0.1-0.15 wall-clock/call). LOCAL SEAL ONLY — sealed-local-on-branch is the deliverable; publish is a separate owner-asked action."

