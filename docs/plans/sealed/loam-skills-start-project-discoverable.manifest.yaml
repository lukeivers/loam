seal_description: |
  PATCH — Promote /start-project SKILL to discoverable subdirectory
  shape; close the silent v0.1.7 AC.LAYERED.2 divergence regression.

  At v0.1.0 ship, AC.OSS-M6.9 verified the start-project SKILL via
  `_resolve_corpus_path` reader-fall-through (Idea 26). Flat-shape
  `plugins/dev-sdlc/skills/start-project.md` was correct AT THE TIME.
  At v0.1.7, AC.LAYERED.2 shipped `_symlink_plugin_skills` —
  per-directory walk only; flat-file skills explicitly skipped at
  `framework/workspace-bootstrap/src/loam/workspace_bootstrap/
  adapters/first_run_scaffold.py:1262-1267`. No test detected the
  divergence: AC.OSS-M6.9's verification was downsized to file-
  existence + frontmatter + manual reader-fall-through simulation,
  never an outcome-altitude check that the SKILL actually reaches
  `<workspace>/.claude/skills/` in a fresh workspace. The SKILL has
  been silently undiscoverable since v0.1.7.

  Batch A (amendment #145, apply commit 140767c pending seal)
  accepted the silent-undiscoverable state and DELETED the
  `start-project` reference from docs/architecture.md (per
  D-BAFI.START-PROJECT). This amendment course-corrects: promote
  the SKILL to discoverable shape AND restore the architecture.md
  reference with refined wording.

  AC families locked per docs/plans/loam-skills-start-project-
  discoverable.md §4:

    - AC.SPDISC.MV — `git mv` plugins/dev-sdlc/skills/start-
      project.md → plugins/dev-sdlc/skills/start-project/SKILL.md.
      Body byte-identical.
    - AC.SPDISC.DSCV — OUTCOME-ALTITUDE: `_symlink_plugin_skills`
      walked against a synthetic workspace produces the symlink at
      `<workspace>/.claude/skills/start-project` and resolves to
      a readable SKILL.md. RED-on-mutation: revert the `git mv`
      and assert the test fails.
    - AC.SPDISC.OSSM69 — original AC.OSS-M6.9 contract still
      passes against the relocated file (frontmatter + body +
      reader-fall-through resolution).
    - AC.SPDISC.ARCH — docs/architecture.md `### Skills` section
      names start-project as Dev/SDLC plugin's first-click intent-
      routing surface; cites the auto-symlink mechanism.
    - AC.SPDISC.COLLAT — collateral references reflect subdirectory
      shape across 5 files: README, two DSDLC test docstrings,
      AC.LAYERED.2 test docstring, layered-skill-architecture.md.
      Includes EXPECTED_SKILLS update in both DSDLC1.7 + DSDLC2.7
      tests to admit `start-project` as the 16th SKILL (per §11 of
      the plan-doc; merged into COLLAT scope).
    - AC.SPDISC.S — smoke: fresh workspace produced by the
      production fresh-scaffold entry-point carries
      `<workspace>/.claude/skills/start-project/SKILL.md` reachable
      as a normal file. OUTCOME-ALTITUDE.

  Method-level choices (builder's call per ODD §1.1; recommendations
  in §10 of the plan-doc):

    - D-SPDISC.MV-METHOD: `git mv` (preserve history).
    - D-SPDISC.NAME-FIELD: keep frontmatter `name: start-project`
      for v0.1.0 contract continuity (subdirectory-name and
      frontmatter-name agreeing is benign).
    - D-SPDISC.ARCH-WORDING: parallel-paragraph addition to the
      existing loam-skills / dev-sdlc paragraph.
    - D-SPDISC.LAYERED-DOC-WORDING: replace real-tree flat-shape
      example with a hypothetical example.
    - D-SPDISC.LAYERED-2-TEST-COMMENT: historical-context wording.
    - D-SPDISC.BAFI-TEST-COLLISION: verification deferred to
      builder; if Batch A's test_AC_BAFI_S_post_fix_state.py
      asserts start-project absence from architecture.md, builder
      updates that test as part of this amendment's source-edit
      commit (preferred path — on-shape semantic correction).

  Out of scope (per sub-plan §3):

    - SKILL body content revision (move only).
    - Migrating other flat-shape skills (none exist in canonical loam).
    - Revising AC.LAYERED.2's skip-flat-file test LOGIC (logic stays;
      only comment example updates).
    - Broader currency review of layered-skill-architecture.md.
    - MCP section of architecture.md (per Batch A's D-BAFI.ARCH-SCOPE).
    - Tightening AC.OSS-M6.9's text language (text was correct; only
      the verification ladder tightens per
      `feedback_loose_AC_text_fix_AC_not_implementation`).

  Predecessor commits:
    - 21c1ddf — Batch A plan-doc + manifest commit.
    - 140767c — Batch A apply commit (pending seal at plan-author
                time; this amendment's apply WAITS for Batch A's
                seal SHA which becomes this amendment's baseline).
    - <Batch A seal SHA> — baseline for this amendment (backfilled
                           at apply-time).
    - <any Batch A-FIX seals> — additional baseline-walks if needed.

  HALT TRIGGERS (per §6 of the plan-doc):

    - WD drifts → halt.
    - Batch A unsealed at apply-time → halt; architecture.md edit
      will conflict.
    - SKILL body non-byte-identical post-move → halt.
    - `_symlink_plugin_skills` mechanism deviates from
      D-SPDISC.MECHANISM expectation → halt + RF.
    - Cross-plugin `start-project` name collision → halt.
    - AC.SPDISC.DSCV test fails RED-on-mutation → halt; not at
      outcome-altitude.
    - Additional hard-coded flat-shape references discovered beyond
      the 5 named in §3 → halt + surface; scope might widen.
    - SKILL frontmatter requires per-directory shape divergence
      (e.g., `allowed-tools` field with companion files) → halt
      + RF (Tier-0-verified at plan-time: no such fields).
    - Batch A's BAFI test asserts start-project absence from
      architecture.md AND that update is contentious → halt + RF.

