  - "Required source-edit OUTSIDE the named amendment fence."
  - "Pre-existing test fails post-restructure (D.1)."
  - "D.2 migration script breaks pos3 mid-flight."
  - "D.3's git-merge mechanics produce a workspace-file change inside <workspace>/workspace/."
  - "Wall-time exceeds projected per-amendment estimate by >50%."
  - "D.4's pos-new-workspace cannot land without touching sealed components outside workspace-bootstrap."
  - "HC#5 empirical pos3 verification fails."

