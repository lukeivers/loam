plan: docs/plans/loam-doc-consistency-batch-a.md

seal_description: |
  Doc-only consistency fixes (Batch A) — closes 5 findings from the
  loam-fresh-install-consistency-review-2026-05-23 research artefact
  (review §7 items 1, 3, 6, 7, 8) in a single tiny doc-only PATCH
  amendment.

  AC.BAFI.INSTALL — docs/install-from-source.md line 78 deletion. The
  line `pip install -e ./framework/binary-observation-harness` named
  a component that does not exist on disk (verified Tier-0 this turn
  via `ls framework/ | grep -i binary` → no match; install-from-
  source.txt has no corresponding entry). Surrounding Tier A
  enumeration preserved cleanly.

  AC.BAFI.ARCH — docs/architecture.md Skills section (lines 89-94)
  rewrite to reflect current reality: loam-skills plugin contributes
  N SKILLs (N derived at build-time via `find plugins/loam-skills/
  skills -name SKILL.md | wc -l`; 20 as of plan-author pre-flight);
  dev-sdlc plugin contributes M layered SKILLs (M derived at build-
  time via `find plugins/dev-sdlc/skills -mindepth 2 -name SKILL.md
  | wc -l`; 15 as of plan-author pre-flight); both auto-discovered
  via Claude Code's .claude/skills/ after first-run symlinking by
  _symlink_plugin_skills in framework/workspace-bootstrap/src/loam/
  workspace_bootstrap/adapters/first_run_scaffold.py. The flat-shape
  start-project.md is intentionally not auto-symlinked per docs/
  design/layered-skill-architecture.md:194-196; the architecture.md
  rewrite removes the start-project reference entirely (Option 1 per
  plan §10 F2 — the flat-vs-layered distinction is an architectural
  detail, not user-facing). MCP section (lines 84-87) NOT touched
  (out of scope for Batch A per plan §10 F3 — telegram-interface
  MCP composition needs separate scope).

  AC.BAFI.PYPROJ — plugins/loam-skills/pyproject.toml line 8
  description rewrite from "five SKILL.md packages capturing loam's
  load-bearing translation patterns (memory-recall, scope-decompose,
  dispatch-with-gates, onboarding-conversation, session-handoff)"
  to count-neutral wording (preferred over hard-coded count per
  D-BAFI.PYPROJ-NEUTRAL — corpus grows; count-neutral stays correct).
  Package metadata (name, version, requires-python, dependencies)
  unchanged.

  AC.BAFI.QUICK — README.md quickstart section gets a one-line
  callout after step 3 (`loam init ~/loam-workspace`) noting the
  interactive 6-question onboarding ritual fires on first run with
  LOAM_ONBOARDING_SKIP=1 as the skip mechanism. Step numbering 1-4
  preserved intact.

  AC.BAFI.DOCS — README.md Documentation section anachronistic
  parentheticals "(authored alongside this README in the v0.1.0
  docs lane.)" removed from both the docs/architecture.md link and
  the docs/getting-started.md link. Link text + URL targets
  unchanged.

  AC.BAFI.S — outcome-altitude smoke. tests/test_AC_BAFI_S_post_fix_
  state.py at plugins/loam-skills/tests/ (per D-BAFI.FENCE-SHAPE)
  reads each of the five touched files and asserts corrected content
  present + stale content absent. Production-altitude file reads,
  no pre-arranged state. Mutation-proof: the test FAILS against the
  pre-amendment tree (verified at build-time by mutation check).

  Five plan-author halt-and-surface findings (per plan §10) all
  surfaced + autonomous-decision-recorded per `feedback_test_
  against_operational_objective_before_escalating`: F1 (dev-sdlc
  count calibration 16 → 15), F2 (start-project SKILL exists but
  not auto-symlinked), F3 (MCP section deferred to separate
  amendment), F4 (AC.BAFI.S placement → plugins/loam-skills/tests/),
  F5 (bundle holds per review's own claim).

  Cosmetic + accuracy hygiene amendment; no behavior change for any
  production code path; one new test file (AC.BAFI.S). Composes with
  amendment #137 (same shape: doc-only sweep with outcome-altitude
  smoke; this amendment is structurally smaller). Closes review §7
  items 1, 3, 6, 7, 8; leaves items 2, 4, 5, 9, 10 as separate-
  amendment candidates per plan §9 bookkeeping.

