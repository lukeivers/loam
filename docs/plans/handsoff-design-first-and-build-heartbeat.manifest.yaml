  title: "handsoff-loop — design-first front stage (N candidate designs + user-validation gate) + build-time progress heartbeat (channel-aware)"

# BASELINE: bad861e0 — canonical main tip at plan-authoring (2026-06-24). The
# handsoff-loop family seals against the workspace-bootstrap component anchor
# (the source lives under framework/tools/handsoff-loop/, inside the
# workspace-bootstrap seal-test's admitted framework/tools/ prefix — same
# pattern as the AC.TPI / AC.BRC / AC.SWARM seals), so the seal-diff is scoped
# bad861e0..<seal> per slice.
#
# TWO buildable slices under one objective (build separately or together,
# builder's call per feedback_serialize_amendment_builds — if DF seals first,
# HB's baseline is DF's apply tip):
#
#   Slice DF (design-first front stage). Today build_from_intent runs
#   understanding → single approval (on the intent inference, pre-research) →
#   research → ONE generate_design → freeze → build. Slice DF adds:
#   generate_candidate_designs(intent, grounding, *, n=3) producing N materially-
#   distinct implementation-agnostic candidate designs (each with a polished
#   sample-output rendering at the accounting-back-office demo bar); a NEW design-
#   validation stage in build_from_intent.py between planning and the freeze,
#   driven by an injected choose_design_fn(candidates) -> ChosenDesign (None =
#   standing-hands-off → auto-pick candidate 0, preserving the sealed non-
#   interactive S6 path byte-behaviour); user tweaks folded into the chosen
#   GeneratedDesign before the (untouched) freeze. The build loop does NOT start
#   until the user settles a design (the prime-directive verify-before-expensive-
#   commit move). AC surface AC.DF.1–.5 (.5 outcome-altitude). Plan §5.
#
#   Slice HB (build-time progress heartbeat). The heartbeat substrate exists
#   (progress.start_heartbeat emits artifact-probe liveness to the run record +
#   a `say` callable defaulting to print/terminal). Slice HB makes the heartbeat
#   channel-aware via an injected notify_fn (the workspace wires the shared
#   channel module post_to_active_channel / _detect_active_channel; loam ships a
#   terminal default — NO pos3-only import in loam source, SAL-HB-1 / H-3),
#   extends convergence.probe_liveness with a cross-beat PROGRESS delta (newest-
#   mtime advance OR run-record line gained — progress, not mere liveness; honors
#   feedback_dead_agent_detection_via_artifact_probe), detects stall (alive-but-
#   not-progressing ≥K beats) and surfaces it distinctly, and routes periodic
#   plain-language status to the user's ACTIVE channel (Discord/Telegram) at a
#   calmer channel cadence (~300s) + immediate stage-transition / stall / done
#   posts. Alert-only (no auto-retry). AC surface AC.HB.1–.5 (.5 outcome-
#   altitude). Plan §5.
