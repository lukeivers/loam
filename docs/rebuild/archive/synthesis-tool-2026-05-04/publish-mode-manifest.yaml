  - glob: "plugins/loam-skills/src/**"
  - path: plugins/loam-skills/pyproject.toml
  - path: plugins/loam-skills/README.md
  - glob: "plugins/loam-skills/skills/**"

# Stays in the dev tree, NEVER ships publicly. Dev-discipline machinery.
dev_only:
  # Dev-tools — loam amend (the renamed pos-amend); migration
  # helpers; the publish tool itself (its OUTPUT ships, not the
  # tool); architecture-B migration tooling; orphan plist cleanup;
  # upgrade-merge resolver. Post-M6b.0: framework/tools/loam-mode/
  # MOVED into the Dev/SDLC plugin tree (covered by
  # `plugins/dev-sdlc/**` glob below); the path no longer exists at
  # the canonical location.
  # M-FBM (2026-05-01): memory-system source RECLASSIFIED dev_only.
  # File-based memory at framework/primary-persona/src/loam/
  # primary_persona/file_memory.py is the v0.1.0 default substrate;
  # graphiti retires to post-v0.1.0 plugin (M-GMP). Per partition-
  # precedence rule #2 (dev_only checked before dev_and_public), this
  # explicit glob wins. memory-system continues running in canonical
  # dev mode; only synthesis output drops it.
  - glob: "framework/memory-system/**"
  # M-FBM (2026-05-01): kuzu_db inspection one-shot tool. Dev-only;
  # surfaces episode count + size + group_id distribution for owner
  # to verify the discard decision per D-Q.MFBM.6.
  - glob: "framework/tools/loam-memory-inspect/**"
  # framework/tools/loam/** RECLASSIFIED to `dev_and_public` at FBE.2
  # (v0.1.0 reviewer foldback; plan-doc: docs/rebuild/plans/
  # v0-1-0-foldback-scope-expansion-fbe2.md; parent: docs/rebuild/
  # plans/v0-1-0-foldback-scope-expansion.md §4 FBE.2). See the
  # `dev_and_public:` block above for the new entry. The CLI binary
  # is intrinsically user-facing; the M2 manifest's lumping of it
  # alongside publish/migration tooling was wrong. Tools that REMAIN
  # dev_only (pos-publish-framework-only, heavy-b-migrate, orphan-
  # plist-cleanup, upgrade-merge-resolver, loam-migrate-*,
  # loam-memory-inspect) stay listed below.
  - glob: "framework/tools/heavy-b-migrate/**"
  - glob: "framework/tools/orphan-plist-cleanup/**"
  - glob: "framework/tools/upgrade-merge-resolver/**"
  - glob: "framework/tools/pos-publish-framework-only/**"
  - glob: "framework/tools/loam-migrate-host-config/**"
  - glob: "framework/tools/loam-migrate-launchd-labels/**"
  - glob: "framework/tools/loam-migrate-dormancy-config/**"
  # Hands-off-lifecycle gate-test files — RECLASSIFIED dev_only by
  # the post-M6 partition realignment amendment (AC.PMR.1; M9 plan
  # §7 finding #1 surfaced this gap). The 12 test files at
  # framework/hands-off-lifecycle/tests/test_AC_AG_*.py (5 files) +
  # test_AC_BAG_*.py (7 files) sys.path-probe into plugins/dev-sdlc/
  # hooks/ to import the moved gate modules under test (post-M6b.0
  # gate-hook source files MOVED to the plugin tree). In the
  # synthesised public artefact the plugin tree is dropped, so
  # these test imports fail at import-time. Per partition-precedence
  # rule #2 (dev_only checked before dev_and_public), these explicit
  # globs win over the broad `framework/hands-off-lifecycle/**`
  # admission in the dev_and_public block above. Non-gate test files
  # in the same directory (e.g. corpus_load_sentinel tests) continue
  # to classify dev_and_public via the broad glob.
  - glob: "framework/hands-off-lifecycle/tests/test_AC_AG_*.py"
  - glob: "framework/hands-off-lifecycle/tests/test_AC_BAG_*.py"
  # Class A — per-component seal-narrative directories. The `seals/`
  # convention carries SEAL_COMMIT files + sealed-amendment narratives
  # rich in dev-historical references (pos-amend, loam-mode,
  # docs/rebuild/, etc.). Per partition-precedence rule #2 (dev_only
  # checked before dev_and_public), this glob wins over the broad
  # `framework/<comp>/**` admissions for each component carrying a
  # `seals/` subtree. Authored at the C1 amendment (M11a dispatch-2
  # AC.M11a.2 foldback) per `docs/rebuild/plans/oss-v0-1-0-publish-
  # public-docs-classes-abc.md` D-Q.ABC.2 = (a) framework-wide glob.
  # Future v0.x components inherit the same classification.
  - glob: "**/seals/**"
  # Class B — dev-discipline meta-tests. `test_no_sealed_amendments.py`
  # verifies the amendment-cycle invariant (no commits land on a
  # sealed-component fence outside an active amendment); the
  # `test_AC_*_seal_diff_*.py` family asserts seal-diff window
  # invariants. Both are dev-mode-only meta-tests; they reference
  # internal cycle vocabulary (pos-amend etc.) that has no public
  # meaning. Authored at the C1 amendment per D-Q.ABC.3 = (a) targeted
  # exact globs (broader patterns risk excluding legitimate public
  # tests).
  - glob: "**/tests/test_no_sealed_amendments.py"
  - glob: "**/tests/test_AC_*_seal_diff_*.py"
  # Class C-bis — test-fence (industry-convention shape). The test
  # suite under any component's `tests/` directory is dev-discipline
  # machinery: tests verify dev-mode behaviour by literal-asserting
  # dev-only paths (e.g. `docs/rebuild/plans/`, `pos-amend`, `loam-
  # mode`), carry fixture content + assertion strings + comments
  # rich in internal vocabulary, and run during CI but never at
  # user-runtime. No public-shipping artefact under any modern
  # Python package's `tests/` directory in v1.0 OSS releases (cpython,
  # numpy, requests precedent). Authored at the C2-bis amendment per
  # `docs/rebuild/plans/oss-v0-1-0-publish-public-docs-classes-abc-
  # bis.md` (foldback for C2 halt at HT-C2.4 — 109-file test-residual
  # scope mismatch). Subsumes the two C1-locked exact globs above
  # (kept in place as audit-trail for D-Q.ABC.3 = a precision ruling).
  - glob: "**/tests/**"
  # Internal docs tree — plans, components, FUTURE_IDEAS, STATE,
  # BACKLOG, capability-corpus authoring shape, decay-retention-
  # analysis, spec/. Per OSS-readiness audit §4.1 + master plan §3
  # AC.OSS.3. Post-M6b.0: docs/rebuild/dev-mode-manifest.yaml MOVED
  # to plugins/dev-sdlc/dev-mode-manifest.yaml (covered by the
  # `plugins/dev-sdlc/**` glob below).
  - glob: "docs/rebuild/**"
  # Dev-mode-only top-level fragment (CLAUDE.dev.md is the dev-
  # extension of CLAUDE.md per loam-mode B's load-time partition).
  - path: CLAUDE.dev.md
  # plugins/dev-sdlc/ SPLIT-ADMITTED at FBE.3 (v0.1.0 reviewer
  # foldback; plan-doc: docs/rebuild/plans/v0-1-0-foldback-scope-
  # expansion-fbe3.md; parent: docs/rebuild/plans/v0-1-0-foldback-
  # scope-expansion.md §4 FBE.3 + §3 Decision B.2). Pre-FBE.3 the
  # broad `glob: "plugins/dev-sdlc/**"` lived here (M6b.0 placement
  # per AC.OSS-M6b0.9 + D-build.M6.14). FBE.3 REMOVED the broad
  # glob and added the user-facing plugin source
  # (`src/`/`pyproject.toml`/`README.md`) to `dev_and_public:` (see
  # block above) so a stranger can `pip install -e plugins/dev-sdlc`
  # against the synth tree. The DEV-DISCIPLINE SUBTREE (the
  # contents enumerated below) STAYS `dev_only` — those paths
  # carry CDCs, long-form ODD docs, conventions, gate hooks,
  # loam-mode tooling, the loam-amend tool, dispatch + plan
  # templates, the dev-mode-manifest. None of that ships publicly.
  #
  # The pre-existing universal `**/seals/**` + `**/tests/**`
  # precedence rules continue to win for `plugins/dev-sdlc/seals/`
  # + `plugins/dev-sdlc/tests/` per partition-precedence rule #2
  # (dev_only checked before dev_and_public). They are NOT re-listed
  # here.
  - glob: "plugins/dev-sdlc/docs/**"
  - glob: "plugins/dev-sdlc/hooks/**"
  - glob: "plugins/dev-sdlc/templates/**"
  - glob: "plugins/dev-sdlc/tools/**"
  - path: plugins/dev-sdlc/dev-mode-manifest.yaml

# MUST NOT ship publicly under any condition. Mostly defensive — these
# paths are .gitignore'd so git ls-tree never sees them; the manifest
# entry is belt-and-braces audit-completeness.
excluded_from_publish:
  # VCS / build / cache / editable-install state.
  - glob: ".git/**"
  - glob: ".scratch/**"
  - glob: ".pos/**"
  # Per-component / workspace runtime state.
  - glob: "data/**"
  - glob: "workspace/**"
  # Untracked workspace-side persona content (see dev-mode-manifest's
  # audit_excludes — same handling).
  - glob: "personas/**"
  # Per-workspace MCP registration.
  - path: .mcp.json
  - path: .gitignore
  # Editable-install metadata + caches (also covered by audit_excludes
  # globs, but declared here for audit-completeness should one ever
  # appear at a non-excluded location).
  - glob: "**/*.egg-info/**"
  - glob: "**/__pycache__/**"
  - glob: "**/.pytest_cache/**"
  - glob: "**/.venv/**"
  - glob: "**/*.pth"
  - glob: "**/.DS_Store"
  - glob: "**/.env"
