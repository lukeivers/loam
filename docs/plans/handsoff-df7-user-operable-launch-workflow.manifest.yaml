  slug: handsoff-df7-user-operable-launch-workflow
  title: "handsoff-loop Slice DF amendment — every candidate design carries a user-operable end-to-end LAUNCH workflow; a non-tech user is never offered a candidate whose launch requires a terminal/script/dev-env, even if its output is a GUI (AC.DF.7)"

# BASELINE: a0c25db1 — canonical main tip (the Slice DF + Slice HB + the AC.DF.6
# amendment seals already landed; this amendment follows on). The handsoff-loop
# family seals against the workspace-bootstrap component anchor (the source lives
# under framework/tools/handsoff-loop/, inside the workspace-bootstrap seal-test's
# admitted framework/tools/ prefix — same pattern as the Slice DF / Slice HB /
# AC.DF.6 seals), so the seal-diff is scoped a0c25db1..<seal>.
#
# Owner-directed amendment (ruling
# 2026-06-24-design-must-carry-user-operable-launch-workflow): rehearsal-2 built a
# Tkinter GUI whose only way in was `python the_gui.py` in a terminal. AC.DF.6 had
# made the design's OUTPUT visible (a wizard, not a CLI), but the LAUNCH path was
# still the exact technical task the non-technical user cannot do. Visible output
# is necessary but NOT sufficient: the whole path to STARTING and USING the tool
# must be operable by the target user, or the design has leaked a developer task
# back to them. This is AC.DF.6 one layer deeper, and the loam prime directive
# made concrete: the user owns WHAT, loam owns HOW, but the HOW must terminate in
# something the user can actually INITIATE and operate.
#
# The amendment encodes "every candidate carries the literal end-to-end user
# workflow + a launch mechanism the target user can operate" — for a non-tech user
# (the default) the launcher is a web app opened by URL/link, a double-click
# packaged app, or email/file delivery; a terminal/script/dev-env launch is
# DISQUALIFIED even when the output is a GUI. Enforced two ways (mirroring
# AC.DF.6): the per-candidate prompt asks for a launch_mechanism + a literal
# user_workflow and demands an operable launcher (the generation layer), AND a
# held-out structural classifier (is_launch_user_operable) drops a
# terminal/script/dev-env launch even if the prompt slips (the guarantee). The
# chosen candidate's launch mechanism + workflow flow into the buildable-design
# generation via as_direction_brief(), so the build is DIRECTED to target the
# committed form-factor. AC surface AC.DF.7. Plan §5.
#
# Build-stage scope: the DESIGN-side guarantee + the build-target directive close
# AC.DF.7. Making the build STAGE actually produce + verify a served,
# browser-openable web app (vs honoring the directive in the generated design) is
# a substantial build-stage change SURFACED AS A SCOPED FOLLOW-UP (SAL-DF-4 / §9),
# NOT built this cycle.
