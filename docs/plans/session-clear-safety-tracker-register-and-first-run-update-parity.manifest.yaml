narrative:
  target: framework/objective-tracker/seals/SEAL_COMMIT.session-clear-safety-tracker-register-and-first-run-update-parity
  body: |
    # session-`/clear` safety: tracker as the open-loop register + first-run↔update parity registry MINOR

    TBD-AT-SEAL (per sub-amendment). Sealed local; awaiting dispatcher
    dogfood publish per ASK-FIRST.

    A workspace `/clear`/compaction no longer loses meaningful end-user
    state and no hand-maintained RESUME-STATE file is required. The
    objective-tracker became the seeded AND existing-workspace-backfilled,
    priority-ordered home for open owner-facing decisions + the sequenced
    dev queue (R1), gained an additive owner-pending lifecycle distinction
    so 'shipped, owner ruling pending' is representable and never read as
    done (R2), and every state-mutating first-run/setup step now registers
    an idempotent update-path the workspace-update process discovers +
    replays against EXISTING workspaces (G — the structural close of the
    fresh-clone-only seeding hole that starved the sealed tracker-context
    channel). Root cause was GIVEN + verified from canonical source; the
    sealed recency-only session-start digest outcome contract was
    re-extended via ODD §4 to add a priority-altitude outcome
    (locked-design-not-license — 'it's the sealed contract' was not a
    reason to keep the bad post-`/clear` outcome); the
    memory-session-continuity §10-risk-3 advisory framing was rejected
    structurally, not inherited. AC.SCS-R1.{1,2,3,4,S} +
    AC.SCS-R2.{1,2,3,S} + AC.SCS-G.{1,2,3,4,S} green against real test
    output; AC.SCS-R1.4 is the outcome-altitude proof (existing,
    never-seeded workspace backfilled via the production entry-point with
    no pre-arranged state — the defect's exact inverse). SHA register +
    method-decision record in the plan-doc §14.
