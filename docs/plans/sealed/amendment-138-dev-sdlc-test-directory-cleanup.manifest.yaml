    seal_test: plugins/dev-sdlc/tests/test_no_sealed_amendments.py
    sidecar: plugins/dev-sdlc/tests/SEAL_COMMIT
    frozen_baseline: false
    extra_allowed_prefixes: []

    # Observable outcomes (the ACs are the contract — per ODD §2.5):
    #
    #   - AC.DSTC.PMR.1 — `framework/memory-system/` no longer appears
    #     in dev-mode-manifest.yaml's `roots:` block; every remaining
