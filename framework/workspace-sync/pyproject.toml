[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-workspace-sync"
version = "1.2.0"
description = "loam workspace-sync — canonical-to-workspace git-shaped sync with three-class workspace-data envelope and LLM-mediated semantic-merge gate. Companion to self-upgrade."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "opentelemetry-api>=1.22",
    "opentelemetry-sdk>=1.22",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
# Hyphenated short-form (per pos-v2 convention: `pos-X = pkg.cli:main`).
# Operator types `pos-sync --canonical <path>`; `pos-workspace-sync` is
# the unambiguous alias the plan §11 D-1 LOCKED ruling describes.
pos-sync = "loam.workspace_sync.cli:main"
pos-workspace-sync = "loam.workspace_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loam*"]

[tool.setuptools.package-data]
"loam.workspace_sync" = ["templates/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
