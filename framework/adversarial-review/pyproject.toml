[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-review"
version = "0.1.0"
description = "loam's standing adversarial-review capability (ready-but-inactive; manual-run + seeded-flaw calibration)"
requires-python = ">=3.9"
# Stdlib-only at the core. PyYAML is an OPTIONAL nicety for the corpus
# index (a stdlib fallback reader ships when it is absent).
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
test = ["pytest>=7.0"]

[project.scripts]
adversarial-review = "adversarial_review.manual:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
