schema_version: 1
amendment:
  number: 141
  slug: amendment-141-seal-tool-section-14-backfill-decouple
  title: "loam-amend seal: decouple §14 SHA backfill from post-seal dry-run gate — runs unconditionally when seal commit lands + plan-doc supplied"

# BASELINE: amendment #140 publish-state commit `b46162f` (current
# main HEAD post-#140 publish — `docs: bump current-release to
# v0.12.17 (amendment #140 seal-tool hygiene pair) + F-DISPATCH-
# BRIEF-FULL-SHA-VERIFICATION capture`). The seal-diff window is
# BASELINE..seal_commit per the single-component fence convention.
# Plan-doc §1 carries the durable owner-ratification record
# (TG 11808/11837/11854) and the full pre-flight Tier-0 evidence.
#
# Commit ladder (expected):
#   <plan-doc + manifest commit (this manifest)>
#   <source-edits + tests commit — decouple `_finalize` steps (g)
#    and (h) in `plugins/dev-sdlc/tools/loam-amend/src/loam_amend/
#    commands/seal.py`: post-seal dry-run no longer early-returns
#    BEFORE step (h); §14 backfill runs unconditionally on plan-doc
#    presence; dry-run diagnostic still emits at failure point;
#    final return value still reflects dry-run exit code. Plus 4
#    new AC test files: AC.SCT.{1,2,3,S}>
#   <loam amend apply auto-commit>
#   <loam amend seal deterministic seal commit — dogfoods the
#    decouple: post-seal dry-run is EXPECTED to pass cleanly for
#    this amendment's own clean working tree, so the seal-time
#    backfill fires via the same code path it would have pre-fix.
#    The decouple's distinct behaviour is verified by AC.SCT.S
#    synthetic-fixture smoke (intentional orphan file → dry-run
#    fails → backfill STILL fires). T1.4 archives this plan-doc +
#    manifest to docs/plans/sealed/. §14 auto-backfill via #136's
#    widened regex (canonical heading shape).>
#
# Single-component fence on `plugins/dev-sdlc/tools/loam-amend/`
# (which lives inside the `dev-sdlc` sealed component). The
# amendment closes the FIDRAFT entry
# F-SEAL-TOOL-§14-BACKFILL-COUPLED-TO-DRY-RUN.
#
# Defends amendment #136's no-manual-fallback promise
# unconditionally — #136 widened the §14 heading regex so the
# auto-backfill works for canonical headings; this amendment makes
# that promise hold EVEN WHEN the post-seal dry-run halts for
# unrelated reasons. Empirical trigger: amendment #138's manual
# §14 backfill commit `7d893b0`, authored because the orphan-file
# dry-run failure blocked the auto-backfill at #138's original
# seal.
#
# AC families per docs/plans/amendment-141-...md §4:
#   AC.SCT.{1,2,3,S} — Decouple: §14 backfill commit lands when
#     seal commit + plan-doc are present, REGARDLESS of post-seal
#     dry-run outcome. Dry-run diagnostic still emits + return
#     code still reflects dry-run exit code. Idempotent across
#     re-runs. Outcome-altitude smoke: synthetic dry-run-fails-
#     but-backfill-still-fires fixture.
baseline: "b46162f45b5a710f4a0acf5ac5f132fc93882bfc"

plan: docs/plans/amendment-141-seal-tool-section-14-backfill-decouple.md

seal_description: |
  loam-amend seal: decouple §14 SHA backfill from post-seal dry-run
  gate. Pre-fix (b46162f canonical), `_finalize` step (g) at
  seal.py:947-969 early-returns on `loam amend apply --dry-run`
  non-zero exit, blocking step (h) (the §14 SHA-backfill at
  seal.py:971-1086) from firing. Empirically: amendment #138's
  orphan-file dry-run failure forced operator to author a manual
  §14 backfill commit (7d893b0), defeating amendment #136's
  no-manual-fallback promise.

  Post-fix: the §14 backfill runs unconditionally when a
  `--plan-doc` was supplied AND a seal commit landed, regardless
  of dry-run outcome. The dry-run check still runs, still emits
  its existing `post-seal-dry-run-failed` diagnostic at the
  failure point, and the seal command's return code still equals
  the dry-run's non-zero exit code. Operator-visible signals
  preserved; only the §14 backfill reachability changes.

  Shape (a) "always-run backfill" chosen over shape (b)
  "auto-retry-after-fixup" per plan-doc §14 D-SCT.SHAPE: (a) is
  mechanically simpler (no deferred-backfill state); preserves
  all operator-visible signals (dry-run diagnostic + non-zero
  exit code); §14 register documents the seal commit (the SHA
  the backfill captures), not HEAD — corrective fixups land as
  separate commits tracked elsewhere (§16 of plan-docs, as #138
  did). Shape (b) would require runtime state (a sidecar marker)
  for no clear win.

  Defends amendment #136's `## §14<sep>` widened-regex no-manual-
  fallback promise unconditionally. Closes the FIDRAFT entry
  F-SEAL-TOOL-§14-BACKFILL-COUPLED-TO-DRY-RUN on seal.

  Revises the locked design at AC.D-sa.7 / D-4 authoring time
  (seal.py:946-969 docstring "On non-zero, leave the seal commit
  in place per D-4 ruling") per `feedback_locked_design_not_-
  license_for_bad_outcomes`: the no-amend CDC ("leave the seal
  commit in place") is preserved — the §14 backfill remains a
  SEPARATE follow-up commit; only the early-return-before-step-h
  side-effect of "leave in place" is revised. Operator still
  authors corrective fixups manually (no auto-retry); the seal
  step is one-shot per invocation; idempotence on re-run is
  preserved.

  Composes with amendment #134 (T1.4 archive mechanism preserved
  unchanged); amendment #136 (widened §14 regex — this amendment
  defends its promise unconditionally); amendment #138 (the
  empirical trigger; manual `7d893b0` backfill commit IS the
  workaround this amendment retires per `feedback_workaround_-
  masks_rootcause_urgency`); amendment #140 (most recent seal-
  tool touch — same `_finalize` function but disjoint scope: #140
  touched steps (b)/(c)/(d) reordering + path resolution; this
  amendment touches steps (g)/(h) coupling only).

components:
  - name: dev-sdlc
    seal_test: plugins/dev-sdlc/tests/test_no_sealed_amendments.py
    sidecar: plugins/dev-sdlc/tests/SEAL_COMMIT
    frozen_baseline: false
    extra_allowed_prefixes: []

    # Observable outcomes (the ACs are the contract):
    #
    #   - AC.SCT.1 — Post-seal dry-run non-zero exit does NOT block
    #     the §14 backfill commit. When `--plan-doc` is supplied AND
    #     a seal commit lands AND dry-run fails, the backfill commit
    #     STILL lands as a separate follow-on commit (HEAD).
    #   - AC.SCT.2 — Dry-run failure STILL emits its existing
    #     `post-seal-dry-run-failed` diagnostic AND the seal
    #     command's return code STILL equals the dry-run's non-zero
    #     exit code. The decouple changes step-(h) reachability,
    #     not step-(g) signal emission.
    #   - AC.SCT.3 — Idempotence preserved under decoupled ordering:
    #     re-invoking the seal step (or running the backfill helper
    #     directly) against a plan-doc that already carries the
    #     `### Commit SHAs` subsection produces NO additional commit
    #     (no double-emit, no duplicate subsection).
    #   - AC.SCT.S — Outcome-altitude smoke: synthetic seal cycle
    #     with plan-doc + manifest + INTENTIONAL orphan file (so the
    #     post-seal dry-run fails) → seal commit lands, dry-run
    #     diagnostic emits non-zero, §14 backfill commit lands as a
    #     separate follow-on commit; post-seal HEAD's plan-doc
    #     carries the `### Commit SHAs` subsection naming both the
    #     amendment commit and the seal commit SHAs.

    # Method-level choices (builder's call per ODD §1.1) — see
    # plan-doc §14 method-decision register for the rationale:
    #
    #   - D-SCT.SHAPE — shape (a) always-run-backfill (NOT shape
    #     (b) auto-retry-after-fixup). Simpler; preserves
    #     operator-visible signals; §14 register documents seal
    #     SHA, not HEAD.
    #   - D-SCT.ERROR-SURFACE — dry-run failure still emits the
    #     `post-seal-dry-run-failed` diagnostic at the failure
    #     point; seal command return code equals dry-run exit code.
    #   - D-SCT.AC-LADDER — single AC family (AC.SCT.*) plus one
    #     outcome-altitude smoke (AC.SCT.S) — single-mechanism
    #     single-axis per Lens 5 EVAL_DIMENSIONS.
    #   - D-SCT.IDEMPOTENCE — pre-existing `git diff --cached
    #     --quiet` no-op path preserved (seal.py:1015-1024);
    #     AC.SCT.3 codifies invariance under the new ordering.
    #   - D-SCT.ORDERING — `_finalize` post-decouple: (g') dry-run
    #     runs + diagnostic emits (no early return) → (h') §14
    #     backfill runs unconditionally on plan-doc presence →
    #     (i') FIDRAFT cleanup surface (unchanged) → final `return
    #     dry_rc`. Final return preserved as dry-run exit code.

    # Out of scope (per plan-doc §3):
    #
    #   - The root cause of #138's dry-run failure (narrative.target
    #     bug in plan-author SKILL template; separate FIDRAFT
    #     `F-PLAN-AUTHOR-SKILL-MANIFEST-TARGET-DEFAULT-GAP` —
    #     different component).
    #   - Auto-retry of dry-run after corrective fixups (shape (b);
    #     rejected per D-SCT.SHAPE).
    #   - Any change to apply.py / dry_run.py / manifest.py.
    #   - The no-amend CDC (preserved — §14 backfill remains a
    #     separate follow-up commit; no `git commit --amend`
    #     introduced anywhere).
    #   - 4 pre-existing loam-amend test failures rooted in
    #     `session-clear-safety-tracker-…manifest.yaml`'s oversized
    #     smoke_outcome field (tracked as `ws-loam-amend-oversized-
    #     manifest-field-cleanup`; per #140 §16 #6).
    #   - Any cross-component touch.

    # Predecessor (load-bearing): amendment #140 publish-state
    # commit b46162f (current main HEAD). Composes with #134 (T1.4
    # archive mechanism preserved unchanged), #136 (widened §14
    # regex; this amendment defends its no-manual-fallback promise
    # unconditionally), #138 (empirical trigger — manual `7d893b0`
    # backfill commit), #140 (most recent seal-tool touch — same
    # `_finalize` function, disjoint scope).

universal_paths:
  prefixes:
    - docs/plans/
  files: []

