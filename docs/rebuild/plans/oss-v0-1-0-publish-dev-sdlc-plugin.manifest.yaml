amendment:
  number: 87
  slug: oss-v0-1-0-publish-dev-sdlc-plugin
  title: "M6a — Dev/SDLC plugin baseline (Surface A: user-facing capabilities; first plugin; pattern-establishing) — author NEW component at plugins/dev-sdlc/ that ships under workspace-bootstrap's existing contribution-protocol (entry-point group loam.bootstrap.contributions; manifest opt-in via bootstrap.yaml's contributions list — zero bootstrap-side source change). Plugin defaults new projects to ODD-shaped 5-stage workflow (research → spec → plan → build → review/verify) with structural gate enforcement (objective + AC presence required before stage advance); provides --methodology=tdd|bdd|adhoc opt-out preserving an internal ODD mirror at <project>/.dev-sdlc-odd-mirror.yaml; surfaces five operator verbs (loam project new|status|advance|list|gate) registered as subcommands of the unified loam CLI via NEW entry-point group loam.cli.subcommands (symmetric to bootstrap's pattern; minimal-mechanism choice over host-registry form per plan §10 D-build.M6.5); ships /start-project Claude skill at plugins/dev-sdlc/skills/start-project.md (D-Q.M6.4 ship recommendation; conditional on owner ruling) leveraging Idea 26's reader-fall-through composition for plugin-relative skill discovery. Stage-bound scope-of-work + objective-tracker integration: plugin creates project parent scope + stage child scopes; per-stage objectives in tracker forest. Per-project state in workspace-local SQLite at <workspace>/.loam/dev-sdlc.sqlite (single source of truth); <project>/.dev-sdlc.yaml is a derived human-readable mirror. AC.OSS.6 (programme-level — first plugin proves workspace-bootstrap's extension protocol works end-to-end without bootstrap-side amendment). 9 (or 10 with M6.9) new test files. Sealed-component fence: 3 components — plugins/dev-sdlc/ (NEW component carrying the plugin source + tests + first SEAL_COMMIT) + framework/tools/loam/ (subcommand-discovery extension) + framework/tools/pos-publish-framework-only/ (M2 partition manifest extends audit_roots + dev_and_public to admit plugins/dev-sdlc/). Master plan §5 M6 row + §6 sequencing rule #4 — M6a is critical-path successor to M5 (sealed e32d4d8); parallel-safe with M7 docs lane; serial with other amendment builds. Predicted 90-180 min midpoint 135 wall-clock for the M6a build slice (next dispatch); this dispatch is the research + plan-doc + extraction-expansion slice (predicted 50-85 min total: 20-40 min original + 30-45 min owner-directive Surface B expansion 2026-04-29). Deferred to v0.1.1 per master plan §5 M6 row + plan §1 + §5: objective-extraction skill for existing repos (Idea 3 sub-feature; the slice/swarm/aggregate engine is multi-week; bundling doubles M6 scope and pushes publish gate). M6a does NOT carry the dev-machinery extraction (Surface B AC.OSS-M6.10..M6.16); that ships as M6b sub-amendment per plan §6.5.4 ship-shape ruling D-Q.M6.6 — sub-amendment series mirror M1.rename precedent; M6a baseline-plugin sealed independently before M6b extraction migrations begin."

