    #   - AC.DSTC.SKILLS.3 — All 6 v0.1.8-Cycle-5 SKILLs parse as
    #     valid YAML at the canonical discovery path
    #     (test_AC_SKILLS_DSDLC1_7 family).
    #   - AC.DSTC.SKILLS.4 — All 15 dev-sdlc SKILLs parse as valid
    #     YAML at the canonical discovery path (test_AC_SKILLS_DSDLC2_7
