        pre-this-build).
      - be76e41 — v0.1.2 item 6 sub-plan-doc (NEW commit; pre-baseline).
      - a30a583 — v0.1.2 item 6 source-edit commit (BASELINE for this
        amendment).

    BASELINE a30a583 (the v0.1.2 item 6 source-edit commit). Single-
