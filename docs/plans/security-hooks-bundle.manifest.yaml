    - AC.SECHK.1 — secret-pattern hook fires on Bash + Edit/Write/
      MultiEdit; blocks the 14-pattern ECC floor; emits structured
      permissionDecisionReason; workspace-additions loader extends
      the floor (additive only).
    - AC.SECHK.2 — dangerous-flag hook blocks git push|commit
      --no-verify + git push --force on protected branches
      (default {main, master, pos-v2, production} + workspace-
      additions).
    - AC.SECHK.3 — config-write hook blocks Edit/Write/MultiEdit
      against .eslintrc{,.json,.js,.yaml,.cjs}, biome.json,
      .pre-commit-config.yaml, .git/config, root .gitignore.
    - AC.SECHK.4 — all three hooks fail-open on internal exception
      (non-JSON stdin, missing tool_input, malformed envelope).
    - AC.SECHK.5 — toggle-off env vars disable hooks at declared
      granularity (LOAM_SAFETY_HOOKS=off all; per-hook env vars
      individually); toggled-off no-op logged for audit.
    - AC.SECHK.6 — three new hook entries land in settings.json at
      first-run scaffold + on re-merge idempotently; user-authored
      stanzas preserved via backup.
    - AC.SECHK.7 — existing AC.BAG.2-7 tests continue to pass
      (bash_guard B5 + DEV-MODE B1/B3/B4 preserved; AC.BAG.1 test
      file rewritten as post-migration regression).
    - AC.SECHK.S1/S2/S3 — outcome-altitude tests invoke production
      hook dispatch path via subprocess with no pre-arranged state.
    - AC.SECHK.B2-MIGRATION-1 — behavior parity (secret-FILE
      detection moved to safety-layer fires on the same inputs +
      preserves the carve-outs).
    - AC.SECHK.B2-MIGRATION-2 — no double-fire (bash_guard.evaluate()
      returns allow/no-op on the migrated inputs).
    - AC.SECHK.B2-MIGRATION-3 — bash_guard B1/B3/B4/B5 surfaces
      preserved (regression coverage).

  Method-level choices (ratified at plan-author time per §0 + §14):

    - D-SECHK.OVERLAP — OPTION B (partial absorb) — owner override
      via Telegram 12311; B2 logic moves to safety-layer,
      bash_guard B2 surface removed.
    - D-SECHK.FAIL-OPEN — FAIL-OPEN + structured NDJSON log
