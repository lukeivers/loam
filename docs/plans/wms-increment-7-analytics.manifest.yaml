  slug: wms-increment-7-analytics
  title: "WMS Increment 7 — ANALYTICS (the LAST WMS increment): a SMALL, CONSERVATIVELY-SCOPED set of genuinely-actionable insights derived read-only over the work-item event log + projection, surfaced ON-DEMAND in plain language, transparent like the prioritization reasons. Builds NO new store, field, event kind, query, lifecycle, or per-turn block. ONE new keep-pace module on the SEALED primary-persona (analytics.py — three derivations + an on-demand render_analytics_block), composing the inc-2 event log + projection read-only (Lens-1). The conservative THREE insights — each one CHANGES what the user does next (the Lens-2 test): (1) WHERE work is piling up / stalling (open items grouped by project/stream, ranked by count + collective staleness off the projection's belongs_to_project/tagged_streams/last_transition_at); (2) CHRONICALLY blocked/waiting items (blocked status or external-party waits_on past a staleness threshold, off the projection + edge graph); (3) COMPLETION-vs-INTAKE balance over a recent window (ObjectiveCreated vs terminal StatusTransitioned counts derived over runtime.store.all_events() — the event-log history, NOT a snapshot). The VANITY metrics are explicitly CUT (D-ANL.2): raw throughput-as-a-number, velocity/burndown, cycle-time-as-a-headline, per-item bottleneck-edge counts, any chart/time-series — number-theatre for a single person tracking their own work. Cycle-time survives ONLY as a supporting phrase inside insight 1 (how long the pile has sat), never a headline. ON-DEMAND only (D-ANL.3): mirrors inc-5's render_plate_block/render_goals_block — NO TriggerKind.turn contributor, zero new always-on per-turn surface (the FBM-don't-bloat mandate). Closes the 7-increment WMS roadmap."

# BASELINE: build/wms-increment-6 tip @ build time (the plan-doc commit's parent on THAT
