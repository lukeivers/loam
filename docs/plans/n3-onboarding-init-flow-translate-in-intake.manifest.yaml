narrative:
  target: docs/plans/sealed/n3-onboarding-init-flow-translate-in-intake.md
  body: |
    # N3 — onboarding / init flow (the translate-in intake) — apply ladder

    2026-05-31. Roadmap N3 (critical path N1 -> N3 -> N4 -> Phase 3) per
    `docs/plans/n3-onboarding-init-flow-translate-in-intake.md`. Builds the
    prime directive's front door: the first run of the operating loop on a
    brand-new user. Per-user-tuned translation STARTS here, with the user
    loam knows least about — which is exactly why the loop's VERIFICATION
    discipline is load-bearing at this moment above all others.

    The central stance: for a brand-new user, infer little and verify
    almost everything. A small set of high-leverage intake prompts -> an
    inferred PROPOSED end-intent -> SURFACED for confirmation -> seeded only
    AFTER the user confirms or corrects. Inference is a hypothesis, never a
    silent write. The over-reach guard bounds the ambition: seed the MINIMUM
    useful prior, not an elaborate model (the elaborate version is what N4
    grows from evidence).

    The load-bearing F2 (plan §10.1): an "onboarding" component ALREADY
    EXISTS (onboarding.py) but it is a six-question CAPABILITY-ACTIVATION
    ritual (language/channel/safety-profile/extractor/watch/auto-skill-
    capture) — it does NOT infer the user's end-intent, propose-and-verify,
    or seed a per-user profile. N3 is NET-NEW intake + seed machinery that
    COMPOSES ON that ritual (runs after it, inside `loam init`); it does NOT
    extend the ritual's question list. Mistaking the two is the #1 scope
    risk; the plan names it in Surface #1, the placement table, the build
    steps, and halt trigger #4.

    Forks ruled BEFORE build (owner-facing product/UX calls, plan §11):
      D-1 = ask-vs-infer balance (recommend: verification-heavy / confirm-
            the-proposal — few asks, an inferred proposal, confirmed before
            seed).
      D-2 = the minimum seed (recommend: minimal four-item GLOBAL seed —
            confirmed end-intent as an OBJECTIVES.md objective + an openness-
            biased INTERACTION-MODEL.md at confidence:prior + channel/voice
            basics; nothing in the workspace model homes — leave them for N4).
      D-3 = the over-reach line (recommend: one-level-up, opt-in — a proposal
            goes at most one level up from the literal ask, the elaborate
            version always an opt-in offer, never auto-built; the D-2 seed-
            bound is the hard backstop).
      D-4 = the entry trigger (recommend: a `loam init` verb that orchestrates
            scaffold -> capability ritual (existing) -> translate-in intake
            (new) -> seed; auto-fire-on-first-run is a later layer, deferred).

    AC families: AC.ONINTAKE.* (the operating loop runs on a new user —
    bounded prompts, a PROPOSED end-intent, surfaced for verification BEFORE
    any commit, over-reach guarded), AC.ONSEED.* (verified result seeded into
    the two homes, gate-9 GREEN, interaction-model at confidence:prior,
    confirmed end-intent as an objective, minimum-seed bounded), AC.ONFIRE.*
    (fires through a real entry-point on first-run, idempotent/non-
    destructive on re-run) and the ★ cold-walk outcome-altitude AC.ONFIRE.3
    (a GENUINELY-EMPTY instance run through the REAL entry-point ends with
    correctly-homed seeded state, gate-9 GREEN, prior matrix, confirmed
    objective — NOT a stub of an inner function).

    Composes on (rebuilds none): the existing capability ritual
    (onboarding.py), establish_loam_layout() for the scaffold, the AIM
    INTERACTION-MODEL.md matrix schema, the live OBJECTIVES.md file-shape,
    and the N1 boundary allowlist (gate 9). Unblocks N4 (the user-model that
    ADAPTS the seeded state — gated on G5).
