amendment:
  slug: workspace-sync-settings-fragment-composer
  title: "loam-realignment RF-1 closure — workspace-sync settings-fragment auto-composer. EXTENDS the sealed `workspace-sync` component: on a successful `pos-sync`, DISCOVER every loam component's `settings.fragment.json` under the synced `<workspace>/framework/` tree (glob `framework/*/hooks/**/settings.fragment.json` — catches frame-kernel at `hooks/` depth AND keep_pace at `hooks/keep_pace/` depth) and COMPOSE their `hooks` blocks into `<workspace>/.claude/settings.json` — ADDITIVELY (only ADD loam-owned hook entries), IDEMPOTENTLY (a re-run never duplicates — detect-and-skip via a stable dedupe key = source-fragment identity + resolved command), and NON-DESTRUCTIVELY (NEVER modify/remove a user's/workspace's own hook entries or any non-`hooks` settings key; loam removes only a previously-composed loam-owned entry whose source fragment is gone). Each composed group is tagged loam-owned for a clean ownership boundary; `${LOAM_REPO}` resolves to the synced framework root. Runs AUTOMATICALLY on a successful sync (safe BECAUSE of the non-clobber guarantee) with a one-line surfaced summary of what was added/refreshed/removed; `--dry-run-compose` reports the plan and writes nothing; `--no-compose` opts out. A malformed/unparseable existing settings.json HALTS the compose step (never a destructive overwrite); writes are atomic (temp-file + os.replace). This turns the frame-kernel 1a/1b + keep-pace `settings.fragment.json` declarations from HAND-MERGED-on-a-gated-step into AUTO-WIRED-on-sync — closing the RF-1 gap named in frame-kernel 1a/1b §7-5 + keep-pace RF-6 (`workspace-sync does not auto-compose fragments today`); it is what makes scale-free governance real IN CODE, not just a portable artefact. AC.SFC.{1,2,3,4,5,6,7,S}: fragments discovered + composed at both glob depths (1); composed entries identifiable as loam-owned + traceable to source, user entries not (2); user hook entries + non-`hooks` keys survive byte-untouched (3); a second sync adds no duplicate — idempotent (4); a vanished fragment's loam entry is removed, user entries never (5); `${LOAM_REPO}` resolved, no literal placeholder survives (6); `--dry-run-compose` writes nothing + malformed settings.json HALTs-not-overwrites (7); a REAL fixture sync composes the REAL frame-kernel SubagentStart+SubagentStop fragments, user `Stop` hook + `statusLine` survive, second sync idempotent — outcome-altitude, asserted by READING the resulting settings.json (S). FEASIBILITY CONFIRMED with a named caveat (Tier-0): workspace-sync CAN compose settings.json (a post-merge Python write, not a git op; `workspace_root` + the `workspace_paths.claude_dir` D-Q.A4-lock helper give the path) — but this REACHES OUTSIDE the D-migration HC#6 git-only-in-`framework/` fence; the widening is NAMED (RF-1), not silent, with the safety envelope sized to the every-workspace blast radius and a standalone-`pos-compose-settings` alternative surfaced (EXTEND-workspace-sync recommended). EXTENDS the `workspace-sync` fence (`frozen_baseline: false`); the `workspace-bootstrap` `claude_dir` resolver + the frame-kernel/keep_pace fragments are IMPORTED/READ, never edited (no other sealed fence widens). Live activation against Luke's LIVE workspace, user-scope `~/.claude/` composition (keep_pace's target — RF-4), and non-`hooks` key composition are explicitly OUT OF SCOPE."

