# --- Decisions surfaced for owner ruling (D-Q.1 through D-Q.5) ---

PLAN_AUTHOR_DECISIONS:
  D-Q.1:
    question: "Detection mechanism — git diff --find-renames vs sha256-of-tree?"
    recommendation: "(a) git diff --diff-filter=ADMRT --find-renames=99% with apply-step-bookkeeping whitelist for A/D pairs."
    rationale: "Mature primitive; fits existing pos-amend shellout pattern. 99% threshold catches rename-with-trivial-edit cases the way we want them caught (see D.1's hands-off-lifecycle R099 entries)."
    confidence: "medium-high"
    alternatives:
      - "(b) sha256-of-tree — content-equivalence; cleaner but more code + more edge cases."
      - "(c) Hybrid (a+b) — fall back to (b) if (a)'s heuristic disagrees with operator expectation."
  D-Q.2:
    question: "Retroactive cleanup invocation shape — bundled into apply, new subcommand, or manual hand-edit?"
    recommendation: "(a) Bundled into apply via manifest-driven cleanup directives."
    rationale: "Mechanises the cleanup; one verb; one chore commit; audit trail in version control."
    confidence: "medium"
    alternatives:
      - "(b) New `pos-amend cleanup-d1` subcommand — more code, more CLI surface, less general."
      - "(c) Manual hand-edit + separate chore commit — simplest but loses mechanisation."
      - "(d) Generic cleanup directive — over-engineering for a one-shot."
  D-Q.3:
    question: "D.1.5 sealed-component fence shape — seal pos-amend, or admit via universal-paths prefix?"
    recommendation: "(b) Admit pos-amend via universal-paths prefix `framework/tools/pos-amend/` (per amendment #22 precedent)."
    rationale: "Keeps D.1.5 minimal; sealing pos-amend is in-scope creep; defer to a future amendment."
    confidence: "high"
    alternatives:
      - "(a) Seal pos-amend — cleaner long-term, larger D.1.5 surface, defer."
  D-Q.4:
    question: "Multi-component cleanup-edit fence — D.1.5 (single-component) edits 8-10 sealed components' tests/. How to fence?"
    recommendation: "(a) Treat as in-scope by doctrine — pos-amend's apply has fence-crossing privilege by design (it's THE canonical writer of SEAL_COMMITs across every component's tree). Universal-paths admissions cover the cleanup target paths."
    rationale: "Pos-amend's apply has historically been the SEAL_COMMIT/BASELINE writer across every component (amendment #22+). The cleanup is the same path mechanically with reverted values."
    confidence: "medium"
    load_bearing: true
    alternatives:
      - "(b) Multi-component sealed amendment — ergonomically worse, fence-discipline cleaner."
      - "(c) Split D.1.5 into D.1.5a (pos-amend logic) + D.1.5b (cleanup) — two cycles for one logical change."
  D-Q.5:
    question: "Build the optional `rename_only:` manifest override (AC.D.1.5.6)?"
    recommendation: "(b) Skip — heuristic-only. Add the override only if a build-time fixture surfaces a heuristic edge case."
    rationale: "ODD §4 — don't build unrequested machinery. Heuristic surface is robust on D-migration's known manifests."
    confidence: "high"
    alternatives:
      - "(a) Build the override — insurance against edge cases; ~20 LOC + 1 schema field + 1 test."

