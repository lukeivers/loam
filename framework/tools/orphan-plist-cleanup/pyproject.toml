[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-orphan-plist-cleanup"
version = "0.10.0"
description = "Detect and remediate pre-amendment-#6 orphan pos-v2 launchd plists (post-M1g namespace pivot per M1e §11 finding #4)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orphan-plist-cleanup = "loam.orphan_plist_cleanup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
