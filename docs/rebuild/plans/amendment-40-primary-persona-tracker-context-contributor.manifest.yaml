narrative:
  target: primary-persona/seals/SEAL_COMMIT.tracker-context-contributor
  body: |
    # Amendment #40 — primary-persona tracker-context contributor
    #                  (in-flight objectives in additionalContext)

    2026-04-25. Third of four Heavy-B sealed-component amendments
    delivering VALUE_PROPOSITION-as-prime-objective migration, per
    sub-plan `docs/rebuild/plans/amendment-40-primary-persona-tracker-
    context-contributor.md` + master research artefact `docs/rebuild/
    plans/research/value-prop-as-root-heavy-b-migration-research.md`.
    Predecessor amendments #38 (objective-tracker schema widening —
    `lifted_from` + `query_projection_view`) sealed at 92bead1 and
    #39 (workspace-bootstrap tracker-seed — first-run seeds the
    value-prop-rooted tree) sealed at 13770df; amendment #40 consumes
    both surfaces unchanged.

    The amendment lands one new responsibility on the existing
    contributor registry inside the `primary-persona` fence:

      - `primary-persona/src/tracker_context.py` (new) — owns the
        narrow `TrackerClient` Protocol (mirrors amendment #33's
        `MemoryClient` Protocol shape; declares only the read-side
        methods the contributor consumes — `query_projection_view`,
        `trace_to_root`, `close`); the path-resolver
        `tracker_db_path_for(workspace_root)` returning
        `<workspace_root>/objective_tracker.sqlite` (convention
        parity with workspace-bootstrap's `TRACKER_DB_FILENAME`);
        the `IN_FLIGHT_STATUSES` frozenset (`{proposed, active}` —
        the tracker's pre-terminal lifecycle states); the
        `TrackerContextConfig` dataclass; pure-function rendering
        helpers (`_is_in_flight`, `_filter_to_root_descendants`,
        `_format_projection_line`, `_render_projection_block`); the
        contributor factory `build_tracker_context_contributor`; and
        the convenience registration helper
        `register_tracker_context` mirroring
        `register_memory_retrieval`'s shape.

      - `primary-persona/src/observability.py` — extended with
        `tracker_context_composed_event` (fires on every successful
        contribution, naming in-flight count + truncated count) and
        `tracker_context_unavailable_event` (fires on graceful-
        degradation paths, naming failure_class + detail).

    Behaviour:

      - On `SessionStart`, the contributor invokes
        `query_projection_view()` against the workspace's tracker DB
        (path resolved from `workspace_root` via
        `tracker_db_path_for`), filters records to in-flight
        descendants of the workspace's value-prop root by walking
        `trace_to_root` per candidate and matching the terminal id
        against `value-prop-root` (amendment #39's stable ID), and
        renders a structured textual block with an identity-anchor-
        style first line ("[primary-persona/tracker-context]"), the
        root's goal text, the in-flight count, and one bullet per
        in-flight objective carrying the objective_id, status, goal,
        and parentage chain.
      - The trigger kind is `TriggerKind.session` (D-build.1) — the
        objective-tree state changes at human cadence; per-turn
        freshness is unnecessary for v1; cold-start cost is bounded.
      - Compaction-resilience: the bracketed identity-anchor first
        line is structurally detectable; the bullet shape carries
        parentage chain so the persona retains lineage even after
        compaction collapses interior context.
      - Filters to the workspace's value-prop-rooted tree only —
        records under any other root co-existing in the same DB do
        NOT appear (AC40.2). Cross-workspace bleed is structurally
        impossible because two workspaces resolve to two distinct DB
        paths via `tracker_db_path_for` (AC40.6).
      - Empty contribution when no in-flight objectives exist
        (AC40.5) — the registry's `additionalContext` is not
        polluted by an empty tracker-context block. Achieved /
        abandoned (terminal) records are filtered out structurally.
      - Cap-guard honoured at scale (AC40.4) — the contributor
        applies a soft sub-cap (default 2000 chars) ahead of the
        composer's structural 10 000-char `_cap_guard`; truncation
        surfaces a marker line naming the elided count
        (`[N more in-flight objectives truncated]`).
      - Graceful-degradation on tracker unavailability (AC40.3) —
        any tracker-side error (open failure, schema mismatch,
        permission error, I/O error) yields a structured
        `pos.persona.tracker_context.unavailable` diagnostic
        (failure_class + detail) and an empty contribution; the
        registry's other contributors continue to fire normally;
        `tracker.close()` is called even on query failure for
        resource hygiene.
      - Read-only access (plan §6 constraint 8) — the contributor
        never writes to the tracker, never binds scopes, never
        mutates state. The `TrackerClient` Protocol declares only
        read-side methods.
      - Framework-not-content (AC40.7) — `primary-persona/src/`
        carries zero literal value-prop or spec-doc prose; the
        rendering composes from runtime projection fields.

    Re-extension under existing objectives per ODD §4 — owner
    ruling D-2 corrected: anchored to v1.0 architectural-layer
    "Objective-based" (`docs/rebuild/spec/pos-v2-objectives-spec.md`
    line 161-162: "three behaviours (required above threshold,
    hierarchical with parentage, referenced consistently). … alignment
    is re-checked at every scope boundary and the check is logged"),
    VALUE_PROPOSITION's "process structure" capability
    (`docs/rebuild/VALUE_PROPOSITION.md` line 101), and the existing
    primary-persona session-start context-load pattern from
    amendments #32 (session-start-context-load gate, sealed at
    `bea9f47`) and #33 (memory-consumer wiring, sealed at `a6d6f6c`).
    NO v1.3 spec addendum authored.

    No source edits to `objective-tracker/`, `workspace-bootstrap/`,
    `hands-off-lifecycle/`, `scope-of-work/`, `memory-system/`, or
    any other sealed component. Amendment #38's public runtime API
    (`LiftedFrom`, `ObjectiveFilter`, `query_projection_view`,
    `ObjectiveTracker.trace_to_root`) is consumed via lazy
    `from objective_tracker import ObjectiveTracker` inside the
    default factory of `register_tracker_context` — keeps the cross-
    component import off the persona-layer's import-time surface;
    the lazy import resolves only when a workspace registers the
    contributor against the live tracker. In tests, a Protocol-
    compatible fake (`_helpers_d40.FakeTrackerClient`) supplies the
    same surface deterministically.

    AC surface (AC40.1 – AC40.7 + AC40.S) — 18 new tests covering
    seven outcome-shaped criteria + the seal-diff invariant:

      - AC40.1: tracker-context contributor produces non-empty
        `additionalContext` when in-flight objectives exist; in-flight
        goals appear in the block; achieved / abandoned (terminal)
        objectives do NOT appear; the contributor registers under
        `TriggerKind.session` (turn-firing does NOT invoke it).
      - AC40.2: secondary-rooted records co-existing in the same DB
        do NOT appear in the contributor's output; orphan records
        whose `trace_to_root` lands on an unknown terminal are
        excluded.
      - AC40.3: tracker open failure does NOT raise into the
        registry's invocation path; query failure does NOT raise;
        structured `pos.persona.tracker_context.unavailable`
        diagnostic emitted with failure_class + detail; sibling
        contributors continue to fire; `tracker.close()` called even
        when query raises.
      - AC40.4: 50 in-flight objectives × 500-char goals do NOT
        trigger `AdditionalContextCapExceededError`; sub-cap honoured
        within tolerance; `[N more in-flight objectives truncated]`
        marker surfaces dropped count.
      - AC40.5: tracker carrying only terminal records produces empty
        contribution; tracker with no records at all produces empty
        contribution.
      - AC40.6: `tracker_db_path_for(workspace_root)` is a pure
        workspace-identity function; two parallel workspaces resolve
        to two distinct DB paths; default factory targets the
        workspace-identity-derived path.
      - AC40.7: source under `primary-persona/src/` contains none of
        the unique-prose markers from VALUE_PROPOSITION.md or the
        spec's architectural-layer "Objective-based" clause; the
        `tracker_context.py` source structurally references the
        runtime API (`query_projection_view`, `trace_to_root`,
        `.goal`) and carries no concrete content constants.
      - AC40.S: seal-diff discipline — only `primary-persona/` +
        `docs/rebuild/plans/` + universal paths changed (verified
        by `primary-persona/tests/test_no_sealed_amendments.py` at
        BASELINE 61ad8f9 + per-component
        `test_no_sealed_amendments.py` sweep across every other
        sealed component).

    Method-level choices (builder's call per ODD §1.1; recorded
    in plan §11):

      - D-build.1 (trigger kind): `SessionStart` only. Master-
        research recommendation; objective-tree state changes at
        human cadence; per-turn freshness adds cost without value
        for v1; lighter cold-start budget. AC40.1 measures outcome.

      - D-build.2 (projection shape): goals + status + parentage
        (one bullet per in-flight objective showing `objective_id`,
        `[status]`, `goal`, and `(<- parent_goal -> root)` parentage
        hint). Slight extension over master-research (b); parentage
        costs ~30 chars/line and substantially improves compaction
        resilience because the persona retains lineage even after
        compaction collapses interior context. Identity-anchor-style
        bracketed marker on first line.

      - D-build.3 (truncation policy at scale): hard-truncation by
        depth-first walk order, capped at `objective_id_cap=20`
        bullets; remainder count surfaced as
        `[N more in-flight objectives truncated]` marker. Master-
        research recommendation. Deterministic; easy to test.

      - D-build.4 (diagnostic event names):
        `pos.persona.tracker_context.composed` (success) and
        `pos.persona.tracker_context.unavailable` (failure). Matches
        existing `pos.persona.<event>` naming convention.

      - D-build.5 (workspace-identity-to-tracker-path resolution):
        private constant `TRACKER_DB_FILENAME = "objective_tracker.
        sqlite"` mirroring workspace-bootstrap's convention parity.
        AC40.6 measures outcome (correct per-workspace path
        resolution); literal-equality is method-level. No cross-
        component import surface.

    Halt-and-surface ODD finding (vocabulary mapping):

      - The plan's AC40.1 names statuses `{started, decomposed}`;
        the actual `objective_tracker.spec.ObjectiveStatus` enum
        uses `{proposed, active, achieved, abandoned}`. "In flight"
        maps to `{proposed, active}` (pre-terminal). The plan's
        terminology is from a hypothetical authoring vocabulary; the
        build adopts the tracker's actual vocabulary as method per
        ODD §2.5 — the AC bounds outcome ("non-empty when in-flight
        objectives exist"), not the specific status-string set.
        Documented in `tracker_context.py:IN_FLIGHT_STATUSES` and in
        the AC40.5 test docstring. NOT a halt; surface to owner.

    Fail-closed behaviours:

      - Tracker open / query / per-record-trace failures funnel
        through the contributor's outer `try/except` envelope; the
        registry sees an empty string, NOT a propagated exception;
        the `[contributor X raised: ...]` sentinel from the
        composer's outer sandbox does NOT appear (the inner branch
        catches the error first; observability surface diagnoses it
        explicitly).
      - Per-record `trace_to_root` failure on a well-opened tracker
        is a record-level skip, NOT a session-level halt — the
        contributor proceeds with the rest of the projection.
      - `tracker.close()` is invoked in a `finally` block so a
        failed query path still releases the underlying SQLite
        handle.

    Out of scope (sub-plan §7):

      - Schema widening or query API on `ObjectiveTracker` —
        amendment #38 (sealed at 92bead1).
      - Workspace-bootstrap first-run tracker seed — amendment #39
        (sealed at 13770df).
      - pos-amend `objectives` manifest block + `project` /
        `audit-coverage` subcommands — pos-amend-tracker-integration
        (dev-discipline).
      - α/β/γ data migration of legacy plan docs into tracker
        records — heavy-b-phase-alpha-beta-gamma-migration plan
        (dev-discipline).
      - A turn-level "alignment check" contributor — future
        amendment under §4 re-extension.
      - Write-side tracker access from primary-persona — read-only
        this amendment.
      - A v1.3 spec addendum — explicitly forbidden by owner ruling
        D-2 corrected.

    BASELINE 61ad8f9 (pre-amendment tip — HEAD~1 of the amendment
    commit). primary-persona's SEAL_COMMIT sidecar advances to the
    amendment commit on the empty-diff window; advanced to the seal
    SHA via `pos-amend seal` on the seal commit.

    With this amendment, the user-visible Heavy-B win lands: the
    persona surfaces the workspace's objective tree at session-load
    time without the user asking. The translation burden of "what
    was I working on" is absorbed; the harness toolkit gains the
    tracker-context contributor as a queryable primitive future
    persona-surfaces compose against. Sibling pos-amend-tracker-
    integration (dev-discipline) and heavy-b-phase-alpha-beta-gamma-
    migration (dev-discipline) inherit a satisfied
    primary-persona-tracker-context precondition; pos-amend
    integration is now blocked by the seal-automation extension
    research+plan agent running in parallel (per dispatch brief
    Pipeline note).
