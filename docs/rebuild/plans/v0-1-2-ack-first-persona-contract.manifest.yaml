        primary-persona last touched here).
      - 18e708c — V11.E §8 backfill (canonical pos-v2 HEAD pre-
        v0.1.2-item-5).
      - 7041ac7 — v0.1.2 item 5 sub-plan-doc (NEW commit; pre-
        baseline).
      - d2754be — v0.1.2 item 5 source-edit commit (BASELINE for
        this amendment).

