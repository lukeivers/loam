= microkernel + objective + result, parent conversation ABSENT (2); judge spawn is isolated — no bot-token, no API key (3); off-frame surfaces a flag, on-frame silent (4); fail-soft non-blocking — never aborts a return (5); portable SubagentStop fragment block (6); REAL off-frame subagent finish -> flagged, outcome-altitude (S). Feasibility CONFIRMED (Tier-0): a SubagentStop hook reads the finished subagent's result via the `transcript_path` common-input field (official hook-development SKILL + changelog); residual live-version risk carried as the AC.SSFC.S build-time probe + a §8 halt trigger. Hard-block on off-frame, the intent-derivation half of the objective check (needs OBJECTIVES.md / keep-pace KP5), the rubric-leakage open question, live-activation merge, and workspace-sync fragment auto-composition are explicitly OUT OF SCOPE. EXTENDS the `frame-kernel` fence (frozen_baseline: false); does NOT widen any other sealed fence (the spawn-isolation surface is IMPORTED, never edited)."

