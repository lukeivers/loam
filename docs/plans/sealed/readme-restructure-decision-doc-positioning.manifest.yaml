# bootstrap/tests/ are inside the component anchor; no extra prefixes
# needed. Plan-doc + manifest at docs/plans/ admitted via universal
# prefix. Smoke writeup at workspace/.scratch/claude-output/ is
# gitignored + outside the fence (informational artefact only,
# referenced by the AC.README.3 test runner). extra_allowed_prefixes
