    # conventional-install / PyPI publish — `pip install loam-harness` → working `loam` — apply ladder

    Parent SUB-ITEM 1b (the owner-gated public PyPI flip, F-PUBLISH) per
    `docs/plans/foundation-polish-cluster.md`; this amendment is its
    AUTONOMOUS portion. Builds on the sealed SUB-ITEM 1a packaging-readiness
    cycle (`docs/plans/sealed/foundation-polish-cluster-install.md`), which
    proved the meta-distribution + the AC.PYPKG.* / AC.INST.S family against a
    LOCAL wheelhouse with the dist-name `loam`.

    OWNER-DECIDED, LOCKED (Luke 2026-06-04): the PyPI distribution name is
    `loam-harness` (the name `loam` is taken on PyPI by an unrelated
    config-manager — verified); the INSTALLED COMMAND stays `loam` (the
    existing loam-cli console entry-point, independent of the dist name);
    version lockstep at 1.2.0; the final `twine upload` is OWNER-RUN with
    Luke's credential — the agent NEVER enters a token.

    This amendment (AUTONOMOUS, no public action):
      1. Renames the dependencies-only meta-distribution dist-name
         `loam` → `loam-harness` in framework/loam-init/meta/pyproject.toml,
         keeping the console command `loam` (AC.PKGPUB.1 / AC.PKGPUB.3).
      2. Re-locksteps the meta version `1.1.0` → `1.2.0` via the release
         process (NOT a drift-prone hand-edit); every closure dist builds
         from its pyproject (AC.PKGPUB.2).
      3. Reconciles the meta's dependency list to the EXAMINE-verified RUNTIME
         closure of the `loam` CLI graph — the on-disk 11-dep list is
         part-aspirational; the reachability walk from loam-cli +
         `loam.cli.subcommands` is authoritative; dev/test-only packages
         (programbench-revival*, loam-heavy-b-migrate, loam-acceptance-smoke,
         subloam-driver) are excluded (AC.PKGPUB.1 / D-PKG.2).
      4. Confirms the three-identifier separation — dist-name `loam-harness`,
         import-name `loam.*` (PEP 420 namespace), command-name `loam` — does
         NOT collide with the unrelated PyPI `loam` (AC.PKGPUB.3).
      5. Authors an OWNER-RUN publish runbook at docs/publish-to-pypi.md:
         `loam release` pre-flight gates → `python -m build` per dist →
         `twine check` (AC.PUBTOOL.1 / AC.PUBTOOL.2) — the agent STOPS at
         `twine check`; `twine upload` is documented for Luke (D-PKG.3).
      6. Flips the README + docs/install-from-source.md published-set headline
         to `pip install loam-harness`.
      7. ★ outcome-altitude AC.INSTPUB.S: a genuinely COLD environment
         (throwaway venv / fresh container, no source clone on PATH, no
         pre-arranged loam state) installs the built `loam-harness` artefact
         from the LOCAL artefact index, then `loam --version` reports 1.2.0 +
         `loam --help` lists the real subcommands — NO framework-tree clone or
         edit (feedback_test_outcome_altitude_required; this IS the
         HARD-smoke-per-minor gate for this meta-framework minor).

    Composes on (Lens 1, NO re-implementation, NO new CI, NO component
    runtime-behavior change): the existing meta-distribution; pip/pipx; the
    `loam.cli.subcommands` entry-point discovery; the existing `loam release`
    gate chain as publish pre-flight.

    OWNER-GATED, NOT in this amendment (halt at these — halt triggers 3):
    the PUBLIC `twine upload` + the `loam-harness` name-claim (F-PUBLISH);
