  title: "Hourly autonomous-restart trigger — an IN-SESSION once-per-hour self-wake (Claude-native CronCreate, session-scoped, restored on --resume) that re-engages the LIVE interactive session to safely continue approved-autonomous work when the agent drifts off mid-run: doubly-gated approval scope, real-usage cost ceiling, one-command CronDelete off-switch, owner-class halt, each-tick Telegram report. NO detached spawn / NO launchd in build scope (the launchd persistence layer is DEFERRED — §7.D — with Luke's check-live-session-first constraint). PART 2 of 2 (#79 CORE-loam primitive; reads PART 1's census). REVISED 2026-06-05 per owner decision: in-session-only for now."

# BASELINE: current branch tip @ build time. ONE NEW component (autonomous-restart), now MUCH SMALLER
# than the prior launchd version — the scheduler is the Claude-native session-scoped CronCreate tick
# (composed-on, NOT a component-generated plist); the component adds only the on-wake runbook
# (refresh census -> read approved-autonomous queue -> doubly-gated pick -> continue IN the live session
# -> report to Telegram) + the guardrails + the arming helper + the CronDelete off-switch.
#
# ★ OWNER DECISION (Luke, 2026-06-05) — IN-SESSION ONLY FOR NOW. The persistent launchd
# "re-launch the session with claude --resume" layer is DEFERRED (he's uncomfortable with it / it feels
# hollow + out of his control). Build NOW: an in-session hourly self-wake — while the interactive session
# is alive, a session-scoped CronCreate tick fires hourly and re-engages the LIVE session to check the
# approved-autonomous queue + continue work. Full live context, visible in Telegram, supervised, trivially
# killable. The launchd layer is DEMOTED-NOT-DELETED to plan §7.D, with Luke's load-bearing constraint
# recorded: IF ever built it MUST check for a live session FIRST and DEFER to it (act only when there is
# genuinely no live session) — so it never fights the in-session loop or double-runs. Out of scope today.
#
# ★ CAPABILITY-CONFIDENCE-GATE STILL APPLIES (to the lower-risk in-session shape) — this is a SELF-WAKING
# agent (a tick continues real work on a clock). Safety bounds are LOAD-BEARING, each with a REAL test:
# doubly-gated scope (persona-eligible AND explicit autonomous_ok, never self-authorized, owner-class
# HALTED-and-surfaced); cost bound against the REAL INTERACTIVE /api/oauth/usage window + the #82
# daily-ration cap + per-tick/per-day caps; a one-command documented off-switch (CronDelete + task id);
# conservative dedup with the in-session Stop-hook (never double-continue one item). The prior #1 risk —
# Telegram-bot-slot theft via a detached claude -p spawn — is ELIMINATED FROM BUILD SCOPE: there is no
# detached spawn (the tick re-engages the LIVE session, which already owns the bot slot). The AC.ISO.*
# isolation family + the spawn-isolation wiring are RETIRED here and recorded as a precondition of the
# DEFERRED §7.D layer (which would spawn headless and would need isolation).
#
# ★ LIVE-ARMING IS OWNER-GATED (explicit plan constraint, D7): the build PRODUCES + TEST-FIRES the
# mechanism, but does NOT arm the live recurring hourly tick. The arming helper (the documented CronCreate
# register one-liner) ships; the live tick is armed only on Luke's explicit "arm it" — after he sets the
# two owner calls D2 (the approval signal) + D3 (the cost numbers).
#
# Two genuinely-his OWNER calls gate the live-armed run (set BEFORE arming): D2 the approval signal
# (the autonomous_ok second gate + who sets it) and D3 the cost ceiling (the daily-ration % against the
# INTERACTIVE window + per-tick + max-items/day numbers).
#
# READ-DEPENDENCY on PART 1 (self-maintaining-work-loop, sealed-local on build/self-maintaining-work-loop):
# the tick refreshes + reads PART 1's census to know what's genuinely current/done before continuing.
# SEQUENCE AFTER PART 1; do NOT build concurrently in one tree. If PART 1's census is unreadable, the
# safety scaffold (scope-gate + cost-bound + off-switch + a no-op fire) ships TODAY with the census-read
# behind a fail-soft seam (plan §8 #3) — the safety bar does NOT depend on the census, only the
# continue-intelligence does. FEASIBILITY: this is LIGHTER than the launchd version and buildable to a
# verified test-fire TODAY (no plist generator, no detached-spawn runner, no isolation wiring).
#
# Adds AC.TICK.* / AC.RESUME.* / AC.SCOPE.* / AC.BOUND.* / AC.KILL.* / AC.AUTORESTART.LIVE.1
# (the outcome-altitude: a REAL test fire — the tick wakes the LIVE session, refreshes+reads the census,
# reads the approved queue, continues an approved-autonomous item IN-SESSION OR correctly no-ops/surfaces,
# reports to Telegram, HALTS on an owner-class item, and the CronDelete off-switch verifiably stops further
# ticks — no launchd, no detached spawn). RETIRED from the prior version: AC.ISO.* (no spawn to isolate).
