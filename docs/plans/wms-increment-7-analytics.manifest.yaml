# events_for / events_since — the typed historical event stream carrying every
# ObjectiveCreated.created_at + StatusTransitioned.from_status/to_status/created_at, the
# COMPLETE transition record throughput/cycle-time/intake-vs-completion derive over) +
# the projection read API (list / query_projection_view / get — belongs_to_project /
# tagged_streams / status incl. blocked / last_transition_at / edges_out/edges_in) +
# the inc-2/4/5 lenses + the inc-5 ON-DEMAND render_*_block precedent (plate.py /
# goals.py / waiting_on.py — production entry points, NOT TriggerKind.turn contributors)
# + the shared lens_render.py finalise_block cap/render + the inc-4 transparent-reason
# discipline (prioritize.py — plain-language reason, never a surfaced score) all live on
# this branch + its inc-2..inc-5 ancestors, NOT on main — building on main finds no work
# model to analyze (plan §8 halt #1).
# SINGLE-component amendment on the SEALED `primary-persona`: ONE new keep-pace module
# `analytics.py` —
#   (a) the THREE read-only DERIVATIONS: pile-up (group open items by project/stream off
#       the projection, rank by count + collective staleness via last_transition_at);
#       stuck (filter blocked status / external waits_on past a tunable staleness
#       threshold off the projection + edges); balance (walk runtime.store.all_events(),
#       count ObjectiveCreated vs terminal StatusTransitioned in a tunable window —
#       DERIVED OVER HISTORY, not a snapshot, AC.ANL.BALANCE.2). Thresholds are
#       calibrate-on-use method-defaults (D-ANL.6 — the F4 scope↔confidence line, NOT
#       owner constants). No store mutation; never raise (fail-soft to empty).
#   (b) the ON-DEMAND `render_analytics_block` — composes the three insights into ONE
#       concise block via the shared finalise_block cap, each a plain-language transparent
#       sentence (the inc-4 reason precedent), honest-empty per-insight when no signal,
#       zero internal vocabulary. MIRRORS render_plate_block/render_goals_block — NOT a
#       TriggerKind.turn contributor (D-ANL.3 / AC.ANL.SURFACE.1).
# The objective-tracker store + event log are CONSUMED read-only via the EXISTING API
# (all_events / list / query_projection_view / get) exactly as inc-2/4/5/6 consume it —
# NOT modified: NO store mutation, NO new field, NO new event kind, NO new query, NO
# materialized analytics table (computed live, mirroring WMS-D2). The inc-2..inc-6 lenses
