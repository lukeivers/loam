  body: |
    # Amendment #32 — primary-persona session-start context-load gate (D8)

    2026-04-24. Delivers FUTURE_IDEAS.md Idea 8's structural
    context-load gate as a primary-persona-layer primitive, per
    amendment plan `docs/rebuild/plans/amendment-32-session-start-
    context-load-gate.md` + research doc `docs/rebuild/plans/research/
    session-start-context-load-gate-research.md`.

    The amendment lands two primitives inside the primary-persona
    fence:

      - `ComposedContextPayload` — the shared additionalContext
        composer with two entry points (`on_session_start`,
        `on_user_prompt_submit`) and a contributor-registration
        surface. Per research §6.2 D7/D8 co-ownership contract. The
        10,000-char additionalContext cap is enforced structurally
        at Pydantic-model construction — invalid payloads cannot
        reach the hook script's stdout (amendment plan §3
        constraint 4).
      - `session_start_gate.compose_session_fields` — the session-
        level payload assembly: discovers the baseline corpus by
        parsing `CLAUDE.md`'s session-start-discipline section
        (research §9 flag #5 — dynamic-baseline discovery so the
        gate picks up baseline growth without a new amendment),
        enumerates in-flight `amendment-*.md` files, probes the
        memory sidecar + orchestrator, reads cost-headroom +
        first-run-completion sidecars, and computes the
        `corpus_gate_state` sentinel (`loaded` / `partial` /
        `missing`).

    Graceful refusal per owner ruling D-2: missing corpus emits a
    structured diagnostic block naming every absent path; the
    session proceeds. No `UserPromptSubmit` `decision: "block"`; no
    `continue: false`. The turn entry point inherits the sentinel
    and propagates it to turn-level contributors (D7's upcoming
    memory-retrieval contributor will bind against this surface
    without amending D8's scope).

    The amendment establishes the primary-persona sealed-component
    sidecar surface (first-time for this component): new
    `primary-persona/tests/test_no_sealed_amendments.py` with
    `BASELINE = "3844f2f..."`, `SEAL_COMMIT_PATH` + `_seal_commit()`
    helper, `allowed_prefixes` + `allowed_files` admissions; new
    `primary-persona/tests/SEAL_COMMIT` sidecar + `primary-persona/
    seals/` directory. Per plan §8 + D7's noted sidecar absence,
    sidecar establishment lives inside the primary-persona fence.

    AC surface (D8.1, D8.2, D8.3, D8.4, D8.5, D8.S):

      - D8.1: session-start additionalContext emission with
        corpus paths + present indicator, in-flight amendments,
        service state, cost headroom, sentinel, first-run marker;
        serialised length strictly < 10,000 chars on baseline.
      - D8.2: graceful refusal on missing corpus — sentinel
        transitions to `partial` / `missing`; diagnostic block
        names every missing path; session proceeds; turn observes
        sentinel and does not block.
      - D8.3: `on_user_prompt_submit` accepts prompt +
        resolved-component + memory-client; carries session-level
        sentinel; refuses at construction when session payload
        was never composed; contributor registration surface is
        D7-bindable; D8 itself registers no turn-level contributor.
      - D8.4: cold-start p95 ≤ 500 ms on warm cache over 10
        consecutive invocations; single-shot < 20 s supervisor
        budget even on forced probe timeout.
      - D8.5: two entry points exposed; 10 k-char cap refused
        structurally at Pydantic construction on both payloads;
        synthetic turn-level contributor round-trips end-to-end
        without any D7 amendment present.
      - D8.S: seal-diff discipline — primary-persona/ + plans/
        + universal paths only.

    Method-level choices (builder's call per ODD §1.1):

      - Corpus discovery: regex-extract backtick-wrapped `*.md`
        refs from CLAUDE.md's session-start-discipline section;
        fall back to a hard-coded baseline list when CLAUDE.md is
        absent or its section is unparseable. Dynamic parse wins
        research §9 flag #5.
      - Service probes: raw socket connect with 250 ms timeout to
        the recorded memory port (default 8765) + orchestrator
        UNIX socket. Research §7 measured 104 ms with services
        reachable / ~1.5 s worst case with forced timeout; the 250
        ms per-probe budget keeps aggregate probe cost inside the
        §7.2 envelope.
      - Cap enforcement: Pydantic `model_validator(mode="after")`
        raises `AdditionalContextCapExceededError`; Pydantic
        wraps in `ValidationError` (both `ValueError`-subclass).
        Test accepts either surface — the structural refusal is
        the AC, not the exact exception class.
      - Contributor registry: trigger-kind-filtered list; names
        must be unique within a composer instance.

    Out of scope (amendment plan §6):

      - Supervisor script (`orchestrator/scripts/pos_session_
        start.py`) not modified here. Composition with the
        existing supervisor stanza is out-of-scope.
      - D7's memory-retrieval turn-level contributor (D7's
        amendment).
      - `UserPromptSubmit` hard-block (forbidden by owner ruling
        D-2).
      - Per-component proposal-declaration schema changes (out-
        of-scope per plan §6).

    FUTURE_IDEAS.md Idea 8 is retired by this amendment; forwarding
    reference appended to the catalogue per the discipline rule.

    BASELINE 3844f2f (pre-amendment tip). primary-persona's
    SEAL_COMMIT sidecar lands at 3844f2f on the amendment commit
    for the empty-diff window; advanced to the amendment SHA in
    the seal commit via `pos-amend seal`.
