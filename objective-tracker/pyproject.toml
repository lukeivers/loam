[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "objective_tracker"
version = "0.1.0"
description = "Objective tracker primitive for pOS v2 — forest-of-trees with event-sourced persistence, sidecar scope binding, and ODD integration."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[tool.setuptools]
package-dir = {"objective_tracker" = "src"}
packages = ["objective_tracker"]
