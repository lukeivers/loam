# EXTEND the sealed `workspace-sync` component. This widens the existing
# `workspace-sync` fence to admit the settings-fragment auto-composer: the
# new module (`framework/workspace-sync/src/loam/workspace_sync/fragment_composer.py`),
# the wire-in to `cli.py` (`_execute_sync` post-merge composer call +
# `--dry-run-compose` / `--no-compose` flags), and the new AC.SFC.* tests.
# `frozen_baseline: false` advances the `workspace-sync` seal baseline (the
# intended fence-widening of an EXTEND). NO OTHER sealed component's fence
# widens: `workspace-bootstrap`'s `claude_dir` resolver is IMPORTED + called,
# NEVER edited (plan §8 halt-trigger #3 guards this); the sealed `frame-kernel`
# + keep_pace `settings.fragment.json` files are READ (discovered + parsed),
# never modified. Sidecar at `tests/SEAL_COMMIT` — the UNIVERSAL convention
# (the seal sweep globs `framework/*/tests/SEAL_COMMIT`; the seal-test reads
# `Path(__file__).parent/"SEAL_COMMIT"`).
components:
  - name: workspace-sync
    seal_test: framework/workspace-sync/tests/test_no_sealed_amendments.py
    sidecar: framework/workspace-sync/tests/SEAL_COMMIT
    frozen_baseline: false
    extra_allowed_prefixes:
      - framework/workspace-sync/

