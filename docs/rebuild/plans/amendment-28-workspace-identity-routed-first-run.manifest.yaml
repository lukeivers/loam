  body: |
    # Amendment #28 — workspace-identity-routed first-run
    #
    # 2026-04-23. Closes the pos3/ivers-corp-pos-v2 false-success
    # mode: one host with two pos-v2 workspaces, `~/.pos/first-run.state`
    # written by workspace A, workspace B's SessionStart hook
    # short-circuited to `_msg_completed()` because the state-file
    # sentinel had no workspace identity. B's .venv/, plists, and
    # self-retired settings.json were all missing; the hook claimed
    # "pos-v2 first-run completed" anyway. Re-extension of amendment
    # #6's AC6 per ODD §4 — AC6 exercised the scaffold layer on both
    # workspaces correctly but bypassed the dispatcher layer that
    # reads the global state file and decides whether to invoke the
    # scaffold at all.
    #
    # Structural remedy (Option C from research §5.3): first-run
    # state moves from `~/.pos/first-run.state` (host-global) to
    # `<workspace>/.pos/first-run.state` (workspace-local). Workspace
    # identity is enforced by path; no dispatcher-side "remember to
    # check workspace" advisory. Defence in depth: `FirstRunState`
    # gains a `workspace_root: str` field; the dispatcher refuses a
    # state whose recorded workspace does not match the current
    # `pos_v2_root` (handles the path-moved-by-admin edge case).
    #
    # Fail-closed behaviours:
    #  - Corrupt/unparseable state (AC13): `read_state` returns None,
    #    dispatcher falls through to fresh-spawn.
    #  - State written by another workspace and somehow visible
    #    (AC11): `workspace_root` mismatch → treat as absent →
    #    fresh-spawn.
    #  - Silent-death (AC14): diagnosis operates on the state file
    #    under the dispatched workspace's tree only. A's state at
    #    A's path is not touched when B dispatches.
    #
    # Log file (`first-run.log`) stays at `<pos_root>/first-run.log`
    # — host-global — unchanged. Only the state artefact moves.
    # The `pos_root` CLI arg on dispatcher and helper is preserved
    # for log writes; a new `--workspace-root`-equivalent is not
    # added because the helper already receives `--pos-v2-root`
    # and the dispatcher knows `pos_v2_root` at its entry.
    #
    # Legacy `~/.pos/first-run.state` is left in place. The new
    # logic reads workspace-local paths; the legacy file is
    # simply never consulted. No migration code ships — per plan
    # §6 flagged inference #2.
    #
    # Preserved failure-class closures (research §7):
    #  - Hook-timeout SIGKILL post-detach sentinel: state file
    #    still written, just per workspace.
    #  - Silent-death detection: `pid` + `updated_at` still
    #    present; `is_stale_live_state` unchanged.
    #  - Atomic writes: `.tmp` sibling + `os.replace` preserved.
    #
    # Five new tests in `tests/test_workspace_identity_routing.py`
    # (AC10 end-to-end multi-workspace dispatch, AC11 foreign-
    # workspace state treated as absent, AC12 self-workspace
    # recognition preserved, AC13 corrupt-state fresh-spawn, AC14
    # per-workspace silent-death diagnosis). Existing detachment
    # tests (`test_detachment.py`) migrated from `pos_root` state-
    # path to `workspace_root` state-path.
    #
    # BASELINE c7ddb51 (pre-amendment tip). hands-off-lifecycle's
    # H19 BASELINE stays frozen at 3780603 per amendment #23
    # (manifest declares `frozen_baseline: true`). SEAL_COMMIT
    # sidecar lands at c7ddb51 on the amendment commit for the
    # empty-diff window; advanced to the amendment SHA in the
    # seal commit via `pos-amend seal`.
    #
    # FUTURE_IDEAS Idea 9 updated with a paragraph noting that
    # state-file routing is now closed by this amendment; the
    # slug-collision hazard in launchd labels remains open for
    # its own future cycle.
