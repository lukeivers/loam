[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-amend"
version = "0.1.0"
description = "Amendment-dispatch tooling for pos-v2 (pos-amend CLI)."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
pos-amend = "pos_amend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
