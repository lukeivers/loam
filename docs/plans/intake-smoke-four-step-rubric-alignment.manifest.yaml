  body: |
    # Acceptance-smoke four-step-loop-ran rubric contract-alignment — apply ladder

    The 1.0 acceptance smoke's last gap was a JUDGE-vs-CONTRACT contradiction: the
    `four-step-loop-ran` rubric demanded leg 2 show committed CONCRETE STRUCTURE
    (a recurring workflow / template / designed enablement pattern) while
    `no-over-engineering` PASSED precisely BECAUSE loam proposed no structure — the
    two dimensions demanded OPPOSITE things on the same transcript (rerun12 A+B
    PARTIAL/PASS).

    The owner's ratified resolution (Luke 13401 + 13403): the close LANDS the
    literal ask as the ONE thing and BY DEFAULT ASKS about EXACTLY ONE rung up a
    leverage ladder (opt-in), suppressed only on a clear one-off signal. This cycle
    aligns the judge rubric to that contract:
      - REWARD: landed the literal ask + asked at most one opt-in rung up BY
        DEFAULT (suppressed only on a clear one-off signal) + all four legs
        visible and adapted (infer -> surface -> check -> learn).
      - PENALIZE (FAIL): jumped TWO+ rungs (a workflow/system for a single doc);
        ASSERTED/already-built structure instead of an opt-in ASK; or FAILED to
        offer the one-rung ask absent any suppressing signal.
      - It no longer demands committed concrete structure (the contradiction).

    This is a contract-ALIGNMENT — the old rubric demanded the OPPOSITE of the
    ratified design — auditable, NOT bar-lowering: the four-leg requirement
    (surfaced hypothesis + adapt) is preserved.

    Predecessor commits:
      - 625303cf — loam-acceptance-smoke variant-B hardening seal (BASELINE).

    BASELINE 625303cf. Single-component fence on
    `framework/tools/loam-acceptance-smoke/`. The workspace-bootstrap close +
    extractor activation (AC.ONRUNG.*/AC.INTENT.5/.6) is a SEPARATE sibling
    amendment (#179), sealed first.

    DO NOT push, DO NOT merge — owner-gated; the dispatcher handles merge-on-seal
    + the READY verdict surface after the smoke re-run.
