[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-cli"
version = "1.10.0"
description = "Unified loam top-level CLI; amend subcommand for amendment dispatch."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
loam = "loam_cli.cli:main"

# AC.V060.1 — `loam release` subcommand registration. Resolves
# through the unified loam CLI dispatcher's `loam.cli.subcommands`
# entry-point group (M6a-authored discovery loop). Sibling to the
# dev-sdlc plugin's `amend` adapter; lives in the `loam-cli` package
# itself because the release verb is canonical, not plugin-shipped
# (every loam codebase has the release process; not gated on dev-sdlc
# being installed).
[project.entry-points."loam.cli.subcommands"]
release = "loam_cli.release.cli:build_release_subcommand"
# AC.SOL-GATE.* (N2) — `loam audit` verb registration. The real entry-
# point that derives the STATE-OF-LOAM record from ground truth + surfaces
# any doc claim that diverges from it. Canonical (every loam codebase has
# the substrate-audit surface); sibling to `release`.
audit = "loam_cli.audit.cli:build_audit_subcommand"
# AC.FLOWDEF.* / AC.CURSOR.* / AC.PAUSE.* (P2.3) — `loam flow` verb
# registration. The operator-facing surface over the defined-workflow
# system: validate a flow definition + resolve the active position
# cursor (the pause-if-lost positive-resolution check). Canonical
# (every loam codebase has the defined-workflow process surface);
# sibling to `release` + `audit`.
flow = "loam_cli.flows.cli:build_flow_subcommand"

[tool.setuptools.packages.find]
where = ["src"]
