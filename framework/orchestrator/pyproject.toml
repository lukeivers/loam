[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-orchestrator"
version = "1.11.0"
description = "Session-resilient orchestrator for loam — asyncio process host, Unix-socket JSON-RPC, bind_scope dispatch layer, compaction-survival integration."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    "loam-scope-of-work",
    "loam-objective-tracker",
    "loam-primary-persona",
    # SUB-ITEM 3 (auto-upgrade trigger): the auto-detect session-start
    # contributor (scripts/auto_upgrade.py) COMPOSES the SEALED migration
    # engine + the reversibility envelope (a thin consumer; AC.UPGR.2). These
    # runtime deps make the engine/envelope import resolve in a real install
    # the same way it resolves in the editable dev tree.
    "loam-state-migration-engine",
    "loam-reversibility-primitive",
]

[tool.setuptools]
package-dir = {"loam.orchestrator" = "src/loam/orchestrator"}
packages = ["loam.orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
