[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-reversibility-primitive"
version = "1.0.0"
description = "Reversibility primitive for loam — compensation-path binding, rollback runtime, path-choice telemetry."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    "loam-scope-of-work",
    "loam-primary-persona",
    "loam-orchestrator",
    "loam-safety-layer",
]

[project.scripts]
loam-reversibility = "loam.reversibility_primitive.cli:main_reversibility"
loam-rollback = "loam.reversibility_primitive.cli:main_rollback"

[tool.setuptools]
package-dir = {"loam.reversibility_primitive" = "src/loam/reversibility_primitive"}
packages = ["loam.reversibility_primitive"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
