  body: |
    # context-management-see-budget-eviction-c3-eviction — apply ladder

    Context-management Cycle 3 — the eviction discipline. Third + last of
    three sequential context-management cycles per master plan
    `docs/plans/context-management-see-budget-eviction-master.md`.
    Predecessors: Cycle 1 (the sensor) + Cycle 2 (the >60% externalize-early
    trigger this discipline fires on).

    Plan: `docs/plans/context-management-see-budget-eviction-c3-eviction.md`.

    Scope (plan §3 / §5): single-component fence on `plugins/loam-skills/` —
    the new `context-hygiene` SKILL (subdirectory shape) + the fork-attribution
    empirical probe test. Universal admissions: `docs/plans/`.

    Single-cycle, single-seal ladder (plan §7). Minor's last cycle →
    HARD-smoke ride-along.

    AC families: AC.CTXEVICT.1 / .2 / .S (outcome-altitude) — full text in
    plan §4; outcome-shaped per ODD §2.5. AC.CTXEVICT.S is the verifier for
    the research §7 UNVERIFIED fork token-attribution claim; it is BLOCKING
    (the cycle does not ship with the probe red).

    Re-extension under existing objectives per ODD §4 — anchors to AC.PO.2
    (intra-session protection: keeping load-bearing state from silent
    compaction is the mirror of the memory-system's cross-session protection)
    + AC.PO.1 (the persona translates "this is getting noisy" into a
    fork/externalize action).

    Halt triggers (plan §6): WD drift; AC.CTXEVICT.S probe shows fork tokens
    leak into the parent reading (re-scope + surface); Cycles 1-2 not sealed;
    `context-hygiene` slug collision; AC reframes to method-in-AC.

