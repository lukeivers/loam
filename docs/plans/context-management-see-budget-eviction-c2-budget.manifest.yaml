seal_description: |
  Context-management Cycle 2 — the context budget.

  Turns Cycle 1's occupancy reading into a budget. Adds occupancy-vs-ceiling
  math with reserves — `remaining = window − reserve_out − reserve_work −
  occupied` — and a threshold classifier mapping a reading to exactly one
  band (<60% continue / 60–85% externalize-early / >85% recommend-compact /
  >92% hard-surface). Per research §5.2: occupancy-vs-ceiling, explicitly NOT
  the token-budget `/n` even-pacing formula (context is occupancy-vs-ceiling,
  not time-paced — copy the live-read + reserve-floor + threshold SHAPE, not
  the even-pacing proof).

  Feeds the MEASURED number into the existing `strategic-compact` SKILL
  decision rubric: branch-1's "infer heuristically / name as a guess" step
  becomes "read the measured occupancy from the context budget; fall back to
  the heuristic ONLY when the sensor reports unavailable." The honest-limit
  text (SKILL.md:143-144/171/254, "utilization isn't directly exposed as a
  number") is conditioned, not blanket-deleted — the unavailable-sensor
  fallback stays honest and AC.COMPACT.* does not regress.

  Manual `/compact` / `/clear` stays OWNER-CLASS (D-COMPACT.TRIGGER lock); the
  budget supplies the number, the rubric supplies the recommendation, the
  owner fires. No autonomous compaction.

  AC families (full text in plan §4):
    - AC.CTXBUD.1 — `remaining` arithmetic + occupancy-% match the
      independently-computed values.
    - AC.CTXBUD.2 — classifier maps a reading to exactly ONE band; boundary
      readings (60/85/92) resolve deterministically.
    - AC.CTXBUD.3 — the SKILL decision step consumes the measured occupancy
      when available, heuristic-fallback only when unavailable; the
      unconditional "not directly exposed" claim is gone / conditioned.
    - AC.CTXBUD.S — OUTCOME-ALTITUDE: a cold reading crossing 85%, fed through
      the production budget path with no pre-arranged state, yields the
      recommend-compact band off the MEASURED number. RED-on-mutation: revert
      the measured-read wiring → band derives from nothing / wrong.

  Out of scope (plan §3): auto-firing `/compact` (owner-class); the
  dispatch-time worker-budget gate (lean-mode, master §7 — plan only);
  microcompact wiring (CC built-in); PreCompact summary-steering (API-only,
  research §2.3).

  Method-level D-build.* decisions remain the builder's (plan §6 + §14).

  BASELINE walked at apply-time (Cycle 1 seal + §14 backfill predecessor).
  Two-component fence: `framework/context-management/` + `plugins/loam-skills/`.

