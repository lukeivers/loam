narrative:
  target: dev-sdlc
  body: |
    Cleanup of two stale-shape residuals in the dev-sdlc sealed
    component so the test directory under `plugins/dev-sdlc/tests/`
    returns to 0-failure baseline (under the production
    verification Python — 3.13 via `.venv/bin/python`).

    Fix 1 (D-DSTC.PMR-FIX) — `plugins/dev-sdlc/dev-mode-manifest.yaml`
    delete two lines referencing `framework/memory-system/`. That
    directory was deleted at v0.3.0 Cycle 2 (`b92aaea`, "graphiti
    rip-out"); the manifest residuals are post-removal stale
    references that the M6b.0 partition-realignment pass missed.
    `framework/primary-persona/` consumes memory via a callable
    provider (loose coupling per its docs/relationship-map.md), so
    relocation to primary-persona is NOT the correct fix —
    deletion is.

    Fix 2 (D-DSTC.SKILLS-FRONTMATTER) — both
    `plan-before-code-author/SKILL.md` and `plan-docs-author/SKILL.md`
    carry a long single-line `description:` value containing English
    colons that PyYAML's flow scanner interprets as inline key/value
    separators, raising
    `yaml.scanner.ScannerError: mapping values are not allowed here`
    on `yaml.safe_load(frontmatter)`. Each `description:` field is
    rewritten as a `>-` (folded, strip-trailing-newline) block
    scalar so internal colons stay part of the string value. Body
    of each SKILL.md is unchanged. 9 currently-failing tests across
    4 test files clear on the same fix.

    No edit under `plugins/dev-sdlc/src/`; the `loam.plugins.dev_sdlc`
    Python package is unchanged. Entry-point discovery, CLI subcommand
    registration, and the contribution surface are behaviour-preserved.

    Pre-flight Tier-0 evidence resolved a third dispatch-brief scope
    (OSS_M6 packaging "regression") as a Python-version artifact:
    `pyenv`'s `python`/`pytest` shims default to 3.9.17 while
    `plugins/dev-sdlc/pyproject.toml` requires `>=3.13`. Under the
    seal-tool's invocation path (`.venv/bin/python` → 3.13), the 6
    OSS_M6 collection errors disappear and all 6 OSS_M6 tests
    collect + run cleanly. No code change needed for OSS_M6 —
    D-DSTC.OSS-M6-RESOLUTION = "no action; production verification
    path already handles it".

    Outcome-altitude smoke (AC.DSTC.S):
    `python3.13 -m pytest plugins/dev-sdlc/tests/ -q` against
    post-amendment HEAD returns 0 failures + 0 errors. Pre-existing
    skips (7) are admissible and unrelated.

    This amendment is a PREREQUISITE for the unwritten seal-tool
    hygiene pair amendment (F-SEAL-PLUGINS-TESTS-SKIPPED +
    F-SEAL-DIRTY-TREE-CHECK-AFTER-PLAN-ARCHIVE in
    docs/FUTURE_IDEAS_DRAFT.md) — that amendment will exercise the
    full plugins/dev-sdlc test suite via the seal-step automation,
    which this cleanup makes green.

    Composes with: post-#136 seal-tool §14 backfill regex widening
    (canonical `## §14 — Method-decision register` heading auto-
    backfills with no manual fallback expected at this seal).
