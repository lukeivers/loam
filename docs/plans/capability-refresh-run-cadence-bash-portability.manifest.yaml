seal_description: |
  Capability-refresh run-cadence.sh bash-portability fix (AC.CRSP.1-3).

  The #193 GitHub Actions cadence binding runs
  framework/tools/capability-refresh/scripts/run-cadence.sh on
  ubuntu-latest, which has no zsh. The script's shebang (#!/bin/zsh) and its
  zsh-only line-16 SCRIPT_DIR="${0:A:h}" both fail there — the kernel cannot
  exec /bin/zsh (exit 127) and ${0:A:h} has no bash equivalent — so the
  scheduled refresh dies before doing any work.

  Fix (portability only; refresh logic untouched):
    1. shebang → #!/usr/bin/env bash (present on both Ubuntu and macOS;
       correct for the bash-3.2 feature set the script already uses).
    2. ${0:A:h} → $(cd "$(dirname "$0")" && pwd) — the standard portable
       script-dir idiom, matching the script's own adjacent line-17
       convention. Symlink-free real invocation yields the identical
       directory, so REPO_ROOT is unchanged and macOS behaviour preserved.

  set -euo pipefail semantics and the LOAM_REFRESH_NO_COMMIT=1 opt-in are
  preserved byte-for-byte.

  AC.CRSP.1 (★ outcome-altitude): the fixed script is executed through its
  own shebang under a PATH from which zsh is genuinely absent (asserted
  unresolvable as a precondition; real bash + dirname symlinked, python3 +
  git stubbed to capture and do no I/O), and reaches
  python3 -m capability_refresh --cadence-class all with cwd == repo root and
  PYTHONPATH including the component src. AC.CRSP.2: fails-on-old /
  passes-on-new portability regression on ${0:A:h}. AC.CRSP.3: set -e +
  LOAM_REFRESH_NO_COMMIT=1 behaviour unchanged.

  No public-action steps — the fix is a repo file change. Sealed locally on
  the worktree branch fix/capability-refresh-bash-portability; the owner
  holds the push (public repo). BASELINE a1166b8d; counter 194 confirmed at
  apply.

