[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-reversibility-primitive"
version = "0.1.0"
description = "Reversibility primitive for pOS v2 — compensation-path binding, rollback runtime, path-choice telemetry."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    "loam-scope-of-work",
    "loam-primary-persona",
    "loam-orchestrator",
    "loam-safety-layer",
]

[tool.setuptools]
package-dir = {"loam.reversibility_primitive" = "src/loam/reversibility_primitive"}
packages = ["loam.reversibility_primitive"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
