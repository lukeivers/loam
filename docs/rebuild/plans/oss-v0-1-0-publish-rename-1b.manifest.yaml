# Eleven sealed components per locked plan §1 fence statement. The
# eleven-component fence is wider than the series-master §2 ladder's
# "likely 3–5" estimate — the dispatch's authority text ("All code-
# side path constants and string literals referencing `~/.pos/`")
# binds the scope to all per-host path-constant callsites. Empirical
# surface inventory at plan time (§11 finding #1):
#
#   Env-var callsites (narrow): three sealed components — HOL,
#   memory-system, workspace-bootstrap.
#
#   Per-host ~/.pos/ path-constant callsites (wide): eleven sealed
#   components — cost-governance, graceful-degradation, hands-off-
#   lifecycle, memory-system, observability-aggregator, orchestrator,
#   primary-persona, self-correction, self-upgrade, telegram-
#   interface, workspace-bootstrap. Plus framework/tools/upgrade-
#   merge-resolver/ (1 docstring; admitted by framework/tools/
#   universal-paths prefix). Plus framework/first-run-inventory.yaml
#   (1 path-string; admitted by H19's existing top-level entry).
#
# hands-off-lifecycle is included because (a) HOL hosts the env-var
# scaffold (first-run-helper, first-run-progress, first-run-settings,
# first-run.sh, settings.json.fragment) AND (b) HOL has per-host
# path-constants in src/hooks. HOL is the conventional narrative
