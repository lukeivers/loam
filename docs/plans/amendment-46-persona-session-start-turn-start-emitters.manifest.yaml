narrative:
  target: hands-off-lifecycle/seals/SEAL_COMMIT.true-first-run
  body: |
    # Amendment #46 — primary-persona session-start + user-prompt-submit
    #                  emitters, contributor wiring, starter-pending
    #                  body completion

    2026-04-25. The runtime caller for the SessionStart context-load
    gate (#32) and the per-turn memory retrieval contributor (#33)
    finally exists. Per umbrella plan
    `docs/plans/memory-into-context-integration.md` §4a.

    Until this amendment, the substrate built across #32 (D8 composer),
    #33 (D7 memory consumer), #35 (onboarding contributor), #40
    (tracker context contributor), and #45 (`extra_inner_hooks`
    registry) was code without a runtime call site — every Claude Code
    session started without the persona's structured `additionalContext`
    reaching the session, and turn-time memory retrieval was unreachable.

    Surface added (primary-persona):

      - `primary-persona/src/session_start_emitter.py` (new) —
        construction + emit + CLI helpers. `build_session_composer(
        workspace_root, *, memory_client_factory=None,
        loaded_persona=None)` constructs a `ComposedContextPayload`,
        registers `tracker-context`, `starter-pending` (when a starter
        contract exists), and `memory-retrieval` (when a memory client
        is supplied). `emit_session_start_context(workspace_root)` runs
        `composer.on_session_start(...)` and returns
        `payload.additional_context_text`; fail-soft (returns "" on
        any exception). `emit_user_prompt_submit_context(workspace_root,
        prompt)` runs `on_session_start` then `on_user_prompt_submit`.
        `build_persona_session_start_inner_hook(pos_v2_root)` returns
        the inner-hook dict `{"type": "command", "command":
        "<venv>/bin/python -m primary_persona.cli session-start",
        "async": False, "timeout": 5}`. Same shape for
        `build_persona_user_prompt_submit_inner_hook`.
        `cli_session_start` and `cli_user_prompt_submit` are the CLI
        helpers — both return 0 unconditionally per AC46.4 (a non-zero
        exit would block Claude Code's hook fan-out).
      - `primary-persona/src/cli.py` (new) — argparse entry point with
        `session-start` and `user-prompt-submit` subcommands. Mirrors
        loam-mode's CLI shape (D-build.8). The UserPromptSubmit
        subcommand reads JSON from stdin (Claude Code's hook contract;
        confirmed via docs research, halt-trigger 3 cleared) and
        extracts the `prompt` field.
      - `primary-persona/src/onboarding.py` — `build_starter_pending_
        contributor` body widened per AC46.7. The contributor returns
        a string whose first line is `STARTER_PENDING_MARKER`
        (preserves AC35.3) and whose body now lists each
        `OnboardingQuestion`'s id, required-flag, and prompt, plus
        write-back instruction lines naming
        `persist_elicitation_transcript`, the contract path, and a
        one-line invocation pattern. Body fits within 2,000 chars
        (~800-char measured footprint with the current 4-question
        canonical tuple). Non-starter contracts still return "".
        AC35.3 + AC.A.4 unchanged.
      - `primary-persona/src/__init__.py` — re-exports the new emitter
        + CLI surface so `from primary_persona import
        emit_session_start_context, emit_user_prompt_submit_context,
        cli_session_start, cli_user_prompt_submit` works.

    Surface added (hands-off-lifecycle):

      - `hands-off-lifecycle/hooks/first_run_settings.py` —
        `merge_user_prompt_submit(*, settings_path, new_entry,
        now_iso=None)` mirrors `merge_session_start`'s shape but
        operates on `hooks.UserPromptSubmit`. Single-entry list (no
        multi-contributor generalisation; AC46.6 defers that).
        New helper `_is_pos_v2_owned_user_prompt_submit` recognises
        the persona's user-prompt-submit command markers.
        `_POS_V2_COMMAND_MARKERS` extended with
        `primary_persona.cli session-start` so re-merge over a
        persona-authored stanza does not back up as user-authored.
      - `hands-off-lifecycle/hooks/first_run_helper.py` —
        `_persona_inner_hooks(pos_v2_root)` lazy-imports
        `primary_persona.session_start_emitter.
        build_persona_session_start_inner_hook` (fail-soft;
        ImportError → []). `_extra_session_start_hooks(pos_v2_root)`
        aggregates `_persona_inner_hooks() + _loam_mode_inner_hooks()`
        for the SessionStart envelope ordering probe → persona →
        loam-mode (D5 of umbrella plan §6). Three call sites
        (Phase 3d, Phase 4c re-merge, Phase 6 self-retire) updated
        to pass the aggregated list to `extra_inner_hooks=`.
        New helper `_persona_user_prompt_submit_stanza(pos_v2_root)`
        returns the UserPromptSubmit envelope; the same three call
        sites invoke `merge_user_prompt_submit(...)` with that
        envelope. Lazy-imported with fail-soft — missing or broken
        primary-persona install degrades to no-UserPromptSubmit-hook
        (pre-amendment-#46 behaviour).

    Behaviour:

      - Every Claude Code session in a pos-v2 workspace receives the
        persona's structured payload as SessionStart additionalContext:
        corpus refs (with present indicator), in-flight amendments,
        service state, cost headroom, gate sentinel (loaded / partial /
        missing), first-run completion timestamp + generation marker,
        tracker context contributor's output (when in-flight objectives
        exist), and starter-pending block (when contract.is_starter is
        True). Total payload fits within the composer's 10,000-char
        structural cap.
      - Every user prompt receives the per-turn memory retrieval
        contributor's output as UserPromptSubmit additionalContext —
        when a memory client is wired (production-side: deferred to
        #47's `.mcp.json` writer; pre-#47 the contributor is not
        registered and the turn payload simply omits the retrieval
        block — graceful empty per AC46.2).
      - Backwards-compat: existing #32, #33, #35, #37, #40, #45 test
        suites stay green. `extra_inner_hooks=None` produces output
        byte-identical to pre-amendment-#46 (AC46.6).
      - Fail-soft chain: composer construction failure → empty payload
        + exit 0 (AC46.4); persona contract unloadable → starter-pending
        not registered, session proceeds (AC46.4); UserPromptSubmit
        memory client unwired → contributor not registered, turn
        proceeds with empty retrieval (AC46.2).

    Re-extension under existing objectives per ODD §4 — anchors to
    v1.0 line 153 ("every interactive session starts with the primary
    persona present by default — asserted by a session-start test")
    and the architectural "persistent + retrievable memory" objective
    (umbrella plan §2). No new spec v1.x clause; this is the load-
    bearing wiring of substrate already built.

    AC surface (AC46.1 – AC46.S) — outcome-shaped per umbrella plan §4a.
    Test files mirror the #41 one-file-per-AC convention; AC46.5 +
    AC46.6 split across primary-persona and hands-off-lifecycle.

    Method-level decisions (D-build.x) recorded in the builder plan §3.1.

    BASELINE 19108ea (pre-amendment tip — HEAD at dispatch).
    primary-persona's BASELINE advances per pos-amend apply.
    hands-off-lifecycle's H19 frozen BASELINE stays at 3780603 per
    amendment #23 (manifest declares `frozen_baseline: true`).
    SEAL_COMMIT sidecars land at the amendment commit on the empty-diff
    window; advanced to the seal SHA via `pos-amend seal`.

    Out of scope (umbrella plan §4c, named explicitly):

      - Persona content authoring (Q1 deferred — `personas/primary/
        contract.yaml` + `prompt.md` remain EXAMPLE template scaffolds).
      - `.mcp.json` writer (amendment #47).
      - Live memory MCP client wiring (deferred to #47).
      - Multi-contributor UserPromptSubmit registry generalisation
        (future amendment).
      - Auto-memory ↔ graphiti unification (separate scope).
      - Memory seeding (separate scope).

    With this amendment, the persona's session-level state (memory,
    tracker, corpus, service, cost, gate sentinel, in-flight amendments)
    + per-turn memory retrieval reach the session at SessionStart and
    UserPromptSubmit respectively. The "is the memory system working
    properly? are we storing things into it? is it getting loaded into
    context?" question (Luke, 2026-04-25) is structurally answered:
    yes, with #47 closing the turn-time MCP-tool surface.
