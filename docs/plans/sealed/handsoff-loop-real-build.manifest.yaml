schema_version: 3
amendment:
  slug: handsoff-loop-real-build
  title: "Real orchestrated hands-off loop — package loam's own build methodology (plan → decompose into scoped sub-tasks → dispatch real claude -p sub-agents → independent tool-executing judge against a frozen sub-agent-unseen acceptance → honest done/dead verdict) as a primary-persona-invocable capability, then run two honest phase end-tests. BUILDS ON the Tier-0 verified probe (decompose→dispatch→judge LIVES at unit scale) and DOES NOT re-prove it — re-running the core loop is a named scope violation (AC.FOUND.0). PHASE A (AC.A.1/.2/.3/.4): a packaged skill-shaped mechanism orchestrates the loop on a real non-toy task of probe-class-or-harder to a machine-checkable acceptance authored+hash-pinned+frozen BEFORE any sub-agent runs and seen by no sub-agent/judge, with an independent tool-executing verdict PLUS an anti-overfit held-out-input check carried THROUGH the packaging; the Phase-A end-test produces a definite per-dimension verdict table — (i) reached frozen done without human loop-driving, (ii) no silent regression across composed sub-tasks, (iii) honest-negative still fires when a sub-task can't be done, (iv) cost/wall-clock within the $2-8/<=20min band measured via --output-format json. PHASE B (AC.B.1/.2/.3/.4/.5): a genuinely under-specified plain-language intent (the under-specification documented) is turned by the intake leg into a machine-checkable AND faithful acceptance via bounded elicit-the-minimum + exactly one plain-English approval gate (no jargon/AC-IDs/spec-syntax surfaced), with an independent faithfulness check guarding checkable-but-wrong; the Phase-B end-test produces a definite per-dimension verdict table (i)-(iv). A definite NEGATIVE on AC.A.4 or AC.B.5 (packaged mechanism materially worse than hand-run / fuzzy intent cannot be made faithfully checkable reliably enough) SATISFIES the AC exactly as a positive does — it is a plan-success outcome reported straight, NEVER retried-to-green, NEVER softened (F2 / LOCKED-DESIGN-NOT-LICENSE; contract §10 flags Phase B as the risk most likely to retire negative — expected-possible, the plan working). TIER C (AC.C.1): end-to-end hands-off, GATED on BOTH phases positive — if either retired negative AC.C.1 is NOT attempted (gated, not failed). Lens-1: composes the verified-real /goal built-in (binary 2.1.143, present since v2.1.139) for the drive/stop leg under claude -p ONLY — loam's tool-executing independent check decides via its surfaced exit code; /goal's Haiku transcript-only evaluator keys off that surfaced verdict, never sub-agent prose; the build does NOT re-implement turn-after-turn drive and does NOT let /goal be the artefact judge. Single-component fence: framework/workspace-bootstrap/ (sidecar framework/workspace-bootstrap/tests/SEAL_COMMIT, seal_test framework/workspace-bootstrap/tests/test_no_sealed_amendments.py — VERIFIED present this turn; LIVE allowed_prefixes admit plugins/loam-skills/ + framework/hands-off-lifecycle/ + framework/hands-off-lifecycle/seals/ + framework/tools/ + docs/plans/ and allowed_files admit docs/STATE.md, all VERIFIED this turn). Anchor rationale: the loam-skills plugin's OWN seal-test is stale (predates the repo-wide docs/rebuild/->docs/ migration; would false-fail on docs/plans/); the objective requires the orchestrator be skill-shaped+persona-invocable (satisfied by the bundle under the workspace-bootstrap-admitted plugins/loam-skills/ prefix), NOT that loam-skills be the seal anchor — mirrors the subloam-driver-fix precedent that sealed cleanly against workspace-bootstrap on this exact branch tip. extra_allowed_prefixes EMPTY — no sealed-source edit outside the workspace-bootstrap anchor. NO Anthropic API key — sub-agents are real claude binary, default Sonnet (feedback_no_anthropic_api_key). LOCAL SEAL ONLY — NOT merged to main, NOT pushed, NOT published, NOT tagged; origin/main stays exactly at its current commit (the public step is a separate owner-asked action, NOT part of this cycle). No version bump (version derives at release-time). AC family scope-descriptive (AC.FOUND.0 + AC.A.* + AC.B.* + AC.C.1 + AC.HL.S); slug NOT version-packed; one test file per AC per the one-file-per-AC convention; method-in-AC test passed per-AC (each satisfiable by more than one implementation)."

