# d-migration.vars.yaml
#
# Vars-file companion to `d-migration.md`. Captures the locked
# decisions, per-amendment context, and dispatch-template-friendly
# variables for the D.1–D.5 migration sequence (strict directory-split
# workspace architecture).
#
# This file is consumable by future `pos-amend template render`
# invocations (per the dispatch-prompt-template-extension plan)
# OR readable directly by the per-amendment dispatchers.
#
# Decisions LOCKED at brief level (D-D1 through D-D5) and at plan-
# author level (D-Q.A1 through D-Q.A5) are captured in dedicated
# sections; per-amendment outcome bounds + AC IDs + seal-fence
# manifests are cross-referenced.

