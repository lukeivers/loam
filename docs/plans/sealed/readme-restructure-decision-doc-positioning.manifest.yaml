ape). extra_allowed_prefixes EMPTY — no sealed-source edit outside the workspace-bootstrap anchor (the README.md edit is the entire source-of-truth change). No version bump (version derives at release-time per feedback_version_numbers_at_release_time). Wall-clock cost band: xs (~15-25 min AI-time per the duration rubric × ~10-15 tool calls × 0.1-0.15 wall-clock/call). LOCAL SEAL ONLY — sealed-local-on-branch is the deliverable; publish is a separate owner-asked action."

