narrative:
  target: hands-off-lifecycle/seals/SEAL_COMMIT.true-first-run
  body: |
    # Amendment #49 — bootstrap-progress visualization in Claude Code's
    #                  terminal status line

    2026-04-26. Closes the silent-terminal UX gap during cold-cache
    first-run: until this amendment, a non-tech user opening Claude in
    a fresh pos-v2 clone saw a single `additionalContext` paragraph at
    SessionStart, then 30 s – 8 min of nothing while the detached
    worker ran. Per locked plan
    `docs/rebuild/plans/bootstrap-progress-statusline.md` §10 D1–D6
    (LOCKED by Luke 2026-04-26).

    Surface added (hands-off-lifecycle):

      - `hands-off-lifecycle/hooks/statusline.py` (new) — D4 stdlib-
        only renderer. Reads stdin JSON envelope, derives state-file
        path from `workspace.project_dir` (D3), dispatches by
        `state.status`, prints one plain-English line ≤ 200 chars,
        exits 0 on every path. Static `_PHASE_LABELS` map translates
        worker-phase strings to non-tech labels; static
        `_PHASE_DURATIONS_S` table (D6) drives the remaining-time
        estimate. Defence-in-depth `_state_belongs_to` mirror refuses
        foreign-workspace state. Fail-closed: any exception → empty
        stdout + exit 0 → blank status line.
      - `hands-off-lifecycle/hooks/first_run_settings.py` —
        `_POS_V2_STATUS_LINE_COMMAND_MARKERS` tuple +
        `_is_pos_v2_owned_status_line` predicate +
        `merge_status_line(*, settings_path, new_entry, now_iso=None)`
        operating on the top-level `statusLine` object (not under
        `hooks.*`), mirroring `merge_session_start` /
        `merge_user_prompt_submit` / `merge_stop` shape: backs up
        user-authored value to `<settings>.user-backup-<ts>.json`,
        atomic `.tmp` + rename, preserves all other top-level keys.
      - `hands-off-lifecycle/hooks/first_run_state.py` — additive
        `progress_pct: int = 0` field on `FirstRunState` (D1).
        Backwards-compat: pre-amendment state files without the
        field read as `progress_pct=0`.
      - `hands-off-lifecycle/hooks/first_run_helper.py` —
        `_status_line_stanza(pos_v2_root)` returns the canonical
        `{type, command, refreshInterval}` envelope.
        `_maybe_merge_status_line(*, pos_v2_root, settings_path)`
        fail-soft wrapper. `_PHASE_PCT` static dict;
        `_advance_state` extension to write `state.progress_pct`
        when the phase is recognised. Two call-site additions:
        Phase 3d settings.json authorship (~L1720) and Phase 6
        self-retire (~L1295), each immediately after the existing
        `_maybe_merge_stop` invocation.
      - `hands-off-lifecycle/hooks/settings.json.fragment` —
        `_comment` extended to mention the `statusLine` field; new
        top-level `statusLine` key documents the post-self-retire
        reference shape (sealed-fragment role unchanged: reference
        documentation, not a hand-merge recipe).

    Surface added (orchestrator — admitted via existing H19 bucket):

      - `orchestrator/scripts/pos_session_start.py` —
        `_maybe_install_status_line(pos_v2_root)` fail-soft retrofit
        helper invoked from `main()` after `print(result[
        "additional_context"])`. Lazy-imports `merge_status_line`
        from the hooks dir; builds the same envelope as the worker
        path; any failure swallowed. Implements the D5 retrofit
        contract so existing-workspace pre-amendment workspaces
        (e.g. pos3) gain the `statusLine` entry on their next
        supervisor session-start without re-running first-run.

    Behaviour:

      - During first-run (state-file `status` ∈ {`starting`,
        `running`}), the terminal status line continuously renders a
        plain-English progress line naming the current phase, time
        elapsed, and a remaining-time estimate. ≤ 200 chars; exit 0.
      - At completion (`status=completed`, `now − updated_at < 60`),
        a "ready"-shaped steady-state line renders. Beyond 60 s
        post-completion the renderer emits empty stdout → status
        line goes blank (D2).
      - On worker failure (`status=failed`), a glanceable summary
        renders; full remediation continues to reach the user via
        the existing SessionStart `additionalContext` channel.
      - Foreign-workspace state, absent state file, and stale-live
        (silent-death) states each map to their own outcome-shaped
        branch per AC.SL.4 / AC.SL.5.
      - Existing-workspace retrofit: a workspace already past first-
        run picks up the `statusLine` entry on its next session-
        start via the supervisor's fail-soft `merge_status_line`
        call (AC.SL.8).
      - Backwards-compat: pre-amendment state files without
        `progress_pct` read as 0; pre-amendment workspaces without
        the `statusLine` entry display nothing until the supervisor
        retrofit fires; pre-amendment behaviour for every other
        path preserved.

    Re-extension under existing objectives per ODD §4 — anchors to
    the v1.0 line 153 "every interactive session starts with the
    primary persona present by default" objective: a 30 s – 8 min
    silent terminal causes non-tech users to abort before the
    persona arrives, so visible bootstrap progress is a
    presupposition of the persona's own surface. Lens 2 directly:
    translates the user's natural-language need ("is this stuck?")
    into AI-effective ambient feedback. No new spec v1.x clause;
    this is the load-bearing wiring of substrate already built.

    AC surface (AC.SL.1 – AC.SL.S) — outcome-shaped per locked plan
    §4. Test files mirror the #46 / #48 one-file-per-AC convention.

    Method-level decisions D1–D6 LOCKED by Luke 2026-04-26 are
    recorded in the locked plan §10. Method-level decisions
    D-build.1 – D-build.9 remain on the builder side per the
    scope-only-dispatch CDC (locked plan §6).

    BASELINE 052b49b (pre-amendment tip — HEAD at dispatch).
    hands-off-lifecycle's H19 frozen BASELINE stays at 3780603 per
    amendment #23 (manifest declares `frozen_baseline: true`).
    SEAL_COMMIT sidecars land at the amendment commit on the empty-
    diff window; advanced to the seal SHA via `pos-amend seal`.

    Out of scope (locked plan §9, named explicitly):

      - Generalised worker-progress framework (status-line script
        is first-run-scoped only).
      - Telegram, Claude-app, or other status surfaces.
      - Dynamic phase-duration calibration (last-N-runs moving
        average).
      - Spinner / animation frames at sub-1 s granularity.
      - Plugin packaging.
      - Renaming or migrating the `<workspace>/.pos/` path.
      - Touching `workspace-bootstrap/` or any sealed component
        other than `hands-off-lifecycle/`.

    With this amendment, a non-tech user opening Claude in a fresh
    pos-v2 clone sees live ambient feedback at the bottom of the
    terminal during the entire first-run window — no log-tailing,
    no wait-and-hope, no guessing whether the system is stuck.
