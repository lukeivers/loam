OUTCOME FLOOR SIGNAL + a held-out anti-overfit binding (the upstream held-out test branches, absent from every prompt, the agent never sees the suite); a NOMINAL-BUT-HOLLOW result is a NON-PASS BY CONSTRUCTION (compile_failed ⇒ 0, empty/vacuous submission, or a friendly summary with ~0 real tests passing drives the floor non-pass — 'it looks done' is not the real outcome); the per-task floor-pass threshold (what graded n_resolved/n_tests counts as the real outcome delivered) is FROZEN with the task set before any run (D-RPB-2); the subset is SIZED so the AC.RPB.5 baseline-miss denominator is non-degenerate (≥ k_min) OR the verdict returns the explicit (c) indeterminate polarity that NAMES the small-denominator reason — a degenerate denominator must NEVER read as a determinate loss/win (the v2 task-#44 defect fix); the genuinely-subjective objective class is EXCLUDED BY CONSTRUCTION per owner ruling Telegram 11437 (REUSED v2 ruling). AC.RPB.3 — the scoring authority for BOTH arms is the INDEPENDENT held-out adversarial tool-grounded judge (the proven _independent_judge methodology spawned through the sealed spawn_isolated_claude surface, forced to enumerate what the real upstream programbench eval result for that task would/would-NOT guarantee about the real outcome) GROUNDED in the real upstream *.eval.json test-suite result + the per-task frozen floor threshold — and PROVABLY NOT the loop's own intake.py AC.B.4b judge (ABC outcome-validity; loam's tool-executing held-out adversarial judge KEPT because it is already a STRONGER shape for the I5/I6 failure mode than ABC's generic LLM-judge; RAND judge-reliability corroborates independent+held-out+adversarial as the right shape, not a reason to add a second method — no external method adopted wholesale; REUSED v2 AC.PBR.3). AC.RPB.4 — per (arm,task) pass/fail computed by a rule FROZEN before any run (content-hash-pinned with the task set): passed iff independent judge tags faithful AND the real upstream programbench eval per-task result clears the frozen per-task positive-real-outcome floor threshold (AC.RPB.2) AND the held-out anti-overfit binding holds (the agent provably never saw the upstream suite — the proven verify.py:213-215 both-must-pass spine, real-PB-bound); each (arm,task) run ONCE for the headline, NO retry-to-pass; bounded small-k re-run ONLY on margin tasks for consistency reporting, NEVER to flip a fail to a pass (ABC contamination-prevention = loam's freeze-before-any-sub-agent spine; REUSED v2 AC.PBR.4). AC.RPB.5 — a PRE-DECLARED decision rule FROZEN before any run maps the two arms' independently-judged pass profiles to EXACTLY THREE definite verdicts; the materially-beats margin shape is REUSED from v2's FROZEN-RATIFIED D-PBR-1 (owner Telegram 11447, the builder freezes EXACTLY this and does NOT move it after runs begin): (a) loam MATERIALLY BEATS baseline iff BOTH (i) among the tasks the BASELINE arm is independently judged a NON-PASS on, the LOAM arm is independently judged a PASS on a CLEAR MAJORITY of them, AND (ii) loam's TOTAL independently-judged pass count does NOT regress below baseline's total; (b) loam does NOT materially beat baseline (margin not cleared — a FIRST-CLASS plan-success outcome reported straight); (c) indeterminate; the 'clear majority of the baseline's non-passes' computation is GATED by a FROZEN small-k floor k_min ≥ 2 on the baseline-miss denominator (D-RPB-1) — if the baseline-miss count is < k_min the verdict is FORCED to (c) indeterminate with the machine-stated reason 'baseline-miss-denominator < k_min', a degenerate/near-degenerate denominator can NEVER resolve to (a) or (b) (the named v2 task-#44 defect fix); the verdict is COMPUTED from the numbers not asserted; 'every task independently judged a pass' is a DOCUMENTED ASPIRATIONAL/SECONDARY metric EXPLICITLY NOT the gate; the margin is a FAIR honest test by construction (recovering a clear majority of the baseline's OWN real-benchmark misses while forbidding any total-pass regression — not trivially clearable, not inflated so a real win reads as a loss), NOT moved after runs begin. AC.RPB.6 — every (arm,task) records MEASURED cost (from --output-format json total_cost_usd, NEVER estimated, D-COST-BAND), wall-clock recorded distinctly as agent-wall-clock AND real-upstream-eval-emulation-wall-clock (the eval leg is wall-clock-heavy — ~8–33 min/task under amd64 emulation per the live prior signal), the raw transcript, the real upstream *.eval.json artefact (test_results + score + error_code), and the independent judge verdict+reason; AND every (arm,task) judged a NON-PASS carries exactly one class from a SMALL FIXED TAXONOMY frozen with the task set — did-not-produce-output / produced-but-no-real-effect (the false-success class: compile_failed / empty / ~0 real tests passing while reporting done) / produced-but-wrong (a compiling submission that fails the frozen floor threshold) / honest-negative-refusal (first-class, never retried-to-green) — so the verdict is a PER-ARM FAILURE-SIGNATURE MAP not only a pass count (REUSED v2 four-class taxonomy, real-PB-bound); the headline number is reproducible from the preserved evidence (re-running the frozen scorer over the preserved *.eval.json + transcripts yields the same verdict; ABC reporting PARTIAL-adopt: cost/latency+reproducibility ADOPTED, full all-task statistical pass@k NOT adopted — architectural-verdict question per feedback_n1_architectural_vs_n3_statistical + cost discipline, small-k only at the margin; the four-class false-success taxonomy KEPT as the outcome, external per-model-signature taxonomies NOT adopted wholesale). AC.RPB.7 (LEAD; honest-negative VALID) — a report at docs/experiments/programbench-revival-real-pb.md carries both arms' definite per-task disposition tables over the REAL public ProgramBench subset (each task named by its real upstream instance-id + digest) + each arm's independently-judged honest-coverage + the PER-ARM FAILURE-SIGNATURE MAP (the false-success 'produced-but-no-real-effect' class explicit per arm) + the margin (clear majority of the baseline's independently-judged real-benchmark misses recovered by loam AND no total-pass regression, with the k_min small-k floor forcing indeterminate on a degenerate denominator) + the computed three-valued verdict + the all-tasks-pass ASPIRATIONAL/SECONDARY metric reported alongside but explicitly labelled NOT the gate + measured cost/latency per arm + an EXPLICIT statement that this is the REAL public ProgramBench measurement and is a DIFFERENT/HARDER artefact than the v2 6-task substitute (the v2 substitute result MUST NOT be cited as a real-PB result; the report names the v2 substitute by slug and states the relationship) + a plain-language answer a non-technical reader can act on to 'does loam materially beat a bare LLM at hands-off task execution for a non-technical user ON THE REAL PUBLIC PROGRAMBENCH, by how much, judged by something other than loam's own judge', OR a definite evidence-backed honest-negative/indeterminate naming WHY. A 'loam does NOT materially beat the baseline on the real public set — here is the evidence' finding SATISFIES AC.RPB.7 EXACTLY as a material-win finding does, is reported straight, and is NEVER retried to green, NEVER the margin weakened, NEVER widened into re-running until loam wins (F2 / LOCKED-DESIGN-NOT-LICENSE). REUSE-VS-REBUILD (D-RPB-7, plan §3.2/§6/§10.1): the existing pos3 programbench-derivative harness measured the CODE-GEN surface (run_agent.py drives raw-llm / loam-builder / loam-builder-odd / continuum-builder-v2 — all single claude -p code-gen agents; ZERO handsoff-loop / orchestrator / spawn_isolated_claude / independent_judge refs across the entire harness; the 100 May 11–13 runs were scored by the upstream programbench eval test-suite on agent-produced codebases, NOT by the sealed loop or the independent judge), so it is NOT reusable as the loam/baseline arm drivers; the builder REUSES its real-PB PLUMBING read-only (task