[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-cost-governance"
version = "0.12.0"
description = "Cost governance for loam — aggregate budget ceilings (money / tokens / time) with activation-gate wrap + sidecar ledger."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    "loam-scope-of-work",
    "loam-primary-persona",
    "loam-orchestrator",
    "loam-safety-layer",
    "loam-reversibility-primitive",
]

[project.scripts]
loam-cost = "loam.cost_governance.cli:main"

[tool.setuptools]
package-dir = {"loam.cost_governance" = "src/loam/cost_governance"}
packages = ["loam.cost_governance"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
