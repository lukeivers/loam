schema_version: 3
amendment:
  # slug-identified (schema v3); number NOT pre-allocated
  # (feedback_version_numbers_at_release_time). PATCH — a guard-floor
  # false-positive fix; version derives at release time.
  slug: seal-guard-floor-draft-baseline-skip
  title: "seal-guard-floor-draft-baseline-skip (PATCH) — the GUARD-SWEEP FLOOR's class-5 manifest-conformance sweep (AC.DPS1.13) wrongly couples every seal to every in-flight DRAFT plan's manifest validity: two sibling drafts (claude-leverage-program-s4b-wire baseline PENDING-S4A-SEAL; principle-foundation-structural-enforcement baseline PLAN_DOC_COMMIT) carry legitimate placeholder baselines that fail load_manifest's hex-SHA check, blocking unrelated seals. FIX (D-GFLOOR2.1): the sweep SKIPS any manifest whose baseline is not a resolvable commit-ish (non-hex placeholder OR hex-shaped-but-unresolvable draft marker); REAL resolvable-baseline manifests stay FULLY validated (a malformed applied/sealed manifest still blocks — that protection is the floor's point). locked-design-not-license on the floor sealed f7c1cc29. ★ outcome-altitude AC.GFLOOR2.3: the production seal entry-point against a real repo carrying a placeholder-baseline draft does NOT halt on it via the manifest-conformance sweep, AND a malformed real-baseline manifest still fails the sweep."

# BASELINE: the plan-doc commit (the commit immediately preceding this
# cycle's source-edit commits), per the house pattern
# (seal-guard-sweep-floor manifest comment). The builder CONFIRMS
# against the actual predecessor tip at apply time.
baseline: "PLAN_DOC_COMMIT"  # builder resolves to the actual SHA at apply

plan: docs/plans/seal-guard-floor-draft-baseline-skip.md
plan_doc_ref: docs/plans/sealed/seal-guard-floor-draft-baseline-skip.md

components:
  # ONE sealed fence: dev-sdlc. loam-amend is a tool under this plugin;
  # the manifest-conformance sweep test + (if used) a skip-predicate
  # helper in loam_amend src seal via this fence. Precedent: the GFLOOR
  # cycle itself (seal-guard-sweep-floor) sealed loam-amend src+tests
  # through this same dev-sdlc fence.
  - name: dev-sdlc
    new_component: false
    seal_test: plugins/dev-sdlc/tests/test_no_sealed_amendments.py
    sidecar: plugins/dev-sdlc/tests/SEAL_COMMIT
    frozen_baseline: false
    extra_allowed_prefixes: []

# Universal admissions (amendment #22 ruling #3): the plan pair only.
# The placeholder manifests are READ-ONLY inputs to the fix, never
# edited here.
universal_paths:
  prefixes:
    - docs/plans/

narrative:
  target: docs/plans/sealed/seal-guard-floor-draft-baseline-skip.md

# Three ACs (AC.GFLOOR2.1..3); AC.GFLOOR2.3 is outcome-altitude.
ac_count: 3
