[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-scope-of-work"
version = "1.4.0"
description = "Scope-of-work primitive for loam — event-sourced FSM with budget governance, observers, and escalation triggers."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[tool.setuptools]
package-dir = {"loam.scope_of_work" = "src/loam/scope_of_work"}
packages = ["loam.scope_of_work"]
