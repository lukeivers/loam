schema_version: 1
amendment:
  number: 26
  slug: teardown-observability-retrofit
  title: "teardown observability retrofit — surface bucket-(b) broad-catch sites"

# BASELINE: dd11677 — the current git tip (docs: table loam rename
# idea — decisions preserved, execution deferred). Empty-diff window
# at amendment-commit time per the established pattern. Follow-on
# chore(seals) commit advances the sidecar to the amendment SHA.
baseline: dd11677
plan: docs/plans/amendment-26-teardown-observability-retrofit.md

# Eight components affected. Seven sealed components gain module-top
# loggers plus emissions at their teardown broad-catches; hands-off-
# lifecycle gets sidecar + narrative only (H19's BASELINE frozen at
# project-start per amendment #23 — `frozen_baseline: true` instructs
# pos-amend to skip the BASELINE literal bump while still advancing
# the sidecar and appending the narrative).
#
# safety-layer gets one source edit (SafetyStore.close — site 5) but
# has no seal-diff test (its test_no_sealed_amendments.py is a monkey-
# patch import guard only, not a BASELINE-diff test). No manifest
# entry; the source edit is admitted into every other component's
# diff window via the `safety-layer/` prefix, which this amendment
# adds to six components' allowed_prefixes tuples (orchestrator
# already has it from amendment #19).
components:
  - name: cost-governance
    seal_test: cost-governance/tests/test_no_sealed_amendments.py
    sidecar: cost-governance/tests/SEAL_COMMIT
    extra_allowed_prefixes:
      - safety-layer/
  - name: self-correction
    seal_test: self-correction/tests/test_no_sealed_amendments.py
    sidecar: self-correction/tests/SEAL_COMMIT
    extra_allowed_prefixes:
      - safety-layer/
  - name: observability-aggregator
    seal_test: observability-aggregator/tests/test_no_sealed_amendments.py
    sidecar: observability-aggregator/tests/SEAL_COMMIT
    extra_allowed_prefixes:
      - safety-layer/
  - name: reversibility-primitive
    seal_test: reversibility-primitive/tests/test_no_sealed_amendments.py
    sidecar: reversibility-primitive/tests/SEAL_COMMIT
    extra_allowed_prefixes:
      - safety-layer/
  - name: telegram-interface
    seal_test: telegram-interface/tests/test_no_sealed_amendments.py
    sidecar: telegram-interface/tests/SEAL_COMMIT
    extra_allowed_prefixes:
      - safety-layer/
  - name: orchestrator
    seal_test: orchestrator/tests/test_no_sealed_amendments.py
    sidecar: orchestrator/tests/SEAL_COMMIT
    # safety-layer/ already admitted from amendment #19.
    extra_allowed_prefixes: []
  - name: workspace-bootstrap
    seal_test: workspace-bootstrap/tests/test_no_sealed_amendments.py
    sidecar: workspace-bootstrap/tests/SEAL_COMMIT
    extra_allowed_prefixes:
      - safety-layer/
  - name: hands-off-lifecycle
    seal_test: hands-off-lifecycle/tests/test_cross_cutting.py
    sidecar: hands-off-lifecycle/tests/SEAL_COMMIT
    frozen_baseline: true

# Universal admissions — per amendment #22's ruling #3 (docs/rebuild/
# plans/ prefix + CLAUDE.md + docs/odd-*.md + FUTURE_IDEAS.md files).
universal_paths:
  prefixes:
    - docs/plans/
  files:
    - CLAUDE.md
    - docs/odd-in-pos.md
    - docs/odd-methodology.md
    - docs/FUTURE_IDEAS.md

narrative:
  target: hands-off-lifecycle/seals/SEAL_COMMIT.true-first-run
  body: |
    # Amendment #26 — teardown observability retrofit
    #
    # 2026-04-22. Retrofits 23 bucket-(b) teardown broad-catches across
    # eight components per tightened CDC 2 (`9559ca7`, 2026-04-23).
    # Bare `pass` in `except Exception` inside close() / stop() /
    # _shutdown / cancel() / dispose() is no longer ODD-legit; each
    # site must emit to observability while still swallowing the
    # exception (no-cascade guarantee preserved; forensic trail
    # restored).
    #
    # Fix shapes (two patterns):
    #  1) `span.add_event(name, {"exception": type(exc).__name__})`
    #     when a component-owned span is live at the catch site —
    #     used for the four orchestrator._shutdown sites in
    #     orchestrator.py that emit on `self._process_span`.
    #  2) `logger.debug("<context>_failed", exc_info=True)` with a
    #     module-top `logging.getLogger(__name__)` — used everywhere
    #     else (all six Store.close() sites, orchestrator.stop/close,
    #     telegram-interface.stop_background, the seven workspace-
    #     bootstrap adapter _shutdown closures).
    #
    # CancelledError split-out: five sites previously co-caught
    # `CancelledError` with broad `Exception`. Per tightened CDC 2
    # (and the §8 rule 8 expected-flow principle), CancelledError
    # keeps its bare-pass clause; the broad Exception clause gains
    # the emission.
    #
    # Touched components:
    #   - cost-governance: store.py close().
    #   - self-correction: store.py close().
    #   - observability-aggregator: store.py close().
    #   - reversibility-primitive: store.py close().
    #   - safety-layer: store.py close() (source edit; no seal-diff
    #     test to advance — admitted into every other component's
    #     allowed_prefixes via this amendment).
    #   - telegram-interface: availability.py stop_background().
    #   - orchestrator: 7 sites across supervisor.py (stop), ipc.py
    #     (stop + client close), orchestrator.py (_shutdown x4 +
    #     close).
    #   - workspace-bootstrap: 9 sites across seven adapter _shutdown
    #     closures (observability_aggregator, safety_layer,
    #     cost_governance, self_correction, memory_system x2 split
    #     terminate + kill, primary_persona, reversibility_primitive).
    #   - hands-off-lifecycle: sidecar + narrative only (frozen H19).
    #
    # Re-verified-and-dropped (deferred to follow-up amendment):
    #   - orchestrator/src/ipc.py:122 — narrow `except
    #     FileNotFoundError` on socket unlink; bucket-(a) designed-
    #     branch.
    #   - hands-off-lifecycle/hooks/first_run_progress.py:159 —
    #     narrow `except OSError` on stream close; bucket-(a).
    #   - workspace-bootstrap/adapters/memory_system.py:109-117 —
    #     failed-startup cleanup inside `contribute()`; enclosing
    #     method is NOT a teardown. Future-amendment decision: is
    #     startup-cleanup broad-catch a bucket-(b) equivalent
    #     under tightened CDC 2? Deferred.
    #
    # Brief pre-research estimate was "~44 sites"; post-research
    # inventory is 23. The delta (~21) is a mix of non-teardown-
    # enclosed sites (the scanner's looser teardown-keyword match
    # caught caller chains that passed through teardowns to non-
    # teardown helpers) and narrow-designed-branch catches (bucket-
    # (a) designed-branch, not bucket-(b) broad-catch). The dropped
    # sites are named in the research doc §5.
    #
    # Test delta: +7 new test files (one per component with source
    # edits), each parameterized across that component's retrofitted
    # sites, asserting the emission shape. safety-layer's test
    # lives in safety-layer/tests/ despite the component having no
    # seal-diff test.
    #
    # Allowed-prefix widenings (per component): the six sealed
    # components whose allowed_prefixes did NOT admit `safety-layer/`
    # gain that admission (cost-governance, self-correction,
    # observability-aggregator, reversibility-primitive, telegram-
    # interface, workspace-bootstrap). Orchestrator already admits
    # it from amendment #19.
    #
    # BASELINE dd11677 (pre-amendment tip). hands-off-lifecycle's
    # H19 BASELINE stays frozen at 3780603 per amendment #23 (manifest
    # declares frozen_baseline: true). SEAL_COMMIT sidecars for seven
    # other components land at dd11677 on the amendment commit for
    # the empty-diff window; advanced to the amendment SHA in the
    # seal commit via `pos-amend seal`.
