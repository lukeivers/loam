# BASELINE: current branch tip @ build time (the plan-doc commit's parent). TWO-component
# amendment, ADDITIVE. The WMS shipped the store + the lenses (read surfaces); it never
# shipped the WRITE-BACK loop that keeps the store true without a human reconciling it — the
# only existing tracker-write path is intake.py (NEW work, on confirm). This layer adds the
# capture-from-ground-truth path: a turn-close (Stop-hook) + on-demand capture pass that
# event-sources work-DELTAS (a sealed/merged git ref via FBM Slice C, a task-list completion,
# a workstream-queue completion, a decision-register entry) into the tracker as auditable
# events — so a work item auto-transitions (active→achieved/blocked) from DERIVED ground-truth
# STATE, never from LLM recall (the structural fix for "claimed done when the outcome wasn't
# delivered"). Plus a current-state-of-all-work census surface that SUBSUMES the existing lens
# blocks (one capped fail-soft block, derived live). Adds AC.CAP.* / AC.DERIVE.* / AC.CENSUS.* /
# AC.HONEST.* / AC.SELFMAINT.LIVE.1 (the outcome-altitude: at an arbitrary moment against the
# LIVE loam+cairn repos with NO hand-reconciliation, the census shows the genuinely-current
# state, an advanced item MOVED by the capture loop, no fabricated "done").
# Ground-truth-only sourcing (no LLM-recall auto-capture) is the load-bearing owner call (D2 ★).
