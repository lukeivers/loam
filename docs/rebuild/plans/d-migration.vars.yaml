# --- Decisions LOCKED at brief level (Luke 2026-04-27) ---

LOCKED_DECISIONS_BRIEF:
  D-D1:
    name: "Strict D over D' on merits"
    ruling: "Commit to strict D, not D'. D's directory split eliminates the 'developer forgot to protect this path' failure class by structural construction; D' relocates the same failure class to .gitignore-pattern-maintenance."
    rationale: "Architectural cleanliness compounds. Wall-time delta D vs D' is 1-2h AI-builder time; negligible."
  D-D2:
    name: "flat→directory-split target structure"
    ruling: "framework/ contains all git-tracked code; workspace/ contains workspace-local state (.pos/, personas/, .mcp.json, .scratch/, memory.yaml, .claude/ at workspace root, .venv/ at workspace root, objective_tracker.sqlite, orchestrator/memory-write-worker logs)."
    target_structure: |
      ~/pos3/                          # (and analogous for canonical pos-v2)
        framework/                     # git-tracked, pulled from canonical
          primary-persona/
          orchestrator/
          workspace-sync/
          self-upgrade/
          workspace-bootstrap/
          memory-system/
          objective-tracker/
          hands-off-lifecycle/
          tools/
          docs/
          (other 8 components)
          first-run-inventory.yaml
          .gitignore (no .pos/, no personas/, no memory.yaml entries — those
                       names don't exist inside framework/)
          pyproject + lock files
        workspace/                     # workspace-local state, gitignored
          .pos/
          personas/
          .mcp.json
          .scratch/
          memory.yaml
          objective_tracker.sqlite
          orchestrator.{out,err}.log
          memory-write-worker.{out,err}.log
          data/
        .claude/                       # workspace root — D-Q.A4 placement
          settings.json
          agents/
        .venv/                         # shared workspace venv (per-workspace)
        .gitignore                     # at workspace root; declares only
                                       # framework/ as tracked
  D-D3:
    name: "pos-sync becomes git-merge under D"
    ruling: "Internally pos-sync becomes 'cd framework && git fetch + git merge --ff-only'. LLM-resolver kept as rare-conflict fallback when git can't auto-resolve. Most syncs are fast-forwards."
    rationale: "Drops ~2400 LOC + ~110 tests. Bug class collapse is structural."
  D-D4:
    name: "β.2 (new-workspace bootstrap) absorbs into D's migration sequence"
    ruling: "pos-new-workspace --from <repo> becomes 'git clone <repo> <new-ws>/framework && pos init <new-ws>'. pos init seeds <new-ws>/workspace/."
    rationale: "Composes naturally with the directory split."
  D-D5:
    name: "β.3 (global install) unchanged"
    ruling: "Independent amendment. Not part of D-migration plan; lives in its own dispatch."
    rationale: "Already orthogonal to architecture choice."

# --- Decisions LOCKED at plan-author level (D-Q.A1 through D-Q.A5; surfaced for owner ruling per §11/§12) ---

PLAN_AUTHOR_DECISIONS:
  D-Q.A1:
    question: "Per-amendment AC breakdown deviates from §4 outline?"
    recommendation: "Accept §4 AC breakdown. No deviation."
    confidence: "high"
  D-Q.A2:
    question: "Build sequence ordering deviates from D.1 → D.5?"
    recommendation: "Accept D.1 → D.2 → D.3 → D.4 → D.5."
    confidence: "high"
    rejected_alternatives:
      - "(b) D.3 first: fails — needs framework/ to exist."
      - "(c) D.2 before D.1: fails — needs framework/ for plist EnvironmentVariables."
  D-Q.A3:
    question: "Sealed-component vs dev-discipline shape per amendment?"
    recommendation: "All 5 sealed-component."
    confidence: "high"
  D-Q.A4:
    question: ".claude/ at workspace root, or under <workspace>/workspace/?"
    recommendation: "(a) .claude/ at workspace root."
    rationale: "Honours Claude Code's expectation; structural-promise preserved (outside framework/); no operator chore. Symlink alternative (c) deferred — symlinks-in-pos3 historically caused issues per workspace-sync HC#12."
    confidence: "high"
  D-Q.A5:
    question: "Class-B handling under D.3?"
    recommendation: "(b) Drop Class-B as a category."
    rationale: "Directory split makes memory.yaml Class-A by structural relocation. No merge driver needed."
    confidence: "medium"
    alternatives:
      - "(a) Ship framework/.gitattributes with memory.yaml merge=ours — kept if owner wants explicit merge-driver back-compat."
      - "(c) Documentation-only Class-B + resolver-handled rare case — kept if owner wants transition-window."

# --- Hard Constraints (binding from dispatch) ---

HARD_CONSTRAINTS:
  HC1: "Each amendment fences cleanly per the per-amendment fence above."
  HC2: "No regression of any landed amendment's tests. Existing tests continue to pass post-migration."
  HC3: "No new third-party deps. Use git-shellout + Pydantic + stdlib."
  HC4: "CRITICAL bug-class-elimination — each amendment's tests MUST include byte-content-match assertions for sample workspace files post-apply. Closes the test-shape-only verification gap that triggered this whole architectural review."
  HC5: "Workspace-state preservation must be empirically verified end-to-end against pos3 (real apply, real cmp against canonical's HEAD blobs in framework/, real workspace-state retention check in workspace/)."
  HC6: "D's structural promise — post-migration it must be IMPOSSIBLE to accidentally write workspace-state into framework/ or framework code into workspace/. Directory boundary is the structural contract."
  HC7: "CDC adherence: scope-only-dispatch CDC; standard pos-amend manifest discipline."
  HC8: "No --amend. Corrective new commits only."
  HC9: "Plan-before-code. Each amendment's builder authors a builder-plan before editing source."

