it__ to keep workspace-bootstrap fence narrow). Adapter metadata: phase=before_orchestrator_start, after=('primary_persona',) — primary_persona populates host.orchestrator + host.scope_runtime within before_orchestrator_start phase; topo-sort honours after= per workspace-bootstrap discovery. AC.OSS.2 (D-2 from feature-usage audit; DegradationComponent.build had zero non-test callers; orchestrator pause/resume hooks declared but unbound; MemorySupervisor defined but not constructed in production). 7 new test files in framework/workspace-bootstrap/tests/: test_AC_OSS_M5_1_dormancy_adapter_constructs_component.py + test_AC_OSS_M5_2_orchestrator_pause_resume_responds_to_dormancy.py + test_AC_OSS_M5_3_memory_supervisor_instantiated.py + test_AC_OSS_M5_4_supervisor_bridge_translates_transitions.py + test_AC_OSS_M5_5_end_to_end_memory_outage_triggers_pipeline.py + test_AC_OSS_M5_6_supervisor_skipped_when_no_sidecar.py + test_AC_OSS_M5_7_notifier_queues_when_no_channel.py. Sealed-component fence: 3 components — workspace-bootstrap (carries the diff: adapter body + 7 tests + sidecar bump) + dormancy (sidecar bump only; no source change; existing public API consumed) + orchestrator (sidecar bump only; no source change; existing MemorySupervisor + pause/resume hooks consumed). HC#4 byte-content sample status: NO RETIRE-AND-REBASELINE (no HC#4 sample paths under any of the 3 touched components impacted by M5 diff; verified at plan-authoring per plan §11 finding #6). Critical architectural finding surfaced + accommodated at plan-authoring: MemorySupervisor exposes asymmetric callback surface (on_recovering + on_normal + on_transition; no explicit on_degraded) — the bridge subscribes via on_transition uniformly + filters by to_state to capture every relevant edge with one callback per plan §11 finding #2 + §10 D-build.M5.4. Pause/resume hook BINDING is already wired in dormancy/policy.py — PolicyDispatcher.apply calls orchestrator.pause_activation(reason); PolicyDispatcher.release calls orchestrator.resume_activation(); the M5 gap is that the dispatcher was never CONSTRUCTED in production (because the component wasn't); M5's adapter promotion lights up the existing wiring. MemorySupervisor instantiation in production is NEW (no prior production caller per plan §11 finding #3); short-circuit on host.memory_sidecar_url is None per plan §10 D-build.M5.6 keeps test workspaces (launch: False) booting cleanly. Adapter file growth: ~80-150 LOC (current file is 27 LOC declaration-only)."

