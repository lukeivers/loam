[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-safety-layer"
version = "1.13.0"
description = "Safety layer for loam — three kill switches, always-ask list, dangerous-op gate."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    "loam-scope-of-work",
    "loam-primary-persona",
    "loam-orchestrator",
]

[project.scripts]
loam-kill = "loam.safety_layer.cli:main"

[tool.setuptools]
package-dir = {"loam.safety_layer" = "src/loam/safety_layer"}
packages = ["loam.safety_layer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
