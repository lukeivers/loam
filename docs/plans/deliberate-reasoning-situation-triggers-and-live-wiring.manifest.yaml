  slug: deliberate-reasoning-situation-triggers-and-live-wiring
  title: "deliberate-reasoning slice 3 — replace conversation-keyword gate triggers with situation/behavior signals + wire the proven gate+loop into live primary-session turns (default-OFF, zero-collateral)"

# BASELINE: the commit immediately preceding this slice's source-edit
# commit (the house HEAD~1 advance pattern). The builder re-baselines to the
# actual source-edit BASELINE at build time (confirm against `main` tip per
# feedback_sync_check_before_build_on_checkout).
#
# SEALED-COMPONENT amendment fence — framework/deliberate-reasoning/:
#   This slice EXTENDS the SEALED slice-1 component (seal a6156590). The
#   gate.py trigger-substrate edits (new situation-signal detectors; retire/
#   demote the _HEDGE_RE/_STAKES_RE conversation-keyword detectors; verify-or-
#   retire NOVELTY) are ADDITIVE + manifest-declared, never a silent widening
#   (feedback_dispatch_explicit_loam_amend_apply). The evaluate_gate(GateSignals)
#   -> GateDecision contract shape is preserved; the loop + the production
#   entry-point are unchanged in shape (composes-with, not rewrite). The
#   builder runs `loam amend apply` + `loam amend seal` against this fence.
#
# LIVE-WIRING fence — the PreToolUse hook adapter:
#   The live-wiring lands a NEW PreToolUse hook composing with the existing
#   pos3/.claude/hooks/ guard pattern (in_thread_work_budget_guard.py /
#   wd_discipline_guard.py), registered in .claude/settings.json. Whether the
#   hook adapter ships in canonical loam's framework/ harness layer or in the
#   workspace .claude/hooks/ surface is the builder's placement call (§2);
#   the framework owns the gate DECISION, the hook owns the harness ADAPTATION.
#   Any workspace-side settings/hook edits are universal-path admissions, not
#   framework-source edits (compatible with the wd_discipline_guard's own
#   allow-list).
#
# AC families locked per docs/plans/deliberate-reasoning-situation-triggers-and-live-wiring.md §5:
#   AC.TRIG.1  — escalation driven by situation signals (pending-action
#                structure + recent tool-result history), NOT by keyword-
#                scanning the user's prompt or the model's draft; the two
#                dissociate (structural-signal turn with no keywords escalates;
#                keyword turn with a safe action does not).
#   AC.TRIG.2  — the v1 situation set (UNBOUNDED_OP / REPEAT_FAILED /
#                MACHINE_IRREVERSIBLE / HIGH_BLAST_RADIUS) each fires on its
#                positive fixture and declines its negative, LLM-free.
#   AC.TRIG.3  — detectors read admissible sources only (tool name, tool-
#                argument structure, target path, recent tool-result
#                metadata); no detector reads the NL prompt/draft; any retained
#                NOVELTY-style label is verified structural-derivation or retired.
#   AC.TRIG.4  — the 2026-06-24 runaway-regex incident shape, replayed as a
#                fixture, escalates (>=UNBOUNDED_OP + REPEAT_FAILED) where the
#                slice-1 keyword gate would NOT have fired.
#   AC.WIRE.1  — the gate fires inside a LIVE primary-session turn (PreToolUse
#                hook -> gate -> loop) and the loop's deliberate output
#                affects the outcome; a safe turn produces none.
#   AC.WIRE.2 ★ — no-collateral / default-OFF: ships default-OFF; with it on, a
#                turn with NO structural signal is byte-identical to baseline;
#                the gate fires on ZERO normal turns (live form of slice-1's
#                gain_on_unflagged == 0).
#   AC.WIRE.3  — composes with the existing PreToolUse safety guards without
#                regressing them; a hard block from a safety guard is not
#                overridden; ordering is deterministic in settings.json.
#   AC.WIRE.4  — the option-(ii) per-turn LLM self-assessment escalation is
#                default-OFF + independently gated; the v1 structural floor
#                runs LLM-free (zero claude -p calls on the hot path); enabling
#                the escalation is a single reversible switch separate from
#                LOAM_DELIBERATE_REASONING.
#   AC.WIRE.OA ★ — outcome-altitude: a LIVE end-to-end real-situation fire
#                through the production wiring with NO pre-arranged gate state
#                yields escalation + a loop intervention that changes the
#                outcome, AND the same enabled config over normal turns yields
#                ZERO collateral.
#
# Plan-authoring rulings carried in (plan §3):
#   D-SIT.1 — HYBRID, structural-first: ship structural floor (i) in v1;
#             defer option-(ii) LLM self-assessment as a default-OFF escalation.
#   D-SIT.2 — v1 situation set = the four §3.2 structural signals.
#   D-SIT.3 — structural-vs-keyword line: admissible = pending-action structure
#             + result history; inadmissible = prompt/draft NL content.
#   D-SIT.4 — wiring via the existing PreToolUse hook pattern; framework-
#             decision + hook-adapter separation; compose-not-override.
#   D-SIT.5 — default-OFF preserved (LOAM_DELIBERATE_REASONING); zero-collateral
#             live invariant; option-(ii) independently default-OFF.
#   D-SIT.6 — slice-2a's SelfAttribution.matches() prompt-keyword matcher
#             superseded as input contract; the self-model folds in as a
#             structural-signal CONDITIONING source (not a parallel keyword
#             scan); slice-2a's behavior-shaping EXPERIMENT untouched + paused.
#
# Out of scope (plan §7): always-on per-turn LLM self-assessment (deferred,
#   default-OFF); the draft-QUALITY coverage class (NAMED GAP, routed to the
#   deferred escalation); the surprise/prediction-error trigger; slice-2a's
#   experiment (untouched + paused); re-running the slice-1 experiment with the
#   new triggers; publish.
#
# STATUS: RATIFIED FOR BUILD (owner cleared 2026-06-24, Discord
