smoke_outcome: "PATCH AC.PCVR.{1-4,S} GREEN; 26 pyprojects bumped 0.10.0 -> 0.12.0; docs/ACTIVE_MINOR anchor + regression test + mutation-detection fixture in place; structural enforcement closes the v0.11/v0.12 silent-skip defect."

# Multi-component PATCH fence per the v0.8.0 / v0.8.1 / v0.8.2 / v0.9.0
# precedent: single fence-anchor (dev-sdlc plugin) carries the seal_test
# + sidecar; universal_paths.prefixes admits framework/ + plugins/ for
# the per-component pyproject sweep. Per §16 finding #2: this convention
# is empirically stable across 5 prior sealed cycles; no change in the
# recent amendment-N stream (136-149) breaks the pattern.
