# capability-refresh — the ONE cadence binding for the deterministic
# capability-corpus refresh. Replaces the two retired bindings (the
# Anthropic cloud routine that 403-stranded its output, and the local
# launchd job that died silently under a fragile system Python). This
# runner lives where the commit lands, so it has native GITHUB_TOKEN write
# access — stranded output is impossible by construction.
#
# Ratified decision (2): a scheduled refresh OPENS A PULL REQUEST for owner
# review. It NEVER commits corpus changes straight to main. workflow_dispatch
# is the manual verification path (and may target any cadence class).
#
# Authority: workspace/strategy/capability-refresh-delivery-architecture-2026-07-02.md
# (§3 RUN + §5 composed architecture); plan
# docs/plans/capability-refresh-actions-cadence-migration.md.
name: capability-refresh

on:
  schedule:
    # GitHub cron is UTC and has no timezone; America/Chicago shifts by 1h
    # across DST. Off-peak minute (:37) per the architecture doc §3.3
    # (top-of-the-hour runs are the most likely to be delayed/dropped).
    - cron: '37 12 * * *'    # daily  — high-velocity (~06:37/07:37 America/Chicago)
    - cron: '37 13 * * 0'    # weekly — long-form Sunday (~07:37/08:37 America/Chicago)
  workflow_dispatch:
    inputs:
      cadence-class:
        description: 'cadence class to run'
        required: true
        default: high-velocity
        type: choice
        options:
          - high-velocity
          - long-form
          - all

# Least-privilege: the refresh needs to push a branch and open a PR. It does
# NOT need write to main (the branch-protection + owner review is the gate).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: capability-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned deps
        # Pinned so an interpreter/dep drift cannot silently re-break the run
        # (the exact failure mode that killed the launchd binding).
        run: python -m pip install --quiet 'pyyaml==6.0.2'

      - name: Resolve cadence class
        id: cls
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLASS="${{ github.event.inputs.cadence-class }}"
          elif [ "${{ github.event.schedule }}" = "37 13 * * 0" ]; then
            CLASS="long-form"
          else
            CLASS="high-velocity"
          fi
          echo "class=$CLASS" >> "$GITHUB_OUTPUT"
          echo "Resolved cadence class: $CLASS"

      - name: Run deterministic refresh (no commit — PR step owns it)
        env:
          LOAM_REFRESH_NO_COMMIT: '1'
        run: ./framework/tools/capability-refresh/scripts/run-cadence.sh "${{ steps.cls.outputs.class }}"

      - name: Open refresh PR (never auto-lands to main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/capability-corpus/; then
            echo "No corpus changes this cycle — no PR opened."
            exit 0
          fi
          CLASS="${{ steps.cls.outputs.class }}"
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          BRANCH="capability-refresh/${CLASS}-${STAMP}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/capability-corpus/
          git commit -m "chore(corpus): scheduled capability refresh (${CLASS})" \
            -m "Deterministic no-LLM projection run — auto-land/review partition per D-CUR.4. Review the corpus diff + any new docs/capability-corpus/pending-deltas/ entries before merge."
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(corpus): scheduled capability refresh (${CLASS})" \
            --body "Automated deterministic capability-corpus refresh (\`${CLASS}\` class, ${STAMP} UTC).

          This PR does **not** auto-land — the owner reviews and merges (ratified decision 2). Review:
          - the corpus body diff under \`docs/capability-corpus/\`
          - any new files under \`docs/capability-corpus/pending-deltas/\` (new claims / removals / contradictions the D-CUR.4 partition flagged for review)
          - any \`source_status: stale\` markings (a fetch failed — never silently current)

          Generated by \`.github/workflows/capability-refresh.yml\`."
          echo "Opened PR from $BRANCH"
