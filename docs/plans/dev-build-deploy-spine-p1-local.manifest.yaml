  title: "dev->build->deploy spine — P1 the LOCAL deploy tier. NEW opt-in capability component `framework/local-deploy-tier/` that composes ON the sealed deploy-safety floor (idle at LOCAL) + the secure-build baseline + the P0 shared contract. AC.LOCAL.{1,2,3,4,C}: a LOCAL build produces a P0-shape Acceptance record judged by an independent check the builder did not control (1); the enabled LOCAL command set carries no irreversible/prod verb so the floor idles, and a destructive-SQL guard WARNS-not-blocks against a provably-local target while deferring an unknown target to the sealed floor fail-closed (2); a backing-service parity gap (engine/version) against a downstream env is surfaced in plain language before any promotion is offered, with the honest-residual caveat always present (3); a LOCAL secret lives in the OS keychain, never a repo-committed file (4); outcome-altitude: build_local() drives the real entry-point over a fresh on-disk workspace with a real subprocess check (C). Sealed floor + secure-build baseline are READ/NAMED, never edited (D-SC.3: the sealed Tier enum is NOT extended)."

# BASELINE: 2409dc48 — the canonical tip at build-dispatch time, the commit
# immediately preceding this cycle's source-edit commit (the house HEAD~1
# advance pattern). This NEW component's first seal fences against it.
#
# Pre-build sync check: canonical HEAD was 2409dc48, 12 commits AHEAD of
# origin/main (da88994e) from prior local seals (not yet pushed); built on
# local HEAD per feedback_build_forward_on_publish_pending.
