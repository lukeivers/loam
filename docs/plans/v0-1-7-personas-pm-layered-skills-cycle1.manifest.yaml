  body: |
    # v0.1.7 Cycle 1 — 5 subagent personas + symlink registration —
    apply ladder

    2026-05-04. v0.1.7 Cycle 1 per
    `docs/plans/eric-final-delivery-plan-2026-05-04.md` §2
    v0.1.7 row + Decision C (subagents source in plugins/dev-sdlc/
    + symlink at workspace-bootstrap RESOLVED YES).

    Sub-plan: `docs/plans/v0-1-7-personas-pm-layered-skills.md`.

    Scope (per sub-plan §6 Cycle 1): two-component fence on
    `plugins/dev-sdlc/` (5 NEW persona files + 1 NEW test file) +
    `framework/workspace-bootstrap/` (first-run scaffold extension +
    2 NEW test files). Cycles 2–4 ship under separate manifests
    serialized after this seal — per `feedback_serialize_amendment_builds`.

    AC families:

      - AC.PERSONAS.{1,2,3,4,5} — 5 persona files at
        plugins/dev-sdlc/agents/<name>.md. Each carries:
          - YAML frontmatter (name + description + model + optional
            tools per Anthropic subagent-file documented surface).
          - 5-section body (Identity anchor / Role / Voice / When to
            invoke me / How I compose with the harness / Out of scope).
          - Role-specific named references:
            * loam-builder       — `loam amend apply`, `loam amend seal`,
                                   ODD, plan-before-code (case-insensitive
                                   match per test).
            * loam-plan-author   — plan-doc, outcome-shape, Named Decisions.
            * loam-researcher    — Lens 1/2/3; tools-restricted to
                                   Read/Grep/Glob/WebFetch/WebSearch.
            * loam-reviewer      — gate-review, ODD, seal-test; tools-
                                   restricted to Read/Grep/Glob/Bash
                                   (no Edit/Write).
            * loam-documenter    — public-facing voice + methodology
                                   awareness.
      - AC.PERSONAS.6 — workspace-bootstrap first-run scaffold
        symlinks every plugin's agents/*.md into
        <workspace>/.claude/agents/<filename>. Idempotent. Resolves
        plugins/ from canonical layout (<workspace>/plugins/) or
        derived-workspace layout (<workspace>/framework/plugins/) per
        the D-architecture nesting.
      - AC.PERSONAS.7 — collision-handling raises
        PluginAgentCollisionError on non-symlink file at target path.
        Operator-precedence: existing symlinks (whether pointing at
        correct source or elsewhere) are left untouched.
      - AC.PERSONAS.8 — discovery in canonical pos-v2 (smoke; live
        `claude` session lists 5 personas via subagent-discovery
        surface; status-file-recorded).

    Method-level choices (builder's call per ODD §1.1):

      - Persona files use the 5-section body shape mirroring the
        primary-persona's `to_agent_md` projection precedent
        (framework/primary-persona/src/loam/primary_persona/agent_md.py:
        Identity anchor + Persona prompt with Role/Voice/...).
      - Frontmatter `tools:` for loam-researcher restricts to
        Read/Grep/Glob/WebFetch/WebSearch (read-only); for loam-
        reviewer restricts to Read/Grep/Glob/Bash (review tools +
        read-only Bash for git operations). Other personas inherit
        full surface (Edit/Write/Bash needed for build/docs/plan-
        author surfaces).
      - Symlinks (not copies) so plugin updates propagate without
        re-bootstrap. Symlink target is the absolute resolved path of
        the plugin agent file.
      - Plugin-root resolver checks canonical layout first
        (<workspace>/plugins/), then derived-workspace layout
        (<workspace>/framework/plugins/) per the D-architecture
        nesting. Returns None when neither present (no error; simply
        no plugin agents to register).
      - Idempotence: existing symlinks (any target) are left alone
        per operator-precedence; non-symlink collisions raise
        PluginAgentCollisionError so operator resolves explicitly.
      - PluginAgentCollisionError uses ERR_HANDS_OFF_INTERNAL
        (-32099) error code, matching the existing scaffold-internal
        error code convention per first_run_scaffold.py:75.
      - Tests are parametrized over the 5 personas (single test
        file: 23 tests; one parametrized fn × 5 personas + 8
        named-references tests) following the v0.1.3 SKILL.md AC.LSK
        precedent. Two scaffold tests cover AC.PERSONAS.6 (10 cases)
        + AC.PERSONAS.7 (4 cases) separately.
      - No edit to `plugins/dev-sdlc/dev-mode-manifest.yaml` (the
        agents/ directory is plugin-tree-internal; admission to the
        DEV-MODE auto-load partition is out-of-fence per sub-plan §7).

    Out of scope (per sub-plan §7):

      - Cycles 2–4 (per-project-pm NEW component; layered-skill
        discovery mechanism; decision-surfacing + one-question-at-a-
        time) — separate manifests, sealed after this Cycle 1.
      - Auto-creation mechanism — defer to v0.2.0.
      - Promotion rubric — defer to v0.2.1.
      - Heavy reverse-engineering / Rails extractor — defer to v0.1.8.
      - 12 dev-sdlc skill-ifications — defer to v0.1.8 + v0.1.9.
      - Real Eric onboarding ritual — defer to v0.2.1.
      - Migration of existing flat-shape skills — out of fence.
      - plugins/loam-skills/ admission to dev-mode-manifest.yaml —
        deferred (the layered-skill discovery mechanism in Cycle 3
        makes this less load-bearing).

