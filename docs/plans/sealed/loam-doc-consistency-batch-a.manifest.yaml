    # Single-component fence per D-BAFI.FENCE-SHAPE. The loam-skills
    # plugin is the only component whose tree is touched non-document-
    # only (via pyproject.toml description rewrite). All other edits
    # (docs/install-from-source.md, docs/architecture.md, README.md
    # quickstart + Documentation sections) land under universal_paths
    # admissions.
    #
    # AC.BAFI.S test lives at plugins/loam-skills/tests/test_AC_BAFI_
    # S_post_fix_state.py per F4 — natural fence-home because Batch A
