[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "upgrade-merge-resolver"
version = "0.1.0"
description = "Clause-(h) merge-resolver factory for `pos upgrade --merge-resolver-module`."
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]
