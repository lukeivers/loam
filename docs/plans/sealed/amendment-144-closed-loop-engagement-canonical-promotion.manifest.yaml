baseline: "b2b46a22b0cbdc7580bd9d612015362e682ac9cb"

plan: docs/plans/amendment-144-closed-loop-engagement-canonical-promotion.md

seal_description: |
  Closed-loop engagement canonical promotion: intent-classifier
  UserPromptSubmit hook + persona-prompt/hook reconciliation +
  fresh-workspace SKILL-discovery audit + operator rescaffold-skills
  CLI. Three merged scopes:

    Scope A — promote pos3-local intent_classifier_inbound.py hook
    to canonical primary-persona (new
    framework/primary-persona/src/loam/primary_persona/intent_classifier.py
    module + new CLI subcommand `primary_persona.cli intent-classifier`
    + multi-contributor generalization of `merge_user_prompt_submit`
    mirroring amendment #45's SessionStart pattern + extension of
    _LOAM_USER_PROMPT_SUBMIT_COMMAND_MARKERS to recognize the
    intent-classifier marker + wiring of the intent-classifier
    inner hook as extra_inner_hooks alongside the persona's
    existing user-prompt-submit contributor).

    Scope B — reconcile the canonical persona prompt's translate-
    inbound stanza (framework/primary-persona/templates/persona-
    template/prompt.md:433-454) with the hook's structural-
    enforcement prescription. Per TG 11881 ruling: slash commands
    are NOT user-facing; the persona MUST NOT type `/handsoff-loop`
    verbatim into responses. Rewrite the persona prompt to match
    the hook's prescription (no verbatim slash command; persona
    follows the auto-loaded SKILL's procedure); the hook is the
    structural backstop, the persona prompt is the documented
    discipline, both speak the same prescription.

    Scope C — fresh-workspace SKILL-discovery audit (assert
    handsoff-loop is discoverable at
    <workspace>/.claude/skills/handsoff-loop/SKILL.md post-scaffold;
    composes alongside existing AC.LAYERED.2 test) + operator-facing
    rescaffold-skills CLI verb for pre-existing workspaces (pos3
    case — pos3 was scaffolded pre-v0.1.7 and scaffold is
    idempotent, so pos3's .claude/skills/ carries only the manual
    handsoff-loop symlink; the rescaffold verb is the operator's
    recovery path) + one-sentence addition to docs/release-process.md
    under fresh-workspace verification.

  Closes the closed-loop engagement architectural gap surfaced this
  session: non-tech users in fresh workspaces typing soft phrasing
  ("I want a tool that does X. show me it works") must engage the
  closed-loop methodology without knowing or typing any slash command.
  Owner ratification: TG 11808 (build-strategy delegation), TG 11878
  (closed-loop engagement directive), TG 11881 (slash command not
  user-facing), TG 11885 (proceed-on-your-own).

  Closes AC46.6 (deferred multi-contributor UserPromptSubmit
  generalization from amendment #46). Dogfoods amendment #142
  D-PASH.BASELINE-WALK + D-PASH.METHOD-DOC at this amendment's own
  baseline computation + commit-ladder. Dogfoods amendment #141's
  decoupled §14 backfill at this amendment's seal. Composes on top
  of amendment v0.1.7 Cycle 3's _symlink_plugin_skills (no semantic
  change to the symlinker; new operator entry point).

# Multi-component fence on `primary-persona` + `hands-off-lifecycle`
