narrative:
  target: framework/hands-off-lifecycle/seals/SEAL_COMMIT.oss-v0-1-0-publish-rename-1g
  body: |
    # Amendment #82 — M1g Tier-1 #6 pos-amend → loam amend CLI rename + tools-tree namespace pivot

    2026-04-29. Seventh and final sub-amendment of the M1.rename
    multi-amendment series per locked series master plan-doc
    `docs/rebuild/plans/oss-v0-1-0-publish-rename.md` (committed
    `ebe0a57`) and locked sub-plan-doc
    `docs/rebuild/plans/oss-v0-1-0-publish-rename-1g.md`.

    Closes the M1.rename programme.

    Composes on M1a (sealed `143d465`, 2026-04-29 — docs/prose-only
    brand rebrand), M1b (sealed `d97c8c1`, 2026-04-29 — env-vars +
    per-host config dir + migration helper), M1c (sealed `1e99d0b`,
    2026-04-29 — launchd label rebrand + plist filename cascade +
    sibling migration helper), M1d (sealed `74ae5d3`, 2026-04-29 —
    OTel pos.* → loam.* root rebrand), M1e (sealed `c806f57`, §14
    backfill `820fd84`, 2026-04-29 — loam.* namespace pivot for 14
    packaged components + cleanup), M1f (sealed `390e1ca`, §14
    backfill `af2e740`, 2026-04-29 — Tier-2 graceful-degradation →
    dormancy thematic rename) and on the OSS v0.1.0 publish programme.

    Owner rulings closed at series-master commit time (2026-04-29):

      - D-RNM.1 SPLIT: M1g is the seventh and final slice of the
        multi-amendment series.
      - D-RNM.2 per-component namespace-package: M1g extends the
        loam.* namespace into the tools-tree for the 4 residual tools
        (pos-publish-framework-only, orphan-plist-cleanup,
        upgrade-merge-resolver, heavy-b-migrate) per M1e §11 finding #4.
      - D-RNM.3 no compat window: hard-cutover; no pos-amend shim
        binary; no transitional dual-binary registration; no
        from pos_amend re-export module.
      - Tier-1 #6 (loam-rename-decisions.md): pos-amend CLI →
        loam amend — subcommand under a unified loam top-level CLI
        (daily-driver brand concentrator; future subcommands like
        loam scope new, loam status, loam plot create live under the
        same umbrella).

    Surface changes:

    Surface A — pos-amend → loam amend CLI rename:

      - Tool directory rename:
          framework/tools/pos-amend/ → framework/tools/loam/
        via git mv (preserving history). Inner package
          framework/tools/loam/src/pos_amend/ →
          framework/tools/loam/src/loam_cli/
        via git mv.

      - Subcommand restructure:
          The existing pos-amend subcommand surface (validate, apply,
          seal, template, new-plan) migrates to
          loam_cli/amend/{cli.py, commands/{apply.py, seal.py,
          validate.py, template.py, new_plan.py}, manifest.py,
          baseline.py, paths.py, sidecar.py, seal_diff.py,
          narrative.py, dry_run.py, template_engine.py,
          tracker_registration.py, rename_detection.py}. New top-level
          loam_cli/cli.py dispatcher uses argparse subparsers; `amend`
          is the first registered subcommand at M1g time; namespace
          reserved for future `loam scope`, `loam status`, `loam plot`
          subcommands per loam-rename-decisions.md Tier-1 #6.

      - pyproject restructure:
          [project] name = "pos-amend" → name = "loam-cli"
          [project.scripts]
            pos-amend = "pos_amend.cli:main"
            → loam = "loam_cli.cli:main"

      - ~30 internal pos_amend → loam_cli.amend import rebrands across
        loam_cli/amend/{cli.py, commands/*.py} + tests.

      - 2 cross-tree pos_amend internal-API consumer rebrands:
          framework/tools/heavy-b-migrate/src/heavy_b_migrate/verify.py
          lines 76 + 81 (late imports — heavy-b-migrate was pos-amend's
          SOLE Python-import consumer per plan §11 finding #1):
            from pos_amend.manifest import LiftedFromEntry, Manifest, ObjectiveEntry
            from pos_amend.tracker_registration import register_objectives, update_source_commits
          →
            from loam_cli.amend.manifest import LiftedFromEntry, Manifest, ObjectiveEntry
            from loam_cli.amend.tracker_registration import register_objectives, update_source_commits

      - HOL bash_guard.py rebrand (the dry-run binary invocation
        surface; AC.BAG.4):
          - Function _pos_amend_dry_run → _loam_amend_dry_run
          - Helper _reason_pos_amend_dry_run → _reason_loam_amend_dry_run
          - Binary path workspace_root / .venv / bin / pos-amend
            → workspace_root / .venv / bin / loam
          - Subprocess args [str(pos_amend), "apply", "--dry-run", str(manifest)]
            → [str(loam), "amend", "apply", "--dry-run", str(manifest)]
          - failure_class string "pos-amend-dry-run-failure"
            → "loam-amend-dry-run-failure" (3 occurrences:
            return-tuple + Decision.failure_class literal + Literal
            type-hint)

      - HOL agent_guard.py rebrand:
          re.compile(r"\bpos-amend\b") → re.compile(r"\bloam amend\b")
          in _LOAM_SURFACE_PATTERNS tuple.

      - HOL test rebrand:
          test_AC_BAG_4_pos_amend_dry_run.py
          → test_AC_BAG_4_loam_amend_dry_run.py via git mv.
          Inside: monkeypatch targets _pos_amend_dry_run →
          _loam_amend_dry_run; assertion strings "pos-amend" →
          "loam amend"; failure_class "pos-amend-dry-run-failure" →
          "loam-amend-dry-run-failure".
          test_AC_AG_1_wrong_wd_dispatch.py: prompt fixture
          "Run pos-amend apply --dry-run on the manifest." →
          "Run loam amend apply --dry-run on the manifest." +
          test name + module docstring rebrand.

      - 11 cross-component test_no_sealed_amendments.py allowlist edits:
          - 8 hard allowlist-prefix rebrands "framework/tools/pos-amend/"
            → "framework/tools/loam/" across:
              cost-governance, dormancy, memory-system,
              observability-aggregator, reversibility-primitive,
              self-correction, self-upgrade, telegram-interface
          - 3 narrative-comment live-fence rebrands describing the
            LIVE fence behaviour (e.g. "shape check: pos-amend apply
            advances the literal" → "shape check: loam amend apply
            advances the literal" in observability-aggregator + self-
            correction); narrative-comment historical-amendment-number
            references (e.g. "Amendment #22 (pos-amend CLI + ...)"
            in memory-system; "advanced to the #32 seal commit per
            ``pos-amend apply``" in primary-persona) PRESERVED
            verbatim per plan §10 D-build.M1g.4 historical-record
            convention.

      - ~10 framework live src docstring/comment rebrands:
          - objective-tracker/src/loam/objective_tracker/filter.py:6
          - objective-tracker/src/loam/objective_tracker/runtime.py:608
          - workspace-bootstrap/src/loam/workspace_bootstrap/adapters/tracker_seed.py:306
          - self-upgrade/manifests/_build_manifest.py:21
          - heavy-b-migrate/src/heavy_b_migrate/{__init__.py:7,12, cli.py:94, amendment_acs.py:16, verify.py:4-20,56,62,69-76}
            (verify.py also rebrands the parameter name pos_amend_repo_root
            → loam_amend_repo_root per plan §10 D-build.M1g.5; pre-build
            grep verified single callsite, no kwarg breakage)
          - heavy-b-migrate/tests/test_ac_d_mig_4_continuous_registration.py
