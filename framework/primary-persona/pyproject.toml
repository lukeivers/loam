[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primary_persona"
version = "0.1.0"
description = "Primary-persona layer for pOS v2 — loader, background-work monitor, and autonomous authoring framework."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    # Amendment #48 (memory-system live client + Stop-hook turn-close
    # write). Persona consumes the same streamable-HTTP MCP client
    # Claude Code uses to talk to the workspace's memory-graphiti
    # service (registered in `<workspace>/.mcp.json` by amendment #47).
    # Pinned to the exact version present in `memory-system/.venv`
    # (D5: floating bound risks protocol drift). Update in lockstep
    # with memory-system's pin.
    "mcp==1.27.0",
    # In-workspace dependency on scope-of-work (D0 amendment required).
    "scope_of_work",
]

[tool.setuptools]
package-dir = {"primary_persona" = "src"}
packages = ["primary_persona"]
