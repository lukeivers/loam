  pre_d1_baseline_recovery:
    method: "git show 57d735f^:<old-path>/tests/test_no_sealed_amendments.py | grep '^BASELINE = '"
    path_form_pre_d1: "bare <comp>/ (e.g. cost-governance/tests/test_no_sealed_amendments.py)"
    path_form_post_d1: "framework/<comp>/ (e.g. framework/cost-governance/tests/test_no_sealed_amendments.py)"
