amendment:
  slug: session-clear-safety-r1-priority-register-backfill
  title: "session-`/clear` safety R1 — priority-ordered open-loop digest + existing-workspace tracker backfill (sub-amendment 2 of 3). Turns the sealed-but-starved tracker-context SessionStart channel load-bearing: the digest the persona reads is ordered by open-loop priority (owner_pending > active > proposed), NOT query/recency order (the exact RESUME-STATE failure). owner_pending objectives surface as open loops tagged AWAITING OWNER, never collapsed into done (AC.SCS-R2.2, staged into R1 per D-SCS.4 — the digest surface lives in primary-persona/tracker_context.py, structurally unsatisfiable in R2's objective-tracker-only fence). AC40.5 empty-when-none preserved (AC.SCS-R1.3). New production update entry-point backfill_tracker_for_existing_workspace composes the existing classify→load→path→seed pipeline, bypassing the run_first_run_scaffold already_scaffolded short-circuit (that short-circuit IS the defect — it stops the amendment-39 seed ever running for an already-scaffolded workspace); idempotent query-then-skip (amendment-39 already_seeded precedent, no clobber). AC.SCS-R1.4 is the outcome-altitude AC: an existing, already-initialized, never-seeded workspace, run through the production entry-point with no pre-arranged tracker state, ends populated + parented (the defect's exact inverse). Build-cycle AC scope AC.SCS-R1.{1,2,3,4,S} + AC.SCS-R2.2 (D-SCS.4). Seal anchor primary-persona; objective-tracker + workspace-bootstrap admitted for the register/seed/backfill surface. ODD §4 re-extension of the sealed recency-only digest outcome contract — priority-altitude outcome added, named not silently widened (§10 finding B). R1 consumes R2 (sealed: owner_pending must be representable before the digest can rank-by-owner-pending). Parent plan: session-clear-safety-tracker-register-and-first-run-update-parity.md §7 sub-amendment 2."

