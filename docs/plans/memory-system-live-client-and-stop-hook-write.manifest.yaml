narrative:
  target: hands-off-lifecycle/seals/SEAL_COMMIT.true-first-run
  body: |
    # Amendment #48 — primary-persona live MCP memory client +
    #                  Stop-hook turn-close write

    2026-04-26. Closes the two production-wiring gaps remaining after
    amendments #46 (persona session-start + user-prompt-submit
    emitters, sealed at de678f5) and #47 (workspace-local .mcp.json
    writer, sealed at 1498c86): the persona's
    `_default_memory_client_factory` was returning None (so the
    memory-retrieval contributor never registered in production), and
    no caller drove `TurnAggregator.close_turn(...)` at user↔AI turn-
    close (so no episodes ever landed in the memory graph). Per
    locked plan
    `docs/plans/memory-system-live-client-and-stop-hook-write.md`
    §6 D1–D12.

    Surface added (primary-persona):

      - `primary-persona/src/mcp_memory_client.py` (new) — D1.
        Exposes `LiveMCPMemoryClient` (Protocol-shape adapter) and
        `build_live_mcp_memory_client(workspace_root)` factory. Reads
        `<workspace>/.mcp.json` (authored by amendment #47), pulls
        the `memory-graphiti` URL, and returns a Protocol-conforming
        adapter. Per-call streamable-HTTP MCP handshake (no
        connection pooling — plan §9 explicit out-of-scope). Returns
        None on every malformed-substrate branch (AC.M.3).
      - `primary-persona/src/stop_emitter.py` (new) — D2 / D3 / D4 /
        D7 / D8 / D11. Carries `cli_stop` (Stop-hook entry point —
        AC.M.4 / AC.M.7) and `cli_memory_write` (detached subprocess
        entry — AC.M.6 / AC.M.10). Stop subprocess: parse envelope,
        recover user message + assistant reply from `transcript_path`
        (D11 graceful-no-op on `/compact` / ESC-interrupt empty
        shapes), derive stable turn id (D4: sha256 of user message),
        dedupe via `<workspace>/.pos/last-turn-id` marker (AC.M.8),
        detach background subprocess via Popen with
        `start_new_session=True` (D3). Detached child: synchronously
        drives one `add_episode` via `TurnAggregator.close_turn`
        against the live MCP client; structured NDJSON diagnostic to
        `<workspace>/.pos/memory-writes.log` on every path (D8).
      - `primary-persona/src/session_start_emitter.py` —
        `_default_memory_client_factory` body now delegates to
        `build_live_mcp_memory_client` (AC.M.1 + AC.M.2 production-
        completion of AC-D7.1). New `build_persona_stop_inner_hook`
        helper mirrors `build_persona_session_start_inner_hook` /
        `build_persona_user_prompt_submit_inner_hook` shape exactly
        (D6 timeout=5).
      - `primary-persona/src/cli.py` — `stop` subparser (routes to
        `cli_stop`) and `memory-write` subparser (routes to
        `cli_memory_write` with --workspace, --turn-id, --session-id,
        --user-message, --assistant-reply args). Both return 0
        unconditionally per AC.M.4 / AC.M.10.
      - `primary-persona/src/__init__.py` — re-exports the new
        symbols.
      - `primary-persona/pyproject.toml` — adds `mcp==1.27.0` runtime
        dep (D5 exact-version pin matching memory-system's pin).

    Surface added (hands-off-lifecycle):

      - `hands-off-lifecycle/hooks/first_run_settings.py` —
        `_POS_V2_STOP_COMMAND_MARKERS` tuple +
        `_is_pos_v2_owned_stop` predicate + `merge_stop(*,
        settings_path, new_entry, now_iso=None)` mirroring
        `merge_user_prompt_submit` shape exactly (single-contributor;
        plan §9 defers multi-contributor generalisation).
      - `hands-off-lifecycle/hooks/first_run_helper.py` —
        `_persona_stop_stanza` (lazy-import + fail-soft helper that
        yields the Stop envelope or None) and `_maybe_merge_stop`
        (fire-and-forget wrapper). Three call sites (Phase 3d ~L1715,
        Phase 4c re-merge ~L1925, Phase 6 self-retire ~L1295) get an
        additional `_maybe_merge_stop(...)` invocation immediately
        after each existing `_maybe_merge_user_prompt_submit` call.

    Behaviour:

      - Every Claude Code session in a pos-v2 workspace whose
        memory-graphiti service is reachable receives the per-turn
        memory retrieval contributor's output as UserPromptSubmit
        additionalContext (AC.M.2 / AC-D7.1 production-completion).
        Pre-#48 the contributor was never registered; post-#48 it
        IS registered when the substrate is ready and OMITTED
        gracefully when it isn't (AC.M.3).
      - Every user↔AI turn produces exactly one aggregated episode
        in the memory graph (AC.M.6). The Stop hook returns in
        milliseconds (AC.M.7); the actual write completes in a
        detached background subprocess. Re-firing Stops on the same
        turn (recursive / `/compact` / interrupt-replay) deduplicate
        on the workspace-local turn-id marker (AC.M.8). `/compact`
        and ESC-interrupt empty-content shapes are graceful no-ops
        (AC.M.9).
      - Fail-soft chain unchanged from earlier amendments:
        SessionStart / UserPromptSubmit / Stop hooks all exit 0 on
        every path; missing or broken primary-persona install
        degrades each hook independently to its
        pre-amendment-#48-equivalent behaviour. Live-client failure
        during write surfaces a structured diagnostic to
        `<workspace>/.pos/memory-writes.log`; the main session is
        unaffected (AC.M.10).

    Re-extension under existing objectives per ODD §4 — anchors to
    the v1.0 architectural "persistent + retrievable memory"
    objective (umbrella plan §2; VALUE_PROPOSITION's "today's
    response is informed by yesterday's decisions") and the D7
    AC-D7.1 + AC-D7.2 production-completion. No new spec v1.x
    clause; this is the load-bearing wiring of substrate already
    built across #32 (D8 composer), #33 (D7 memory consumer), #46
    (SessionStart + UserPromptSubmit emitters), and #47
    (workspace-local .mcp.json writer).

    AC surface (AC.M.1 – AC.M.S) — outcome-shaped per locked plan
    §5. Test files mirror the #41 one-file-per-AC convention.

    Method-level decisions D1–D12 LOCKED by Luke 2026-04-26 are
    recorded in the locked plan §6.

    BASELINE de5fe11 (pre-amendment tip — HEAD at dispatch).
    primary-persona's BASELINE advances per `pos-amend apply`.
    hands-off-lifecycle's H19 frozen BASELINE stays at 3780603 per
    amendment #23. SEAL_COMMIT sidecars land at the amendment commit
    on the empty-diff window; advanced to the seal SHA via
    `pos-amend seal`.

    Out of scope (locked plan §9, named explicitly):

      - Persona content authoring (umbrella plan §4c Q1 deferred).
      - Auto-memory ↔ graphiti unification.
      - Memory seeding (real episodes accumulate organically).
      - Cross-workspace memory keying (group_id = workspace slug).
      - Per-scope group_id, per-message aggregation.
      - Awareness-block contributor for "memory writes failing".
      - Live client used by orchestrator / objective-tracker /
        scope-of-work / self-correction (first-wave consumer is
        primary-persona only per Rule A from amendment #33).
      - Multi-contributor `hooks.Stop` registry (single-contributor
        for now; future amendment).
      - MCP client connection pooling / reuse across hook invocations.
      - `SubagentStop` registration (Stop-only).
      - Stop-hook stdout as additionalContext (per Claude Code docs
        Stop stdout doesn't reach additionalContext).

    With this amendment, the persona's per-turn memory retrieval +
    turn-close write are LIVE end-to-end. The "is the memory system
    actually being used?" question is structurally answered: yes,
    every turn writes one aggregated episode and every prompt
    receives the retrieval block when memory is reachable.
