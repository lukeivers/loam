mately don't author new ACs; future amendments can audit log to characterise no-AC traffic + rule on tightening to refusal per plan §10 D-build.M4.3). Recursion handling: LOAM_DISPATCH_BYPASS_HOOK=1 env-var bypass + sentinel-already-written idempotency (theoretical today since dispatch_with_scope has zero production callers; design-for-future per plan §10 D-build.M4.4). AC declaration format: <AC-MANIFEST>...</AC-MANIFEST> CSV block (stdlib csv.reader parseable; namespace-segregated marker — verified at plan-authoring no collision per plan §11 finding #4; recommended per plan §10 D-build.M4.2). 6 new test files (5 in hands-off-lifecycle: test_AC_OSS_M4_1_setup_phase_runs.py + test_AC_OSS_M4_2_ac_declaration_parsing.py + test_AC_OSS_M4_3_pre_tool_use_composition.py + test_AC_OSS_M4_5_normal_use_short_circuit.py + test_AC_OSS_M4_6_fail_soft_diagnostic.py; 1 in primary-persona: test_AC_OSS_M4_4_public_stub_writer.py — covers AC.OSS-M4.4 public surface). Sealed-component fence: 2 components — primary-persona + hands-off-lifecycle (per plan §10 D-build.M4.6). HC#4 byte-content sample status: NO RETIRE-AND-REBASELINE (no HC#4 sample paths under either touched component impacted by M4 diff; verified at plan-authoring per plan §11 finding #6). Critical architectural finding surfaced + accommodated at plan-authoring: Claude Code's PreToolUse hook protocol allows only allow/deny/ask outputs — cannot wrap tool execution; dispatch's enumeration of four gates is satisfied by the disk-side setup phase (per amendments #52/#74 setup-phase semantics) per plan §11 finding #1 + §10 D-build.M4.1. IPC-bound gate chain (cost/safety/reversibility/orchestrator wraps inside activate_scope_with_spec) stays as explicit-call surface for in-process dispatch_with_scope callers — out of M4 scope per dispatch + plan §6."

