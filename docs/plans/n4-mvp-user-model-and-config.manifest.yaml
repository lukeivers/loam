schema_version: 1
amendment:
  number: 159  # Next free counter after #158 (N3 onboarding, in flight on its own
               # branch). Re-check at build time — if another slice seals first,
               # advance to the next free number.
  slug: n4-mvp-user-model-and-config
  title: "N4 — MVP user-model + config (the adaptive interaction-model's first real brick): READ the openness-biased INTERACTION-MODEL.md matrix N3 seeded and INJECT the per-area exposure/autonomy cell onto the LIVE keep-pace UserPromptSubmit hook every turn (compose on the existing contributors() seam + the KP1 work-anchor — NO new hook), so the persona's behaviour actually adapts per area; PLUS explicit-override (stated preference -> cell hard-set + confidence high + locked) + plain-language inspect (render the cells in prose, never the raw file) + the FBM rule auto-weighting HOME (infer a coarse weight band + surface for confirm over the B1 weight: frontmatter mechanism — never silent-write). Openness-default is PRE-RULED (G5: expose substance, adapt only vocabulary). MVP FENCE: read + inject + override + inspect + auto-weight-surface ONLY; the full engine (behavioural signal counters + hysteresis + fast-down-on-distress + tone/learning-appetite adaptive axes + weekly re-eval consolidation + drift judge = design AIM-4..8) is the LATER remainder, explicitly OUT — cells move ONLY by explicit statement in this slice. AC.UM.READ/AREA/OVR/INSP/WT/FENCE incl. the ★ outcome-altitude AC.UM.READ.4 (the REAL user-prompt-submit hook, given a seeded matrix, injects the correct per-area cell — verified at the live entry-point, not a unit test of an inner function). Forks D-N4.1..4 (area-classifier mechanism / enforce-path inclusion / override-lock / auto-weight aggressiveness) carry recommendations — dispatcher in FULL-AUTONOMY rules them fast."

# BASELINE: f1f6116 — current main HEAD (carries the full kernel + onboarding;
# N3's seed-writer that WRITES ~/.claude/INTERACTION-MODEL.md at confidence:prior
# is live on main). N4 reads that file; it does NOT re-seed or re-shape it. N4
# evolves in place on main. The plan branch (plan/n4-mvp-user-model-and-config)
# is off f1f6116; code lands on the build branch. Re-check at build time if main
# advances (N3 may merge first — re-baseline onto the merged tip).
baseline: "f1f6116"

plan: docs/plans/n4-mvp-user-model-and-config.md

components:
  # EXTEND hands-off-lifecycle: the read+inject path is a NEW fail-soft
  # Contributor registered in the LIVE keep_pace contributors() list
  # (framework/hands-off-lifecycle/hooks/keep_pace/user_prompt_submit.py) — NO
  # new hook, NO chain-runner change. The enforce-path (D-N4.2, recommended IN)
  # parameterizes the KP9 draft_gate threshold by the active area's
  # technical-exposure cell. Both surfaces live here.
  - name: hands-off-lifecycle
    seal_test: framework/hands-off-lifecycle/tests/test_cross_cutting.py
    sidecar: framework/hands-off-lifecycle/tests/SEAL_COMMIT
    frozen_baseline: true   # H19 pinned at project-start per amendment #23
    extra_allowed_prefixes: []
  # EXTEND primary-persona: the area-classifier reads the EXISTING WorkAnchor
  # (keep_pace/work_anchor.py) — it does NOT recompute the anchor. The matrix
  # reader/writer (override hard-set in the seed-writer's format) + the
  # plain-language inspect renderer (prose, never raw file) land here alongside
  # the per-turn read-path the persona already owns. Exact module layout is the
  # builder's call per ODD §1.1.
  - name: primary-persona
    seal_test: framework/primary-persona/tests/test_no_sealed_amendments.py
    sidecar: framework/primary-persona/tests/SEAL_COMMIT
    frozen_baseline: false
    extra_allowed_prefixes: []

