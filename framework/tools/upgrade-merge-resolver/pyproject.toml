[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-upgrade-merge-resolver"
version = "0.1.0"
description = "Clause-(h) merge-resolver factory for `loam upgrade --merge-resolver-module` (post-M1g namespace pivot per M1e §11 finding #4)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]
