narrative:
  target: docs/plans/sealed/claude-leverage-program-s2-doctrine.md
  body: |
    # Claude-leverage program Slice 2 — DOCTRINE — apply ladder

    Second of four slices under the master plan
    `docs/plans/claude-leverage-program.md`. Delivers D-CLP.1 (RULED at
    master: layered enforcement — doctrine text alone has already failed
    in this workspace per feedback_structural_enforcement_on_recurrence):
    when loam (persona or dispatched agent) is about to do work directly
    or build a bespoke equivalent of a catalogued Claude primitive, an
    observable check fires on the production path. Consumes Slice 1's
    sealed currency machinery (seal c41f9473) as the catalogue the check
    consults, and lands Slice 1's two named D-CUR.5 handoffs.

    This amendment:
      1. Graduates the pos3 prototype trio into plugins/loam-skills
         (catalog → decide → record): claude-feature-awareness re-cut as
         a thin lookup over docs/capability-corpus/ with NO independent
         capability claims (the gap-analysis §3.2 structural fix — the
         corpus is the one refresh-kept claims surface);
         tool-selection-rubric with facts re-verified live at build +
         corpus pointers; primitive-rationale-check documenting the
         audit-trail line the new hook enforces. README rewritten from
         disk (§3.3 fix; meta-decision-haiku labeled
         planned-not-yet-packaged per the sealed lsk1 F3 ruling).
         (AC.CLP-DOC.1, .5, .6)
      2. Lands the dispatch-time structural check: PreToolUse hook on the
         Task matcher in plugins/dev-sdlc/hooks/ (fifth sibling of the
         guard family, same envelope + NDJSON audit + dev-mode
         short-circuit + fail-open-on-error). Two-tier posture: precise
         bespoke-equivalent match without a primitive-rationale: line →
         DENY naming the primitive + the one-line fix; low-confidence →
         allow + systemMessage warn. The rationale line IS the hatch and
         IS the audit record; emergency-off env/sentinel is logged.
         Matcher data rows each name their corpus entry; a bidirectional
         coverage guard makes corpus↔check drift observable (a
         refresh-added entry without coverage turns the suite red — no
         frozen list). Fire path: file-reads only, no network, no LLM,
         within the AC.CLP-DOC.7 latency bound; Task-matcher scoping adds
         zero cost to all other tool calls. (AC.CLP-DOC.2 ★, .4, .7, .8)
      3. Wires the hook for bootstrapped workspaces via the
         first_run_settings.py marker+stanza (A4 precedent) — the sole
         reason hands-off-lifecycle is in this fence.
      4. Adds the plan-time leg: plan-docs convention + plan template
         carry a REQUIRED "Primitive check" section; this cycle's plan-doc
         §2bis is the first conforming instance. (AC.CLP-DOC.3)
      5. Pre-seal ride-alongs per the F-SEAL-GUARD-SWEEP-FLOOR lesson:
         primary-persona's AC.α.8 capability-content guard (skill/hook
         content carries no schema-marker strings) + touched components'
         full suites. (AC.CLP-DOC.S)

    Out with named handoffs: pos3 prototype retirement (workspace chore,
    dispatcher-side); the runtime/persona-path check for NORMAL-USE
    workspaces (master §2 row 4 "second" — own cycle); a plan-lint hook
    (named escalation if plan-time non-adherence recurs); the
    /goal-vs-bespoke RULING (Slice 3's).

    NO public-action steps; NO Anthropic API key anywhere. BASELINE
    a8bbc3f7 — HEAD at sub-plan authoring; counter 185 next free; builder
    confirms both at apply time.
