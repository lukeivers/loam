[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-odd-extractor"
version = "1.1.0"
description = "loam odd-extractor — Cartographer-style ODD reverse-engineering scaffold for the dev-sdlc plugin. Cycle 1 (v0.1.8): four-stage workflow shape (init/analyze/generate/verify) + language-adapter registry (zero adapters) + dry-run cost estimate via cost-governance + foreign-codebase budget envelope. Cycles 2-4 ship confidence bands, ratification workflow, Ruby/Rails first-class adapter, Python first-class adapter."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6",
    "pydantic>=2",
    "loam-cli",
    "loam-cost-governance",
    # v0.1.8 Cycle 3 — Ruby/Rails first-class adapter. tree-sitter
    # provides the AST library; tree-sitter-ruby provides the Ruby
    # grammar. Both ship as pre-compiled wheels (no native compile
    # step on user machines). Per cycle plan-doc Surface #8 — these
    # are required (not optional) since the Ruby adapter is part of
    # the package's public surface from this cycle on.
    "tree-sitter>=0.23",
    "tree-sitter-ruby>=0.23",
    # v0.1.8 Cycle 4a — JS/TS/Playwright first-class adapter.
    # tree-sitter-javascript covers .js/.mjs/.cjs/.jsx;
    # tree-sitter-typescript covers .ts (typescript grammar) and
    # .tsx (tsx grammar). Both pre-compiled wheels. Per cycle
    # plan-doc Surface #11 — required (not optional) since the
    # JS/TS adapter is part of the package's public surface from
    # this cycle on; lazy-imported at first parse-call so
    # ``import loam_odd_extractor`` is still cheap.
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
# v0.2.5 corrective C4-pivot — synthesis routes through `claude -p`
# subprocess (Claude Max subscription auth via OAuth keychain) NOT
# the Anthropic SDK. The `[synthesis]` extra (anthropic>=0.40) is
# REMOVED; no PyPI-installable LLM SDK dependency exists. The
# `claude` CLI must be on PATH for `--live` extraction to function;
# this is an out-of-band install
# (https://docs.anthropic.com/claude-code), not a Python dep.
# Owner ruling 2026-05-05 (Telegram 10194): subscription only,
# never an Anthropic API key. See
# `docs/plans/v0-2-5-corrective-c4-pivot-claude-print-synthesis.md` §14.

# AC.OREK.1 / AC.OREK.2 — the unified loam CLI dispatcher's
# `loam.cli.subcommands` entry-point group resolves `loam odd-extract`
# to this builder. Mirrors the loam-amend / loam project precedents.
[project.entry-points."loam.cli.subcommands"]
odd-extract = "loam_odd_extractor.cli:build_odd_extract_subcommand"

# AC.OREK.4 — language-adapter registry discovers adapters via this
# entry-point group. Cycle 1 ships zero adapters; Cycle 3 (Ruby)
# populates first, Cycle 4 (Python) extends. The group name is
# namespaced under loam.odd_extractor for collision avoidance with
# future loam features.
[project.entry-points."loam.odd_extractor.language_adapters"]
# Resolve to a module-level factory callable that returns the
# singleton instance (per Cycle 3 plan-doc Surface #1 — adapter
# instances are stateless; the singleton avoids re-instantiating
# the parser cache on every discover_adapters() call).
ruby = "loam_odd_extractor.lang.ruby.adapter:_singleton_factory"
# Cycle 4a (v0.1.8) — JS/TS/Playwright adapter. Same factory
# pattern as Ruby per plan-doc §3 + Surface #1 mirror.
jsts = "loam_odd_extractor.lang.jsts.adapter:_singleton_factory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
