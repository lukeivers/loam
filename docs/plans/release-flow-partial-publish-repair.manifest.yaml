schema_version: 3
amendment:
  # Slug-identified (schema v3); no number pre-allocated
  # (feedback_version_numbers_at_release_time). Class: PATCH (DEV);
  # scheduling: lands BEFORE the next publish of any class
  # (publish-gate dependency per roadmap §4 Candidate 7).
  slug: release-flow-partial-publish-repair
  title: "Release-flow partial-publish repair — a `loam release` re-run completes a partial publish instead of declaring 'nothing to do': the already-on-origin branch (with --release) detects a missing GitHub Release and creates it with generated notes; release-notes generation resolves plan-docs under the release-integration-v<X-Y-Z>.md naming and accepts the explicit --plan-doc path; the flow reports a --release publish complete only when tag AND Release both exist; the reworked branch honors --dry-run (no Release create, no backfill commit/push) and stays a no-op on fully-published versions. From the v1.5.0 live incident (FIDRAFT F-RELEASE-FLOW-PARTIAL-PUBLISH-NOT-REPAIRABLE). loam-cli fence only; shared loam_amend plan locator byte-unchanged; LOCAL only."

# BASELINE: f76164a4 — canonical main tip at plan-authoring. Builder
# re-walks to the canonical-clean pre-this-amendment HEAD at apply time
# if main moved.
baseline: "f76164a4"

plan: docs/plans/release-flow-partial-publish-repair.md
plan_doc_ref: docs/plans/release-flow-partial-publish-repair.md

ac_count: 4
smoke_outcome: "Production release entry-point on a tag-only fixture (--release, faked gh/remote): Release created with real notes; fully-published re-run no-op; --dry-run mutates nothing; sibling tests green."

# Fence (plan §5): loam-cli only. The shared loam_amend.plan_locator and
# everything under plugins/dev-sdlc/ stay byte-unchanged (D-RFPR.1);
# touching them is a fence breach -> halt (plan §6.3).
components:
  - name: loam-cli
    seal_test: framework/tools/loam/tests/test_no_sealed_amendments.py
    sidecar: framework/tools/loam/tests/SEAL_COMMIT
    frozen_baseline: false
    extra_allowed_prefixes: []

universal_paths:
  prefixes:
    - docs/plans/
  files: []

narrative:
  target: docs/plans/sealed/release-flow-partial-publish-repair.md
  body: |
    # release-flow-partial-publish-repair — apply ladder

    Publish-gate dependency PATCH. Plan:
    `docs/plans/release-flow-partial-publish-repair.md`.

    Closes the v1.5.0 live incident's root cause (FIDRAFT
    F-RELEASE-FLOW-PARTIAL-PUBLISH-NOT-REPAIRABLE): the release
    runner's already-on-origin branch returned "nothing to do" with
    the GitHub Release missing, so a partial publish (tag pushed,
    Release never created) was unrepairable by re-run and recovery
    was a manual cross-package kludge. Sibling: the notes
    generator's plan-doc lookup missed the
    release-integration-v<X-Y-Z>.md naming (notes degraded to
    "(unavailable)" — visible on the published v1.4.0 Release), and
    the explicit --plan-doc flag never reached notes generation.

    Fix shape (plan §10): Release-existence detection + repair in
    the already-on-origin branch behind the existing --release
    opt-in; release-side naming resolution (shared loam_amend
    locator untouched, D-RFPR.1); plan-doc threaded into
    generate_notes (D-RFPR.2); dry-run honored across the reworked
    branch including the pre-existing backfill-mutates-on-dry-run
    latent bug (D-RFPR.4); both-halves completeness reporting scoped
    to --release runs (D-RFPR.5). Adjacent manifest-sweep-before-
    release-prep-stubs item ruled OUT of fence with disposition
    recorded (D-RFPR.3).

    AC family AC.RFPR.1-4 (plan §4); AC.RFPR.3 is outcome-altitude
    (production entry-point on a deliberately tag-only fixture, no
    pre-arranged repair state, ends with the Release existing).
    Idempotency on fully-published versions is AC.RFPR.4, not a hope.

    Ladders to roadmap §4 Candidate 7 -> the publish flow's "SHIPPED
    PUBLIC means user-visibly shipped" promise -> AC.PO.2
    (protection: feedback_published_state_only_from_git_refs — the
    tag ref was green while the user-visible Releases page was stale
    for a day).
