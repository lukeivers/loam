narrative:
  target: framework/primary-persona/tests/SEAL_COMMIT.notes
  body: |
    # M-FBM — file-based memory baseline (memory-substrate pivot)

    2026-05-01. v0.1.0 publish-blocker per master plan
    `oss-v0-1-0-publish.md` §5 + series master
    `oss-v0-1-0-publish-memory-pivot.md`. Two-amendment series
    replacing graphiti as v0.1.0 default memory substrate; M-GMP
    (graphiti-memory plugin migration) defers to the v0.1.x lane
    post-M12.

    Empirical justification (per series master §1 + research):
    1 retrievable episode after weeks; 216MB graphiti err.log at
    plan-time; 4 sealed amendments today (#92/#94/#95/#96) didn't
    fix reliability; sidecar crashed at 16:04:27 today under normal
    workload; 3 of 4 RED-class graphiti surfaces unexercised by
    persona's actual retrieval path; auto-memory MEMORY.md already
    carries 24 hand-curated rules at zero infra cost. M-FBM removes
    graphiti from v0.1.0 runtime; M-GMP relocates the source as a
    plugin post-publish.

    All six §11 decisions ruled to plan recommendations 2026-05-01:

      - D-Q.MFBM.1 — Episode shape: one markdown file per turn.
      - D-Q.MFBM.2 — Retrieval: layered grep + BM25 via sqlite-FTS5;
        no embedding index at v0.1.0.
      - D-Q.MFBM.3 — Memory dir:
        `<workspace>/workspace/.loam/memory/` (D.2-shape; sibling of
        `<workspace>/workspace/.pos/`; the plan recommended
        `<workspace>/.loam/memory/` aligned to M1b's pending rename;
        builder pivoted to the actual landed shape per the plan's
        D-Q.MFBM.3 builder-pivot clause — M1b has not landed at
        M-FBM dispatch time, and `<workspace>/workspace/.loam/`
        is the post-D.2 sibling-of-`.pos` path that survives M1b's
        future `.pos`→`.loam` rename without data move).
      - D-Q.MFBM.4 — Auto-memory orthogonal (no merge, no mirror).
      - D-Q.MFBM.5 — Both bootstrap.contributions +
        `loam.memory.providers` entry-point groups; M-FBM authors
        the `MemoryProvider` Protocol stub (zero runtime impact);
        M-GMP implements graphiti's provider against it.
      - D-Q.MFBM.6 — kuzu_db: discard with one-shot inspection
        script. Inspection result on pos3 at amendment time:
        kuzu_db = 2.9 MB, 0 episode_uuid byte-occurrences,
        episodes.json fixture record count = 34 (test fixture, not
        live data). Research §5 evidence confirmed; halt-trigger
        §9.8 does NOT fire.

    Surface changes (multi-component fence — primary-persona
    component + cross-component admissions for hands-off-lifecycle
    test-fixture updates + new tool authoring + partition manifest
    edit):

      - `framework/primary-persona/src/loam/primary_persona/
        file_memory.py` — NEW module. `FileMemoryStore` (one
        markdown file per turn under `<memory_dir>/episodes/<group>/
        <YYYY-MM-DD>/<turn-id>.md`; sqlite-FTS5 BM25 retrieval with
        grep fallback; archive primitive backing `/memory:archive`
        per AC.MFBM.6) + `MemoryProvider` Protocol stub
        (D-Q.MFBM.5; M-GMP implements graphiti's provider) +
        `FileBackedMemoryClient` adapter satisfying
        `MemoryClient` Protocol (so the post-amendment-J memory-
        write worker drains queue entries to file; AC.J.5
        preserved; substrate flips from MCP to file-based at the
        worker's `client_factory` default).
      - `framework/primary-persona/src/loam/primary_persona/
        session_start_emitter.py` — `_default_memory_client_factory`
        returns `None` post-M-FBM; `build_session_composer` now
        registers the file-based contributor in the `client is None`
        branch. Per AC.MFBM.5: zero MCP instantiation in the runtime
        retrieval path. Pre-existing MCP path preserved as typed
        surface for tests + M-GMP.
      - `framework/primary-persona/src/loam/primary_persona/
        memory_write_worker.py` — `drain_once`'s default
        `client_factory` flips from
        `mcp_memory_client.build_live_mcp_memory_client` to
        `file_memory.build_file_backed_memory_client`. AC.J.5
        preserved (worker drains; one episode write per queue
        entry); substrate-default change only.
      - `framework/primary-persona/src/loam/primary_persona/
        stop_emitter.py` — `cli_memory_write` docstring updated to
        record M-FBM substrate-default flip; symbol-level call
        path UNCHANGED (legacy MCP-callable surface preserved per
        AC.J.8 backwards-compat; tests that monkeypatch
        `mcp_memory_client.build_live_mcp_memory_client` continue
        to bind).
      - `framework/primary-persona/src/loam/primary_persona/
        __init__.py` — re-exports `FileMemoryStore`,
        `FileMemoryRetrievalConfig`, `MemoryProvider`,
        `build_file_memory_retrieval_contributor`,
        `memory_dir_for_workspace`,
        `register_file_memory_retrieval`. Retires
        `LiveMCPMemoryClient` + `build_live_mcp_memory_client`
        re-exports (module stays on disk for M-GMP).
      - `framework/primary-persona/skills/memory-search.md` +
        `memory-archive.md` — NEW skill markdown files authoring
        the user-facing `/memory:search` + `/memory:archive`
        surfaces per AC.MFBM.6.
      - `framework/primary-persona/tests/
        test_AC_MFBM_1_stop_writes_episode_file.py` (5 tests),
        `test_AC_MFBM_2_ups_retrieval_returns_relevant.py` (6
        tests), `test_AC_MFBM_5_no_mcp_runtime_instantiation.py`
        (4 tests) — NEW. AC.MFBM.1/2/5 test families.
      - `framework/primary-persona/tests/
        test_AC46_2_user_prompt_submit_cli_emits_retrieval.py` +
        `test_AC_M_3_memory_unreachable_graceful_empty.py` —
        fixture updates per `feedback_loose_AC_text_fix_AC_not_
        implementation`. Pre-M-FBM "no retrieval block when
        memory unwired" → post-M-FBM "empty-state retrieval block
        when memory dir empty" (the file-based contributor is the
        production default; graceful-empty contract is satisfied
        by the `(no results for this query)` block). The
        underlying invariant (no exception, hook fan-out
        unblocked) is unchanged.
      - `framework/tools/pos-publish-framework-only/
        publish-mode-manifest.yaml` —
        `framework/memory-system/**` reclassifies
        `dev_and_public` → `dev_only` per AC.MFBM.3 (file-based
        memory is the v0.1.0 default substrate; graphiti retires
        to v0.1.x plugin via M-GMP). New `framework/tools/loam-
        memory-inspect/**` glob (one-shot kuzu_db inspection per
        D-Q.MFBM.6).
      - `framework/tools/pos-publish-framework-only/tests/
        test_AC_OSS_3_default_partition_complete.py` —
        memory-system path moves from the dev_and_public sample
        to the dev_only sample.
      - `framework/first-run-inventory.yaml` — retires
        `dedicated_venvs[memory-system]` + `services[memory-
        graphiti]` per AC.MFBM.7. The orchestrator service
        remains. Memory-system retires to v0.1.x plugin via
        M-GMP.
      - `framework/hands-off-lifecycle/tests/
        test_d1_byte_content_match.py` — HC#4 retire-and-
        rebaseline for `framework/primary-persona/src/loam/
        primary_persona/__init__.py` +
        `session_start_emitter.py`. Per
        `feedback_loose_AC_text_fix_AC_not_implementation` ODD
        §4 in-band rebaseline.
      - `framework/hands-off-lifecycle/tests/test_first_run.py`
        — T7-T9 + T14 + AC7 inventory tests updated to reflect
        the retired memory-graphiti service + dedicated venv.
      - `framework/tools/loam-memory-inspect/` — NEW one-shot
        inspection tool per D-Q.MFBM.6. Read-only; reports file
        sizes + episode_uuid byte-occurrence proxy +
        episodes.json fixture record count. Stdlib-only.
      - `docs/plans/oss-v0-1-0-publish.md` (commit #2 of
        the build sequence; landed at BASELINE) — master plan §5
        row update inserts M-FBM between M5 and M6 + adds M-GMP
        in v0.1.x lane; §6 ASCII sequencing diagram updated;
        §5 critical-path total updated 9-14h → 11-17h midpoint
        ~13h.

    AC surface (AC.MFBM.1..7 + AC.MFBM.S):

      - AC.MFBM.1 — Stop-hook writes one markdown file per turn
        under `<workspace>/workspace/.loam/memory/episodes/<group>/
        <YYYY-MM-DD>/<turn-id>.md`. Verified by 5-test family at
        `test_AC_MFBM_1_stop_writes_episode_file.py`.
      - AC.MFBM.2 — File-based retrieval contributor returns
        relevant prior-session episodes; ≥7 of 10 fixture bar.
        Verified by 6-test family at `test_AC_MFBM_2_ups_retrieval_
        returns_relevant.py` — the 7-of-10 fixture sweep, fail-
        closed on dir-deletion mid-search, canonical shape,
        group_id isolation, empty-query.
      - AC.MFBM.3 — Synthesis output drops graphiti runtime dep.
        Verified by partition manifest reclassification + the
        AC.OSS.3 partition spot-check test moving memory-system
        to the dev_only sample.
      - AC.MFBM.4 — kuzu_db migration: discard. Verified by the
        amendment doc carrying a one-line "discarded" note + the
        loam-memory-inspect tool's run-at-amendment-time output
        captured in this narrative (research §5 evidence
        confirmed: 0 episode_uuid byte-occurrences in pos3's
        kuzu_db).
      - AC.MFBM.5 — Persona's MCP-client wiring retires from
        runtime. Verified by 4-test family at `test_AC_MFBM_5_no_
        mcp_runtime_instantiation.py` — default factory returns
        None, file-based contributor registers in production,
        no MCP import in factory source, MemoryProvider Protocol
        importable.
      - AC.MFBM.6 — `/memory:search` + `/memory:archive` skills
        ship. Verified by skill markdown files at
        `framework/primary-persona/skills/memory-search.md` +
        `memory-archive.md`. Underlying mechanics (BM25 search,
        archive primitive) covered by AC.MFBM.1/2 tests.
      - AC.MFBM.7 — first-run-inventory drops graphiti-service.
        Verified by inventory file diff + T14 inventory test
        update + the inspection tool confirming graphiti
        retirement at v0.1.0.
      - AC.MFBM.S — Sealed-component fence: only paths under
        primary-persona, hands-off-lifecycle, framework/tools/
        pos-publish-framework-only, framework/tools/loam-memory-
        inspect, framework/first-run-inventory.yaml, or universal-
        paths. Memory-system source UNTOUCHED.

    Method-level choices (builder's call per ODD §1.1):

      - D-build.M-FBM.1 — Memory dir at
        `<workspace>/workspace/.loam/memory/` (post-D.2 sibling-
        of-`.pos`; survives M1b future rename without data move).
      - D-build.M-FBM.2 — sqlite-FTS5 BM25 with grep fallback over
        the most recent ~200 files; tokenisation = `\\W+` split.
      - D-build.M-FBM.3 — Episode file body shape: YAML-ish
        frontmatter (`name`, `source`, `source_description`,
        `reference_time`, `group_id`) + body. Stdlib-only
        frontmatter parser.
      - D-build.M-FBM.4 — `FileBackedMemoryClient` adapter
        satisfies `MemoryClient` Protocol so the existing post-
        amendment-J worker pipeline survives intact (queue +
        worker; substrate-default flip only).
      - D-build.M-FBM.5 — `MemoryProvider` Protocol shape:
        `add_episode` + `search` + `health`. Three methods
        cover the substrate contract.
      - D-build.M-FBM.6 — kuzu_db inspection: read-only;
        episode_uuid byte-scan as proxy when no kuzu client on
        PATH; fixtures.json record count surfaced separately.

    Halt-and-surface findings (none triggers a halt):

      - Plan-§9.8 (kuzu_db inspection contradicts research §5):
        DOES NOT FIRE. Inspection report at amendment time:
        0 episode_uuid byte-occurrences in pos3's kuzu_db proper;
        34 fixture records in episodes.json (test fixture, not
        live data). Research §5 "1 episode after weeks" evidence
        confirmed (the fixture-set is test data, not live
        retrievable episodes).
      - HSF#1 — pre-M-FBM AC text "no retrieval block when
        memory unwired" required updating per
        `feedback_loose_AC_text_fix_AC_not_implementation`
        because post-M-FBM the file-based contributor IS the
        production default. Two AC fixture-level updates landed
        in-band; underlying invariant preserved.
      - HSF#2 — HC#4 byte-content samples for `__init__.py` +
        `session_start_emitter.py` rebaselined per the same
        feedback rule. ODD §4 in-band retire-and-rebaseline.
      - HSF#3 — `framework/tools/loam-memory-inspect/` is a NEW
        sealed-component-class component; no formal seal-test
        sidecar (out of M-FBM scope; the tool is dev-only and
        ships under partition `dev_only`). Future amendment may
        elevate to formal sealed component if it grows.
      - HSF#4 — Post-amendment-J memory-write queue + worker
        pipeline survives; substrate-default change is the only
        runtime flip. AC.J family preserved by construction.
      - HSF#5 — Memory-system source UNTOUCHED per fence
        constraint; `framework/memory-system/factory.py` lines
        200-207's silent Binder excepts (research §8.1) +
        `memory.yml` 4 ephemerality rules (research §1.5 / §8.2)
        remain — flagged for M-GMP-builder ownership at
        relocation time.

    Out of scope (per plan §8 + ODD §2.5):

      - Embedding-similarity ranking at v0.1.0 (research §3 row
        12, YELLOW). Deferred; M-GMP / future plugin restores.
      - Cross-encoder reranking (research §3 row 17, RED).
        M-GMP.
      - Cross-episode entity dedup / community detection
        (research §3 row 15, RED). M-GMP.
      - Graph-traversal queries (`center_node_uuid`) (research
        §3 row 14, RED). M-GMP.
      - Anthropic server-side Memory API integration (research
        §7 open-q 1; surface uncertain). Re-evaluated post-
        publish.
      - Stop-hook subagent for entity extraction (research §3
        row 10, YELLOW). Post-v0.1.0.
      - MCP-server-over-file-store (research §4). Future shape
        if non-Claude-Code clients consume loam memory.
      - Per-component CLI for memory ops (`loam memory list`).
        FUTURE_IDEAS_DRAFT capture post-build.
      - InstructionsLoaded hook for memory-load verification.
        Out of scope unless structural-enforcement need
        surfaces.
      - Retention-class enforcement (D5/D10). Unexercised by
        persona writes per research §1.4; rich D5/D10 surface
        preserved in memory-system source for M-GMP.
      - Token-usage observability sink. M-GMP-internal cleanup.
      - Auto-memory MEMORY.md (Claude-managed; orthogonal per
        D-Q.MFBM.4).
      - Graphiti-service shutdown / launchctl bootout (per plan
        §7 hard constraint). Service continues running in the
        canonical dev tree until M-GMP relocates.

    Touched-component test counts:
      - primary-persona: 521 passed (was 506; +15 new AC.MFBM
        tests).
      - workspace-bootstrap: 252 passed, 1 skipped (no change).
      - hands-off-lifecycle: 470 passed (no change in count;
        7 fixture-shifted tests for partition / inventory /
        byte-content).
      - pos-publish-framework-only: 63 passed (no change in
        count; 1 fixture reclassified).
      - Cross-component seal-diff sweep: 14 components green
        (cost-governance, dormancy, memory-system, objective-
        tracker, observability-aggregator, orchestrator,
        primary-persona, reversibility-primitive, safety-layer,
