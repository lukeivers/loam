e_runner.py STAY (runtime infrastructure); F2 — Option D hybrid for A1-A4 settings.json registration (gate files MOVE; writer stays + probes); F3 — loam amend shadow-then-flip deferred to M6b.1; F4 — SPLIT into M6b.0 + M6b.1. AC family: AC.OSS-M6b0.1..M6b0.9 + AC.OSS-M6b0.S(b0). Each AC ladders up to AC.OSS.6 → AC.PO.1 + AC.PO.2 (prime objective) per master plan §6.5.5."

# Six sealed components in the M6b.0 fence per plan §5 + AC.OSS-M6b0.S(b0):
#
#   plugins/dev-sdlc/ (receives MOVEs + new docs + new hooks + new tools + templates + conventions)
#   framework/hands-off-lifecycle/ (5 gate-hook DELETES + first_run_helper.py probe-and-prefer edit)
#   framework/tools/loam-mode/ (DELETED; package MOVED to plugin tree)
#   framework/tools/loam/ (templates/ DELETED; template_engine.py probe-and-prefer edit)
#   framework/tools/pos-publish-framework-only/ (partition-manifest reshape)
#   docs/rebuild/ (FUTURE_IDEAS.md edit; dev-mode-manifest.yaml DELETED)
#
# Plus root docs/ (3 file DELETEs from MOVE OUT to plugin: odd-methodology.md, odd-in-loam.md, duration-estimation-rubric.md).
#
# F1 RULING: agent_file_authoring.py + agent_file_runner.py STAY at
# framework/hands-off-lifecycle/hooks/. NOT in MOVE list. Runtime
# infrastructure used unconditionally by first_run_helper.py for ALL
# workspaces (not dev-mode-only).
#
# F2 RULING: Option D hybrid. Gate hook FILES MOVE. Writer logic at
# first_run_helper.py STAYS; gains probe-and-prefer pattern (mirror of
# amendment #67 _resolve_corpus_path):
#
#   def _resolve_gate_script(loam_root: Path, name: str) -> Path:
#       """Resolve gate-hook script path. Prefer plugin-side; fall back to canonical."""
#       plugin_path = loam_root / "plugins" / "dev-sdlc" / "hooks" / name
#       if plugin_path.exists():
#           return plugin_path
#       return loam_root / "framework" / "hands-off-lifecycle" / "hooks" / name
#
# Each _*_stanza() builder in first_run_helper.py replaces its hardcoded
# canonical-side script-path construction with _resolve_gate_script().
#
# F3 RULING: loam amend shadow-then-flip deferred to M6b.1.
# framework/tools/loam/ source untouched in M6b.0 (templates/ subdir
# excepted — those MOVE per Item 4).
#
# F4 RULING: SPLIT. THIS dispatch is M6b.0. M6b.1 (loam amend MOVE) is
# a separate amendment requiring separate dispatcher approval.
#
# HC#4 byte-content sample status: NO RETIRE-AND-REBASELINE. Pre-build
# verification: file MOVEs preserve byte-content (git mv is rename-only;
# does not modify file content). first_run_helper.py probe-and-prefer
# edit adds ~30 LOC (one helper + 5 stanza-builder edits) — additive
# Python; no sample paths in this file. Partition-manifest YAML edits
# are additive/subtractive YAML — no sample paths in YAML. The HC#4
# invariant remains GREEN through M6b.0.
