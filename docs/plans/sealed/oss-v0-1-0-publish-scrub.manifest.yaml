cing rule #7. Next milestone candidates per master plan §3 out-of-scope: M11.dry-run (now unblocked — substitution pass produces clean synthesis output per AC.OSS-M9.6 smoke); memory-system code fix (task #18 — graceful-fallthrough CDC operationalisation); M1c-corrective (task #16 — M1.rename trailing-edge programme; can run parallel to M11)."

