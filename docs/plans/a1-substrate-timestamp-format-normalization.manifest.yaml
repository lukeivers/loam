narrative:
  target: framework/hands-off-lifecycle/seals/SEAL_COMMIT.a1-substrate-timestamp-format-normalization
  body: |
    # Amendment #75 — A1 substrate timestamp-format normalization

    2026-04-28. Per the locked plan-doc
    `docs/plans/a1-substrate-timestamp-format-normalization.md`
    and locked research artefact
    `docs/plans/research/a1-substrate-timestamp-format-normalization-research.md`.
    Composes on the four-amendment structural-enforcement programme
    (A1 #51 substrate; A2 #70 objective-binding gate; A3 #71 TDD-guard;
    A4 #72 Bash/Agent guards) plus #52, #73, #74. No programme
    amendment; this is a substrate-layer defect-class fix per ODD
    §5.1.1 elimination.

    This amendment closes the failure class flagged in FIDRAFT
    line 155 (captured 2026-04-28 by amendment #74's build agent).
    A1's substrate shipped two lexicographically-incomparable
    timestamp formats: the sentinels emitted second-resolution
    `%Y-%m-%dT%H:%M:%SZ`; the manifest emitted microsecond
    `%Y-%m-%dT%H:%M:%S.%f+00:00`. On same-second writes lex-compare
    flipped because `.` (0x2E) sorts before `Z` (0x5A) — A3's
    `manifest_row.created_at > sentinel.created_at` predicate
    silently produced `False` for legitimate new-AC rows. Empirical
    pre-fix: 1000/1000 collisions in tight-loop test (FIDRAFT 155).

    Resolution per ODD §5.1.1 elimination: migrate ALL THREE A1
    timestamp emitters to format γ — microsecond-resolution,
    `Z`-suffixed, fixed-width 27 chars
    (`%Y-%m-%dT%H:%M:%S.%fZ`). The fixed width matters because
    `strftime`'s `%f` always emits 6 digits, removing the
    `isoformat()` zero-microsecond stripping edge case.

    Surface changes (three sealed components):

      - `framework/hands-off-lifecycle/hooks/_gate_helpers.py` —
        new canonical helper `now_iso_microsecond_z()` returning
        format γ. The audit-log helper `now_iso_z()` (second
        resolution) stays — different concern (human-readable log
        lines, no compare).
      - `framework/hands-off-lifecycle/hooks/active_scope_sentinel.py`
        — `_now_iso()` delegates to the canonical helper via
        in-function lazy import. `import time` removed.
      - `framework/hands-off-lifecycle/hooks/corpus_load_sentinel.py`
        — `_now_iso()` delegates to the canonical helper. `import
        time` removed.
      - `framework/objective-tracker/src/store.py` — new local
        `_now_iso_microsecond_z()` helper (one-line mirror of the
        canonical helper; cross-component import constraint
        documented in the source). `insert_manifest_row` swaps to
        `_now_iso_microsecond_z()`.
      - `framework/primary-persona/src/dispatch_wrapper.py` —
        `_wait_until_next_iso_second()` and its callsite in
        `_run_setup_phase` removed. `import time` removed.
        Surrounding comment block updated to reflect post-#75
        substrate state.

    Test surface (seven new ACs across three test directories):

      - `framework/hands-off-lifecycle/tests/test_AC_TFN_1_*.py` —
        sentinel emitters produce format γ.
      - `framework/objective-tracker/tests/test_AC_TFN_2_*.py` —
        manifest insert produces format γ.
      - `framework/hands-off-lifecycle/tests/test_AC_TFN_3_*.py` —
        single shared helper as source of truth.
      - `framework/primary-persona/tests/test_AC_TFN_4_*.py` —
        dispatcher no longer needs the wait helper; back-to-back
        lex-compare correct (1000/1000).
      - `framework/hands-off-lifecycle/tests/test_AC_TFN_5_*.py` —
        A3 predicate works on mixed-format manifest history.
      - `framework/hands-off-lifecycle/tests/test_AC_TFN_6_*.py` —
        format invariant under back-to-back same-second writes.
      - AC.TFN.S — this seal commit.

    Test updates to existing #74 tests:

      - `test_AC_DSA_3_setup_sequencing_for_a3_predicate.py` —
        rewritten for the post-fix substrate. The wait-helper
        regression test (`test_AC_DSA_3_wait_helper_advances_iso_
        second`) is removed (the helper is gone — AC.TFN.4); the
        end-to-end sentinel-vs-manifest lex-compare test now uses
        the real post-fix emitters with no synthetic delay.
      - `test_AC_DSA_8_composition_with_a2_a3.py` — the three
        wait-helper callsites are removed; the manifest-row
        fixtures' `created_at` strings now use the format γ shape
        (`%Y-%m-%dT%H:%M:%S.%fZ`) so the lex-compare against the
        real γ-format sentinel is structurally correct.
      - `_helpers_dsa.py` — `disable_iso_second_wait` becomes a
        no-op shim retaining its name + signature for AC.DSA.5/6/7/9
        callsite compatibility.

    Empirical post-fix verification (recorded in plan §14 at seal
    time): 0/1000 collisions in tight-loop sentinel-then-manifest
    pair; same for manifest-then-sentinel and sentinel-then-sentinel.

    ODD §2.5 reverse-direction audit clean: every code change in
    this amendment's diff traces back to a named AC under §4. No
    silent branches; no defensive `if`s without backing ACs.

    Out of scope (locked plan-doc §7, named explicitly):

      - Audit-log timestamp format (`now_iso_z`) — second-resolution
        Z-suffix kept; logs are read by humans, not lex-compared
        against sentinels.
      - `objective_tracker.events._utcnow_iso` — different substrate
        (events table), no cross-comparison with A1 sentinels.
      - `memory-system` data files — different substrate, different
        consumer.
      - `workspace-sync` and `self-upgrade` `_now_iso` helpers —
        different substrates; no cross-compare.
      - Persona dispatch-wrapper diagnostic NDJSON `ts` keys —
        write-only logs; never read for compare.
      - Backfill of existing β-format manifest rows (D-TFN.3 ruling:
        accept heterogeneity).

    FIDRAFT items closed by this amendment:

      - "A1 timestamp heterogeneity" (line 155, captured 2026-04-28)
        — CLOSED by AC.TFN.1 .. AC.TFN.6 (the format mismatch is
        eliminated at the emitter source).

    BASELINE 1ca6f62 (pre-amendment tip — HEAD at dispatch). Three
    sealed components touched per the established multi-component
    pattern (A1 #51 was the precedent: objective-tracker +
    hands-off-lifecycle).

    Composes on (consumers-only; no semantic edits):

      - A1's sentinel reader return-shapes (untouched).
      - A1's manifest row dict shape (untouched; only the
        `created_at` value's format changes).
      - A3's lex-compare predicate at `tdd_guard.py:334`
        (untouched; becomes structurally correct).
      - #74's `_run_setup_phase` (the wait callsite is removed; the
        sentinel-then-manifest sequence is preserved).
