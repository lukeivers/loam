  title: "Session-start service_state memory-entry reframe PATCH — the probe_service_state docstring + SessionPayload.service_state Field description + the V11.E comment block model the memory entry as file-based-store reachability under the v0.1.0 M-FBM file-based pivot (no memory daemon / no HTTP health port for the file-based store; the TCP probe engages only when the graphiti/M-GMP plist is present), NOT as a port-probed session-level sidecar service. Prose-only: the SEALED wire contract is preserved byte-identically — the service_state dict, the memory + orchestrator keys, and the value set up/down/unknown/not_expected (not_expected is the V11.E M-FBM signal, already correct and untouched) are unchanged; the orchestrator entry keeps its genuine-UNIX-socket-service framing. The memory-session-continuity builder correctly left this out-of-fence (its §12 halt-trigger 2 — sealed-component widening; its §10 F2 item 1 named service_state:memory:not_expected as the correct M-FBM signal, which is true of the behaviour; the surrounding service-model prose is the separate, correctly-scoped follow-on this PATCH closes). No behaviour change crosses any boundary — verified prose-only by grep (no test asserts the docstring / Field-description / comment text; pre-existing session-start tests D8.1/D8.4/AC46.1/V11.E.2 run unmodified and stay GREEN — AC.SSMR.3 is the structural guard). Four ACs AC.SSMR.{1,2,3,S}: outcome-shape, method the builder's call, no method-in-AC. Class PATCH per docs/release-versioning-policy.md — no behaviour change, no contract change, source-file prose only; D-SSMR.1 ratifies, builder-autonomous because §2 empirically proves prose-only (no owner-gated options surface). Stacks on amend/memory-session-continuity seal 77e3bd7 backfill tip 5957073 as BASELINE (D-SSMR.2 — predecessor unmerged; one linear seal ladder; ships together LOCAL). AC family scope-descriptive (AC.SSMR.*); slug NOT version-packed. Composes on SEALED predecessors: m-fbm-operational-health (the file-based pivot — source of the modelling correction), v0-1-2-V11-E-graphiti-probe-skip (the not_expected sentinel — already correct, untouched here), session-start-context-load-gate (#32 D8 composer — SessionPayload.service_state field). NO Anthropic API key — no LLM step in this amendment. Plan+build+seal+ship-LOCAL cycle."

