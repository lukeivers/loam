schema_version: 3
amendment:
  slug: memory-session-continuity
  title: "Memory session-continuity MINOR — a session restart is behaviourally transparent. File-based memory makes sessions not matter: a fresh session reconstructs the active working thread + live decisions / pending rulings from durably-stored memory read at session-start, WITHOUT any bespoke session-end capture hook (continuous passive capture already exists and is healthy; the fix is read-side + ranking-side only). Closes two structural gaps: Gap B — the file-based retrieval path ranks by pure BM25 with reference_time UNINDEXED, so recency-of-active-thread is never a ranking signal (file_memory.py:489 ORDER BY score, :459 reference_time UNINDEXED); recency-aware ranking surfaces the most-recent-active-thread episodes in top-N. Gap A (REFRAMED from the dispatch's store-wipe framing — the kuzu deletion is by-design M-FBM per D-Q.MFBM.6, capture is healthy with 614 episodes written through 2026-05-15) — (a) named-thread durable surfaces (FIDRAFT-class entries that record where-we-were + open owner rulings, e.g. F-INVERTED-FRAME at docs/FUTURE_IDEAS_DRAFT.md:274) are not in the session-start auto-load corpus, and (b) episode memory is never consulted at session-start at all (context_composer.py:363 on_session_start skips every non-session-trigger contributor; both memory contributors register at TriggerKind.turn). A new TriggerKind.session active-thread contributor (composed on the SEALED #45 multi-contributor SessionStart registry + #46 emitter substrate — Lens 1 no new hook machinery) surfaces a bounded active-thread digest at session-start; named-thread surfaces enter the session-start corpus as defence-in-depth (two independent paths to one prime-objective outcome). Six ACs: AC.MSC.{1,2,3,4,5,S} — outcome-shape, method the builder's call, no method-in-AC. AC.MSC.4 is the outcome-altitude behavioural-transparency probe; AC.MSC.1-3 are the mechanism ACs that ladder into it; both ladder to AC.PO.1 (translation-burden — session-amnesia is the maximal per-session-boundary burden) + AC.PO.2 (toolkit — recency-aware session-start read is a reusable persona primitive). Class MINOR per docs/release-versioning-policy.md — new behaviour at the session boundary (the session-start contributor); D-MSC.1 ratifies, downgrade to PATCH only on explicit build-time evidence no new behaviour crosses the session boundary. Version derives at release-time. AC family scope-descriptive (AC.MSC.*); slug NOT version-packed. Predecessor v0.10.8 SHIPPED PUBLIC (post-publish backfill 58b1452; seal 688e85b). Composes on SEALED predecessors: #32/#33 D8/D7 composer + memory-consumer, M-FBM file-based pivot, v0.4.3 BM25-fix (token sanitisation already fixed + sealed — OUT of this plan's scope), #45 multi-contributor SessionStart registry, #46 session-start emitter. NO Anthropic API key — any LLM step is claude -p subprocess (feedback_no_anthropic_api_key). Plan-author-only cycle — build deferred to a future session pending owner ratification of the corrected Gap A framing (the single gating named decision)."

