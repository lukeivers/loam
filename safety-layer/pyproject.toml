[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pos_safety_layer"
version = "0.1.0"
description = "Safety layer for pOS v2 — three kill switches, always-ask list, dangerous-op gate."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyee>=11",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6",
    "scope_of_work",
    "primary_persona",
    "pos_orchestrator",
]

[tool.setuptools]
package-dir = {"safety_layer" = "src"}
packages = ["safety_layer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
