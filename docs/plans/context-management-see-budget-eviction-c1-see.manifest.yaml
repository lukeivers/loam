seal_description: |
  Context-management Cycle 1 — SEE layer (the context-occupancy sensor).

  Adds loam's missing live context-window sensor. A stdlib-only statusline
  script composes onto Claude Code's `statusLine` primitive (stdin JSON
  envelope, per-assistant-message refresh), extracts the documented
  `context_window` object (used_percentage / total_input_tokens /
  total_output_tokens / context_window_size; min CC 2.1.132), writes the
  reading to `<workspace>/.loam/context-meter.json`, and exits 0. A `read()`
  production entry-point returns the live reading or a fail-open `unavailable`
  sentinel — mirroring `usage-window-guard`'s `read()` shape (real default
  path, injectable transport for fixtures, never fabricates a number).

  Subscription-compatible (no Anthropic API key; per feedback_no_anthropic_api_key)
  and zero API cost. The literal delivery of Luke's "see what's in context" —
  the top-line occupancy %, VERIFIED-direct per research §2.2. The per-category
  `/context` breakdown is out of scope (PLAUSIBLE-not-verified, research §7;
  future verify-then-build).

  AC families (full text in plan §4):
    - AC.CTXSEE.1 — populated `context_window` envelope → meter file carries
      the occupancy reading (%, token counts, window size, timestamp).
    - AC.CTXSEE.2 — absent `context_window` field → `unavailable` sentinel +
      exit 0 (fail-open; never fabricates).
    - AC.CTXSEE.3 — `read()` returns the live reading or the sentinel on any
      failure (missing file / malformed JSON / absent field); never raises.
    - AC.CTXSEE.S — OUTCOME-ALTITUDE: real entry-point + realistic envelope +
      no pre-arranged meter file → meter occupancy == envelope occupancy.
      RED-on-mutation: break the extract step → assertion fails.

  Out of scope (plan §3): budget math + thresholds (Cycle 2); the per-category
  breakdown; the `strategic-compact` SKILL edit (Cycle 2); auto-firing
  `/compact` (owner-class always); auto-claiming the workspace `statusLine`
  slot as DEFAULT (ships + documents the script; install-decision separate, to
  avoid colliding with the hands-off-lifecycle first-run statusLine).

  Method-level D-build.* decisions remain the builder's per the
  scope-only-dispatch CDC (plan §6 + §14).

  BASELINE walked at apply-time (canonical-clean pre-this-amendment HEAD).
  Single-component fence on the NEW `framework/context-management/`.

