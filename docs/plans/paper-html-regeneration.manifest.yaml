  title: "Paper HTML regeneration PATCH — closes FIDRAFT F-PAPER-HTML-REGEN. v0.9.0's ODD methodology paper publish (D-ODDPAPER.5.2 Path C) deleted the previously-staged `docs/papers/odd-methodology.html` (committed `cfcb03f`, 32KB, custom-CSS-styled with `prefers-color-scheme` dynamic theme) because it was from an earlier paper iteration with a stale title (\"Outcome-Altitude Acceptance for LLM-Authored Software\" instead of v19's \"Methodology Description and Case-Study Observations from LLM-Authored Software\") and substantively different body content. The publish shipped markdown-only (GitHub renders the markdown natively for external readers); pandoc was not installed on the dispatcher's machine; HTML regen captured as FIDRAFT. PATCH installs pandoc, regenerates the HTML from the v19 markdown source-of-truth using the existing custom-CSS template extracted from the deleted HTML (preserving `prefers-color-scheme` dynamic theming), commits the regenerated HTML alongside a documented reproducible-regen invocation. AC.PHRG.{1,2,3,4,S} GREEN. Single-component fence (docs-only addition + no framework source touched; dev-sdlc seal anchor admits docs/ + plan-doc + manifest). Composes with v0.9.0 paper publish (the predecessor that deferred this) + `feedback_dynamic_theme_for_generated_documents` (the regen MUST preserve dynamic-theme behavior)."

