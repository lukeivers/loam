DECISIONS_DETAIL: |
  ### D-β.1. β.1 — `canonical_source:` URL vs local-path vs both?
  Cache location for URL form?

  Recommendation: accept BOTH URL and absolute local-path forms;
  cache at `~/.pos/canonical-cache/<repo-id>/` (workspace-shared);
  always-fetch on every invocation (~50ms warm).

  ### D-β.2. β.2 — `pos new-workspace` as `pos` subcommand vs separate
  `pos-new-workspace` console_script? KEY question.

  Recommendation: **path (b.i)** — new console_script
  `pos-new-workspace` declared in `workspace-sync/pyproject.toml`
  (sibling to `pos-sync`, `pos-workspace-sync`). Module at
  `workspace-sync/src/workspace_sync/new_workspace_cli.py`. NOT a
  `pos` subcommand (avoids editing sealed self-upgrade/cli.py).
  Sub-options: (b.i) inside workspace-sync OR (b.ii) new top-level
  `tools/pos-new-workspace/`. Recommendation: (b.i) — β.2 is
  sync-shaped (first-sync from fresh clone); workspace-sync is the
  natural home; minimal scope-bend.

  ### D-β.3. β.3 — which install path? Curl-bash / pipx / homebrew?

  Recommendation: **path (b)** — pipx install + thin curl-bash
  wrapper. The wrapper handles `pip install --user pipx` if pipx
  is missing; then `pipx install git+https://...` (or PyPI-published
  meta-package). Pro: standard modern Python-CLI distribution;
  audited install machinery; clean uninstall. Con: pos-v2 needs a
  top-level meta-package or single pyproject for pipx to install
  against; D-β.3-detail captured for builder reference.

  Homebrew formula can land later as a downstream wrapper around the
  pipx install (homebrew calls `pipx install` under the hood).

  ### D-β.4. Should β be split into separate amendments vs landed
  as one bundle?

  Recommendation: **three separate amendments** (β.1 first, β.2
  second, β.3 third; sequenced by same-tree-serialize). Reasoning:
  β.1's UX win arrives fast; per-AC isolation; β.3's larger surface
  lands last so it doesn't block β.1 + β.2.

  Decisions captured for builder reference (NOT owner ruling here):
  - D-β.5 (component fence for β.3): method-shape.
  - D-β.6 (β.1 sealed-component vs dev-discipline): sealed-component
    recommended (saves future-admission work).
  - D-β.2-detail (β.2 in-process embed vs subprocess for
    workspace-bootstrap): method-shape.
  - D-β.3-detail (pos-v2 meta-package for pipx): method-shape.
DECISIONS_SUMMARY: |
  | Decision | Recommendation | Why it matters |
  |---|---|---|
  | D-β.1 — β.1 `canonical_source:` shape (URL/path) + cache location + fetch policy | **Accept both URL + absolute local-path; cache at `~/.pos/canonical-cache/<repo-id>/`; always-fetch on every invocation** | Maximum flexibility for both non-tech (URL) and developer (local-path) operators; workspace-shared cache avoids per-workspace duplicate clones |
  | D-β.2 — β.2 placement: `pos` subcommand vs separate console_script | **Path (b.i): new console_script `pos-new-workspace` declared in `workspace-sync/pyproject.toml`. NOT a `pos` subcommand** | Avoids editing sealed self-upgrade/cli.py (Hard Constraint #2); matches `pos-sync` / `pos-workspace-sync` precedent |
  | D-β.3 — β.3 install path | **Path (b): pipx install + thin curl-bash wrapper** for the pipx pre-install gate | Leverages standard Python-CLI distribution machinery; auditable; clean uninstall; aligns with D-A1 (Architecture A for CLI binary) |
  | D-β.4 — Bundle splitting | **Ship as three separate amendments (β.1 → β.2 → β.3, sequenced by same-tree-serialize)** | β.1's UX win arrives fast; per-AC isolation; β.3's larger surface lands last |
